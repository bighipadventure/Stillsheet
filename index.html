        if (Number.isInteger(seed)) meta.seed = seed;
        if (typeof inp.sampler_name === "string") meta.settings.sampler = inp.sampler_name;
        if (typeof inp.scheduler === "string") meta.settings.scheduler = inp.scheduler;
        if (typeof inp.steps === "number") meta.settings.steps = inp.steps;
        if (typeof inp.cfg === "number") meta.settings.cfg = inp.cfg;
      }
      if (typeof inp.ckpt_name === "string" && !meta.model) meta.model = inp.ckpt_name;
      if (typeof inp.vae_name === "string" && !meta.vae) meta.vae = inp.vae_name;
      if (typeof inp.lora_name === "string") meta.loras.push({ name: inp.lora_name, weight: Number(inp.strength_model ?? 1) });
      for (const v of Object.values(inp)) {
        if (v && typeof v === "object" && !Array.isArray(v) && typeof v.lora === "string" && v.on !== false) meta.loras.push({ name: v.lora, weight: Number(v.strength ?? 1) });
      }
      if (typeof inp.stop_at_clip_layer === "number") meta.settings.clipSkip = Math.abs(inp.stop_at_clip_layer);
      if (Number.isInteger(inp.width) && Number.isInteger(inp.height) && !meta.width) { meta.width = inp.width; meta.height = inp.height; }
    }
    const { text, loras } = LoraTags.extract(meta.prompt);
    meta.prompt = text;
    meta.loras.push(...loras);
    return meta;
  }
}

// ===== BASE IMAGE (FAVORITE IMAGE -> COMMON SETTINGS) =====
class BaseImage {
  static async read(file) {
    const meta = await MetaReader.read(file);
    let thumb = "";
    try {
      const canvas = await scaledImage(file, USER_SETTINGS.baseThumbSide);
      thumb = canvas.toDataURL("image/jpeg", USER_SETTINGS.thumbQuality);
    } catch {}
    const { quality, rest } = this.split(meta.prompt);
    return {
      name: file.name, thumb, format: meta.format, raw: meta.raw || "", fullPrompt: meta.prompt, quality, prompt: rest,
      negative: meta.negative, seed: meta.seed, model: meta.model, modelHash: meta.modelHash || "", vae: meta.vae, modules: meta.modules || [], loras: meta.loras, settings: meta.settings,
      width: meta.width, height: meta.height, useSeed: false,
    };
  }

  static split(prompt) {
    const parts = String(prompt || "").split(",").map((t) => t.trim()).filter(Boolean);
    const quality = parts.filter((t) => USER_SETTINGS.qualityTags.test(t));
    const rest = parts.filter((t) => !USER_SETTINGS.qualityTags.test(t));
    return { quality: quality.join(", "), rest: rest.join(", ") };
  }

  // モデルは名前で探し、見つからなければ生成情報のハッシュ（「name.safetensors [abcd1234]」の [] の中）で探す
  static matchModel(name, hash, list) {
    const hit = this.match(name, list);
    if (!list?.length || list.includes(hit) || !hash) return hit;
    const h = String(hash).toLowerCase();
    return list.find((x) => (x.match(/\[([0-9a-f]+)\]\s*$/i)?.[1] || "").toLowerCase().startsWith(h.slice(0, 8))) || hit;
  }

  static match(name, list) {
    if (!name || !list?.length) return name || "";
    const key = (n) => Infotext.displayName(n).toLowerCase();
    return list.find((x) => x === name) || list.find((x) => key(x) === key(name)) || name;
  }

  static samplerFor(backendKind, name, list) {
    if (!name) return name;
    const map = USER_SETTINGS.comfy.samplerMap;
    if (backendKind === "comfy") return map[name] || name;
    const back = Object.entries(map).find(([, v]) => v === name)?.[0];
    const value = back || name;
    return list?.length ? (list.find((x) => x.toLowerCase() === value.toLowerCase()) || value) : value;
  }

  static schedulerFor(backendKind, name, list) {
    if (!name) return name;
    const map = USER_SETTINGS.comfy.schedulerMap;
    if (backendKind === "comfy") return map[name] || name.toLowerCase();
    const back = Object.entries(map).find(([k, v]) => v === name && k !== "Automatic")?.[0];
    const value = back || name;
    return list?.length ? (list.find((x) => x.toLowerCase() === value.toLowerCase()) || value) : value;
  }

  // keepText: 品質タグ・ネガティブがすでに入っていれば上書きしない（ドロップしたとき）。「もう一度流し込む」では上書きする
  static apply(doc, base, { res = {}, backendKind = "a1111", keepText = false } = {}) {
    const c = doc.common;
    const s = c.settings;
    const used = [];
    const kept = [];
    const set = (key, fn) => { fn(); used.push(L.baseKeys[key]); };
    for (const key of ["quality", "negative"]) {
      if (!base[key]) continue;
      if (keepText && String(c[key] || "").trim()) kept.push(L.baseKeys[key]);
      else set(key, () => { c[key] = base[key]; });
    }
    if (base.model) set("model", () => { c.model = this.matchModel(base.model, base.modelHash, res.models); });
    // VAE・Text Encoder は、画像AIの一覧に同じものがあるときだけ流し込む（合わないものを送ると画像AIが読み込みで止まるため）。
    // SD WebUI の画像で一覧を読み込めているときは、書かれていなければ「自動」「なし」にして、ほかのアプリで選んだものが残らないようにする
    const named = [base.vae, ...(base.modules || [])].filter((n) => n && !USER_SETTINGS.autoValues.includes(n));
    const find = (list) => (list?.length ? named.map((n) => this.match(n, list)).find((v) => list.includes(v)) : "") || "";
    const infotext = base.format === "a1111";
    if (res.vaes?.length) {
      const vae = find(res.vaes.filter((v) => !USER_SETTINGS.autoValues.includes(v)));
      if (vae || infotext) set("vae", () => { c.vae = vae || "Automatic"; });
    }
    if (res.textEncoders?.length) {
      const te = find(res.textEncoders);
      if (te || infotext) set("textEncoder", () => { c.textEncoder = te || "Automatic"; });
    }
    const bs = base.settings || {};
    if (bs.sampler) set("sampler", () => { s.sampler = this.samplerFor(backendKind, bs.sampler, res.samplers); });
    if (bs.scheduler) set("scheduler", () => { s.scheduler = this.schedulerFor(backendKind, bs.scheduler, res.schedulers); });
    if (Number(bs.steps) > 0) set("steps", () => { s.steps = clamp(Number(bs.steps), USER_SETTINGS.limits.steps); });
    if (Number(bs.cfg) > 0) set("cfg", () => { s.cfg = clamp(Number(bs.cfg), USER_SETTINGS.limits.cfg); });
    if (Number(bs.clipSkip) > 0) set("clipSkip", () => { s.clipSkip = clamp(Number(bs.clipSkip), USER_SETTINGS.limits.clipSkip); });
    if (Number(base.width) > 0 && Number(base.height) > 0) set("size", () => { c.width = clamp(Number(base.width), USER_SETTINGS.limits.side); c.height = clamp(Number(base.height), USER_SETTINGS.limits.side); });
    if (base.loras?.length) set("loras", () => {
      const keep = LoraTags.extract(c.suffix).text;
      c.suffix = PromptBuilder.tidy([keep, ...base.loras.map((l) => LoraTags.tag(l.name, l.weight))]);
    });
    if (base.useSeed && Number.isInteger(base.seed) && base.seed >= 0) set("seed", () => { s.seed = base.seed; });
    used.kept = kept;
    return used;
  }

  static shareInfo(base) {
    if (!base) return null;
    return { raw: base.raw || "", prompt: base.fullPrompt || "", seed: base.seed ?? null };
  }
}

// ===== LORA TAGS (<lora:name:weight> IN PROMPTS) =====
class LoraTags {
  static regex() {
    return new RegExp(USER_SETTINGS.loraPattern.source, "gi");
  }

  static extract(prompt) {
    const loras = [];
    const text = String(prompt || "").replace(this.regex(), (m, name, weight) => {
      loras.push({ name: name.trim(), weight: weight === undefined ? 1 : Number(weight) });
      return "";
    });
    return { text: PromptBuilder.tidy([text]), loras };
  }

  static base(name) {
    return String(name).split(/[\\/]/).pop().replace(USER_SETTINGS.loraExtensions, "").toLowerCase();
  }

  static resolve(name, available) {
    const exact = available.find((a) => a === name);
    if (exact) return exact;
    const hit = available.find((a) => this.base(a) === this.base(name));
    if (hit) return hit;
    return USER_SETTINGS.loraExtensions.test(name) ? name : name + USER_SETTINGS.loraDefaultExtension;
  }

  static tag(name, weight = 1) {
    return `<lora:${Infotext.displayName(name)}:${weight}>`;
  }
}

// ===== PROMPT BUILDER (COMMON + CAST + SCENE + LOCATION) =====
class PromptBuilder {
  static tidy(parts) {
    return parts.map((p) => String(p || "").trim()).filter(Boolean).join(", ")
      .replace(/\s*,\s*(?:,\s*)+/g, (m) => (m.includes("\n") ? ",\n" : ", ")).replace(/^\s*,\s*|\s*,\s*$/g, "").replace(/[ \t]{2,}/g, " ").trim();
  }

  static join(parts, layout) {
    if (layout !== "lines") return this.tidy(parts);
    return parts.map((p) => this.tidy([p])).filter(Boolean).join(",\n");
  }

  static castOf(doc, scene) {
    return (scene.cast || []).map((id) => doc.cast.find((c) => c.id === id)).filter(Boolean);
  }

  // 実際に送るプロンプト。シーンで「送信プロンプトを個別指定」がオンなら、その文面をそのまま使う
  static build(doc, scene) {
    if (scene.customPrompt) return { prompt: scene.customText || "", negative: scene.customNegative || "" };
    return this.auto(doc, scene);
  }

  // 各欄（品質タグ・人数・登場人物・シーン・場所・末尾）から組み立てたプロンプト
  static auto(doc, scene) {
    const c = doc.common;
    const loc = doc.locations.find((l) => l.id === scene.location);
    return {
      prompt: this.join([c.quality, scene.count, ...this.castOf(doc, scene).map((p) => this.tidy(USER_SETTINGS.castParts.filter((k) => Doc.partOn(scene, p.id, k)).map((k) => p[k]))), scene.prompt, loc?.prompt, c.suffix], c.promptLayout),
      negative: this.join([c.negative, scene.negative], c.promptLayout),
    };
  }
}

// ===== DOCUMENT (SETTINGS JSON) =====
class Doc {
  static create() {
    return { ...clone(USER_SETTINGS.defaultDoc), novel: clone(USER_SETTINGS.novel.defaults) };
  }

  static newScene(fields = {}) {
    return { ...clone(USER_SETTINGS.defaultScene), ...fields, id: "s" + uid() };
  }

  static normalize(src) {
    const base = this.create();
    const d = src && typeof src === "object" ? src : {};
    const out = { ...base, ...this.pickStrings(d, ["title", "synopsis", "brief", "manuscript"]) };
    out.mode = d.mode === "novel" ? "novel" : "sheet";
    out.novel = this.novelOf(d.novel);
    out.base = d.base && typeof d.base === "object" ? clone(d.base) : null;
    if (Number.isFinite(Number(d.sceneCount))) out.sceneCount = clamp(Math.round(Number(d.sceneCount)), USER_SETTINGS.limits.sceneCount);
    out.common = { ...base.common, ...(d.common || {}), settings: { ...base.common.settings, ...(d.common?.settings || {}) } };
    // VAE・Text Encoder の「いまの設定のまま」（空）はやめた。ほかのアプリで選んだものが残ってエラーになるため、「自動」に読み替える
    for (const key of ["vae", "textEncoder"]) if (!out.common[key]) out.common[key] = "Automatic";
    out.run = Object.fromEntries(Object.entries(base.run).map(([k, v]) => [k, d.run && k in d.run ? d.run[k] : v]));
    out.cast = Array.isArray(d.cast) ? d.cast.map((c) => this.person(c)) : base.cast;
    out.locations = Array.isArray(d.locations) ? d.locations.map((l) => this.person(l, "l")) : [];
    const castIds = new Set(out.cast.map((c) => c.id));
    const locIds = new Set(out.locations.map((l) => l.id));
    out.scenes = Array.isArray(d.scenes) ? d.scenes.map((s) => {
      const sc = { ...clone(USER_SETTINGS.defaultScene), ...this.pickStrings(s || {}, ["title", "text", "count", "prompt", "negative", "location", "customText", "customNegative"]) };
      sc.customPrompt = !!s?.customPrompt;
      sc.id = typeof s?.id === "string" && s.id ? s.id : "s" + uid();
      sc.cast = Array.isArray(s?.cast) ? s.cast.filter((id) => castIds.has(id)) : [];
      sc.castParts = Object.fromEntries(Object.entries(s?.castParts && typeof s.castParts === "object" ? s.castParts : {})
        .filter(([id, v]) => castIds.has(id) && v && typeof v === "object")
        .map(([id, v]) => [id, Object.fromEntries(USER_SETTINGS.castParts.filter((k) => typeof v[k] === "boolean").map((k) => [k, v[k]]))]));
      if (!locIds.has(sc.location)) sc.location = "";
      sc.perScene = Number(s?.perScene) > 0 ? Math.round(Number(s.perScene)) : null;
      const side = (v) => (Number(v) > 0 ? clamp(Math.round(Number(v)), USER_SETTINGS.limits.side) : null);
      sc.width = side(s?.width);
      sc.height = side(s?.height);
      if (!sc.width || !sc.height) { sc.width = null; sc.height = null; }
      sc.seed = s?.seed !== null && s?.seed !== undefined && s?.seed !== "" && Number.isFinite(Number(s.seed)) ? clamp(Math.round(Number(s.seed)), [-1, USER_SETTINGS.seedMax]) : null;
      Object.assign(sc, this.pickStrings(s || {}, ["sceneTitle", "motion", "videoPrompt"]));
      sc.sceneStart = !!s?.sceneStart;
      sc.loop = !!s?.loop;
      sc.noImage = !!s?.noImage;
      sc.lines = this.lines(s?.lines, castIds);
      return sc;
    }) : [];
    if (out.scenes[0]) out.scenes[0].sceneStart = true;
    return out;
  }

  static novelOf(src) {
    const base = clone(USER_SETTINGS.novel.defaults);
    const n = src && typeof src === "object" ? src : {};
    const lim = USER_SETTINGS.novel.limits;
    const out = { ...base, narrate: n.narrate === undefined ? base.narrate : !!n.narrate };
    const stages = USER_SETTINGS.novel.stages.map(([k]) => k);
    const until = stages.indexOf(n.autoUntil);
    const skip = n.skip && typeof n.skip === "object" ? n.skip : null;
    out.skip = Object.fromEntries(stages.map((k, i) => [k, skip ? !!skip[k] : until >= 0 && i > until]));
    if (USER_SETTINGS.novel.imageAspects.some(([k]) => k === n.aspect)) out.aspect = n.aspect;
    if (Number.isFinite(Number(n.imageCount))) out.imageCount = clamp(Math.round(Number(n.imageCount)), lim.imageCount);
    out.linesMin = Number.isFinite(Number(n.linesMin)) ? clamp(Math.round(Number(n.linesMin)), lim.lines) : 2;
    out.linesMax = Number.isFinite(Number(n.linesMax)) ? clamp(Math.round(Number(n.linesMax)), lim.lines) : 5;
    out.narrator = this.voiceOf(n.narrator, base.narrator);
    const v = n.video && typeof n.video === "object" ? n.video : {};
    out.video = {
      seconds: VideoClient.secondsOf(VideoClient.lengthFor(Number.isFinite(Number(v.seconds)) ? Number(v.seconds) : base.video.seconds)),
      megapixels: Number.isFinite(Number(v.megapixels)) ? clamp(Number(v.megapixels), lim.megapixels) : base.video.megapixels,
      turbo: v.turbo === undefined ? base.video.turbo : !!v.turbo,
      sound: !!v.sound,
      options: Object.fromEntries(USER_SETTINGS.novel.loopPrompt.groups.map((g) => [g.key, g.choices.some(([c]) => c === v.options?.[g.key]) ? v.options[g.key] : base.video.options[g.key]])),
    };
    return out;
  }

  static voiceOf(v, fallback = USER_SETTINGS.novel.castVoice) {
    const o = v && typeof v === "object" ? v : {};
    const mode = USER_SETTINGS.novel.voiceModes.some(([k]) => k === o.mode) ? o.mode : fallback.mode;
    return { mode, caption: typeof o.caption === "string" ? o.caption : fallback.caption, seed: o.seed == null ? "" : String(o.seed), on: o.on !== false };
  }

  static lines(list, castIds) {
    const narrator = USER_SETTINGS.novel.narrator;
    return (Array.isArray(list) ? list : []).filter((l) => l && typeof l === "object").map((l) => ({
      id: typeof l.id === "string" && l.id ? l.id : "v" + uid(),
      who: castIds.has(l.who) ? l.who : narrator,
      text: typeof l.text === "string" ? l.text : "",
      emo: this.emo(l.emo),
    }));
  }

  static emo(v) {
    return this.emoList(v).join("");
  }

  static emoList(v) {
    let rest = String(v ?? "");
    const found = [];
    for (const [e] of [...USER_SETTINGS.novel.emojis].sort((a, b) => b[0].length - a[0].length)) {
      const at = rest.indexOf(e);
      if (at < 0) continue;
      found.push([at, e]);
      rest = rest.slice(0, at) + " ".repeat(e.length) + rest.slice(at + e.length);
    }
    return found.sort((a, b) => a[0] - b[0]).slice(0, USER_SETTINGS.novel.maxEmo).map(([, e]) => e);
  }

  static newLine(fields = {}) {
    return { id: "v" + uid(), who: USER_SETTINGS.novel.narrator, text: "", emo: "", ...fields };
  }

  static groups(doc) {
    const out = [];
    doc.scenes.forEach((s, i) => {
      if (i === 0 || s.sceneStart || !out.length) out.push({ head: s, scenes: [] });
      out[out.length - 1].scenes.push(s);
    });
    return out;
  }

  static pickStrings(src, keys) {
    return Object.fromEntries(keys.filter((k) => typeof src[k] === "string").map((k) => [k, src[k]]));
  }

  // 登場人物（prefix "c"）は「キャラクター名・作品」「身体的特徴」「服装」に分けて持つ。場所（"l"）は prompt ひとつ。
  // 以前の登場人物の「見た目」（prompt）は「身体的特徴」に入れる
  static person(p, prefix = "c") {
    const o = p && typeof p === "object" ? p : {};
    const id = typeof o.id === "string" && o.id ? o.id : prefix + uid();
    if (prefix !== "c") return { id, name: String(o.name || ""), prompt: String(o.prompt || ""), note: String(o.note || "") };
    const body = String(o.body ?? "") || (o.ident == null && o.outfit == null ? String(o.prompt || "") : "");
    return { id, name: String(o.name || ""), ident: String(o.ident || ""), body, outfit: String(o.outfit || ""), note: String(o.note || ""), voice: this.voiceOf(o.voice) };
  }

  // 登場人物の各要素（キャラクター名・作品 / 身体的特徴 / 服装）をそのシーンで使うか。書いていなければ使う
  static partOn(scene, castId, key) {
    return scene.castParts?.[castId]?.[key] !== false;
  }

  static serialize(doc) {
    return { format: USER_SETTINGS.projectFormat, version: USER_SETTINGS.projectVersion, app: USER_SETTINGS.appName, savedAt: new Date().toISOString(), ...clone(doc) };
  }

  static isProject(obj) {
    return obj && typeof obj === "object" && [USER_SETTINGS.projectFormat, USER_SETTINGS.castFormat, USER_SETTINGS.situationFormat].includes(obj.format);
  }

  static situationFile(doc) {
    const slot = (id) => doc.cast.findIndex((c) => c.id === id);
    const locs = doc.locations.map(({ id, name, prompt, note }) => ({ id, name, prompt, note }));
    return {
      format: USER_SETTINGS.situationFormat, version: USER_SETTINGS.projectVersion, app: USER_SETTINGS.appName, savedAt: new Date().toISOString(),
      title: doc.title, synopsis: doc.synopsis, brief: doc.brief, sceneCount: doc.sceneCount, run: clone(doc.run), locations: locs,
      castSlots: doc.cast.length,
      scenes: doc.scenes.map(({ id, cast, ...rest }) => ({ ...clone(rest), castSlots: cast.map(slot).filter((i) => i >= 0) })),
    };
  }

  static loadSituation(doc, sit) {
    const slots = (sit.scenes || []).flatMap((s) => (Array.isArray(s?.castSlots) ? s.castSlots : [])).map(Number).filter((n) => Number.isInteger(n) && n >= 0);
    const need = Math.max(Number(sit.castSlots) || 0, slots.length ? Math.max(...slots) + 1 : 0);
    while (doc.cast.length < need) doc.cast.push(this.person({}, "c"));
    const mapped = {
      ...this.serialize(doc), ...this.pickStrings(sit, ["title", "synopsis", "brief"]),
      sceneCount: sit.sceneCount ?? doc.sceneCount,
      run: { ...doc.run, ...(sit.run || {}) },
      locations: Array.isArray(sit.locations) ? sit.locations : [],
      scenes: (Array.isArray(sit.scenes) ? sit.scenes : []).map((s) => ({
        ...s, id: undefined,
        cast: (Array.isArray(s?.castSlots) ? s.castSlots : []).map((i) => doc.cast[Number(i)]?.id).filter(Boolean),
      })),
    };
    return this.normalize(mapped);
  }

  static castFile(doc) {
    return { format: USER_SETTINGS.castFormat, version: USER_SETTINGS.projectVersion, cast: doc.cast.map(({ name, ident, body, outfit, note, voice }) => ({ name, ident, body, outfit, note, voice })) };
  }

  static swapCast(doc, incoming) {
    const list = (Array.isArray(incoming) ? incoming : []).map((c) => this.person(c));
    list.forEach((c, i) => {
      if (i < doc.cast.length) Object.assign(doc.cast[i], { name: c.name, ident: c.ident, body: c.body, outfit: c.outfit, note: c.note, voice: c.voice });
      else doc.cast.push({ ...c, id: "c" + uid() });
    });
    return list.length;
  }

  static perScene(doc, scene) {
    return clamp(Math.round(Number(scene.perScene) || Number(doc.run.perScene) || 1), USER_SETTINGS.limits.perScene);
  }
}

// ===== SETTINGS STORE (CONNECTIONS, KEPT IN THIS BROWSER) =====
class SettingsStore {
  constructor() {
    this.data = this.load();
  }

  defaults() {
    const urls = Object.fromEntries(Object.entries(USER_SETTINGS.backends).map(([k, v]) => [k, v.url]));
    return { backend: USER_SETTINGS.defaultBackend, urls, llm: clone(USER_SETTINGS.llm.defaults), voice: clone(USER_SETTINGS.novel.voice.defaults), video: clone(USER_SETTINGS.novel.video.defaults), ui: { rightTab: "image", settingsPane: "guide", exportAllGood: false, help: true, leftW: 0, rightW: 0, hideLeft: false, hideRight: false } };
  }

  load() {
    const base = this.defaults();
    try {
      const raw = localStorage.getItem(USER_SETTINGS.storageKey);
      if (raw) {
        const d = JSON.parse(raw);
        const video = { ...base.video, ...(d.video || {}) };
        for (const [k, olds] of Object.entries(USER_SETTINGS.novel.video.oldDefaults)) if (olds.includes(video[k])) video[k] = base.video[k];
        return { ...base, ...d, urls: { ...base.urls, ...(d.urls || {}) }, llm: { ...base.llm, ...(d.llm || {}) }, voice: { ...base.voice, ...(d.voice || {}) }, video, ui: { ...base.ui, ...(d.ui || {}) } };
      }
    } catch {}
    return base;
  }

  save() {
    try { localStorage.setItem(USER_SETTINGS.storageKey, JSON.stringify(this.data)); } catch {}
  }

  get url() { return this.data.urls[this.data.backend]; }
}

// ===== IMAGE STORE (GENERATED IMAGES, IN MEMORY ONLY) =====
class ImageStore {
  constructor() {
    this.byScene = new Map();
  }

  list(sceneId) {
    if (!this.byScene.has(sceneId)) this.byScene.set(sceneId, []);
    return this.byScene.get(sceneId);
  }

  find(imageId) {
    for (const [sceneId, list] of this.byScene) {
      const img = list.find((i) => i.id === imageId);
      if (img) return { sceneId, img };
    }
    return null;
  }

  get total() {
    let n = 0;
    for (const list of this.byScene.values()) n += list.length;
    return n;
  }

  async add(sceneId, fields) {
    const img = { id: "i" + uid(), check: null, manual: null, createdAt: Date.now(), ...fields };
    img.url = URL.createObjectURL(img.blob);
    try {
      const canvas = await scaledImage(img.blob, USER_SETTINGS.thumbSide);
      img.thumb = URL.createObjectURL(await canvasBlob(canvas, "image/jpeg", USER_SETTINGS.thumbQuality));
    } catch {
      img.thumb = img.url;
    }
    this.list(sceneId).push(img);
    return img;
  }

  dropFull(img) {
    if (!img.blob) return;
    if (img.url && img.url !== img.thumb) URL.revokeObjectURL(img.url);
    img.blob = null;
    img.url = null;
  }

  revoke(img) {
    if (img.url) URL.revokeObjectURL(img.url);
    if (img.thumb && img.thumb !== img.url) URL.revokeObjectURL(img.thumb);
    img.blob = null;
  }

  remove(sceneId, imageId) {
    const list = this.list(sceneId);
    const i = list.findIndex((x) => x.id === imageId);
    if (i < 0) return;
    this.revoke(list[i]);
    list.splice(i, 1);
  }

  clear(sceneId) {
    for (const img of this.list(sceneId)) this.revoke(img);
    this.byScene.delete(sceneId);
  }

  clearAll() {
    for (const id of [...this.byScene.keys()]) this.clear(id);
  }

  keepOnly(sceneIds) {
    const keep = new Set(sceneIds);
    for (const id of [...this.byScene.keys()]) if (!keep.has(id)) this.clear(id);
  }
}

// ===== VERDICT AND SET PICKING =====
class Judge {
  static verdict(img, run) {
    if (img.manual === "ok") return true;
    if (img.manual === "ng") return false;
    const c = img.check;
    if (!c || c.state !== "done") return null;
    if (c.anatomy) return false;
    const offPrompt = c.mismatch || (Number.isFinite(c.match) && c.match < run.matchThreshold);
    return c.score >= run.threshold && !c.broken && !(run.strictScene && offPrompt);
  }

  static counts(list, run) {
    const out = { total: list.length, good: 0, ng: 0, pending: 0 };
    for (const img of list) {
      const v = this.verdict(img, run);
      if (v === true) out.good++;
      else if (v === false) out.ng++;
      else out.pending++;
    }
    return out;
  }

  static pick(list, run, pinnedId) {
    const pinned = list.find((i) => i.id === pinnedId && i.blob);
    if (pinned) return pinned;
    const usable = list.filter((i) => i.blob);
    const good = usable.filter((i) => this.verdict(i, run) === true)
      .sort((a, b) => (b.manual === "ok") - (a.manual === "ok") || (b.check?.score ?? 0) - (a.check?.score ?? 0) || a.createdAt - b.createdAt);
    if (good.length) return good[0];
    if (run.check) return null;
    return usable.find((i) => this.verdict(i, run) === null) || null;
  }

  static lacking(list, run) {
    if (!run.check) return !list.some((i) => this.verdict(i, run) !== false);
    return this.counts(list, run).good < 1;
  }
}

// ===== STORY WRITER (ROUGH IDEA -> SCENES) =====
class StoryWriter {
  static castLines(doc) {
    return doc.cast.map((c, i) => `- id: ${c.id} (${letter(i)}) / name: ${c.name || "(unnamed)"} / notes: ${c.note || "-"} / look: ${lookOf(c)}`).join("\n") || "(none)";
  }

  static locationLines(doc) {
    return doc.locations.map((l) => `- id: ${l.id} / name: ${l.name || "(unnamed)"} / notes: ${l.note || "-"} / look: ${l.prompt || "-"}`).join("\n") || "(none)";
  }

  static userText(doc) {
    return [
      `Idea from the user:\n${doc.brief.trim()}`,
      `Number of scenes: ${doc.sceneCount}`,
      USER_SETTINGS.styleRules[doc.common.style] || USER_SETTINGS.styleRules.tags,
      `Cast:\n${this.castLines(doc)}`,
      `Locations:\n${this.locationLines(doc)}`,
      doc.title.trim() ? `Working title: ${doc.title.trim()}` : "",
    ].filter(Boolean).join("\n\n");
  }

  static accept(doc, obj) {
    const castIds = new Set(doc.cast.map((c) => c.id));
    const locIds = new Set(doc.locations.map((l) => l.id));
    const str = (v) => (Array.isArray(v) ? v.join(", ") : typeof v === "string" ? v : v == null ? "" : String(v)).trim();
    const raw = Array.isArray(obj.scenes) ? obj.scenes : null;
    if (!raw?.length) throw new Error("no scenes");
    const scenes = raw.filter((s) => s && typeof s === "object").map((s) => Doc.newScene({
      title: str(s.title), text: str(s.text || s.narration),
      cast: (Array.isArray(s.cast) ? s.cast : []).map(String).filter((id) => castIds.has(id)),
      location: locIds.has(String(s.location || "")) ? String(s.location) : "",
      count: str(s.count), prompt: str(s.prompt),
    }));
    if (!scenes.some((s) => s.prompt)) throw new Error("no prompts");
    return { title: str(obj.title), synopsis: str(obj.synopsis), scenes };
  }

  static async write(llm, doc, signal) {
    return llm.askJson(USER_SETTINGS.storyPrompt, this.userText(doc), [], signal, (obj) => this.accept(doc, obj), M.storyBad);
  }

  static async rewriteScene(llm, doc, scene, signal) {
    const cast = PromptBuilder.castOf(doc, scene);
    const loc = doc.locations.find((l) => l.id === scene.location);
    const text = [
      `Scene title: ${scene.title || "-"}`,
      `Narration: ${scene.text || "-"}`,
      `Characters in the scene:\n${cast.map((c) => `- ${c.name || "(unnamed)"} / notes: ${c.note || "-"} / look: ${lookOf(c, scene)}`).join("\n") || "(none)"}`,
      `Location: ${loc ? `${loc.name} / ${loc.prompt}` : "(none: describe the place in the prompt)"}`,
      USER_SETTINGS.styleRules[doc.common.style] || USER_SETTINGS.styleRules.tags,
    ].join("\n\n");
    return llm.askJson(USER_SETTINGS.sceneRewritePrompt, text, [], signal, (obj) => {
      const prompt = typeof obj.prompt === "string" ? obj.prompt.trim() : "";
      if (!prompt) throw new Error("no prompt");
      return { count: typeof obj.count === "string" ? obj.count.trim() : "", prompt };
    }, M.rewriteBad);
  }
}

// ===== IMAGE CHECKER (VISION LLM LOOKS FOR BROKEN DRAWING) =====
class ImageChecker {
  static promptOf(doc, scene, img) {
    const raw = img?.prompt || PromptBuilder.build(doc, scene).prompt;
    return BaseImage.split(LoraTags.extract(raw).text).rest;
  }

  static userText(doc, scene, img) {
    const cast = PromptBuilder.castOf(doc, scene);
    return [
      `画像のプロンプト（再現度はこれと比べる）: ${this.promptOf(doc, scene, img) || "-"}`,
      "",
      "このシーンで描くべき内容:",
      `- タイトル: ${scene.title || "-"}`,
      `- ナレーション: ${scene.text || "-"}`,
      `- 人数: ${scene.count || "-"}${cast.length ? `（${cast.map((c) => c.name || "名前なし").join("、")}）` : ""}`,
      "添付した画像をチェックしてください。",
    ].join("\n");
  }

  static accept(obj) {
    const score = Number(obj.score);
    if (!Number.isFinite(score)) throw new Error("no score");
    const bool = (v) => v === true || v === "true" || v === "yes";
    const list = (v) => (Array.isArray(v) ? v : typeof v === "string" && v ? [v] : []).map((x) => String(x).trim()).filter(Boolean);
    const anatomy = bool(obj.anatomy);
    const match = Number(obj.prompt_match);
    return {
      state: "done", anatomy,
      score: clamp(Math.round(anatomy ? Math.min(score, USER_SETTINGS.anatomyScoreCap) : score), [0, 100]),
      broken: anatomy || bool(obj.broken), mismatch: bool(obj.mismatch),
      match: Number.isFinite(match) ? clamp(Math.round(match), [0, 100]) : null,
      missing: list(obj.missing), issues: list(obj.issues),
    };
  }

  static async imageUrl(blob) {
    const llm = USER_SETTINGS.llm;
    const canvas = await scaledImage(blob, llm.imageSide);
    return canvas.toDataURL("image/jpeg", llm.imageQuality);
  }

  static async check(llm, doc, scene, img, signal) {
    const url = await this.imageUrl(img.blob);
    return llm.askJson(USER_SETTINGS.checkPrompt, this.userText(doc, scene, img), [url], signal, (obj) => this.accept(obj), M.checkBad);
  }
}

// ===== GUIDE (ERROR -> ONE SENTENCE THAT SAYS WHERE TO GO NEXT) =====
class Guide {
  static fail(text, action = null) {
    return Object.assign(new UserError(text), { action });
  }

  static explain(err, who = "image") {
    const F = M.fix;
    const llm = who === "llm";
    if (err?.name === "AbortError") return { text: M.cancelled, action: null, aborted: true };
    if (err instanceof UserError) return { text: err.message, action: err.action || null };
    if (err?.name === "TimeoutError") return { text: llm ? F.llmTimeout : F.imageTimeout, action: llm ? "settingsLlm" : "refresh" };
    if (err instanceof TypeError) return { text: llm ? F.llmDown : F.imageDown, action: "refresh" };
    const msg = String(err?.message || err || "");
    if (llm && /image|vision|multimodal|image_url|mmproj/i.test(msg)) return { text: F.llmVision, action: "settingsLlm" };
    if (llm && /model/i.test(msg) && /not found|does not exist|no model|not loaded|404/i.test(msg)) return { text: F.llmModel, action: "settingsLlm" };
    if (!llm && /vae/i.test(msg) && /size mismatch|state_dict|shape/i.test(msg)) return { text: `${F.vaeMismatch}\n${msg}`, action: "image:model" };
    if (!llm && /value_not_in_list|not in list|ckpt_name|lora_name|vae_name/i.test(msg)) return { text: F.comfyMissing, action: "image:model" };
    return { text: msg, action: llm ? "settingsLlm" : null };
  }

  static text(err, who) {
    return this.explain(err, who).text;
  }
}

// ===== RUN CLOCK (AVERAGE TIME PER STEP -> REMAINING TIME) =====
class RunClock {
  constructor() {
    this.avg = {};
    this.count = {};
  }

  add(kind, ms) {
    const a = USER_SETTINGS.etaSmoothing;
    this.avg[kind] = this.avg[kind] == null ? ms : this.avg[kind] * (1 - a) + ms * a;
    this.count[kind] = (this.count[kind] || 0) + 1;
  }

  async time(kind, fn) {
    const t = performance.now();
    try { return await fn(); } finally { this.add(kind, performance.now() - t); }
  }

  has(kind) { return this.avg[kind] != null; }

  estimate({ gens, checks, swaps }) {
    if (!this.has("gen")) return null;
    const partial = (checks > 0 && !this.has("check")) || (swaps > 0 && !this.has("vram"));
    const ms = gens * this.avg.gen + checks * (this.avg.check || 0) + swaps * (this.avg.vram || 0);
    return { ms, partial };
  }
}

// ===== RUNNER (GENERATE N IMAGES PER SCENE, CHECK, PICK) =====
class Runner {
  constructor(app) {
    this.app = app;
    this.ctl = null;
    this.vramFreed = false;
    this.plan = [];
  }

  get busy() { return !!this.ctl; }

  stop() {
    if (!this.ctl) return;
    this.ctl.abort();
    this.app.backend().interrupt();
  }

  seedFor(base, index) {
    const n = Number(base);
    if (Number.isFinite(n) && n >= 0) return (n + index) % (USER_SETTINGS.seedMax + 1);
    return Math.floor(Math.random() * USER_SETTINGS.seedMax);
  }

  static sizeOf(doc, scene) {
    const c = doc.common;
    const own = Number(scene.width) > 0 && Number(scene.height) > 0;
    const w = own ? scene.width : c.width, hh = own ? scene.height : c.height;
    return { width: clamp(Number(w) || 0, USER_SETTINGS.limits.side), height: clamp(Number(hh) || 0, USER_SETTINGS.limits.side) };
  }

  static seedBase(doc, scene) {
    return scene.seed !== null && scene.seed !== undefined && scene.seed !== "" ? Number(scene.seed) : Number(doc.common.settings.seed);
  }

  spec(doc, scene, index) {
    const backend = this.app.backend();
    const { prompt, negative } = PromptBuilder.build(doc, scene);
    const c = doc.common;
    const settings = { ...c.settings, seed: this.seedFor(Runner.seedBase(doc, scene), index) };
    const size = Runner.sizeOf(doc, scene);
    if (backend.keepsLoraTags) return { prompt, negative, loras: [], model: c.model, vae: c.vae, textEncoder: c.textEncoder || "", size, settings, shownPrompt: prompt };
    const pos = LoraTags.extract(prompt);
    const neg = LoraTags.extract(negative);
    const available = this.app.res.loras || [];
    const loras = pos.loras.map((l) => ({ ...l, name: LoraTags.resolve(l.name, available) }));
    return { prompt: pos.text, negative: neg.text, loras, model: c.model, vae: c.vae, textEncoder: c.textEncoder || "", size, settings, shownPrompt: prompt };
  }

  // PLAN AND REMAINING WORK
  swapsFor(run, gens, checks) {
    if (!(run.check || this.checkOnlyMode) || this.checkDisabled || !this.app.store.data.llm.freeVram) return 0;
    if (gens > 0) return this.vramFreed ? 2 : 1;
    return checks > 0 && !this.vramFreed ? 1 : 0;
  }

  remaining() {
    const run = { ...this.app.doc.run, check: this.app.doc.run.check || this.checkOnlyMode };
    let gens = 0, pending = 0;
    for (const p of this.plan) {
      if (!p.closed) gens += Math.max(0, p.total - p.done);
    }
    if (run.check && !this.checkDisabled) {
      for (const p of this.plan) pending += this.app.images.list(p.id).filter((i) => i.blob && (!i.check || i.check.state === "pending")).length;
    }
    const checks = run.check && !this.checkDisabled ? gens + pending : 0;
    return { gens, checks, swaps: this.swapsFor(run, gens, checks) };
  }

  report(fraction = 0) {
    const r = this.remaining();
    const left = r.gens + r.checks - fraction;
    const total = this.doneUnits + Math.max(0, left);
    const pct = total > 0 ? (this.doneUnits + fraction) / total : 0;
    this.app.progress(pct);
    this.app.updateEta(this.app.clock.estimate(r));
  }

  // VRAM
  async ensureImageVram(signal) {
    if (!this.vramFreed) return;
    this.app.phase("vram");
    this.app.status(M.runRestoreVram);
    await this.app.clock.time("vram", () => this.app.backend().restoreVram());
    this.vramFreed = false;
    if (signal.aborted) throw new DOMException("aborted", "AbortError");
  }

  async freeImageVram() {
    if (!this.app.store.data.llm.freeVram || this.vramFreed) return;
    this.app.phase("vram");
    this.app.status(M.runFreeVram);
    await this.app.clock.time("vram", () => this.app.backend().freeVram());
    this.vramFreed = true;
  }

  // ONE IMAGE / CHECKS
  async generateOne(doc, scene, index, signal) {
    const spec = this.spec(doc, scene, index);
    const out = await this.app.clock.time("gen", () => this.app.backend().generate(spec, {
      signal,
      onProgress: (p) => {
        this.app.status(fmt(M.runImage, { pct: Math.round(clamp(Number(p) || 0, [0, 1]) * 100) }));
        this.report(clamp(Number(p) || 0, [0, 0.99]));
      },
    }));
    return this.app.images.add(scene.id, {
      blob: out.blob, seed: out.seed, info: out.info, prompt: spec.shownPrompt, negative: spec.negative,
      width: spec.size.width, height: spec.size.height, settings: clone(spec.settings),
    });
  }

  async checkPending(doc, scene, signal, title) {
    const run = doc.run;
    const pending = this.app.images.list(scene.id).filter((i) => i.blob && (!i.check || i.check.state === "pending"));
    if (!pending.length || this.checkDisabled) return;
    await this.freeImageVram();
    const llm = this.app.llm();
    for (let k = 0; k < pending.length; k++) {
      if (signal.aborted) throw new DOMException("aborted", "AbortError");
      const img = pending[k];
      this.app.phase("check", title());
      this.app.status(fmt(M.runCheck, { k: k + 1, m: pending.length }));
      try {
        img.check = await this.app.clock.time("check", () => ImageChecker.check(llm, doc, scene, img, signal));
        this.checkFails = 0;
      } catch (err) {
        if (err?.name === "AbortError" || signal.aborted) throw err;
        const why = Guide.explain(err, "llm");
        img.check = { state: "error", error: why.text };
        this.checkFails++;
        if (this.checkFails >= USER_SETTINGS.checkFailLimit) {
          this.checkDisabled = true;
          this.app.sceneChanged(scene.id);
          this.app.notice(fmt(M.checkOff, { fix: why.text }), "warn", why.action);
          this.report();
          return;
        }
      }
      this.doneUnits++;
      if (Judge.verdict(img, run) === false && !run.keepRejected) this.app.images.dropFull(img);
      this.app.sceneChanged(scene.id);
      this.report();
    }
  }

  /* あとから文章AIチェックだけをする（チェックをオフにして生成したあとに使う）。
     チェックが済んだ画像（state: done）は飛ばし、まだのものと失敗したものだけを見る。画像は作らない */
  async checkOnly(sceneIds) {
    const app = this.app;
    if (this.busy) throw Guide.fail(M.runBusy);
    const doc = app.doc;
    const scenes = sceneIds.map((id) => doc.scenes.find((s) => s.id === id)).filter(Boolean);
    const todo = (s) => app.images.list(s.id).filter((i) => i.blob && i.check?.state !== "done");
    const targets = scenes.filter((s) => todo(s).length);
    const skipped = scenes.reduce((n, s) => n + app.images.list(s.id).filter((i) => i.check?.state === "done").length, 0);
    if (!targets.length) {
      app.notice(fmt(app.images.total ? M.checkOnlyNothing : M.checkOnlyNoImages, { skipped }), "warn");
      return null;
    }
    this.ctl = new AbortController();
    const signal = this.ctl.signal;
    this.checkOnlyMode = true;
    this.checkFails = 0;
    this.checkDisabled = false;
    this.doneUnits = 0;
    this.plan = targets.map((s) => ({ id: s.id, total: 0, done: 0, closed: true }));
    const started = Date.now();
    let checked = 0;
    app.runStateChanged(true);
    try {
      app.phase("idle", "");
      app.status(M.runPreparing);
      const llm = await Net.probe(`${LlmClient.norm(app.store.data.llm.url)}/models`);
      if (llm !== "ok") throw Object.assign(Guide.fail(M.fix.checkOnlyNoLlm, "settingsLlm"), { who: "llm" });
      for (const s of targets) {
        for (const img of todo(s)) img.check = { state: "pending" };
        app.sceneChanged(s.id);
      }
      this.report();
      for (let si = 0; si < targets.length; si++) {
        const scene = targets[si];
        if (this.checkDisabled) break;
        app.markRunning(scene.id);
        const before = todo(scene).length;
        await this.checkPending(doc, scene, signal, () => fmt(M.checkOnlyTitle, { i: si + 1, n: targets.length, title: scene.title || `#${doc.scenes.indexOf(scene) + 1}` }));
        checked += before - todo(scene).length;
      }
      const run = doc.run;
      const good = scenes.reduce((n, s) => n + Judge.counts(app.images.list(s.id), run).good, 0);
      const lacking = scenes.filter((s) => Judge.lacking(app.images.list(s.id), run)).map((s) => `#${doc.scenes.indexOf(s) + 1}`);
      app.phase("done", "");
      app.progress(1);
      app.notice(fmt(M.checkOnlyDone, { checked, skipped, good, time: formatDuration(Date.now() - started), lacking: lacking.join("・") || M.lacking }), lacking.length ? "warn" : "ok");
      return { checked, skipped, good, lacking };
    } catch (err) {
      const why = Guide.explain(err, err?.who || "llm");
      for (const s of targets) {
        for (const img of app.images.list(s.id)) if (img.check?.state === "pending") img.check = undefined;
        app.sceneChanged(s.id);
      }
      if (why.aborted) {
        app.phase("stop", "");
        app.notice(fmt(M.checkOnlyStopped, { checked }), "");
      } else {
        app.phase("error", "");
        app.notice(why.text, "err", why.action);
      }
      return null;
    } finally {
      this.ctl = null;
      this.plan = [];
      this.checkOnlyMode = false;
      app.markRunning(null);
      app.updateEta(null);
      app.runStateChanged(false);
    }
  }

  async run(sceneIds) {
    const app = this.app;
    if (this.busy) throw Guide.fail(M.runBusy);
    const doc = app.doc;
    const run = doc.run;
    const scenes = sceneIds.map((id) => doc.scenes.find((s) => s.id === id)).filter(Boolean);
    if (!scenes.length) throw Guide.fail(doc.scenes.length ? M.fix.noTarget : M.fix.noScenes, doc.scenes.length ? "target" : "story");
    this.ctl = new AbortController();
    const signal = this.ctl.signal;
    this.checkFails = 0;
    this.checkDisabled = false;
    this.doneUnits = 0;
    this.plan = scenes.map((s) => ({ id: s.id, total: Doc.perScene(doc, s), done: 0, closed: false }));
    const started = Date.now();
    let made = 0;
    app.runStateChanged(true);
    try {
      await app.preflight(scenes);
      if (doc.mode === "novel") await app.freeForMedia();
      this.report();
      const extra = USER_SETTINGS.autoExtra;
      const good = (si) => Judge.counts(app.images.list(scenes[si].id), run).good;
      let phaseName = "gen";
      let round = 0;
      const title = (si) => fmt(M.runTitle, {
        i: si + 1, n: scenes.length, title: scenes[si].title || `#${doc.scenes.indexOf(scenes[si]) + 1}`,
        phase: L.phasesVerb[phaseName], made: this.plan[si].done, total: this.plan[si].total, good: good(si),
      });
      let targets = scenes.map((_, si) => si);
      for (;;) {
        await this.ensureImageVram(signal);
        phaseName = "gen";
        for (const si of targets) {
          const scene = scenes[si];
          const plan = this.plan[si];
          app.markRunning(scene.id);
          while (plan.done < plan.total) {
            app.phase("gen", title(si));
            app.status(round ? fmt(M.runExtra, { n: targets.length, k: round, max: extra.maxRounds }) : fmt(M.runImage, { pct: 0 }));
            await this.generateOne(doc, scene, app.images.list(scene.id).length, signal);
            plan.done++;
            made++;
            this.doneUnits++;
            app.sceneChanged(scene.id);
            this.report();
          }
          plan.closed = true;
        }
        if (!run.check) break;
        phaseName = "check";
        for (const si of targets) {
          if (this.checkDisabled) break;
          app.markRunning(scenes[si].id);
          await this.checkPending(doc, scenes[si], signal, () => title(si));
        }
        this.report();
        if (!run.autoExtra || this.checkDisabled || round >= extra.maxRounds) break;
        targets = targets.filter((si) => good(si) === 0);
        if (!targets.length) break;
        round++;
        for (const si of targets) {
          this.plan[si].total += Doc.perScene(doc, scenes[si]);
          this.plan[si].closed = false;
        }
        this.report();
      }
      const goodAll = scenes.reduce((n, s) => n + Judge.counts(app.images.list(s.id), run).good, 0);
      const lacking = scenes.filter((s) => Judge.lacking(app.images.list(s.id), run)).map((s) => `#${doc.scenes.indexOf(s) + 1}`);
      const vars = { scenes: scenes.length, made, good: goodAll, time: formatDuration(Date.now() - started), lacking: lacking.join("・") || M.lacking };
      app.lastRun = { ...vars, at: new Date(), lacking };
      app.phase("done", "");
      app.progress(1);
      app.notice(fmt(lacking.length ? M.runDone : M.runDoneAll, vars), lacking.length ? "warn" : "ok");
      return { made, good: goodAll, lacking };
    } catch (err) {
      const why = Guide.explain(err, err?.who || "image");
      if (why.aborted) {
        app.phase("stop", "");
        app.notice(fmt(M.runStopped, { made }), "");
      } else {
        app.phase("error", "");
        app.notice(why.text, "err", why.action);
      }
      throw Object.assign(err instanceof Error ? err : new Error(String(err)), { shown: true });
    } finally {
      this.ctl = null;
      this.plan = [];
      app.markRunning(null);
      app.updateEta(null);
      app.runStateChanged(false);
    }
  }
}

// ===== IRODORI BRIDGE CLIENT (VOICES) =====
class IrodoriClient {
  constructor(url) {
    this.base = String(url || NV.voice.defaults.bridgeUrl).trim().replace(/\/+$/, "");
  }

  async call(path, { method = "GET", body, signal, timeoutMs = USER_SETTINGS.probeTimeoutMs * 4, binary = false } = {}) {
    const timeout = AbortSignal.timeout(timeoutMs);
    let res;
    try {
      res = await fetch(this.base + path, {
        method, signal: signal ? AbortSignal.any([signal, timeout]) : timeout,
        headers: body ? { "Content-Type": "application/json" } : undefined, body: body ? JSON.stringify(body) : undefined,
      });
    } catch (err) {
      if (signal?.aborted) throw err;
      throw Object.assign(Guide.fail(fmt(NM.voiceDown, { url: this.base }), "settingsVoice"), { retry: true });
    }
    if (binary && res.ok) return res.blob();
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw Guide.fail(data.error?.message || `Irodori Bridge: HTTP ${res.status}`, "settingsVoice");
    return data;
  }

  health(signal) { return this.call("/health", { signal, timeoutMs: NV.voice.healthTimeoutMs }); }
  submit(body, signal) { return this.call("/jobs", { method: "POST", body, signal, timeoutMs: NV.voice.submitTimeoutMs }); }
  job(id, signal) { return this.call(`/jobs/${id}`, { signal, timeoutMs: NV.voice.pollTimeoutMs }); }
  cancel(id) { return this.call(`/jobs/${id}`, { method: "DELETE" }).catch(() => {}); }
  unload() { return this.call("/unload", { method: "POST" }); }
  audio(id, signal) { return this.call(`/jobs/${id}/audio.wav`, { signal, binary: true, timeoutMs: NV.voice.submitTimeoutMs }); }

  async again(fn, { signal, onRetry, tries = Infinity } = {}) {
    const V = NV.voice;
    const started = Date.now();
    for (let n = 1; ; n++) {
      try {
        return await fn();
      } catch (err) {
        if (!err?.retry || signal?.aborted || n >= tries || Date.now() - started > V.pollGiveUpMs) throw err;
        onRetry?.(n);
        await sleep(V.retryWaitMs);
        if (signal?.aborted) throw new DOMException("aborted", "AbortError");
      }
    }
  }

  async check() {
    try {
      const health = await this.again(() => this.health(), { tries: NV.voice.fetchRetries });
      if (!health.irodori) return { state: "warn", text: fmt(NM.voiceNoIrodori, { err: health.irodori_error || "?" }) };
      return { state: "ok", text: fmt(NM.voiceOk, { state: health.loaded ? NM.voiceLoaded : NM.voiceIdle }) };
    } catch {
      const probe = await Net.probe(`${this.base}/health`);
      return probe === "cors" ? { state: "cors", text: NM.voiceCors } : { state: "down", text: fmt(NM.voiceDown, { url: this.base }) };
    }
  }

  async speak(body, signal, onState) {
    const sent = await this.submit(body, signal);
    const id = sent.job_id;
    try {
      for (;;) {
        await sleep(NV.voice.pollMs);
        if (signal.aborted) throw new DOMException("aborted", "AbortError");
        const retry = (n) => onState?.({ state: "retry", n });
        const st = await this.again(() => this.job(id, signal), { signal, onRetry: retry });
        if (st.state === "done") return { blob: await this.again(() => this.audio(id, signal), { signal, onRetry: retry, tries: NV.voice.fetchRetries }), duration: Number(st.result?.duration) || 0 };
        if (st.state === "error") throw Guide.fail(st.error?.message || st.error?.code || "Irodori-TTS error", "settingsVoice");
        if (st.state === "cancelled") throw new DOMException("aborted", "AbortError");
        onState?.(st);
      }
    } catch (err) {
      if (err?.name === "AbortError" || signal.aborted) this.cancel(id);
      throw err;
    }
  }

  static fileToDataUrl(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(reader.error);
      reader.readAsDataURL(file);
    });
  }
}

// ===== VIDEO CLIENT (COMFYUI MINIMAX H3 LOOP TURBO) =====
class VideoClient {
  constructor(cfg) {
    this.cfg = { ...NV.video.defaults, ...(cfg || {}) };
    this.base = String(this.cfg.url || NV.video.defaults.url).trim().replace(/\/+$/, "");
    this.clientId = uid() + uid();
    this.current = null;
  }

  get probeUrl() { return `${this.base}/system_stats`; }

  static size(width, height, megapixels) {
    const V = NV.video;
    const ratio = (Number(width) || 1) / (Number(height) || 1);
    const area = megapixels * V.megapixelUnit;
    const snap = (v) => Math.max(V.multiple, Math.round(v / V.multiple) * V.multiple);
    return { width: snap(Math.sqrt(area * ratio)), height: snap(Math.sqrt(area / ratio)) };
  }

  static lengthFor(seconds) {
    const C = NV.loopPrompt.loop;
    const target = Number(seconds) * C.fps;
    return C.lengths.reduce((best, len) => (Math.abs(len - C.tailFrames - target) < Math.abs(best - C.tailFrames - target) ? len : best));
  }

  static secondsOf(length) {
    const C = NV.loopPrompt.loop;
    return (length - C.tailFrames) / C.fps;
  }

  static async frame(blob, size) {
    const bmp = await createImageBitmap(blob);
    const canvas = h("canvas", { width: size.width, height: size.height });
    const k = Math.max(size.width / bmp.width, size.height / bmp.height);
    const w = bmp.width * k, hh = bmp.height * k;
    canvas.getContext("2d").drawImage(bmp, (size.width - w) / 2, (size.height - hh) / 2, w, hh);
    bmp.close?.();
    return canvasBlob(canvas, "image/png");
  }

  workflow({ imageName, prompt, size, seconds, seed, turbo }) {
    const N = NV.video.nodes;
    const c = this.cfg;
    const wf = clone(NV.video.workflow);
    wf[N.image].inputs.image = imageName;
    Object.assign(wf[N.video].inputs, { prompt, width: size.width, height: size.height, length: VideoClient.lengthFor(seconds) });
    delete wf[N.size];
    wf[N.seed].inputs.noise_seed = seed;
    wf[N.unet].inputs.unet_name = c.unet;
    wf[N.lora].inputs.lora_name = c.lora;
    if (!turbo) {
      wf[N.loop].inputs.model = [N.unet, 0];
      wf[N.steps].inputs.steps = NV.video.stepsNoTurbo;
      delete wf[N.lora];
    }
    wf[N.clip].inputs.clip_name = c.clip;
    wf[N.vae].inputs.vae_name = c.vae;
    wf[N.audioVae].inputs.vae_name = c.audioVae;
    return wf;
  }

  async models() {
    const out = {};
    await Promise.all(Object.entries(NV.video.modelInputs).map(async ([k, [cls, key]]) => { out[k] = await ComfyClient.prototype.inputList.call(this, cls, key); }));
    return out;
  }

  download(doc) {
    const nv = doc.novel.video;
    const size = VideoClient.size(doc.common.width, doc.common.height, nv.megapixels);
    const wf = this.workflow({ imageName: NV.video.workflowImage, prompt: "", size, seconds: nv.seconds, seed: 0, turbo: nv.turbo });
    downloadBlob(new Blob([JSON.stringify(wf, null, 2)], { type: "application/json" }), NV.video.workflowFile);
  }

  async post(path, init, signal) {
    try {
      return await fetch(this.base + path, { ...init, signal });
    } catch (err) {
      if (signal?.aborted) throw err;
      throw Guide.fail(fmt(NM.videoDown, { url: this.base }), "settingsVideo");
    }
  }

  async upload(blob, name, signal) {
    const fd = new FormData();
    fd.append("image", blob, name);
    fd.append("overwrite", "true");
    const res = await this.post("/upload/image", { method: "POST", body: fd }, signal);
    if (!res.ok) throw Guide.fail(fmt(NM.videoError, { err: `upload ${res.status}` }), "settingsVideo");
    const j = await res.json();
    return j.subfolder ? `${j.subfolder}/${j.name}` : j.name;
  }

  async make({ blob, prompt, seconds, megapixels, turbo, seed, width, height }, { signal, onProgress }) {
    const size = VideoClient.size(width, height, megapixels);
    const name = await this.upload(await VideoClient.frame(blob, size), `${NV.video.uploadPrefix}${uid()}.png`, signal);
    const wf = this.workflow({ imageName: name, prompt, size, seconds, seed, turbo });
    const res = await this.post("/prompt", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ prompt: wf, client_id: this.clientId }) }, signal);
    if (!res.ok) throw Guide.fail(fmt(NM.videoRejected, { status: res.status, text: (await res.text()).slice(0, 600) }), "settingsVideo");
    const id = (await res.json()).prompt_id;
    this.current = id;
    const stop = ComfyClient.prototype.watch.call(this, id, onProgress);
    const started = Date.now();
    try {
      for (;;) {
        if (signal.aborted) throw new DOMException("aborted", "AbortError");
        if (Date.now() - started > NV.video.timeoutMs) throw new DOMException("timeout", "TimeoutError");
        const entry = (await (await fetch(`${this.base}/history/${id}`, { signal })).json())[id];
        if (entry) {
          if (entry.status?.status_str === "error") {
            const e = (entry.status.messages || []).find((m) => m[0] === "execution_error");
            throw Guide.fail(fmt(NM.videoError, { err: e?.[1]?.exception_message || "?" }), "settingsVideo");
          }
          const file = VideoClient.findVideo(entry.outputs);
          if (!file) throw Guide.fail(NM.videoNoOutput, "settingsVideo");
          const q = new URLSearchParams({ filename: file.filename, subfolder: file.subfolder || "", type: file.type || "output" });
          const out = await (await fetch(`${this.base}/view?${q}`, { signal })).blob();
          return { blob: out.type.startsWith("video/") ? out : new Blob([out], { type: VideoClient.mime(file.filename) }), name: file.filename, size };
        }
        await sleep(NV.video.pollMs);
      }
    } finally {
      stop();
      this.current = null;
    }
  }

  static findVideo(outputs) {
    for (const o of Object.values(outputs || {})) {
      for (const list of Object.values(o || {})) {
        if (!Array.isArray(list)) continue;
        const f = list.find((x) => x && typeof x.filename === "string" && NV.video.videoExt.test(x.filename));
        if (f) return f;
      }
    }
    return null;
  }

  static mime(name) {
    return /\.webm$/i.test(name) ? "video/webm" : /\.gif$/i.test(name) ? "image/gif" : "video/mp4";
  }

  static ext(blob) {
    return /webm/.test(blob.type) ? "webm" : /gif/.test(blob.type) ? "gif" : "mp4";
  }

  free() {
    return fetch(`${this.base}/free`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ unload_models: true, free_memory: true }), signal: AbortSignal.timeout(USER_SETTINGS.listTimeoutMs) }).then((r) => r.ok).catch(() => false);
  }

  interrupt() {
    const body = JSON.stringify(this.current ? { prompt_id: this.current } : {});
    return fetch(`${this.base}/interrupt`, { method: "POST", headers: { "Content-Type": "application/json" }, body }).catch(() => {});
  }
}

// ===== NOVEL WRITER (TEXT AI: PLAN, SCRIPT, LOOP VIDEO PROMPT) =====
class NovelWriter {
  static voiceText(v) {
    if (!v) return "-";
    return [v.caption?.trim(), v.mode !== "caption" ? `(${v.mode})` : ""].filter(Boolean).join(" ") || "-";
  }

  static castLines(doc, filter = () => true) {
    return doc.cast.map((c, i) => [c, i]).filter(([c]) => filter(c)).map(([c, i]) => `- id: ${c.id} (${letter(i)}) / name: ${c.name || "(unnamed)"} / notes: ${c.note || "-"} / voice: ${this.voiceText(c.voice)} / look: ${lookOf(c)}`).join("\n") || "(none)";
  }

  static speaks(c) {
    const v = c?.voice;
    if (!v || v.on === false) return false;
    return v.mode === "caption" ? !!v.caption.trim() : true;
  }

  static castId(doc, v) {
    const s = String(v ?? "").trim();
    if (!s) return null;
    const i = doc.cast.findIndex((c, k) => c.id === s || letter(k) === s.toUpperCase() || (c.name && c.name.trim() === s));
    return i < 0 ? null : doc.cast[i].id;
  }

  static locationId(doc, v) {
    const s = String(v ?? "").trim();
    if (!s) return "";
    const i = doc.locations.findIndex((l, k) => l.id === s || String(k + 1) === s || (l.name && l.name.trim() === s));
    return i < 0 ? "" : doc.locations[i].id;
  }

  static lines(doc, raw) {
    return (Array.isArray(raw) ? raw : [])
      .map((l) => (typeof l === "string" ? { speaker: "", text: l } : l || {}))
      .map((l) => Doc.newLine({ who: this.speakerOf(doc, l.speaker ?? l.name ?? l.who), text: String(l.text ?? l.line ?? "").replace(/^["「『]|["」』]$/g, "").trim(), emo: Doc.emo(l.emo) }))
      .filter((l) => l.text);
  }

  static emojiList() {
    return NV.emojis.map(([e, a, b]) => `${e} ${a}（${b}）`).join(" / ");
  }

  static manuscript(doc) {
    const t = (doc.manuscript || "").trim();
    return t ? `Base manuscript (follow it):\n${t}` : "";
  }

  static planText(doc) {
    return [
      doc.brief.trim() ? `Idea from the user:\n${doc.brief.trim()}` : "",
      this.manuscript(doc),
      `Total number of pictures: ${doc.novel.imageCount}`,
      USER_SETTINGS.styleRules[doc.common.style] || USER_SETTINGS.styleRules.tags,
      `Cast:\n${this.castLines(doc)}`,
      `Locations:\n${StoryWriter.locationLines(doc)}`,
      doc.title.trim() ? `Working title: ${doc.title.trim()}` : "",
    ].filter(Boolean).join("\n\n");
  }

  static acceptPlan(doc, obj) {
    const castIds = new Set(doc.cast.map((c) => c.id));
    const locIds = new Set(doc.locations.map((l) => l.id));
    const str = (v) => (Array.isArray(v) ? v.join(", ") : typeof v === "string" ? v : v == null ? "" : String(v)).trim();
    const groups = Array.isArray(obj.scenes) ? obj.scenes.filter((g) => g && typeof g === "object") : [];
    const scenes = [];
    for (const g of groups) {
      const imgs = (Array.isArray(g.images) ? g.images : g.prompt ? [g] : []).filter((o) => o && typeof o === "object");
      imgs.forEach((o, k) => scenes.push(Doc.newScene({
        title: str(o.title), text: str(o.text || o.narration),
        cast: [...new Set((Array.isArray(o.cast) ? o.cast : []).map((v) => this.castId(doc, v)).filter((id) => castIds.has(id)))],
        location: locIds.has(this.locationId(doc, o.location)) ? this.locationId(doc, o.location) : "",
        count: str(o.count), prompt: str(o.prompt), loop: o.loop === true || o.loop === "true", noImage: o.noImage === true || o.noImage === "true",
        sceneStart: k === 0, sceneTitle: k === 0 ? str(g.title) : "", lines: this.lines(doc, o.lines),
      })));
    }
    if (!scenes.length || !scenes.some((s) => s.prompt || s.noImage)) throw new Error("no images");
    scenes[0].sceneStart = true;
    return { title: str(obj.title), synopsis: str(obj.synopsis), scenes };
  }

  static isScenario(obj) {
    return !!obj && typeof obj === "object" && !Doc.isProject(obj) && Array.isArray(obj.scenes)
      && obj.scenes.some((g) => g && typeof g === "object" && ((Array.isArray(g.images) && g.images.some((o) => o && typeof o.prompt === "string")) || typeof g.prompt === "string"));
  }

  static scenarioIn(text) {
    try {
      const obj = JSON.parse(text);
      if (this.isScenario(obj)) return obj;
    } catch {}
    return LooseJson.candidates(String(text || "")).find((o) => this.isScenario(o)) || null;
  }

  static mergeCast(doc, list) {
    let added = 0;
    const str = (v) => (v == null ? "" : String(v)).trim();
    (Array.isArray(list) ? list : []).filter((o) => o && typeof o === "object").forEach((o, k) => {
      const key = str(o.id) || letter(k);
      let c = doc.cast.find((x, i) => letter(i) === key.toUpperCase() || x.id === key) || doc.cast.find((x) => x.name && x.name.trim() === str(o.name));
      if (!c) { c = Doc.person({}, "c"); doc.cast.push(c); added++; }
      for (const f of ["name", "note", "ident", "body", "outfit"]) if (!str(c[f]) && str(o[f])) c[f] = str(o[f]);
      const voice = typeof o.voice === "string" ? o.voice : o.voice?.caption;
      if (c.voice.mode === "caption" && !str(c.voice.caption) && str(voice)) c.voice.caption = str(voice);
    });
    return added;
  }

  static mergeLocations(doc, list) {
    const str = (v) => (v == null ? "" : String(v)).trim();
    (Array.isArray(list) ? list : []).filter((o) => o && typeof o === "object").forEach((o, k) => {
      const key = str(o.id) || String(k + 1);
      let l = doc.locations.find((x, i) => String(i + 1) === key || x.id === key) || doc.locations.find((x) => x.name && x.name.trim() === str(o.name));
      if (!l) { l = Doc.person({}, "l"); doc.locations.push(l); }
      for (const f of ["name", "note", "prompt"]) if (!str(l[f]) && str(o[f])) l[f] = str(o[f]);
    });
  }

  static fromManuscript(doc) {
    const text = (doc.manuscript || "").trim();
    if (!text.includes("{")) return null;
    const obj = this.scenarioIn(text);
    if (!obj) return null;
    this.mergeCast(doc, obj.cast || obj.characters);
    this.mergeLocations(doc, obj.locations);
    try { return this.acceptPlan(doc, obj); } catch { return null; }
  }

  static requestText(doc) {
    const n = doc.novel;
    const aspect = NV.imageAspects.find(([k]) => k === n.aspect) || NV.imageAspects[0];
    const person = (c, i) => `- ${letter(i)}: ${c.name || "(名前なし)"}${c.note ? ` ／ ${c.note}` : ""}${c.voice?.caption?.trim() ? ` ／ 声: ${c.voice.caption.trim()}` : ""}${[c.ident, c.body, c.outfit].some((x) => x?.trim()) ? ` ／ 見た目: ${[c.ident, c.body, c.outfit].filter((x) => x?.trim()).join(", ")}` : ""}`;
    const cast = doc.cast.map((c, i) => [c, i]);
    return fmt(NV.requestTemplate, {
      title: doc.title || NL.requestNone,
      brief: [doc.brief.trim(), doc.manuscript.trim()].filter(Boolean).join("\n\n") || NL.requestNone,
      count: n.imageCount, min: n.linesMin, max: Math.max(n.linesMin, n.linesMax), aspect: aspect[1], maxEmo: NV.maxEmo,
      cast: cast.map(([c, i]) => person(c, i)).join("\n") || NL.requestNone,
      locations: doc.locations.map((l, i) => `- ${i + 1}: ${l.name || "(名前なし)"}${l.note ? ` ／ ${l.note}` : ""}${l.prompt ? ` ／ ${l.prompt}` : ""}`).join("\n") || NL.requestNone,
      style: NV.requestStyle[doc.common.style] || NV.requestStyle.tags,
      emojis: NV.emojis.map(([e, a, b]) => `- ${e} ${a}（${b}）`).join("\n"),
    });
  }

  static plan(llm, doc, signal) {
    return llm.askJson(NV.planPrompt, this.planText(doc), [], signal, (obj) => this.acceptPlan(doc, obj), NM.planBad);
  }

  static speakerOf(doc, v) {
    const s = String(v ?? "").trim();
    if (!s || /^(narrator|narration|地の文|ナレーション|ナレーター)$/i.test(s)) return NV.narrator;
    const byId = doc.cast.find((c) => c.id === s);
    if (byId) return byId.id;
    const i = doc.cast.findIndex((c, k) => (c.name && c.name.trim() === s) || letter(k) === s.toUpperCase());
    return i >= 0 ? doc.cast[i].id : NV.narrator;
  }

  static nameOf(doc, who) {
    if (who === NV.narrator) return NL.narratorName;
    const i = doc.cast.findIndex((c) => c.id === who);
    return i < 0 ? NL.narratorName : doc.cast[i].name || `${letter(i)}`;
  }

  static scriptText(doc, groups, gi, prevLines) {
    const g = groups[gi];
    const outline = groups.map((x, i) => `${i === gi ? ">> " : "   "}Scene ${i + 1}${x.head.sceneTitle ? ` (${x.head.sceneTitle})` : ""}: ${x.scenes.map((s) => s.title || s.text).filter(Boolean).join(" / ")}`).join("\n");
    const castName = (s) => s.cast.map((id) => this.nameOf(doc, id)).join(", ") || "-";
    return [
      `Game title: ${doc.title || "-"}\nSynopsis: ${doc.synopsis || "-"}`,
      this.manuscript(doc),
      `Cast:\n${this.castLines(doc)}`,
      `Delivery emoji list (for "emo"):\n${this.emojiList()}`,
      `Outline (the current scene is marked with >>):\n${outline}`,
      prevLines.length ? `Lines of the previous scene:\n${prevLines.map((l) => `${this.nameOf(doc, l.who)}: ${l.text}`).join("\n")}` : "",
      `Pictures of this scene (attached in this order):\n${g.scenes.map((s, k) => `Picture ${k + 1}${s.noImage ? " (text only: no picture, black screen)" : ""}: ${s.title || "-"} / what happens: ${s.text || "-"} / characters: ${castName(s)} / image prompt: ${s.prompt || "-"}`).join("\n")}`,
      `Lines per picture: ${doc.novel.linesMin} to ${doc.novel.linesMax}. Return exactly ${g.scenes.length} entries in "images".`,
    ].filter(Boolean).join("\n\n");
  }

  static acceptScript(doc, obj, n) {
    const list = Array.isArray(obj.images) ? obj.images : Array.isArray(obj) ? obj : null;
    if (!list || list.length < n) throw new Error("count");
    const out = list.slice(0, n).map((im) => this.lines(doc, Array.isArray(im?.lines) ? im.lines : Array.isArray(im) ? im : []));
    if (!out.some((lines) => lines.length)) throw new Error("no lines");
    return out;
  }

  static async script(llm, doc, groups, gi, prevLines, images, signal) {
    const system = fmt(NV.scriptPrompt, { min: doc.novel.linesMin, max: Math.max(doc.novel.linesMin, doc.novel.linesMax), maxEmo: NV.maxEmo });
    const text = this.scriptText(doc, groups, gi, prevLines);
    const accept = (obj) => this.acceptScript(doc, obj, groups[gi].scenes.length);
    try {
      return await llm.askJson(system, text, images, signal, accept, NM.scriptBad);
    } catch (err) {
      if (!images.length || err?.name === "AbortError" || !/image|vision|multimodal|image_url|mmproj/i.test(String(err?.message || ""))) throw err;
      return llm.askJson(system, text, [], signal, accept, NM.scriptBad);
    }
  }

  // LOOP VIDEO PROMPT
  static loopSeconds(doc) { return VideoClient.secondsOf(VideoClient.lengthFor(doc.novel.video.seconds)); }

  static loopContext(doc, scene, img, size) {
    return `Stable Diffusion prompt: ${ImageChecker.promptOf(doc, scene, img) || "(none)"}\n` +
      `Negative prompt (for reference only): ${img.negative || "(none)"}\n` +
      `Model: ${img.settings?.model || doc.common.model || "unknown"}\nImage size: ${size.width}x${size.height}`;
  }

  static loopOptionsText(doc) {
    const P = NV.loopPrompt;
    const chosen = doc.novel.video.options;
    const lines = P.groups.map((g) => `${g.label}: ${(g.choices.find(([v]) => v === chosen[g.key]) || [])[1] || chosen[g.key]}`);
    lines.unshift(P.modeLabel);
    lines.push(`モードの意味: ${P.loop.storyMode}`);
    lines.push(`長さ: ${this.loopSeconds(doc).toFixed(2)}秒`);
    return lines.join("\n");
  }

  static loopSettingsText(doc, direction) {
    const P = NV.loopPrompt;
    const chosen = doc.novel.video.options;
    const lines = P.groups.filter((g) => g.key !== "motion").map((g) => g.choices.find(([v]) => v === chosen[g.key])[2].replace("{vocab}", P.cameraVocab));
    lines.unshift(P.loop.promptRule, P.loop.motion[chosen.motion] || P.loop.motion.normal);
    if (direction) lines.push(P.directionRule.replace("{text}", direction));
    return `${P.header}\n${lines.map((l) => `- ${l}`).join("\n")}`;
  }

  static staticCamera(text) {
    const cfg = NV.loopPrompt.staticCamera;
    const fixSentence = (sentence) => {
      if (!cfg.move.test(sentence) && !cfg.nounLead.test(sentence)) return sentence;
      const lead = sentence.match(cfg.lead) || sentence.match(cfg.nounLead);
      if (lead) return `${lead[1]}${/,\s*$/.test(lead[1]) ? cfg.sentence.replace(/^The/, "the") : cfg.sentence}`;
      return sentence.replace(cfg.clause, "");
    };
    const lines = text.split("\n").map((line) => {
      if (!/\bcamera\b|push[- ]in|pull[- ]out|dolly|zoom|tracking shot|arc shot|crane shot/i.test(line)) return line;
      const said = new Set();
      let shot = "";
      return line.split(/(?<=[.!?])\s+/).map(fixSentence).filter((p) => {
        const body = p.replace(/^[a-z_]+:\s*/, "");
        shot = body.match(/^\[Shot \d+\]/)?.[0] || shot;
        const bare = body.replace(/^\[Shot \d+\]\s*/, "").replace(/^At [\d:.]+,\s*/, "");
        if (bare.toLowerCase() !== cfg.sentence.toLowerCase()) return true;
        if (said.has(shot)) return false;
        said.add(shot);
        return true;
      }).join(" ");
    });
    let out = lines.join("\n");
    if (!cfg.still.test(out)) {
      const field = cfg.fields.find((f) => out.includes(f));
      if (field) {
        const at = out.indexOf(field) + field.length;
        const lead = out.slice(at).match(/^[ \t]*\r?\n?/)[0].length;
        const end = out.indexOf("\n", at + lead);
        const stop = end < 0 ? out.length : end;
        out = `${out.slice(0, stop).trimEnd()} ${cfg.sentence}${out.slice(stop)}`;
      }
    }
    return out;
  }

  static loopFinish(doc, text) {
    const P = NV.loopPrompt;
    const chosen = doc.novel.video.options;
    let out = text.replace(P.instructionPattern, "").trimStart();
    const rules = ["voice", "vocal", "sfx"].filter((k) => chosen[k] === "off").map((k) => P.audioRules[k].en);
    if (rules.length) {
      const at = out.indexOf(P.soundscapeField);
      if (at >= 0) {
        const start = at + P.soundscapeField.length;
        const lead = out.slice(start).match(/^[ \t]*(\r?\n)?/);
        const body = out.slice(start + lead[0].length);
        if (!/^N\/A\b/.test(body)) out = `${out.slice(0, start)}${lead[1] ? "\n" : " "}${rules.join(" ")}${body ? ` ${body}` : ""}`;
      } else {
        out = `${out.trimEnd()}\n\n${P.soundscapeField} ${rules.join(" ")}`;
      }
    }
    if (chosen.scene === "static") out = this.staticCamera(out);
    if (chosen.music === "off") out = out.replace(new RegExp(`(^|\\n)(${P.musicField})([ \\t]*\\n?)[^\\n]*`), (m, lead, field, sep) => `${lead}${field}${sep.includes("\n") ? "\n" : " "}N/A`);
    return out;
  }

  static clean(reply) {
    let t = String(reply?.text || "").replace(/<think>[\s\S]*?<\/think>/g, "");
    if (t.includes("</think>")) t = t.split("</think>").slice(1).join("</think>");
    t = t.trim().replace(/^```\w*\n?|\n?```$/g, "").trim();
    if (t.length >= 2 && t[0] === t[t.length - 1] && `"'`.includes(t[0])) t = t.slice(1, -1).trim();
    return t;
  }

  static async videoPrompt(llm, doc, scene, img, signal) {
    const P = NV.loopPrompt;
    const seconds = String(this.loopSeconds(doc));
    const nv = doc.novel.video;
    const size = VideoClient.size(img.width || doc.common.width, img.height || doc.common.height, nv.megapixels);
    const contextText = this.loopContext(doc, scene, img, size);
    const direction = (scene.motion || "").trim();
    const images = [await ImageChecker.imageUrl(img.blob)];
    let storyUser = `${P.story.userHeader}\n${contextText}\n\n${P.story.optionsHeader}\n${this.loopOptionsText(doc)}`;
    if (direction) storyUser += `\n\n${P.story.directionHeader} ${direction}`;
    const story = this.clean(await llm.chat(P.story.system.replaceAll("{seconds}", seconds), storyUser, images, signal));
    if (!story) throw new UserError(M.llmEmptyReply);
    const system = `${P.style.replaceAll("{seconds}", seconds)}\n\n${this.loopSettingsText(doc, direction)}\n\n${P.namingRule}\n\n${P.expressionRule}`;
    let user = `${contextText}\n\n${P.story.promptHeader}\n${story}`;
    if (P.story.voiceLine.test(story)) user += `\n\n${P.story.voiceRule}`;
    const out = this.clean(await llm.chat(system, user, images, signal));
    if (!out) throw new UserError(M.llmEmptyReply);
    return this.loopFinish(doc, out);
  }
}

// ===== NOVEL RUNNER (PLAN -> IMAGES -> SCRIPT -> VOICE -> LOOP VIDEO) =====
class NovelRunner {
  constructor(app) {
    this.app = app;
    this.ctl = null;
    this.stage = null;
    this.audio = new Audio();
  }

  destroy() {
    this.stop();
    this.audio.pause();
  }

  get busy() { return !!this.ctl; }
  get order() { return NV.stages.map(([k]) => k); }
  get doc() { return this.app.doc; }

  stop() {
    if (!this.ctl) return;
    this.ctl.abort();
    this.app.runner.stop();
    this.app.videoClient().interrupt();
  }

  play(url) {
    this.audio.pause();
    if (!url) return;
    this.audio.src = url;
    this.audio.play().catch(() => {});
  }

  // STATE OF EACH STEP
  voiced(line) {
    if (!line.text.trim()) return false;
    if (line.who === NV.narrator) return this.doc.novel.narrate;
    return this.doc.cast.find((c) => c.id === line.who)?.voice?.on !== false;
  }

  autoVoiced(line) {
    if (!this.voiced(line)) return false;
    return line.who === NV.narrator || NovelWriter.speaks(this.doc.cast.find((c) => c.id === line.who));
  }

  voiceOf(who) {
    if (who === NV.narrator) return this.doc.novel.narrator;
    return this.doc.cast.find((c) => c.id === who)?.voice || Doc.voiceOf(null);
  }

  voiceSig(line) {
    const v = this.voiceOf(line.who);
    const cfg = this.app.store.data.voice;
    return JSON.stringify([line.who, line.text.trim(), line.emo || "", v.mode, v.caption, v.seed, cfg.checkpoint, cfg.numSteps, cfg.durationScale]);
  }

  take(line) {
    const e = this.app.voices.get(line.id);
    return e?.takes?.find((t) => t.id === e.pick) || null;
  }

  voiceState(line) {
    const e = this.app.voices.get(line.id);
    const t = this.take(line);
    if (!this.voiced(line)) return { state: "skip", e, t };
    if (e?.state === "run" || e?.state === "wait") return { state: e.state, e, t };
    if (t && t.sig === this.voiceSig(line)) return { state: "done", e, t };
    if (e?.state === "error") return { state: "error", e, t };
    return { state: "stale", e, t };
  }

  pickTake(lineId, takeId) {
    const e = this.app.voices.get(lineId);
    if (!e?.takes?.some((t) => t.id === takeId)) return;
    e.pick = takeId;
    this.app.board.updateVoice(lineId);
    this.app.left.paintSteps();
  }

  dropTake(lineId, takeId) {
    const e = this.app.voices.get(lineId);
    const t = e?.takes?.find((x) => x.id === takeId);
    if (!t) return;
    URL.revokeObjectURL(t.url);
    e.takes = e.takes.filter((x) => x !== t);
    if (e.pick === takeId) e.pick = e.takes[e.takes.length - 1]?.id || null;
    this.app.board.updateVoice(lineId);
    this.app.left.paintSteps();
  }

  videoSig(scene) {
    const v = this.doc.novel.video;
    return JSON.stringify([this.app.pickOf(scene.id)?.id || "", scene.videoPrompt, scene.motion, v.seconds, v.megapixels, v.turbo]);
  }

  videoTake(scene) {
    const e = this.app.videos.get(scene.id);
    return e?.takes?.find((t) => t.id === e.pick) || null;
  }

  videoState(scene) {
    const e = this.app.videos.get(scene.id);
    const t = this.videoTake(scene);
    if (!scene.loop || scene.noImage) return { state: "skip", e, t };
    if (e?.state === "run" || e?.state === "wait") return { state: e.state, e, t };
    if (t && t.sig === this.videoSig(scene)) return { state: "done", e, t };
    if (e?.state === "error") return { state: "error", e, t };
    return { state: "stale", e, t };
  }

  pickVideo(sceneId, takeId) {
    const e = this.app.videos.get(sceneId);
    if (!e?.takes?.some((t) => t.id === takeId)) return;
    e.pick = takeId;
    this.app.board.paintVideo(sceneId);
    this.app.left.paintSteps();
  }

  dropVideo(sceneId, takeId) {
    const e = this.app.videos.get(sceneId);
    const t = e?.takes?.find((x) => x.id === takeId);
    if (!t) return;
    URL.revokeObjectURL(t.url);
    e.takes = e.takes.filter((x) => x !== t);
    if (e.pick === takeId) e.pick = e.takes[e.takes.length - 1]?.id || null;
    this.app.board.paintVideo(sceneId);
    this.app.left.paintSteps();
  }

  // FILES MADE ELSEWHERE
  addFiles(files, test, kind) {
    const list = files.filter((f) => test.test(mediaType(f)) || test.test(f.name));
    if (!list.length) this.app.notice(fmt(NM.addBad, { kind }), "warn");
    return list.map((f) => ({ name: f.name, blob: f.type ? f : new Blob([f], { type: mediaType(f) }) }));
  }

  async addVoiceFiles(lineId, files) {
    const line = this.allLines().find((l) => l.id === lineId);
    if (!line) return;
    const list = this.addFiles(files, /^audio\/|\.(wav|mp3|flac|ogg|m4a|aac|opus)$/i, NM.addKindAudio);
    if (!list.length) return;
    const e = this.app.voices.get(lineId) || { takes: [], pick: null };
    const sig = this.voiceSig(line);
    const added = [];
    for (const { blob } of list) added.push({ id: "t" + uid(), blob, url: URL.createObjectURL(blob), duration: await mediaDuration(blob), sig, at: Date.now() });
    this.app.voices.set(lineId, { ...e, takes: [...e.takes, ...added], pick: added[added.length - 1].id, state: "", error: "" });
    this.app.board.updateVoice(lineId);
    this.app.left.paintSteps();
    this.app.notice(fmt(NM.addedVoices, { n: added.length }), "ok");
  }

  async addVideoFiles(sceneId, files) {
    const scene = this.doc.scenes.find((s) => s.id === sceneId);
    if (!scene) return;
    const list = this.addFiles(files, /^video\/|^image\/gif$|\.(mp4|webm|mov|mkv|gif)$/i, NM.addKindVideo);
    if (!list.length) return;
    const e = this.app.videos.get(sceneId) || { takes: [], pick: null };
    const sig = this.videoSig(scene);
    const added = list.map(({ blob, name }) => ({ id: "v" + uid(), blob, url: URL.createObjectURL(blob), sig, name, at: Date.now() }));
    this.app.videos.set(sceneId, { ...e, takes: [...e.takes, ...added], pick: added[added.length - 1].id, state: "", error: "" });
    this.app.board.paintVideo(sceneId);
    this.app.left.paintSteps();
    this.app.notice(fmt(NM.addedVideos, { n: added.length }), "ok");
  }

  allLines() {
    return this.doc.scenes.flatMap((s) => s.lines);
  }

  stat(key) {
    const doc = this.doc;
    const S = NL.stageStat;
    const n = doc.scenes.length;
    if (!n) return S.empty;
    if (key === "plan") return fmt(S.plan, { n, g: Doc.groups(doc).length });
    if (key === "images") {
      const withImage = doc.scenes.filter((s) => !s.noImage);
      return fmt(S.images, { n: withImage.length, done: withImage.filter((s) => this.app.pickOf(s.id)).length });
    }
    if (key === "script") return fmt(S.script, { n, done: doc.scenes.filter((s) => s.lines.some((l) => l.text.trim())).length, lines: this.allLines().filter((l) => l.text.trim()).length });
    if (key === "voice") {
      const lines = this.allLines().filter((l) => this.autoVoiced(l) || this.voiceState(l).state === "done");
      return lines.length ? fmt(S.voice, { n: lines.length, done: lines.filter((l) => this.voiceState(l).state === "done").length }) : S.empty;
    }
    const loops = doc.scenes.filter((s) => s.loop);
    return loops.length ? fmt(S.video, { n: loops.length, done: loops.filter((s) => this.videoState(s).state === "done").length }) : S.empty;
  }

  pending(key) {
    const doc = this.doc;
    if (key === "plan") return !doc.scenes.length;
    if (key === "images") return doc.scenes.some((s) => !s.noImage && !this.app.pickOf(s.id));
    if (key === "script") return doc.scenes.some((s) => !s.lines.some((l) => l.text.trim()));
    if (key === "voice") return this.allLines().some((l) => this.autoVoiced(l) && ["stale", "error"].includes(this.voiceState(l).state));
    return doc.scenes.some((s) => s.loop && ["stale", "error"].includes(this.videoState(s).state));
  }

  firstOpen() {
    return this.order.find((k) => this.pending(k)) || null;
  }

  // RUN
  async task(fn) {
    const app = this.app;
    if (this.busy || app.runner.busy || app.storyCtl) { app.notice(M.runBusy, "warn"); return false; }
    this.ctl = new AbortController();
    app.runStateChanged(true);
    try {
      const ok = await fn(this.ctl.signal);
      if (ok !== false) { app.phase("done", ""); app.progress(1); }
      return ok;
    } catch (err) {
      if (!err?.shown) {
        const why = Guide.explain(err, err?.who || "llm");
        app.phase(why.aborted ? "stop" : "error", "");
        app.notice(why.aborted ? NM.stageStopped : why.text, why.aborted ? "" : "err", why.action);
      }
      return false;
    } finally {
      this.ctl = null;
      this.stage = null;
      app.updateEta(null);
      app.runStateChanged(false);
      app.board.paintNovel();
      app.left.paintSteps();
    }
  }

  skipped(key) { return !!this.doc.novel.skip?.[key]; }

  firstRun() {
