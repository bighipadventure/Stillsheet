      if (c.voice.mode === "caption" && !str(c.voice.caption) && str(voice)) c.voice.caption = str(voice);
    });
    return added;
  }

  static mergeLocations(doc, list) {
    const str = (v) => (v == null ? "" : String(v)).trim();
    (Array.isArray(list) ? list : []).filter((o) => o && typeof o === "object").forEach((o, k) => {
      const key = str(o.id) || String(k + 1);
      let l = doc.locations.find((x, i) => String(i + 1) === key || x.id === key) || doc.locations.find((x) => x.name && x.name.trim() === str(o.name));
      if (!l) { l = Doc.person({}, "l"); doc.locations.push(l); }
      for (const f of ["name", "note", "prompt"]) if (!str(l[f]) && str(o[f])) l[f] = str(o[f]);
    });
  }

  static fromManuscript(doc) {
    const text = (doc.manuscript || "").trim();
    if (!text.includes("{")) return null;
    const obj = this.scenarioIn(text);
    if (!obj) return null;
    this.mergeCast(doc, obj.cast || obj.characters);
    this.mergeLocations(doc, obj.locations);
    try { return this.acceptPlan(doc, obj); } catch { return null; }
  }

  static requestText(doc) {
    const n = doc.novel;
    const aspect = NV.imageAspects.find(([k]) => k === n.aspect) || NV.imageAspects[0];
    const person = (c, i) => `- ${letter(i)}: ${c.name || "(名前なし)"}${c.note ? ` ／ ${c.note}` : ""}${c.voice?.caption?.trim() ? ` ／ 声: ${c.voice.caption.trim()}` : ""}${[c.ident, c.body, c.outfit].some((x) => x?.trim()) ? ` ／ 見た目: ${[c.ident, c.body, c.outfit].filter((x) => x?.trim()).join(", ")}` : ""}`;
    const cast = doc.cast.map((c, i) => [c, i]);
    return fmt(NV.requestTemplate, {
      title: doc.title || NL.requestNone,
      brief: [doc.brief.trim(), doc.manuscript.trim()].filter(Boolean).join("\n\n") || NL.requestNone,
      count: n.imageCount, min: n.linesMin, max: Math.max(n.linesMin, n.linesMax), aspect: aspect[1], maxEmo: NV.maxEmo,
      cast: cast.map(([c, i]) => person(c, i)).join("\n") || NL.requestNone,
      locations: doc.locations.map((l, i) => `- ${i + 1}: ${l.name || "(名前なし)"}${l.note ? ` ／ ${l.note}` : ""}${l.prompt ? ` ／ ${l.prompt}` : ""}`).join("\n") || NL.requestNone,
      style: NV.requestStyle[doc.common.style] || NV.requestStyle.tags,
      emojis: NV.emojis.map(([e, a, b]) => `- ${e} ${a}（${b}）`).join("\n"),
    });
  }

  static plan(llm, doc, signal) {
    return llm.askJson(NV.planPrompt, this.planText(doc), [], signal, (obj) => this.acceptPlan(doc, obj), NM.planBad);
  }

  static speakerOf(doc, v) {
    const s = String(v ?? "").trim();
    if (!s || /^(narrator|narration|地の文|ナレーション|ナレーター)$/i.test(s)) return NV.narrator;
    const byId = doc.cast.find((c) => c.id === s);
    if (byId) return byId.id;
    const i = doc.cast.findIndex((c, k) => (c.name && c.name.trim() === s) || letter(k) === s.toUpperCase());
    return i >= 0 ? doc.cast[i].id : NV.narrator;
  }

  static nameOf(doc, who) {
    if (who === NV.narrator) return NL.narratorName;
    const i = doc.cast.findIndex((c) => c.id === who);
    return i < 0 ? NL.narratorName : doc.cast[i].name || `${letter(i)}`;
  }

  static scriptText(doc, groups, gi, prevLines) {
    const g = groups[gi];
    const outline = groups.map((x, i) => `${i === gi ? ">> " : "   "}Scene ${i + 1}${x.head.sceneTitle ? ` (${x.head.sceneTitle})` : ""}: ${x.scenes.map((s) => s.title || s.text).filter(Boolean).join(" / ")}`).join("\n");
    const castName = (s) => s.cast.map((id) => this.nameOf(doc, id)).join(", ") || "-";
    return [
      `Game title: ${doc.title || "-"}\nSynopsis: ${doc.synopsis || "-"}`,
      this.manuscript(doc),
      `Cast:\n${this.castLines(doc)}`,
      `Delivery emoji list (for "emo"):\n${this.emojiList()}`,
      `Outline (the current scene is marked with >>):\n${outline}`,
      prevLines.length ? `Lines of the previous scene:\n${prevLines.map((l) => `${this.nameOf(doc, l.who)}: ${l.text}`).join("\n")}` : "",
      `Pictures of this scene (attached in this order):\n${g.scenes.map((s, k) => `Picture ${k + 1}: ${s.title || "-"} / what happens: ${s.text || "-"} / characters: ${castName(s)} / image prompt: ${s.prompt || "-"}`).join("\n")}`,
      `Lines per picture: ${doc.novel.linesMin} to ${doc.novel.linesMax}. Return exactly ${g.scenes.length} entries in "images".`,
    ].filter(Boolean).join("\n\n");
  }

  static acceptScript(doc, obj, n) {
    const list = Array.isArray(obj.images) ? obj.images : Array.isArray(obj) ? obj : null;
    if (!list || list.length < n) throw new Error("count");
    const out = list.slice(0, n).map((im) => this.lines(doc, Array.isArray(im?.lines) ? im.lines : Array.isArray(im) ? im : []));
    if (!out.some((lines) => lines.length)) throw new Error("no lines");
    return out;
  }

  static async script(llm, doc, groups, gi, prevLines, images, signal) {
    const system = fmt(NV.scriptPrompt, { min: doc.novel.linesMin, max: Math.max(doc.novel.linesMin, doc.novel.linesMax), maxEmo: NV.maxEmo });
    const text = this.scriptText(doc, groups, gi, prevLines);
    const accept = (obj) => this.acceptScript(doc, obj, groups[gi].scenes.length);
    try {
      return await llm.askJson(system, text, images, signal, accept, NM.scriptBad);
    } catch (err) {
      if (!images.length || err?.name === "AbortError" || !/image|vision|multimodal|image_url|mmproj/i.test(String(err?.message || ""))) throw err;
      return llm.askJson(system, text, [], signal, accept, NM.scriptBad);
    }
  }

  static async videoPrompt(llm, doc, scene, blob, signal) {
    const loc = doc.locations.find((l) => l.id === scene.location);
    const text = [
      `Picture title: ${scene.title || "-"}`,
      `What happens: ${scene.text || "-"}`,
      `Characters: ${PromptBuilder.castOf(doc, scene).map((c) => `${c.name || "(unnamed)"} (${lookOf(c, scene)})`).join("; ") || "(none)"}`,
      `Location: ${loc ? `${loc.name} / ${loc.prompt}` : "-"}`,
      `Image prompt: ${scene.prompt || "-"}`,
      scene.motion?.trim() ? `Motion hint from the user (follow it): ${scene.motion.trim()}` : "",
    ].filter(Boolean).join("\n");
    const url = await ImageChecker.imageUrl(blob);
    const reply = await llm.chat(fmt(NV.videoPrompt, { seconds: doc.novel.video.seconds }), text, [url], signal);
    const out = String(reply.text || "").replace(/<think>[\s\S]*?<\/think>/g, "").replace(/^```[a-z]*\s*|```\s*$/gi, "").trim();
    if (!out) throw new UserError(M.llmEmptyReply);
    return out;
  }
}

// ===== NOVEL RUNNER (PLAN -> IMAGES -> SCRIPT -> VOICE -> LOOP VIDEO) =====
class NovelRunner {
  constructor(app) {
    this.app = app;
    this.ctl = null;
    this.stage = null;
    this.audio = new Audio();
  }

  destroy() {
    this.stop();
    this.audio.pause();
  }

  get busy() { return !!this.ctl; }
  get order() { return NV.stages.map(([k]) => k); }
  get doc() { return this.app.doc; }

  stop() {
    if (!this.ctl) return;
    this.ctl.abort();
    this.app.runner.stop();
    this.app.videoClient().interrupt();
  }

  play(url) {
    this.audio.pause();
    if (!url) return;
    this.audio.src = url;
    this.audio.play().catch(() => {});
  }

  // STATE OF EACH STEP
  voiced(line) {
    if (!line.text.trim()) return false;
    return line.who !== NV.narrator || this.doc.novel.narrate;
  }

  autoVoiced(line) {
    if (!this.voiced(line)) return false;
    return line.who === NV.narrator || NovelWriter.speaks(this.doc.cast.find((c) => c.id === line.who));
  }

  voiceOf(who) {
    if (who === NV.narrator) return this.doc.novel.narrator;
    return this.doc.cast.find((c) => c.id === who)?.voice || Doc.voiceOf(null);
  }

  voiceSig(line) {
    const v = this.voiceOf(line.who);
    const cfg = this.app.store.data.voice;
    return JSON.stringify([line.who, line.text.trim(), line.emo || "", v.mode, v.caption, v.seed, cfg.checkpoint, cfg.numSteps, cfg.durationScale]);
  }

  take(line) {
    const e = this.app.voices.get(line.id);
    return e?.takes?.find((t) => t.id === e.pick) || null;
  }

  voiceState(line) {
    const e = this.app.voices.get(line.id);
    const t = this.take(line);
    if (!this.voiced(line)) return { state: "skip", e, t };
    if (e?.state === "run") return { state: "run", e, t };
    if (t && t.sig === this.voiceSig(line)) return { state: "done", e, t };
    if (e?.state === "error") return { state: "error", e, t };
    return { state: "stale", e, t };
  }

  pickTake(lineId, takeId) {
    const e = this.app.voices.get(lineId);
    if (!e?.takes?.some((t) => t.id === takeId)) return;
    e.pick = takeId;
    this.app.board.updateVoice(lineId);
    this.app.left.paintSteps();
  }

  dropTake(lineId, takeId) {
    const e = this.app.voices.get(lineId);
    const t = e?.takes?.find((x) => x.id === takeId);
    if (!t) return;
    URL.revokeObjectURL(t.url);
    e.takes = e.takes.filter((x) => x !== t);
    if (e.pick === takeId) e.pick = e.takes[e.takes.length - 1]?.id || null;
    this.app.board.updateVoice(lineId);
    this.app.left.paintSteps();
  }

  videoSig(scene) {
    const v = this.doc.novel.video;
    return JSON.stringify([this.app.pickOf(scene.id)?.id || "", scene.videoPrompt, scene.motion, v.seconds, v.megapixels, v.turbo]);
  }

  videoState(scene) {
    const e = this.app.videos.get(scene.id);
    if (!scene.loop) return { state: "skip", e };
    if (e?.state === "run") return { state: "run", e };
    if (e?.blob && e.sig === this.videoSig(scene)) return { state: "done", e };
    if (e?.state === "error") return { state: "error", e };
    return { state: "stale", e };
  }

  allLines() {
    return this.doc.scenes.flatMap((s) => s.lines);
  }

  stat(key) {
    const doc = this.doc;
    const S = NL.stageStat;
    const n = doc.scenes.length;
    if (!n) return S.empty;
    if (key === "plan") return fmt(S.plan, { n, g: Doc.groups(doc).length });
    if (key === "images") return fmt(S.images, { n, done: doc.scenes.filter((s) => this.app.pickOf(s.id)).length });
    if (key === "script") return fmt(S.script, { n, done: doc.scenes.filter((s) => s.lines.some((l) => l.text.trim())).length, lines: this.allLines().filter((l) => l.text.trim()).length });
    if (key === "voice") {
      const lines = this.allLines().filter((l) => this.autoVoiced(l) || this.voiceState(l).state === "done");
      return lines.length ? fmt(S.voice, { n: lines.length, done: lines.filter((l) => this.voiceState(l).state === "done").length }) : S.empty;
    }
    const loops = doc.scenes.filter((s) => s.loop);
    return loops.length ? fmt(S.video, { n: loops.length, done: loops.filter((s) => this.videoState(s).state === "done").length }) : S.empty;
  }

  pending(key) {
    const doc = this.doc;
    if (key === "plan") return !doc.scenes.length;
    if (key === "images") return doc.scenes.some((s) => !this.app.pickOf(s.id));
    if (key === "script") return doc.scenes.some((s) => !s.lines.some((l) => l.text.trim()));
    if (key === "voice") return this.allLines().some((l) => this.autoVoiced(l) && ["stale", "error"].includes(this.voiceState(l).state));
    return doc.scenes.some((s) => s.loop && ["stale", "error"].includes(this.videoState(s).state));
  }

  firstOpen() {
    return this.order.find((k) => this.pending(k)) || null;
  }

  // RUN
  async task(fn) {
    const app = this.app;
    if (this.busy || app.runner.busy || app.storyCtl) { app.notice(M.runBusy, "warn"); return false; }
    this.ctl = new AbortController();
    app.runStateChanged(true);
    try {
      const ok = await fn(this.ctl.signal);
      if (ok !== false) { app.phase("done", ""); app.progress(1); }
      return ok;
    } catch (err) {
      if (!err?.shown) {
        const why = Guide.explain(err, err?.who || "llm");
        app.phase(why.aborted ? "stop" : "error", "");
        app.notice(why.aborted ? NM.stageStopped : why.text, why.aborted ? "" : "err", why.action);
      }
      return false;
    } finally {
      this.ctl = null;
      this.stage = null;
      app.updateEta(null);
      app.runStateChanged(false);
      app.board.paintNovel();
      app.left.paintSteps();
    }
  }

  start(fromKey, { explicit = false } = {}) {
    const order = this.order;
    const from = fromKey ? order.indexOf(fromKey) : order.indexOf(this.firstOpen());
    if (from < 0) { this.app.notice(fmt(NM.allDone, { until: NV.stages[order.indexOf(this.doc.novel.autoUntil)][2] }), "ok"); return Promise.resolve(true); }
    const last = Math.max(from, order.indexOf(this.doc.novel.autoUntil));
    return this.task(async (signal) => {
      for (let i = from; i <= last; i++) {
        this.stage = order[i];
        this.app.left.paintSteps();
        const ok = await this[order[i]](signal, { force: explicit && i === from });
        if (ok === false) return false;
        if (signal.aborted) throw new DOMException("aborted", "AbortError");
      }
      this.app.phase("done", "");
      this.app.progress(1);
      this.app.notice(fmt(NM.allDone, { until: NV.stages[last][2] }), "ok");
      return true;
    });
  }

  // ① PLAN
  async plan(signal) {
    const app = this.app;
    const doc = this.doc;
    if (!doc.brief.trim() && !doc.manuscript.trim()) { app.left.focus("story", "#brief"); throw Guide.fail(NM.needBrief, "story"); }
    const count = doc.scenes.reduce((n, s) => n + app.images.list(s.id).length, 0);
    if (doc.scenes.length && !confirm(fmt(NM.planReplace, { n: doc.scenes.length, count }))) return false;
    const fromText = NovelWriter.fromManuscript(doc);
    if (!fromText) { app.phase("llm", NM.planRunning); app.status(NM.planRunning); }
    const out = fromText || await NovelWriter.plan(app.llm(), doc, signal);
    if (out.title) doc.title = out.title;
    if (out.synopsis) doc.synopsis = out.synopsis;
    doc.scenes = out.scenes;
    doc.novel.imageCount = clamp(out.scenes.length, NV.limits.imageCount);
    app.clearNovelMedia();
    app.docChanged(true);
    app.left.render();
    const lines = out.scenes.reduce((n, s) => n + s.lines.length, 0);
    app.notice(fromText ? fmt(NM.manuscriptJson, { n: out.scenes.length, g: Doc.groups(doc).length, lines }) : fmt(NM.planDone, { n: out.scenes.length, g: Doc.groups(doc).length }), "ok");
    return true;
  }

  // ② IMAGES
  async images(signal, { force } = {}) {
    const app = this.app;
    const ids = this.doc.scenes.filter((s) => !app.pickOf(s.id)).map((s) => s.id);
    if (!ids.length) { if (force) app.notice(NM.imagesNothing, "ok"); return true; }
    app.snapAspect();
    await app.runner.run(ids);
    if (signal.aborted) throw new DOMException("aborted", "AbortError");
    return !this.doc.scenes.some((s) => !app.pickOf(s.id));
  }

  // ③ SCRIPT
  async script(signal, { force } = {}) {
    const app = this.app;
    const doc = this.doc;
    const missing = doc.scenes.filter((s) => !app.pickOf(s.id));
    if (missing.length) { app.notice(fmt(NM.scriptNeedPicks, { list: missing.map((s) => `#${doc.scenes.indexOf(s) + 1}`).join("・") }), "warn", `scene:${missing[0].id}`); return false; }
    const groups = Doc.groups(doc);
    let todo = groups.map((g, gi) => gi).filter((gi) => groups[gi].scenes.some((s) => !s.lines.some((l) => l.text.trim())));
    if (!todo.length) {
      if (!force || !confirm(NM.scriptRedo)) return true;
      todo = groups.map((g, gi) => gi);
    }
    const llm = app.llm();
    await app.runner.freeImageVram();
    let total = 0;
    for (let t = 0; t < todo.length; t++) {
      const gi = todo[t];
      const text = fmt(NM.scriptRunning, { i: t + 1, n: todo.length });
      app.phase("llm", text);
      app.status(text);
      app.progress(t / todo.length);
      const images = [];
      for (const s of groups[gi].scenes) images.push(await ImageChecker.imageUrl(app.pickOf(s.id).blob));
      const prev = gi > 0 ? groups[gi - 1].scenes.flatMap((s) => s.lines).filter((l) => l.text.trim()) : [];
      const out = await NovelWriter.script(llm, doc, groups, gi, prev, images, signal);
      groups[gi].scenes.forEach((s, k) => {
        s.lines = out[k];
        total += out[k].length;
        app.board.updateLines(s.id);
      });
      app.docChanged(false);
      app.left.paintSteps();
    }
    app.progress(1);
    app.board.render();
    app.notice(fmt(NM.scriptDone, { lines: total }), "ok");
    return true;
  }

  // ④ VOICE
  async voice(signal, { force, lines, count = 1 } = {}) {
    const app = this.app;
    let todo = lines ? lines.filter((l) => this.voiced(l)).flatMap((l) => Array(count).fill(l)) : this.allLines().filter((l) => this.autoVoiced(l) && ["stale", "error"].includes(this.voiceState(l).state));
    if (!todo.length) {
      const all = this.allLines().filter((l) => this.autoVoiced(l));
      if (!force || !all.length || !confirm(NM.voiceRedo)) { if (force) app.notice(NM.voiceNothing, "ok"); return true; }
      todo = all;
    }
    const client = app.voiceClient();
    const ready = await client.check();
    if (ready.state !== "ok") throw Guide.fail(ready.text, "settingsVoice");
    await app.runner.freeImageVram();
    let made = 0;
    for (let i = 0; i < todo.length; i++) {
      const line = todo[i];
      app.phase("voice", fmt(NM.voiceRunning, { i: i + 1, n: todo.length, state: "" }));
      app.progress(i / todo.length);
      const sig = this.voiceSig(line);
      const e = app.voices.get(line.id) || { takes: [], pick: null };
      const body = await this.voiceBody(line, e.takes.filter((t) => t.sig === sig).length);
      app.voices.set(line.id, { ...e, state: "run", error: "" });
      app.board.updateVoice(line.id);
      try {
        const out = await client.speak(body, signal, (st) => app.status(fmt(NM.voiceRunning, { i: i + 1, n: todo.length, state: st.state === "queued" ? fmt(NM.voiceQueued, { n: st.queue_position || 1 }) : `${st.note || ""} ${Math.round(st.elapsed || 0)}s` })));
        const take = { id: "t" + uid(), blob: out.blob, url: URL.createObjectURL(out.blob), duration: out.duration, sig, at: Date.now() };
        app.voices.set(line.id, { takes: [...e.takes, take], pick: take.id, state: "", error: "" });
        made++;
      } catch (err) {
        app.voices.set(line.id, { ...e, state: err?.name === "AbortError" ? "" : "error", error: Guide.text(err, "voice") });
        app.board.updateVoice(line.id);
        throw err;
      }
      app.board.updateVoice(line.id);
      app.left.paintSteps();
    }
    app.progress(1);
    app.notice(fmt(NM.voiceDone, { n: made }), "ok");
    return true;
  }

  seedOf(who, v, take = 0) {
    const n = Number(String(v.seed ?? "").trim());
    if (String(v.seed ?? "").trim() !== "" && Number.isFinite(n)) return Math.round(n) + take;
    let h = 0;
    for (const ch of String(who)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
    return NV.voice.seedBase + ((h + take) % NV.voice.seedSpan);
  }

  async voiceBody(line, take = 0) {
    const v = this.voiceOf(line.who);
    const cfg = this.app.store.data.voice;
    const who = NovelWriter.nameOf(this.doc, line.who);
    const text = `${Doc.emo(line.emo)}${line.text.trim()}`;
    if (text.length > NV.voice.maxTextChars) throw new UserError(fmt(NM.voiceTooLong, { n: NV.voice.maxTextChars }));
    const files = this.app.voiceFiles.get(line.who) || {};
    const voice = { mode: v.mode };
    if (v.mode === "cassette") {
      if (!files.cassette) throw Guide.fail(fmt(NM.voiceNeedCassette, { who }), "cast");
      voice.cassette_upload_base64 = await IrodoriClient.fileToDataUrl(files.cassette);
      voice.cassette_name = files.cassette.name;
    } else if (v.mode === "reference") {
      if (!files.refs?.length) throw Guide.fail(fmt(NM.voiceNeedRefs, { who }), "cast");
      voice.reference_audio_base64 = await Promise.all(files.refs.map(async (f) => ({ name: f.name, data: await IrodoriClient.fileToDataUrl(f) })));
    }
    const steps = String(cfg.numSteps ?? "").trim();
    return {
      text, caption: v.caption.trim() || null, checkpoint: cfg.checkpoint, voice,
      seed: this.seedOf(line.who, v, take), num_steps: steps === "" ? null : Number(steps), duration_scale: Number(cfg.durationScale) || 1, length_check: false,
    };
  }

  makeVoices(lines, count = 1) {
    return this.task((signal) => this.voice(signal, { lines, count }));
  }

  testVoice(who, msgEl) {
    return this.task(async (signal) => {
      setMsg(msgEl, NL.voiceRun);
      const out = await this.app.voiceClient().speak(await this.voiceBody(Doc.newLine({ who, text: NL.voiceTestText })), signal);
      const url = URL.createObjectURL(out.blob);
      this.play(url);
      setTimeout(() => URL.revokeObjectURL(url), Math.max(10, out.duration + 5) * 1000);
      setMsg(msgEl, fmt(NL.voiceDone, { sec: out.duration.toFixed(1) }), "ok");
      return true;
    }).then((ok) => { if (!ok) setMsg(msgEl, $("run-status").textContent, "err"); return ok; });
  }

  // ⑤ LOOP VIDEO
  async video(signal, { force, ids } = {}) {
    const app = this.app;
    const doc = this.doc;
    let todo = ids ? ids.map((id) => doc.scenes.find((s) => s.id === id)).filter(Boolean) : doc.scenes.filter((s) => s.loop && ["stale", "error"].includes(this.videoState(s).state));
    if (!todo.length) {
      const all = doc.scenes.filter((s) => s.loop);
      if (!force || !all.length || !confirm(NM.videoRedo)) { if (force) app.notice(NM.videoNothing, "ok"); return true; }
      todo = all;
    }
    const noPick = todo.find((s) => !app.pickOf(s.id));
    if (noPick) { app.notice(fmt(NM.scriptNeedPicks, { list: `#${doc.scenes.indexOf(noPick) + 1}` }), "warn", `scene:${noPick.id}`); return false; }
    const client = app.videoClient();
    const state = await Net.probe(client.probeUrl);
    if (state !== "ok") throw Guide.fail(state === "cors" ? NM.videoCors : fmt(NM.videoDown, { url: client.base }), "settingsVideo");
    const needPrompt = todo.filter((s) => !s.videoPrompt.trim());
    if (needPrompt.length) {
      await app.runner.freeImageVram();
      const llm = app.llm();
      for (let i = 0; i < needPrompt.length; i++) {
        const s = needPrompt[i];
        app.phase("llm", fmt(NM.videoPrompting, { i: i + 1, n: needPrompt.length }));
        app.status(fmt(NM.videoPrompting, { i: i + 1, n: needPrompt.length }));
        s.videoPrompt = await NovelWriter.videoPrompt(llm, doc, s, app.pickOf(s.id).blob, signal);
        app.docChanged(false);
        app.board.paintVideo(s.id);
      }
    }
    if (app.store.data.voice.unloadBeforeVideo) await app.voiceClient().unload().catch(() => null);
    await app.backend().freeVram();
    app.runner.vramFreed = true;
    const v = doc.novel.video;
    for (let i = 0; i < todo.length; i++) {
      const s = todo[i];
      const pick = app.pickOf(s.id);
      const sig = this.videoSig(s);
      const old = app.videos.get(s.id);
      const label = (p) => fmt(NM.videoRunning, { i: i + 1, n: todo.length, pct: p == null ? "" : `${Math.round(p * 100)}%` });
      app.phase("video", label());
      app.status(label());
      app.progress(i / todo.length);
      app.videos.set(s.id, { ...(old || {}), state: "run" });
      app.board.paintVideo(s.id);
      try {
        const out = await client.make({
          blob: pick.blob, prompt: s.videoPrompt, seconds: v.seconds, megapixels: v.megapixels, turbo: v.turbo,
          seed: Math.floor(Math.random() * USER_SETTINGS.seedMax), width: pick.width, height: pick.height,
        }, { signal, onProgress: (p) => { app.status(label(p)); app.progress((i + clamp(Number(p) || 0, [0, 0.99])) / todo.length); } });
        if (old?.url) URL.revokeObjectURL(old.url);
        app.videos.set(s.id, { state: "done", blob: out.blob, url: URL.createObjectURL(out.blob), sig, name: out.name });
      } catch (err) {
        app.videos.set(s.id, old?.blob ? { ...old, state: "done" } : { state: "error", error: Guide.text(err, "video") });
        app.board.paintVideo(s.id);
        throw err;
      }
      app.board.paintVideo(s.id);
      app.left.paintSteps();
    }
    app.progress(1);
    app.notice(fmt(NM.videoDone, { n: todo.length }), "ok");
    return true;
  }

  makeVideos(ids) {
    return this.task((signal) => this.video(signal, { ids }));
  }
}

// ===== NUMBER CONTROL (SLIDER + STEPPER + CLICK TO TYPE) =====
class NumberControl {
  static watch(root) {
    root.querySelectorAll('input[type="number"]').forEach((el) => this.enhance(el));
    const obs = new MutationObserver((list) => {
      for (const rec of list) for (const node of rec.addedNodes) {
        if (node.nodeType !== 1) continue;
        if (node.matches?.('input[type="number"]')) this.enhance(node);
        node.querySelectorAll?.('input[type="number"]').forEach((el) => this.enhance(el));
      }
    });
    obs.observe(root, { childList: true, subtree: true });
    return obs;
  }

  static num(v) {
    const n = Number(v);
    return v === "" || v === null || v === undefined || !Number.isFinite(n) ? null : n;
  }

  static decimals(step) {
    const t = String(step || 1);
    return t.includes(".") ? t.split(".")[1].length : 0;
  }

  static enhance(src) {
    if (src.dataset.numctl || src.closest(".numctl")) return;
    src.dataset.numctl = "1";
    const cfg = USER_SETTINGS.numberControl;
    const box = h("div", { class: "numctl" });
    src.replaceWith(box);
    src.classList.add("numctl-src");
    const minus = h("button", { type: "button", class: "numctl-step dec", text: "−", "aria-label": "減らす" });
    const plus = h("button", { type: "button", class: "numctl-step inc", text: "+", "aria-label": "増やす" });
    const range = h("input", { type: "range", class: "numctl-range", tabindex: "-1" });
    const val = h("button", { type: "button", class: "numctl-val", title: "クリックして数値を入力" });
    box.append(src, minus, range, plus, val);
    const proto = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, "value");
    const read = () => proto.get.call(src);
    const bounds = () => ({
      min: this.num(src.getAttribute("min")), max: this.num(src.getAttribute("max")),
      smin: this.num(src.dataset.sliderMin), smax: this.num(src.dataset.sliderMax),
      step: this.num(src.getAttribute("step")) || 1,
    });
    const sync = () => {
      const b = bounds();
      const v = this.num(read());
      const slider = b.smin !== null && b.smax !== null;
      box.classList.toggle("no-slider", !slider);
      range.hidden = !slider;
      if (slider) { Object.assign(range, { min: b.smin, max: b.smax, step: b.step }); range.value = v ?? b.smin; }
      val.textContent = v === null ? (src.placeholder || "—") : v.toFixed(Math.min(this.decimals(b.step), 4)).replace(/(\.\d*?)0+$/, "$1").replace(/\.$/, "");
      val.classList.toggle("empty", v === null);
      box.classList.toggle("disabled", src.disabled);
      [minus, plus, range, val].forEach((el) => { el.disabled = src.disabled; });
    };
    const commit = (v) => {
      const b = bounds();
      let out = "";
      if (v !== null) {
        let n = v;
        if (b.min !== null) n = Math.max(b.min, n);
        if (b.max !== null) n = Math.min(b.max, n);
        out = String(Number(n.toFixed(Math.min(this.decimals(b.step) + 2, 6))));
      }
      if (out === read()) { sync(); return; }
      proto.set.call(src, out);
      sync();
      src.dispatchEvent(new Event("input", { bubbles: true }));
      src.dispatchEvent(new Event("change", { bubbles: true }));
    };
    Object.defineProperty(src, "value", { configurable: true, get: read, set: (v) => { proto.set.call(src, v); sync(); } });
    new MutationObserver(sync).observe(src, { attributes: true, attributeFilter: ["min", "max", "step", "disabled", "placeholder"] });
    const bump = (dir) => {
      const b = bounds();
      const cur = this.num(read()) ?? this.num(String(src.placeholder || "").match(/-?\d+(\.\d+)?/)?.[0]) ?? b.smin ?? b.min ?? 0;
      commit(Math.round((cur + dir * b.step) / b.step) * b.step);
    };
    for (const [btn, dir] of [[minus, -1], [plus, 1]]) {
      let timer = null;
      const stop = () => { clearTimeout(timer); clearInterval(timer); timer = null; };
      btn.addEventListener("pointerdown", (e) => {
        if (e.button !== 0) return;
        e.preventDefault();
        bump(dir);
        timer = setTimeout(() => { timer = setInterval(() => bump(dir), cfg.repeatMs); }, cfg.repeatDelayMs);
      });
      ["pointerup", "pointerleave", "pointercancel"].forEach((ev) => btn.addEventListener(ev, stop));
      btn.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); bump(dir); } });
    }
    range.addEventListener("input", () => commit(Number(range.value)));
    val.addEventListener("click", () => {
      const edit = h("input", { type: "text", class: "numctl-edit", inputmode: "decimal", value: read(), "aria-label": "数値を入力" });
      let done = false;
      const finish = (ok) => {
        if (done) return;
        done = true;
        edit.replaceWith(val);
        if (ok) {
          const t = edit.value.trim().replace(/[０-９．－]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xfee0)).replace("ー", "-");
          if (t === "") commit(null);
          else if (Number.isFinite(Number(t))) commit(Number(t));
        }
        sync();
      };
      edit.addEventListener("keydown", (e) => {
        if (e.key === "Enter") { e.preventDefault(); finish(true); }
        else if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); finish(false); }
      });
      edit.addEventListener("blur", () => finish(true));
      val.replaceWith(edit);
      edit.focus();
      edit.select();
    });
    sync();
  }
}

// ===== CLIPPED TEXT (HOVER SHOWS THE WHOLE TEXT) =====
class ClipTitle {
  static selector = ".clip, .clip-lines, .prop-label, .pill-app, .set-item .cap, .scene-stat";

  static attach(root, bag) {
    bag.on(root, "mouseover", (e) => {
      const el = e.target.closest?.(this.selector);
      if (!el) return;
      if (el.dataset.full) { el.title = el.dataset.full; return; }
      if (el.title && !el.dataset.autoTitle) return;
      const cut = el.scrollWidth > el.clientWidth + 1 || el.scrollHeight > el.clientHeight + 1;
      if (cut) { el.title = el.innerText.trim(); el.dataset.autoTitle = "1"; }
      else if (el.dataset.autoTitle) { el.removeAttribute("title"); delete el.dataset.autoTitle; }
    });
  }
}

// ===== AUTO-GROWING TEXT AREAS (THE WHOLE TEXT IS ALWAYS VISIBLE) =====
class AutoGrow {
  static fit(el) {
    if (!el.isConnected || !el.offsetParent) return;
    el.style.height = "0px";
    el.style.height = `${el.scrollHeight + el.offsetHeight - el.clientHeight}px`;
  }

  static fitAll(root) {
    root.querySelectorAll?.("textarea.autogrow").forEach((el) => this.fit(el));
  }

  static watch(root, columns, bag) {
    const mark = (el) => { el.classList.add("autogrow"); requestAnimationFrame(() => this.fit(el)); };
    root.querySelectorAll("textarea").forEach(mark);
    const obs = new MutationObserver((list) => {
      for (const rec of list) for (const node of rec.addedNodes) {
        if (node.nodeType !== 1) continue;
        if (node.matches("textarea")) mark(node);
        node.querySelectorAll("textarea").forEach(mark);
      }
    });
    obs.observe(root, { childList: true, subtree: true });
    bag.on(root, "input", (e) => { if (e.target.matches?.("textarea.autogrow")) this.fit(e.target); });
    bag.on(root, "toggle", (e) => this.fitAll(e.target), true);
    const widths = new Map();
    const ro = new ResizeObserver((entries) => {
      for (const en of entries) {
        const w = Math.round(en.contentRect.width);
        if (widths.get(en.target) === w) continue;
        widths.set(en.target, w);
        this.fitAll(en.target);
      }
    });
    columns.forEach((el) => ro.observe(el));
    return { disconnect() { obs.disconnect(); ro.disconnect(); } };
  }
}

// ===== CORS EXTENSIONS FOR FORGE / COMFYUI (DOWNLOAD) =====
class CorsExtension {
  static origins(backend) {
    const cfg = USER_SETTINGS.corsExtensions[backend];
    const page = location.protocol.startsWith("http") ? location.origin : null;
    return [...new Set([...(page ? [page] : []), ...cfg.defaultOrigins])];
  }

  static pingUrl(backend, baseUrl) {
    return `${String(baseUrl || USER_SETTINGS.backends[backend].url).replace(/\/+$/, "")}${USER_SETTINGS.corsExtensions[backend].pingPath}`;
  }

  static zip(backend) {
    const cfg = USER_SETTINGS.corsExtensions[backend];
    const origins = this.origins(backend);
    const source = cfg.source.replace("__ORIGINS__", origins.map((o) => `    ${JSON.stringify(o)},`).join("\n"));
    const readme = cfg.readme.replace("__ORIGINS_TEXT__", origins.join(" / ")).replace(/\n/g, "\r\n");
    return ZipWriter.build([
      { path: `${cfg.folder}/${cfg.file}`, data: source },
      { path: `${cfg.folder}/README.txt`, data: readme },
    ]);
  }

  static download(backend) {
    downloadBlob(this.zip(backend), USER_SETTINGS.corsExtensions[backend].zipName);
  }

  static async ping(backend, baseUrl) {
    try {
      const res = await fetch(this.pingUrl(backend, baseUrl), { signal: AbortSignal.timeout(USER_SETTINGS.probeTimeoutMs) });
      return res.ok ? await res.json() : null;
    } catch {
      return null;
    }
  }
}

// ===== FORM HELPERS (CONTROLS BOUND TO AN OBJECT KEY) =====
class Form {
  static field(label, control, extra) {
    return h("label", { class: "field" }, label, control, extra);
  }

  static prop(label, control, { note, title, top } = {}) {
    return [
      h("div", { class: `prop${top ? " top" : ""}`, title }, h("span", { class: "prop-label", text: label }), control),
      note ? h("p", { class: "note", text: note }) : null,
    ];
  }

  static text(obj, key, onChange, props = {}) {
    const el = h(props.rows ? "textarea" : "input", { ...props, value: obj[key] ?? "" });
    el.addEventListener("input", () => { obj[key] = el.value; onChange?.(key, el.value); });
    return el;
  }

  static number(obj, key, onChange, range, props = {}) {
    const { slider, allowEmpty, ...rest } = props;
    const attrs = { type: "number", min: range?.[0], ...rest, value: obj[key] ?? "" };
    if (slider) Object.assign(attrs, { max: range?.[1], "data-slider-min": slider[0], "data-slider-max": slider[1] });
    const el = h("input", attrs);
    el.addEventListener("change", () => {
      if (el.value === "" && allowEmpty) { obj[key] = null; onChange?.(key, null); return; }
      let v = Number(el.value);
      if (!Number.isFinite(v) || el.value === "") v = Number(obj[key]) || (range ? range[0] : 0);
      if (range) v = clamp(v, range);
      if (String(v) !== el.value) el.value = v;
      obj[key] = v;
      onChange?.(key, v);
    });
    return el;
  }

  static check(obj, key, label, onChange) {
    const el = h("input", { type: "checkbox", checked: !!obj[key] });
    el.addEventListener("change", () => { obj[key] = el.checked; onChange?.(key, el.checked); });
    return h("label", { class: "check" }, el, label);
  }

  static select(obj, key, entries, onChange, props = {}) {
    const { listed, ...attrs } = props;
    const el = h("select", attrs);
    const value = obj[key] ?? "";
    const list = entries.some(([v]) => String(v) === String(value)) ? entries : [...entries, [value, entries.length && listed !== false ? `${value} ${L.notInList}` : String(value)]];
    fillSelect(el, list, value);
    el.addEventListener("change", () => { obj[key] = el.value; onChange?.(key, el.value); });
    return el;
  }

  static seg(entries, value, onPick) {
    const box = h("div", { class: "seg", role: "group" });
    const paint = (v) => box.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.value === String(v))));
    box.append(...entries.map(([v, label]) => h("button", { type: "button", "data-value": v, text: label, onclick: () => { paint(v); onPick(v); } })));
    paint(value);
    return box;
  }

  static section(key, title, body, tools = []) {
    return h("section", { class: "psec", "data-sec": key },
      h("h2", { class: "psec-title" }, h("span", { class: "clip", text: title }), tools.length ? h("span", { class: "tools" }, ...tools) : null),
      h("div", { class: "psec-body" }, ...body.flat().filter(Boolean)));
  }
}
// ===== LEFT PANEL (BASE IMAGE / STORY / CAST / LOCATIONS) =====
class LeftPanel {
  constructor(app) {
    this.app = app;
    this.root = $("left-panel");
  }

  destroy() { this.root.replaceChildren(); }

  changed(structural = false) { this.app.docChanged(structural); }

  render() {
    const top = this.root.scrollTop;
    const novel = this.app.doc.mode === "novel";
    this.stepsEl = null;
    this.root.replaceChildren(...[this.modeSection(), this.baseSection(), novel ? this.novelStorySection() : this.storySection(), this.castSection(), this.locationSection(), novel ? this.stepsSection() : null].filter(Boolean));
    this.root.scrollTop = top;
  }

  modeSection() {
    const app = this.app;
    return Form.section("mode", NL.secMode, [
      Form.seg(NV.modes, app.doc.mode, (v) => app.setMode(v)),
      h("p", { class: "note", text: NV.modeInfo[app.doc.mode] }),
    ]);
  }

  novelStorySection() {
    const app = this.app;
    const doc = app.doc;
    const nv = doc.novel;
    const lim = NV.limits;
    const manuscript = Form.text(doc, "manuscript", () => this.changed(), { rows: 6, placeholder: NL.manuscriptPlaceholder, id: "manuscript" });
    const load = async (file) => {
      if (!file) return;
      const text = await file.text();
      const scenario = NovelWriter.scenarioIn(text);
      if (scenario) { app.importScenario(scenario, file.name); return; }
      manuscript.value = text;
      manuscript.dispatchEvent(new Event("input"));
      AutoGrow.fit(manuscript);
      app.notice(fmt(NM.manuscriptLoaded, { name: file.name }), "ok");
    };
    const fileIn = h("input", { type: "file", accept: ".txt,.md,.json,text/plain,application/json", hidden: true });
    fileIn.addEventListener("change", () => { const f = fileIn.files?.[0]; fileIn.value = ""; load(f); });
    manuscript.addEventListener("dragover", (e) => { e.preventDefault(); e.stopPropagation(); });
    manuscript.addEventListener("drop", (e) => {
      const f = [...(e.dataTransfer?.files || [])][0];
      if (!f) return;
      e.preventDefault();
      e.stopPropagation();
      load(f);
    });
    return Form.section("story", NL.secStory, [
      Form.field(NL.brief, Form.text(doc, "brief", () => this.changed(), { rows: 4, placeholder: NL.briefPlaceholder, id: "brief" })),
      Form.field(NL.manuscript, manuscript),
      h("p", { class: "note", text: NL.manuscriptNote }),
      h("div", { class: "row request-row" },
        h("button", { class: "small", text: NL.manuscriptLoad, onclick: () => fileIn.click() }),
        h("button", { class: "small", text: NL.requestDownload, onclick: () => app.downloadRequest() }),
        h("button", { class: "small", text: NL.requestCopy, onclick: () => app.copyRequest() }),
        fileIn),
      h("p", { class: "note", text: NL.requestNote }),
      Form.prop(NL.imageCount, Form.number(nv, "imageCount", () => this.changed(), lim.imageCount, { slider: NV.sliders.imageCount })),
      Form.prop(NL.linesMin, Form.number(nv, "linesMin", () => this.changed(), lim.lines, { slider: lim.lines })),
      Form.prop(NL.linesMax, Form.number(nv, "linesMax", () => this.changed(), lim.lines, { slider: lim.lines })),
      h("button", { class: "primary", text: NV.stages[0][1], onclick: () => app.novel.start("plan", { explicit: true }) }),
      h("p", { class: "msg", id: "story-msg" }),
      Form.prop(L.title, Form.text(doc, "title", () => app.renderHead())),
      Form.prop(L.synopsis, Form.text(doc, "synopsis", () => app.renderHead(), { rows: 2 }), { top: true }),
    ]);
  }

  stepsSection() {
    const app = this.app;
    const nv = app.doc.novel;
    const rows = NV.stages.map(([k, label]) => h("div", { class: "step-row", "data-stage": k },
      h("span", { class: "step-name", text: label }),
      h("span", { class: "step-stat" }),
      h("button", { class: "mini", text: NL.stageRun, title: NL.stageRunTitle, onclick: () => app.novel.start(k, { explicit: true }) })));
    this.stepsEl = Form.section("steps", NL.secSteps, [
      Form.prop(NL.autoUntil, Form.select(nv, "autoUntil", NV.stages.map(([k, , until]) => [k, until]), () => this.changed(), { listed: false })),
      h("p", { class: "note", text: NL.autoUntilNote }),
      h("div", { class: "step-list" }, ...rows),
    ]);
    this.paintSteps();
    return this.stepsEl;
  }

  paintSteps() {
    for (const el of this.root.querySelectorAll(".cast-tools[data-cast]")) {
      const p = this.app.doc.cast.find((c) => c.id === el.dataset.cast);
      if (p && !el.contains(el.ownerDocument.activeElement)) el.replaceWith(this.castTools(p));
    }
    const sec = this.stepsEl;
    if (!sec) return;
    const nr = this.app.novel;
    const busy = nr.busy || this.app.runner.busy;
    for (const row of sec.querySelectorAll(".step-row")) {
      const k = row.dataset.stage;
      row.querySelector(".step-stat").textContent = nr.stat(k);
      row.classList.toggle("running", nr.stage === k);
      row.classList.toggle("open", !busy && nr.firstOpen() === k);
      row.querySelector("button").disabled = busy;
    }
  }

  voiceBox(voice, key) {
    const app = this.app;
    const box = h("div", { class: "voice-box" });
    const msg = h("p", { class: "msg" });
    const changed = () => { this.changed(); app.board.paintNovel(); app.left.paintSteps(); };
    const files = () => app.voiceFiles.get(key) || {};
    const fileRow = (label, accept, multiple) => {
      const input = h("input", { type: "file", accept, multiple, hidden: true });
      const list = multiple ? files().refs || [] : files().cassette ? [files().cassette] : [];
      const names = h("span", { class: "voice-files clip", text: list.length ? (multiple ? fmt(NL.voiceFileCount, { n: list.length }) + " " : "") + list.map((f) => f.name).join("、") : NL.voiceFileNone });
      input.addEventListener("change", () => {
        const picked = [...(input.files || [])];
        input.value = "";
        if (!picked.length) return;
        app.voiceFiles.set(key, { ...files(), ...(multiple ? { refs: picked } : { cassette: picked[0] }) });
        changed();
        paint();
      });
      return Form.field(label, h("div", { class: "row voice-file" }, h("button", { class: "mini", text: NL.voiceFilePick, onclick: () => input.click() }), names, input));
    };
    const paint = () => box.replaceChildren(...[
      h("div", { class: "voice-head" }, h("span", { class: "voice-title", text: NL.voice }), Form.seg(NV.voiceModes, voice.mode, (v) => { voice.mode = v; changed(); paint(); })),
      Form.field(voice.mode === "caption" ? NL.voiceCaption : NL.voiceCaptionOther, Form.text(voice, "caption", changed, { rows: 2, placeholder: NL.voiceCaptionPlaceholder })),
      voice.mode === "cassette" ? fileRow(NL.voiceCassette, ".safetensors", false) : voice.mode === "reference" ? fileRow(NL.voiceRefs, "audio/*", true) : null,
      h("div", { class: "grid2" },
        Form.field(NL.voiceSeed, Form.text(voice, "seed", changed, { placeholder: NL.voiceSeedPlaceholder, inputmode: "numeric" })),
        h("div", { class: "field voice-test" }, h("button", { class: "mini", text: NL.voiceTest, onclick: () => app.novel.testVoice(key, msg) }))),
      voice.mode === "caption" ? h("p", { class: "note", text: NL.voiceSeedNote }) : null,
      msg].filter(Boolean));
    paint();
    return box;
  }

  focus(sec, selector) {
    const el = this.root.querySelector(`[data-sec="${sec}"]`);
    el?.scrollIntoView({ block: "start", behavior: "smooth" });
    const target = selector ? el?.querySelector(selector) : null;
    target?.focus();
  }

  baseSection() {
    const app = this.app;
    const base = app.doc.base;
    const pick = () => $("file-base").click();
    const drop = h("div", { class: "base-drop", tabindex: 0, role: "button", onclick: pick, onkeydown: (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); } } },
      base?.thumb ? h("img", { src: base.thumb, alt: "" }) : null,
      h("div", { class: "base-text" },
        h("b", { text: base ? fmt(L.baseLoaded, { name: base.name }) : L.baseDrop, title: base?.name }),
        h("span", { text: base ? (L.baseFormat[base.format] || base.format) : L.baseDropNote })));
    drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
    drop.addEventListener("dragleave", () => drop.classList.remove("over"));
    drop.addEventListener("drop", (e) => {
      e.preventDefault();
      e.stopPropagation();
      drop.classList.remove("over");
      const f = [...(e.dataTransfer?.files || [])].find((x) => x.type.startsWith("image/"));
      if (f) app.loadBase(f);
    });
    const body = [drop];
    if (base) {
      body.push(
        Form.field(L.basePrompt, Form.text(base, "prompt", () => this.changed(), { rows: 3 })),
        h("p", { class: "note", text: L.basePromptNote }),
        Form.check(base, "useSeed", L.baseUseSeed, () => this.changed()),
        h("div", { class: "row" },
          h("button", { class: "small primary", text: L.baseAddScene, onclick: () => app.addSceneFromBase() }),
          h("button", { class: "small", text: L.baseToCast, onclick: () => app.baseToCast() }),
          h("button", { class: "small", text: L.baseReapply, onclick: () => app.applyBase() })));
    }
    const tools = base ? [h("button", { class: "mini quiet danger", text: L.baseClear, onclick: () => { app.doc.base = null; this.changed(); this.render(); } })] : [];
    return Form.section("base", L.secBase, body, tools);
  }

  storySection() {
    const app = this.app;
    const doc = app.doc;
    const msg = h("p", { class: "msg", id: "story-msg" });
    return Form.section("story", L.secStory, [
      Form.field(L.brief, Form.text(doc, "brief", () => this.changed(), { rows: 5, placeholder: L.briefPlaceholder, id: "brief" })),
      h("p", { class: "note", text: L.briefNote }),
      Form.prop(L.sceneCount, Form.number(doc, "sceneCount", () => { this.changed(); app.updateRunNote(); }, USER_SETTINGS.limits.sceneCount, { slider: [1, 20] })),
      h("button", { class: "primary", text: L.writeStory, onclick: () => app.writeStory(msg) }),
      msg,
      Form.prop(L.title, Form.text(doc, "title", () => app.renderHead())),
      Form.prop(L.synopsis, Form.text(doc, "synopsis", () => app.renderHead(), { rows: 2 }), { top: true }),
    ]);
  }

  personItem(list, p, i, kind) {
    const isCast = kind === "cast";
    const remove = h("button", {
      class: "mini quiet danger", text: L.remove,
      onclick: () => {
        list.splice(list.indexOf(p), 1);
        for (const s of this.app.doc.scenes) {
          if (isCast) s.cast = s.cast.filter((id) => id !== p.id);
          else if (s.location === p.id) s.location = "";
          if (isCast) for (const l of s.lines) if (l.who === p.id) l.who = NV.narrator;
        }
        this.changed(true);
        this.render();
      },
    });
    return h("div", { class: "item" },
      h("div", { class: "item-head" }, h("span", { class: "tag", text: isCast ? letter(i) : `${i + 1}` }), this.nameInput(p, isCast ? L.castName : L.locationName), remove),
      ...(isCast
        ? USER_SETTINGS.castParts.map((k) => Form.field(L.castPartNames[k], Form.text(p, k, () => this.changed(), { rows: 2, placeholder: L.castPartHints[k], "data-key": k })))
        : [Form.prop(L.locationPrompt, Form.text(p, "prompt", () => this.changed(), { rows: 2 }), { top: true })]),
      Form.prop(L.castNoteField, Form.text(p, "note", () => this.changed(), { placeholder: L.castNotePlaceholder })),
      isCast && this.app.doc.mode === "novel" ? this.voiceBox(p.voice, p.id) : null,
      isCast && this.app.doc.mode === "novel" ? this.castTools(p) : null);
  }

  castTools(p) {
    const app = this.app;
    const doc = app.doc;
    const scenes = doc.scenes.filter((s) => s.cast.includes(p.id));
    const lines = doc.scenes.flatMap((s) => s.lines).filter((l) => l.who === p.id && l.text.trim());
    const move = h("select", { class: "cast-move", title: NL.castMoveLinesTitle, disabled: !lines.length });
    fillSelect(move, [["", NL.castMoveLines], [NV.narrator, NL.narratorName], ...doc.cast.filter((c) => c !== p).map((c) => [c.id, `${letter(doc.cast.indexOf(c))}. ${c.name || L.castUnnamed}`])], "");
    move.addEventListener("change", () => { if (move.value) app.moveLines(p.id, move.value); });
    const busy = app.runner.busy || app.novel.busy;
    return h("div", { class: "cast-tools", "data-cast": p.id },
      h("p", { class: "note keep cast-usage", text: fmt(NL.castUsage, { images: scenes.length, lines: lines.length }) }),
      h("div", { class: "row" },
        h("button", { class: "mini", text: NL.castRegenImages, title: NL.castRegenImagesTitle, disabled: !scenes.length || busy, onclick: () => app.regenCastImages(p) }),
        h("button", { class: "mini", text: NL.castRegenVoices, title: NL.castRegenVoicesTitle, disabled: !lines.length || busy, onclick: () => app.novel.makeVoices(lines) })),
      move);
  }

  // 名前は打つたびにシーンを描き直すと重いので、入力欄から離れたとき（Enter を含む）にシーンへ反映する
  nameInput(p, placeholder) {
    const el = Form.text(p, "name", () => this.changed(false), { placeholder });
    el.addEventListener("change", () => this.changed(true));
    return el;
  }

  castFileRow() {
    const app = this.app;
    const input = h("input", { type: "file", accept: ".json,application/json", hidden: true });
    input.addEventListener("change", async () => {
      const f = input.files?.[0];
      input.value = "";
      if (!f) return;
      try { await app.swapCastFrom(await readJsonFile(f)); } catch { app.notice(M.loadFailed, "err"); }
    });
    return h("div", { class: "row request-row" },
      h("button", { class: "small", text: NL.castLoad, title: NL.castLoadTitle, onclick: () => input.click() }),
      h("button", { class: "small", text: NL.castSave, onclick: () => app.saveCast() }),
      input);
  }

  castSection() {
    const doc = this.app.doc;
    return Form.section("cast", L.secCast, [
      h("p", { class: "note", text: L.castNote }),
      h("p", { class: "note", text: L.castPromptNote }),
      ...doc.cast.map((p, i) => this.personItem(doc.cast, p, i, "cast")),
      h("button", { text: L.addCast, onclick: () => { doc.cast.push(Doc.person({}, "c")); this.changed(true); this.render(); } }),
      doc.mode === "novel" ? this.castFileRow() : null,
      doc.mode === "novel" ? h("p", { class: "note", text: NL.silentNote }) : null,
      doc.mode === "novel" ? h("div", { class: "item narrator-item" },
        h("div", { class: "item-head" }, h("span", { class: "tag", text: "—" }), h("b", { text: NL.narratorVoice })),
        Form.check(doc.novel, "narrate", NL.narrate, () => { this.changed(); this.app.board.paintNovel(); this.paintSteps(); }),
        this.voiceBox(doc.novel.narrator, NV.narrator)) : null,
    ]);
  }

  locationSection() {
    const doc = this.app.doc;
    return Form.section("locations", L.secLocations, [
      h("p", { class: "note", text: L.locationsNote }),
      ...doc.locations.map((p, i) => this.personItem(doc.locations, p, i, "loc")),
      h("button", { text: L.addLocation, onclick: () => { doc.locations.push(Doc.person({}, "l")); this.changed(true); this.render(); } }),
    ]);
  }
}

// ===== RIGHT PANEL (COMMON IMAGE SETTINGS / RUN AND CHECK) =====
class RightPanel {
  constructor(app) {
    this.app = app;
    this.root = $("right-panel");
    this.tabs = $("right-tabs");
    this.bag = new Listeners();
    this.tabs.replaceChildren(...USER_SETTINGS.rightTabs.map(([k, label]) => h("button", { role: "tab", "data-tab": k, text: label })));
    this.bag.on(this.tabs, "click", (e) => {
      const tab = e.target.closest("[data-tab]")?.dataset.tab;
      if (tab) this.show(tab);
    });
  }

  destroy() { this.bag.destroy(); this.root.replaceChildren(); }

  get tab() {
    const t = this.app.store.data.ui.rightTab;
    return USER_SETTINGS.rightTabs.some(([k]) => k === t) ? t : USER_SETTINGS.rightTabs[0][0];
  }

  show(tab, focusKey) {
    this.app.store.data.ui.rightTab = tab;
    this.app.store.save();
    this.render();
    if (focusKey) {
      const el = this.root.querySelector(`[data-key="${focusKey}"]`);
      el?.scrollIntoView({ block: "center", behavior: "smooth" });
      el?.focus();
    }
  }

  changed() { this.app.docChanged(false); this.app.board.updateAllPreviews(); }

  render() {
    const tab = this.tab;
    for (const b of this.tabs.querySelectorAll("[data-tab]")) b.setAttribute("aria-selected", String(b.dataset.tab === tab));
    const top = this.root.scrollTop;
    this.root.replaceChildren(...(tab === "run" ? this.runTab() : this.imageTab()));
    this.root.scrollTop = top;
  }

  listEntries(list, extra = []) {
    return [...extra, ...(list || []).map((v) => [v, v])];
  }

  // VAE は一覧を読み込んでいなくても「自動」を選べるようにする（合わない VAE を外す手段を常に残す）
  vaeEntries(list) {
    const named = (list || []).filter((v) => !USER_SETTINGS.autoValues.includes(v));
    const auto = this.app.store.data.backend === "comfy" ? [["Automatic", L.vaeAutoComfy]] : [["Automatic", L.vaeAuto], ["None", L.vaeNone]];
    return [...auto, ...named.map((v) => [v, v])];
  }

  imageTab() {
    const app = this.app;
    const c = app.doc.common;
    const s = c.settings;
    const res = app.res;
    const lim = USER_SETTINGS.limits;
    const sl = USER_SETTINGS.sliders;
    const msg = h("p", { class: "msg" });
    const families = USER_SETTINGS.modelFamilies.map((f) => [f.id, f.label]);
    const styleSel = Form.select(c, "style", USER_SETTINGS.promptStyles, () => this.changed());
    const famSel = Form.select(c, "family", families, (k, v) => {
      const fam = USER_SETTINGS.modelFamilies.find((f) => f.id === v);
      if (fam?.style) { c.style = fam.style; styleSel.value = fam.style; }
      this.changed();
    });
    const presets = USER_SETTINGS.sizePresets.map(([w, hh]) => [`${w}x${hh}`, `${w} × ${hh}`]);
    const sizeSel = h("select");
    const syncPreset = () => { fillSelect(sizeSel, [["", "—"], ...presets], `${c.width}x${c.height}`); if (!presets.some(([v]) => v === `${c.width}x${c.height}`)) sizeSel.value = ""; };
    const onSize = () => { syncPreset(); this.changed(); app.board.render(); };
    const wIn = Form.number(c, "width", onSize, lim.side, { step: USER_SETTINGS.sizeStep, slider: sl.side });
    const hIn = Form.number(c, "height", onSize, lim.side, { step: USER_SETTINGS.sizeStep, slider: sl.side });
    syncPreset();
    sizeSel.addEventListener("change", () => {
      if (!sizeSel.value) return;
      [c.width, c.height] = sizeSel.value.split("x").map(Number);
      wIn.value = c.width; hIn.value = c.height;
      onSize();
    });
    const swap = h("button", { class: "small", text: L.swapSize, onclick: () => { [c.width, c.height] = [c.height, c.width]; wIn.value = c.width; hIn.value = c.height; onSize(); } });
    const loraSel = h("select", { "data-key": "lora" });
    fillSelect(loraSel, [["", "—"], ...(res.loras || []).map((n) => [n, Infotext.displayName(n)])], "");
    // 選んだ LoRA は「末尾」（全シーン共通）に足す。すでに入っている LoRA は足さない
    const suffixEl = Form.text(c, "suffix", () => this.changed(), { rows: 2, "data-key": "suffix" });
    loraSel.addEventListener("change", () => {
      const name = loraSel.value;
      loraSel.value = "";
      if (!name) return;
      const shown = Infotext.displayName(name);
      if (LoraTags.extract(c.suffix).loras.some((l) => Infotext.displayName(l.name).toLowerCase() === shown.toLowerCase())) {
        app.notice(fmt(M.loraAlready, { name: shown }), "warn");
        return;
      }
      suffixEl.value = PromptBuilder.tidy([suffixEl.value, LoraTags.tag(name)]);
      suffixEl.dispatchEvent(new Event("input"));
      app.notice(fmt(M.loraAdded, { name: shown }), "ok");
    });
    const loadBtn = h("button", { class: "mini", text: L.loadLists, title: L.loadListsTitle, onclick: async () => { await app.loadResources(msg); } });
    return [
      Form.section("model", L.secModel, [
        msg,
        Form.prop(L.model, Form.select(c, "model", this.listEntries(res.models, [["", L.keepCurrent]]), () => this.changed(), { "data-key": "model", listed: !!res.models?.length })),
        Form.prop(L.vae, Form.select(c, "vae", this.vaeEntries(res.vaes), () => this.changed(), { "data-key": "vae", listed: !!res.vaes?.length }), { title: L.vaeTitle }),
        res.forgeNeo || res.textEncoders?.length || c.textEncoder
          ? Form.prop(L.textEncoder, Form.select(c, "textEncoder", this.listEntries(res.textEncoders, [["Automatic", L.vaeAuto]]), () => this.changed(), { "data-key": "textEncoder", listed: !!res.textEncoders?.length }), { title: L.textEncoderTitle })
          : null,
        Form.prop(L.family, famSel, { title: L.familyTitle }),
        Form.prop(L.style, styleSel, { title: L.styleTitle }),
      ], [loadBtn]),
      Form.section("prompt", L.secPrompt, [
        Form.prop(L.quality, Form.text(c, "quality", () => this.changed(), { rows: 2, "data-key": "quality" }), { top: true, note: L.qualityNote }),
        Form.prop(L.suffix, suffixEl, { top: true, note: L.suffixNote }),
        Form.prop(L.insertLora, loraSel, { note: L.insertLoraNote }),
        Form.prop(L.negative, Form.text(c, "negative", () => this.changed(), { rows: 4 }), { top: true }),
        Form.prop(L.promptLayout, Form.seg([["lines", L.promptLayoutLines], ["inline", L.promptLayoutInline]], c.promptLayout, (v) => { c.promptLayout = v; this.changed(); }), { note: L.promptLayoutNote }),
      ]),
      Form.section("sampling", L.secSampling, [
        Form.prop(L.sampler, Form.select(s, "sampler", this.listEntries(res.samplers), () => this.changed(), { listed: !!res.samplers?.length })),
        Form.prop(L.scheduler, Form.select(s, "scheduler", this.listEntries(res.schedulers), () => this.changed(), { listed: !!res.schedulers?.length })),
        Form.prop(L.steps, Form.number(s, "steps", () => this.changed(), lim.steps, { slider: sl.steps })),
        Form.prop(L.cfg, Form.number(s, "cfg", () => this.changed(), lim.cfg, { step: 0.5, slider: sl.cfg })),
        Form.prop(L.seed, Form.number(s, "seed", () => { this.changed(); app.board.render(); }, [-1, USER_SETTINGS.seedMax], { "data-key": "seed" }), { note: L.seedNote }),
        Form.prop(L.clipSkip, Form.number(s, "clipSkip", () => this.changed(), lim.clipSkip)),
      ]),
      app.doc.mode === "novel" ? this.aspectSection() : Form.section("size", L.secSize, [
        Form.prop(L.sizePreset, sizeSel),
        Form.prop(L.width, wIn),
        Form.prop(L.height, hIn),
        h("div", { class: "row" }, swap),
      ]),
    ];
  }

  aspectSection() {
    const app = this.app;
    const c = app.doc.common;
    const nv = app.doc.novel;
    const note = h("p", { class: "note", text: fmt(NL.aspectNote, { w: c.width, h: c.height }) });
    const sel = Form.select(nv, "aspect", NV.imageAspects.map(([k, label]) => [k, label]), (k, v) => {
      const a = NV.imageAspects.find(([x]) => x === v);
      [c.width, c.height] = [a[2], a[3]];
      note.textContent = fmt(NL.aspectNote, { w: c.width, h: c.height });
      this.changed();
      app.board.render();
    }, { listed: false, "data-key": "aspect" });
    return Form.section("size", L.secSize, [Form.prop(NL.aspect, sel), note]);
  }

  runTab() {
    const app = this.app;
    const r = app.doc.run;
    const lim = USER_SETTINGS.limits;
    const sl = USER_SETTINGS.sliders;
    const changed = () => { app.docChanged(false); app.updateRunNote(); app.board.updateAllImages(); app.setStrip.render(); };
    const checkBox = h("div", { style: "display:flex;flex-direction:column;gap:6px" },
      Form.prop(L.threshold, Form.number(r, "threshold", changed, lim.threshold, { slider: sl.threshold, "data-key": "threshold" })),
      h("p", { class: "note", text: L.anatomyNote }),
      Form.check(r, "strictScene", L.strictScene, changed),
      Form.prop(L.matchThreshold, Form.number(r, "matchThreshold", changed, lim.matchThreshold, { slider: sl.matchThreshold }), { note: L.matchThresholdNote }),
      Form.check(r, "autoExtra", L.autoExtra, changed),
      h("p", { class: "note", text: L.autoExtraNote }),
      h("p", { class: "note", text: L.checkFlow }));
    const sync = () => { checkBox.hidden = !r.check; };
    sync();
    const llm = app.store.data.llm;
    return [
      Form.section("count", L.secCount, [
        Form.prop(L.perScene, Form.number(r, "perScene", () => { changed(); app.board.render(); }, lim.perScene, { slider: sl.perScene, "data-key": "perScene" })),
      ]),
      Form.section("check", L.secCheck, [
        Form.check(r, "check", L.check, () => { sync(); changed(); }),
        h("p", { class: "note", text: L.checkNote }),
        checkBox,
        h("div", { class: "check-only" },
          h("button", { id: "btn-check-only", class: "icon-search", text: L.checkOnly, disabled: app.runner.busy, onclick: () => app.checkOnly() }),
          h("p", { class: "note", text: L.checkOnlyNote })),
      ]),
      Form.section("memory", L.secMemory, [
        Form.check(r, "keepRejected", L.keepRejected, changed),
        h("p", { class: "note", text: L.keepRejectedNote }),
        Form.check(llm, "freeVram", L.freeVram, () => app.store.save()),
      ]),
    ];
  }
}

// ===== DRAG SORT (REORDER BY DRAGGING, OTHERS MOVE LIVE) =====
class DragSort {
  constructor({ container, item, handle, id, onEnd, threshold = 5 }) {
    this.o = { container, item, handle, id, onEnd, threshold };
    this.down = (e) => this.start(e);
    container.addEventListener("pointerdown", this.down);
  }

  destroy() {
    this.o.container.removeEventListener("pointerdown", this.down);
    this.stop?.();
  }

  items() {
    return [...this.o.container.children].filter((el) => el.matches(this.o.item));
  }

  start(e) {
    if (e.button !== 0) return;
    const grip = e.target.closest(this.o.handle);
    const el = grip?.closest(this.o.item);
    if (!el || el.parentElement !== this.o.container) return;
    e.preventDefault();
    const c = this.o.container;
    const doc = c.ownerDocument;
    const win = doc.defaultView;
    const before = this.items().map(this.o.id);
    const s = { x: e.clientX, y: e.clientY, on: false, last: e, raf: 0 };
    const local = (ev) => {
      const r = c.getBoundingClientRect();
      return { x: ev.clientX - r.left - c.clientLeft, y: ev.clientY - r.top - c.clientTop };
    };
    const flip = (els, first) => {
      for (const sib of els) {
        const f = first.get(sib);
        const dx = f.x - sib.offsetLeft, dy = f.y - sib.offsetTop;
        if (!dx && !dy) continue;
        sib.style.transition = "none";
        sib.style.transform = `translate(${dx}px, ${dy}px)`;
        sib.getBoundingClientRect();
        sib.style.transition = "transform .2s ease";
        sib.style.transform = "";
      }
    };
    const follow = () => {
      const p = local(s.last);
      el.style.transform = `translate(${s.ox + p.x - s.px - el.offsetLeft}px, ${s.oy + p.y - s.py - el.offsetTop}px)`;
    };
    const place = () => {
      const p = local(s.last);
      const cx = s.ox + p.x - s.px + el.offsetWidth / 2;
      const cy = s.oy + p.y - s.py + el.offsetHeight / 2;
      const sibs = this.items().filter((x) => x !== el);
      const at = sibs.filter((x) => {
        const sy = x.offsetTop + x.offsetHeight / 2;
        if (Math.abs(sy - cy) < Math.min(x.offsetHeight, el.offsetHeight) / 2) return x.offsetLeft + x.offsetWidth / 2 < cx;
        return sy < cy;
      }).length;
      const now = this.items().indexOf(el);
      if (at !== now) {
        const first = new Map(sibs.map((x) => [x, { x: x.offsetLeft, y: x.offsetTop }]));
        const ref = sibs[at];
        c.insertBefore(el, ref || sibs[sibs.length - 1].nextSibling);
        flip(sibs, first);
      }
      follow();
    };
    const scroll = () => {
      s.raf = 0;
      if (!s.on) return;
      const edge = 60, y = s.last.clientY, vh = win.innerHeight;
      const dy = y < edge ? -(edge - y) / 3 : y > vh - edge ? (y - (vh - edge)) / 3 : 0;
      if (!dy) return;
      let box = c.parentElement;
      while (box && box !== doc.body && !(box.scrollHeight > box.clientHeight && /(auto|scroll)/.test(win.getComputedStyle(box).overflowY))) box = box.parentElement;
      if (box && box !== doc.body) box.scrollTop += dy; else win.scrollBy(0, dy);
      place();
      s.raf = win.requestAnimationFrame(scroll);
    };
    const move = (ev) => {
      s.last = ev;
      if (!s.on) {
        if (Math.hypot(ev.clientX - s.x, ev.clientY - s.y) < this.o.threshold) return;
        s.on = true;
        c.classList.add("drag-sorting");
        const p = local(e);
        Object.assign(s, { px: p.x, py: p.y, ox: el.offsetLeft, oy: el.offsetTop });
        el.classList.add("drag-lifted");
        doc.body.classList.add("drag-active");
      }
      place();
      if (!s.raf) s.raf = win.requestAnimationFrame(scroll);
    };
    const end = () => {
      this.stop();
      if (!s.on) return;
      el.style.transition = "transform .2s ease";
      el.style.transform = "";
      const after = this.items().map(this.o.id);
      win.setTimeout(() => {
        el.classList.remove("drag-lifted");
        c.classList.remove("drag-sorting");
        for (const x of this.items()) { x.style.transition = ""; x.style.transform = ""; }
        if (after.join("\n") !== before.join("\n")) this.o.onEnd(after);
      }, 210);
      const swallow = (ev) => { ev.stopPropagation(); ev.preventDefault(); };
      doc.addEventListener("click", swallow, { capture: true, once: true });
      win.setTimeout(() => doc.removeEventListener("click", swallow, { capture: true }), 0);
    };
    this.stop = () => {
      doc.removeEventListener("pointermove", move);
      doc.removeEventListener("pointerup", end);
      doc.removeEventListener("pointercancel", end);
      if (s.raf) win.cancelAnimationFrame(s.raf);
      s.raf = 0;
      doc.body.classList.remove("drag-active");
      this.stop = null;
    };
    doc.addEventListener("pointermove", move);
    doc.addEventListener("pointerup", end);
    doc.addEventListener("pointercancel", end);
  }
}

// ===== SCENE BOARD (ONE CARD PER SCENE) =====
class SceneBoard {
  constructor(app) {
    this.app = app;
    this.root = $("scenes");
    this.cards = new Map();
    this.sort = new DragSort({ container: this.root, item: ".scene", handle: ".drag-grip", id: (el) => el.dataset.scene, onEnd: (ids) => app.reorderScenes(ids) });
    this.groupSort = new DragSort({ container: this.root, item: ".nv-group", handle: ".nv-group-grip", id: (el) => el.dataset.group, onEnd: (ids) => app.reorderGroups(ids) });
    this.groupSorts = [];
    this.collapsed = new Set();
  }

  destroy() { this.sort.destroy(); this.groupSort.destroy(); this.groupSorts.forEach((x) => x.destroy()); this.cards.clear(); this.root.replaceChildren(); }

  render() {
    const doc = this.app.doc;
    this.cards.clear();
    this.groupSorts.forEach((x) => x.destroy());
    this.groupSorts = [];
    if (!doc.scenes.length) {
      this.root.replaceChildren(h("div", { class: "empty-board", text: L.emptyBoard, style: "white-space:pre-line" }));
      return;
    }
    if (doc.mode === "novel") { this.root.replaceChildren(...this.novelGroups()); return; }
    this.root.replaceChildren(...doc.scenes.map((s, i) => this.card(s, i)));
  }

  // NOVEL GAME: SCENE GROUPS, LINES AND LOOP VIDEO
  novelGroups() {
    const app = this.app;
    const doc = app.doc;
    return Doc.groups(doc).map((g, gi) => {
      const head = g.head;
      const lines = g.scenes.reduce((n, s) => n + s.lines.filter((l) => l.text.trim()).length, 0);
      const body = h("div", { class: "nv-group-body" }, ...g.scenes.map((s, k) => this.card(s, doc.scenes.indexOf(s), { group: gi, k })));
      this.groupSorts.push(new DragSort({ container: body, item: ".scene", handle: ".drag-grip", id: (el) => el.dataset.scene, onEnd: (ids) => app.reorderInGroup(head.id, ids) }));
      const sec = h("section", { class: `nv-group${this.collapsed.has(head.id) ? " collapsed" : ""}`, "data-group": head.id });
      const toggle = h("button", { class: "mini quiet nv-group-toggle", title: NL.groupToggle, text: this.collapsed.has(head.id) ? "▸" : "▾", onclick: () => {
        const on = !this.collapsed.has(head.id);
        if (on) this.collapsed.add(head.id); else this.collapsed.delete(head.id);
        sec.classList.toggle("collapsed", on);
        toggle.textContent = on ? "▸" : "▾";
      } });
      sec.append(
        h("div", { class: "nv-group-head" },
          h("span", { class: "nv-group-grip", title: NL.groupGrip, "aria-hidden": "true" }),
          toggle,
          h("span", { class: "nv-group-no", text: fmt(NL.groupScene, { n: gi + 1 }) }),
          Form.text(head, "sceneTitle", () => app.docChanged(false), { class: "nv-group-title", placeholder: NL.groupTitle }),
          h("span", { class: "nv-group-stat", text: fmt(NL.groupStat, { n: g.scenes.length, lines }) }),
          gi > 0 ? h("button", { class: "mini quiet", text: NL.groupJoin, onclick: () => app.joinGroup(head) }) : null,
          h("button", { class: "mini quiet danger", text: NL.groupRemove, onclick: () => app.removeGroup(head) })),
        body,
        h("button", { class: "nv-add-image", text: NL.groupAddImage, onclick: () => app.addImageToGroup(head) }));
      return sec;
    });
  }

  novelArea(scene) {
    const app = this.app;
    const lines = h("div", { class: "nv-lines" });
    const video = h("div", { class: "nv-video" });
    const add = h("button", { class: "mini", text: NL.lineAdd, onclick: () => {
      scene.lines.push(Doc.newLine({ who: scene.cast[0] || NV.narrator }));
      app.docChanged(false);
      this.updateLines(scene.id);
      lines.querySelector(".nv-line:last-child .nv-text")?.focus();
    } });
    return { lines, video, el: h("div", { class: "nv-area" }, h("div", { class: "nv-lines-box" }, h("div", { class: "nv-sub", text: NL.lines }), lines, add), video) };
  }

  updateLines(sceneId) {
    const card = this.cards.get(sceneId);
    const scene = this.app.doc.scenes.find((s) => s.id === sceneId);
    if (!card?.lines || !scene) return;
    const app = this.app;
    const doc = app.doc;
    const speakersFor = () => [[NV.narrator, NL.narratorName], ...doc.cast.map((c, i) => [c, i])
      .map(([c, i]) => [c.id, `${letter(i)}. ${c.name || L.castUnnamed}`])];
    const emoTitle = fmt(NL.emoTitle, { list: NovelWriter.emojiList() });
    const move = (i, d) => {
      const j = i + d;
      if (j < 0 || j >= scene.lines.length) return;
      [scene.lines[i], scene.lines[j]] = [scene.lines[j], scene.lines[i]];
      app.docChanged(false);
      this.updateLines(sceneId);
    };
    card.lines.replaceChildren(...scene.lines.map((l, i) => h("div", { class: "nv-line", "data-line": l.id },
      Form.select(l, "who", speakersFor(l), () => { app.docChanged(false); this.updateVoice(l.id); app.left.paintSteps(); }, { class: "nv-who", listed: false, "aria-label": NL.lineSpeaker }),
      Form.text(l, "emo", () => { app.docChanged(false); this.updateVoice(l.id); app.left.paintSteps(); }, { class: "nv-emo", placeholder: NL.emoPlaceholder, title: emoTitle, "aria-label": NL.emo }),
      Form.text(l, "text", () => { app.docChanged(false); this.updateVoice(l.id); app.left.paintSteps(); }, { class: "nv-text", placeholder: NL.lineText }),
      h("span", { class: "nv-voice" }),
      h("button", { class: "mini quiet", text: "↑", title: NL.lineUp, disabled: i === 0, onclick: () => move(i, -1) }),
      h("button", { class: "mini quiet", text: "↓", title: NL.lineDown, disabled: i === scene.lines.length - 1, onclick: () => move(i, 1) }),
      h("button", { class: "mini quiet danger", text: "✕", title: NL.lineRemove, onclick: () => { scene.lines.splice(i, 1); app.docChanged(false); this.updateLines(sceneId); app.left.paintSteps(); } }))));
    for (const l of scene.lines) this.updateVoice(l.id);
  }

  updateVoice(lineId) {
    let row = null;
    for (const c of this.cards.values()) if (!row) row = c.lines?.querySelector(`.nv-line[data-line="${lineId}"]`) || null;
    const line = this.app.doc.scenes.flatMap((s) => s.lines).find((l) => l.id === lineId);
    if (!row || !line) return;
    const app = this.app;
    const nr = app.novel;
    const { state, e, t } = nr.voiceState(line);
    const n = e?.takes?.length || 0;
    const text = { skip: NL.voiceSkip, run: NL.voiceRun, error: NL.voiceError, done: fmt(NL.voiceDone, { sec: (t?.duration || 0).toFixed(1) }), stale: NL.voiceStale }[state];
    row.querySelector(".nv-voice").replaceChildren(
      h("button", { class: "mini quiet", text: NL.voicePlay, title: NL.voicePlayTitle, disabled: !t?.url, onclick: () => nr.play(t.url) }),
      h("span", { class: `nv-voice-state ${state}`, text, title: e?.error || "" }),
      h("button", { class: "mini quiet", text: NL.voiceMake, title: NL.voiceMakeTitle, disabled: state === "skip" || nr.busy || app.runner.busy, onclick: () => nr.makeVoices([line]) }),
      h("button", { class: "mini quiet nv-takes", text: fmt(NL.takesOpen, { n }), title: NL.takesOpenTitle, disabled: state === "skip" && !n, onclick: () => app.takes.open(line.id) }));
    if (app.takes.lineId === lineId) app.takes.render();
  }

  paintVideo(sceneId) {
    const card = this.cards.get(sceneId);
    const scene = this.app.doc.scenes.find((s) => s.id === sceneId);
    if (!card?.video || !scene) return;
    const app = this.app;
    const nr = app.novel;
    const pick = app.pickOf(sceneId);
    const { state, e } = nr.videoState(scene);
    const busy = nr.busy || app.runner.busy;
    const changed = () => { app.docChanged(false); app.left.paintSteps(); };
    const kids = [Form.check(scene, "loop", NL.videoLoop, () => { changed(); this.paintVideo(sceneId); })];
    if (scene.loop) {
      const sound = !!app.doc.novel.video.sound;
      kids.push(
        Form.field(NL.videoMotion, Form.text(scene, "motion", changed, { placeholder: NL.videoMotionPlaceholder })),
        h("details", { class: "nv-video-prompt", open: !!scene.videoPrompt.trim() }, h("summary", { text: NL.videoPrompt }), Form.text(scene, "videoPrompt", changed, { rows: 4, "data-key": "videoPrompt" })),
        e?.url ? h("video", { class: "nv-video-preview", src: e.url, loop: true, muted: !sound, autoplay: true, playsInline: true, controls: true })
          : h("p", { class: `note keep${state === "error" ? " err" : ""}`, text: state === "run" ? NL.videoRun : state === "error" ? e.error : pick ? NL.videoNone : NL.videoNeedPick }),
        h("div", { class: "row" },
          h("button", { class: "mini", text: e?.url ? NL.videoRemake : NL.videoMake, disabled: !pick || busy, onclick: () => nr.makeVideos([sceneId]) }),
          e?.url && state !== "run" ? h("button", { class: "mini quiet danger", text: NL.videoClear, onclick: () => { URL.revokeObjectURL(e.url); app.videos.delete(sceneId); this.paintVideo(sceneId); app.left.paintSteps(); } }) : null,
          e?.url && state === "stale" ? h("span", { class: "nv-voice-state stale", text: NL.voiceStale }) : null));
    }
    card.video.replaceChildren(...kids);
  }

  paintNovel() {
    if (this.app.doc.mode !== "novel") return;
    for (const id of this.cards.keys()) {
      this.updateLines(id);
      this.paintVideo(id);
    }
  }

  overridesText(scene) {
    const o = L.overrides;
    const parts = [];
    if (Number(scene.perScene) > 0) parts.push(fmt(o.perScene, { v: scene.perScene }));
    if (Number(scene.width) > 0 && Number(scene.height) > 0) parts.push(fmt(o.size, { w: scene.width, h: scene.height }));
    if (scene.seed !== null && scene.seed !== undefined && scene.seed !== "") parts.push(fmt(o.seed, { v: scene.seed }));
    if ((scene.negative || "").trim()) parts.push(o.negative);
    return parts.join("・");
  }

  extraSection(scene, changed) {
    const app = this.app;
    const c = app.doc.common;
    const lim = USER_SETTINGS.limits;
    const summaryInfo = h("span", { class: "override" });
    const refresh = () => {
      const t = this.overridesText(scene);
      summaryInfo.textContent = t ? `（${t}）` : "";
      summaryInfo.nextSibling && (summaryInfo.nextSibling.hidden = !!t);
      changed();
    };
    const novel = app.doc.mode === "novel";
    const presets = novel ? NV.imageAspects.filter(([, , w, hh]) => w !== c.width || hh !== c.height).map(([, label, w, hh]) => [`${w}x${hh}`, label]) : USER_SETTINGS.sizePresets.map(([w, hh]) => [`${w}x${hh}`, `${w} × ${hh}`]);
    const sizeSel = h("select");
    const own = () => Number(scene.width) > 0 && Number(scene.height) > 0;
    const sizeValue = () => (!own() ? "common" : presets.some(([v]) => v === `${scene.width}x${scene.height}`) ? `${scene.width}x${scene.height}` : "custom");
    fillSelect(sizeSel, [["common", novel ? fmt(NL.sceneSizeCommon, { label: NV.imageAspects.find(([k]) => k === app.doc.novel.aspect)?.[1] || "" }) : fmt(L.sceneSizeCommon, { w: c.width, h: c.height })], ...presets, ...(novel ? [] : [["custom", L.sceneSizeCustom]])], sizeValue());
    const wIn = Form.number(scene, "width", () => refresh(), lim.side, { step: USER_SETTINGS.sizeStep, allowEmpty: true, placeholder: String(c.width) });
    const hIn = Form.number(scene, "height", () => refresh(), lim.side, { step: USER_SETTINGS.sizeStep, allowEmpty: true, placeholder: String(c.height) });
    const custom = h("div", { class: "grid2" }, Form.field(L.width, wIn), Form.field(L.height, hIn));
    custom.hidden = sizeValue() !== "custom";
    sizeSel.addEventListener("change", () => {
      const v = sizeSel.value;
      if (v === "common") { scene.width = null; scene.height = null; }
      else if (v === "custom") { if (!own()) { scene.width = c.width; scene.height = c.height; } }
      else [scene.width, scene.height] = v.split("x").map(Number);
      wIn.value = scene.width ?? "";
      hIn.value = scene.height ?? "";
      custom.hidden = v !== "custom";
      refresh();
    });
    const t = this.overridesText(scene);
    summaryInfo.textContent = t ? `（${t}）` : "";
    const hint = h("span", { text: L.sceneExtraNone });
    hint.hidden = !!t;
    return h("details", { class: "scene-extra", open: !!t },
      h("summary", {}, h("span", { text: L.sceneExtra }), summaryInfo, hint),
      h("div", { class: "grid2" },
        Form.field(L.scenePerScene, Form.number(scene, "perScene", () => { refresh(); this.updateImages(scene.id); }, lim.perScene, { allowEmpty: true, placeholder: String(app.doc.run.perScene) })),
        Form.field(L.sceneSeed, Form.number(scene, "seed", () => refresh(), [-1, USER_SETTINGS.seedMax], { allowEmpty: true, placeholder: L.sceneSeedPlaceholder }))),
      Form.field(L.sceneSize, sizeSel),
      custom,
      Form.field(L.sceneNegative, Form.text(scene, "negative", () => refresh())));
  }

  card(scene, index, pos = null) {
    const app = this.app;
    const doc = app.doc;
    const changed = () => { app.docChanged(false); this.updatePreview(scene.id); };
    const stat = h("span", { class: "scene-stat" });
    const media = h("div", { class: "scene-media" });
    const preview = h("div", { class: "preview-box" });
    const previewLabel = h("span", { class: "preview-label" });
    // 「送信プロンプトを個別指定」は見出しの行の右に置く（押し間違いを減らすため本文から離す）。
    // summary の中のスイッチを押しても、開け閉めはしない（ラベルは操作できる要素なので summary の動作が起きない）
    const customToggle = Form.check(scene, "customPrompt", L.customPrompt, (k, on) => {
      if (on && !scene.customText && !scene.customNegative) {
        const auto = PromptBuilder.auto(doc, scene);
        scene.customText = auto.prompt;
        scene.customNegative = auto.negative;
      }
      if (on) previewDetails.open = true;
      app.docChanged(false);
      preview.dataset.mode = "";
      this.updatePreview(scene.id);
    });
    customToggle.classList.add("custom-toggle");
    const previewSummary = h("summary", {}, previewLabel, customToggle);
