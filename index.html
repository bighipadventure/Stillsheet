<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stillsheet</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎴</text></svg>">
<style>
/* ===== TOKENS ===== */
:root {
  --bg: #e9e9e9;
  --surface: #f5f5f5;
  --surface-2: #ffffff;
  --head: #e1e1e1;
  --ink: #2c2c2c;
  --muted: #5a5a5a;
  --line: #d0d0d0;
  --line-strong: #a8a8a8;
  --control: #ffffff;
  --control-hover: #ececec;
  --accent: #0d66d0;
  --accent-hover: #0a58b5;
  --on-accent: #ffffff;
  --accent-text: #0d66d0;
  --accent-soft: #dde9f8;
  --on-accent-soft: #0a4a99;
  --lamp: #e68619;
  --danger: #c9252d;
  --danger-soft: #fbe6e6;
  --ok: #268e6c;
  --ok-soft: #dcf2ea;
  --on-status: #ffffff;
  --warn-soft: #fdf0dc;
  --on-warn-soft: #5c3a00;
  --stage: #3a3a3a;
  --chip: #ececec;
  --radius-s: 4px;
  --radius-l: 6px;
  --h-control: 28px;
  --run-height: 36px;
  --topbar-h: 40px;
  --thumb: 92px;
  --menu-w: 320px;
  --font: "Source Han Sans JP", "Noto Sans JP", "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: light;
  box-sizing: border-box;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1b1b1b;
    --surface: #2c2c2c;
    --surface-2: #232323;
    --head: #252525;
    --ink: #e8e8e8;
    --muted: #ababab;
    --line: #3e3e3e;
    --line-strong: #5a5a5a;
    --control: #383838;
    --control-hover: #454545;
    --accent-hover: #1473e6;
    --accent-text: #8cc8ff;
    --accent-soft: #1d3554;
    --on-accent-soft: #cfe3fb;
    --lamp: #f0a63a;
    --danger: #ff8a8a;
    --danger-soft: #3d1c1c;
    --ok: #6fd6a8;
    --ok-soft: #173a2d;
    --on-status: #10201a;
    --warn-soft: #3a2c10;
    --on-warn-soft: #ffe0a8;
    --stage: #121212;
    --chip: #383838;
    color-scheme: dark;
  }
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body { margin: 0; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 13px; line-height: 1.5; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 1px; }
[hidden] { display: none !important; }
body { -webkit-user-select: none; user-select: none; }
input, textarea, select, pre, code, .msg, #run-status, .story-synopsis, .viewer-info { -webkit-user-select: text; user-select: text; }
.help-toggle { margin: 0 6px; white-space: nowrap; }
body.no-help .layout .note:not(.keep) { display: none !important; }

/* ===== CONTROLS ===== */
button {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: var(--h-control);
  border: 1px solid var(--line-strong); background: var(--control); color: var(--ink);
  border-radius: var(--radius-s); padding: 3px 10px; cursor: pointer; font-size: 12px; font-weight: 500; line-height: 1.3;
  transition: background-color .12s, border-color .12s;
}
button:hover:not(:disabled) { background: var(--control-hover); border-color: var(--muted); }
button:disabled { opacity: .45; cursor: not-allowed; }
button.primary, button.run { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
button.primary:hover:not(:disabled), button.run:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); color: var(--on-accent); }
button.quiet { border-color: transparent; background: transparent; }
button.quiet:hover:not(:disabled) { background: var(--control-hover); border-color: transparent; }
button.danger { color: var(--danger); border-color: var(--danger); background: transparent; }
button.danger:hover:not(:disabled) { background: var(--danger-soft); color: var(--danger); }
button.quiet.danger { border-color: transparent; }
button.big { width: 100%; font-size: 14px; letter-spacing: .06em; }
button.mini, button.small { min-height: 22px; padding: 0 7px; font-size: 11px; }
input[type="text"], input[type="url"], input[type="number"], input[type="password"], input:not([type]), select, textarea {
  width: 100%; min-height: var(--h-control); background: var(--surface-2); border: 1px solid var(--line-strong);
  border-radius: var(--radius-s); padding: 3px 8px; font-size: 13px;
}
select { padding-right: 4px; }
input:focus, select:focus, textarea:focus { border-color: var(--accent-text); outline: none; box-shadow: 0 0 0 1px var(--accent-text); }
input:disabled, select:disabled, textarea:disabled { opacity: .55; cursor: not-allowed; }
textarea { resize: vertical; line-height: 1.5; padding: 4px 8px; min-height: 54px; }
input[type="range"] { width: 100%; accent-color: var(--accent); }
label.check { display: flex; gap: 8px; align-items: center; font-size: 12px; cursor: pointer; }
label.check input { margin: 0; }
.note { font-size: 12px; color: var(--muted); margin: 0; }
.note:empty { display: none; }
.msg { font-size: 12px; margin: 0; white-space: pre-wrap; }
.msg:empty { display: none; }
.msg.ok { color: var(--ok); }
.msg.err { color: var(--danger); }
.msg.warn { color: var(--on-warn-soft); background: var(--warn-soft); padding: 4px 8px; border-radius: var(--radius-s); }
.row { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 6px 8px; }
code { background: var(--surface-2); border: 1px solid var(--line); padding: 0 5px; border-radius: 3px; word-break: break-all; font-size: 12px; font-family: var(--mono); }
pre { font-family: var(--mono); font-size: 11px; white-space: pre-wrap; word-break: break-word; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius-s); padding: 6px 8px; margin: 0; }
details > summary { cursor: pointer; font-size: 12px; color: var(--muted); list-style: none; display: flex; align-items: center; gap: 6px; }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: "›"; display: inline-block; transition: transform .12s; font-weight: 700; }
details[open] > summary::before { transform: rotate(90deg); }
details > summary:hover { color: var(--ink); }
details[open] > summary { margin-bottom: 4px; }
.seg { display: flex; border: 1px solid var(--line-strong); border-radius: var(--radius-s); overflow: hidden; background: var(--surface-2); }
.seg button { flex: 1; min-width: 0; min-height: 26px; border: none; border-radius: 0; border-right: 1px solid var(--line-strong); padding: 2px 4px; font-size: 12px; background: transparent; white-space: nowrap; }
.seg button:last-child { border-right: none; }
.seg button[aria-pressed="true"], .seg button[aria-pressed="true"]:hover:not(:disabled) { background: var(--accent); color: var(--on-accent); font-weight: 700; }
.field { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--muted); min-width: 0; }
.field > input, .field > select, .field > textarea, .field > .numctl { color: var(--ink); }
.prop { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 8px; align-items: center; margin: 0; }
.prop-label { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prop.top { align-items: start; }
.prop.top .prop-label { padding-top: 5px; }
.clip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ===== TOGGLE SWITCH (ALL CHECKBOXES) ===== */
input[type="checkbox"] {
  appearance: none; -webkit-appearance: none; flex: none; position: relative; width: 34px; height: 20px; margin: 0;
  border-radius: 999px; background: var(--line-strong); cursor: pointer; transition: background .15s;
}
input[type="checkbox"]::before {
  content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%;
  background: #ffffff; box-shadow: 0 1px 2px rgba(0, 0, 0, .35); transition: transform .15s;
}
input[type="checkbox"]:checked { background: var(--accent); }
input[type="checkbox"]:checked::before { transform: translateX(14px); }
input[type="checkbox"]:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; }
input[type="checkbox"]:disabled { opacity: .45; cursor: not-allowed; }

/* ===== NUMBER CONTROL (SLIDER + STEPPER + CLICK TO TYPE) ===== */
.numctl { display: grid; grid-template-columns: 24px minmax(40px, 1fr) 24px minmax(52px, auto); align-items: center; gap: 4px; width: 100%; min-width: 0; }
.numctl.no-slider { grid-template-columns: 24px minmax(52px, 1fr) 24px; }
.numctl.no-slider .dec { order: 1; }
.numctl.no-slider .numctl-val, .numctl.no-slider .numctl-edit { order: 2; }
.numctl.no-slider .inc { order: 3; }
.numctl > input.numctl-src { display: none; }
.numctl-step { width: 24px; height: 24px; min-height: 0; padding: 0; border-radius: 50%; display: grid; place-items: center; font-size: 15px; font-weight: 700; line-height: 1; }
.numctl-range { min-width: 0; margin: 0; }
.numctl-val, .numctl-edit { height: 26px; min-height: 0; padding: 0 6px; border-radius: var(--radius-s); font-size: 12px; font-variant-numeric: tabular-nums; text-align: center; }
.numctl-val { border: 1px solid var(--line); background: var(--surface-2); cursor: text; white-space: nowrap; }
.numctl-val:hover { border-color: var(--accent-text); }
.numctl-val.empty { color: var(--muted); }
.numctl-edit { width: 100%; }
.numctl.disabled { opacity: .5; pointer-events: none; }

/* ===== TOP BAR ===== */
.topbar { flex: none; height: var(--topbar-h); display: flex; align-items: center; gap: 4px; padding: 0 10px; background: var(--head); border-bottom: 1px solid var(--line); }
.topbar h1 { font-size: 14px; margin: 0 6px 0 2px; font-weight: 700; letter-spacing: .04em; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.topbar h1::before { content: ""; width: 12px; height: 12px; border-radius: 3px; background: var(--lamp); }
.topbar > button { white-space: nowrap; }
.pills { display: flex; gap: 4px; margin-left: auto; flex-wrap: nowrap; overflow: hidden; min-width: 0; }
.pill { min-height: 24px; font-size: 12px; border-radius: 999px; padding: 1px 10px; background: transparent; border-color: var(--line); white-space: nowrap; min-width: 0; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: none; }
.pill[data-state="ok"]::before { background: var(--ok); }
.pill[data-state="warn"]::before { background: var(--lamp); }
.pill[data-state="down"]::before { background: var(--danger); }
.pill-label { font-weight: 700; }
.pill-app { color: var(--muted); overflow: hidden; text-overflow: ellipsis; max-width: 22ch; }
.help-btn { border-color: var(--accent-text); color: var(--accent-text); font-weight: 700; }

/* ===== LAYOUT ===== */
.layout { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: var(--left-w, 320px) 6px minmax(0, 1fr) 6px var(--right-w, 340px); background: var(--line); }
.splitter { cursor: col-resize; background: var(--line); position: relative; touch-action: none; }
.splitter::after { content: ""; position: absolute; left: 2px; right: 2px; top: 50%; height: 36px; margin-top: -18px; border-radius: 1px; background: var(--line-strong); }
.splitter:hover, .splitter.dragging { background: var(--accent); }
.splitter:hover::after, .splitter.dragging::after { background: var(--on-accent); }
body.resizing { cursor: col-resize; }
body.resizing * { user-select: none; }
.col-left, .col-right { background: var(--surface); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.side-scroll, .insp-scroll { flex: 1 1 auto; overflow-y: auto; min-height: 0; }
.psec { border-bottom: 1px solid var(--line); }
.psec-title { margin: 0; padding: 5px 10px; font-size: 11px; font-weight: 700; letter-spacing: .06em; color: var(--muted); background: var(--head); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 6px; min-height: 28px; }
.psec-title .tools { margin-left: auto; display: flex; gap: 4px; letter-spacing: 0; }
.psec-body { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 6px; }
.side-foot { flex: none; padding: 8px 10px; background: var(--head); border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; }
.run-row { display: grid; grid-template-columns: 136px minmax(0, 1fr); gap: 6px; }
.run-row select, .run-row button { height: var(--run-height); }
.tabs-h { flex: none; display: flex; background: var(--head); border-bottom: 1px solid var(--line); }
.tabs-h button { flex: 1; border: none; border-radius: 0; background: transparent; min-height: 32px; border-bottom: 2px solid transparent; }
.tabs-h button[aria-selected="true"] { border-bottom-color: var(--accent); color: var(--accent-text); font-weight: 700; }
.col-center { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg); }
.center-scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 12px 14px 24px; container-type: inline-size; }
@media (max-width: 1100px) {
  html, body { height: auto; }
  body { overflow: visible; }
  .layout { grid-template-columns: 1fr; }
  .splitter { display: none; }
  .side-scroll, .insp-scroll, .center-scroll { overflow: visible; }
  .pills .pill-app { display: none; }
}

/* ===== STATUS PANEL (PHASE, PROGRESS AT THE TOP RIGHT, ETA) ===== */
.status-panel { flex: none; padding: 6px 12px; display: flex; flex-direction: column; gap: 2px; background: var(--surface); border-bottom: 1px solid var(--line); }
.status-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; min-height: 26px; }
.phase { flex: none; font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); white-space: nowrap; }
.phase[data-phase="gen"] { background: var(--accent); color: var(--on-accent); }
.phase[data-phase="check"] { background: var(--ok); color: var(--on-status); }
.phase[data-phase="vram"], .phase[data-phase="llm"] { background: var(--lamp); color: #1a1000; }
.phase[data-phase="error"] { background: var(--danger); color: var(--on-status); }
.phase[data-phase="done"] { background: var(--ok-soft); color: var(--ok); }
.status-main { flex: 1 1 200px; min-width: 0; font-size: 12px; font-weight: 700; }
.overall { display: flex; align-items: center; gap: 8px; flex: 0 1 300px; min-width: 160px; margin-left: auto; }
.progress { flex: 1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.progress > div { height: 100%; width: 0; background: var(--lamp); transition: width .3s; }
.overall-pct { font-size: 11px; font-weight: 700; color: var(--muted); min-width: 3em; text-align: right; font-variant-numeric: tabular-nums; }
.eta { font-size: 11px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
#run-status { margin: 0; font-size: 12px; min-height: 1.5em; white-space: pre-wrap; color: var(--muted); display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
#run-status[data-kind="err"] { color: var(--danger); }
#run-status[data-kind="warn"] { color: var(--on-warn-soft); }
#run-status[data-kind="ok"] { color: var(--ok); }
#run-status .fix { min-height: 22px; padding: 0 8px; font-size: 11px; }

/* ===== BOARD HEAD ===== */
.board-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 10px; }
.board-head .titles { flex: 1; min-width: 0; }
.story-title { font-size: 18px; font-weight: 700; margin: 0; line-height: 1.35; }
.story-synopsis { color: var(--muted); margin: 2px 0 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.empty-board { border: 1px dashed var(--line-strong); border-radius: var(--radius-l); padding: 28px; text-align: center; color: var(--muted); background: var(--surface); line-height: 1.8; }

/* ===== LIST ITEMS (CAST / LOCATIONS) ===== */
.item { border: 1px solid var(--line); border-radius: var(--radius-s); background: var(--surface-2); padding: 8px; display: flex; flex-direction: column; gap: 6px; }
.item-head { display: flex; align-items: center; gap: 6px; }
.item-head .tag { flex: none; min-width: 24px; height: 22px; border-radius: 999px; background: var(--accent-soft); color: var(--on-accent-soft); font-weight: 700; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; padding: 0 6px; }
.item-head input { flex: 1; }

/* ===== BASE IMAGE ===== */
.base-drop { border: 2px dashed var(--line-strong); border-radius: var(--radius-l); padding: 10px; display: flex; gap: 10px; align-items: center; color: var(--muted); cursor: pointer; min-height: 72px; }
.base-drop.over { border-color: var(--accent-text); color: var(--accent-text); background: var(--accent-soft); }
.base-drop img { width: 72px; height: 72px; object-fit: cover; border-radius: var(--radius-s); flex: none; background: var(--stage); }
.base-drop .base-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; font-size: 12px; }
.base-drop .base-text b { color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ===== SCENE CARDS ===== */
.scene { border: 1px solid var(--line); border-radius: var(--radius-l); background: var(--surface); margin-bottom: 10px; }
.scene.running { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.scene-head { display: flex; align-items: center; gap: 6px; padding: 4px 6px 4px 8px; background: var(--head); border-bottom: 1px solid var(--line); border-radius: var(--radius-l) var(--radius-l) 0 0; flex-wrap: wrap; }
.scene-no { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: var(--on-accent); font-size: 12px; font-weight: 700; display: grid; place-items: center; }
.scene-head .title { flex: 1 1 120px; min-width: 90px; font-weight: 700; }
.scene-stat { flex: 0 1 auto; min-width: 0; font-size: 11px; color: var(--muted); white-space: nowrap; max-width: 34ch; }
.scene-stat b { color: var(--ok); }
.scene-body { display: grid; grid-template-columns: minmax(260px, 400px) minmax(0, 1fr); gap: 12px; padding: 10px; }
.scene-fields { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
@container (max-width: 760px) {
  .scene-body { grid-template-columns: 1fr; }
}
.cast-checks { display: flex; flex-wrap: wrap; gap: 4px 12px; }
.scene-extra { border-top: 1px dashed var(--line); padding-top: 4px; }
.scene-extra > summary { flex-wrap: wrap; }
.scene-extra > summary > span { min-width: 0; }
.scene-extra .grid2 { margin-top: 4px; }
.override { color: var(--lamp); font-weight: 700; }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--thumb), 1fr)); gap: 6px; align-content: start; }
.thumbs-empty { color: var(--muted); font-size: 12px; border: 1px dashed var(--line); border-radius: var(--radius-s); padding: 16px; text-align: center; }
.thumb { position: relative; aspect-ratio: 1; border-radius: var(--radius-s); overflow: hidden; border: 2px solid transparent; background: var(--stage); padding: 0; cursor: pointer; min-height: 0; }
.thumb:focus-visible { outline: 2px solid var(--accent-text); }
.thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }
.thumb.ng img { opacity: .35; filter: grayscale(.8); }
.thumb.picked { border-color: var(--lamp); }
.thumb .badge { position: absolute; left: 3px; bottom: 3px; font-size: 10px; font-weight: 700; padding: 0 5px; border-radius: 999px; background: rgba(0, 0, 0, .7); color: #fff; line-height: 16px; }
.thumb .badge.ok { background: var(--ok); color: var(--on-status); }
.thumb .badge.ng { background: var(--danger); color: var(--on-status); }
.thumb.pending::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(45deg, transparent 0 6px, rgba(255, 255, 255, .08) 6px 12px); pointer-events: none; }
.thumb .pin { position: absolute; right: 2px; top: 2px; min-height: 22px; width: 24px; padding: 0; border: none; border-radius: 999px; background: rgba(0, 0, 0, .55); color: #fff; font-size: 13px; opacity: 0; z-index: 1; }
.thumb:hover .pin, .thumb .pin:focus-visible { opacity: 1; }
.thumb.picked .pin { opacity: 1; color: var(--lamp); }
.thumb.pinned .pin { background: var(--lamp); color: #000; }
.thumb .pin:hover:not(:disabled) { background: rgba(0, 0, 0, .8); color: var(--lamp); border: none; }

/* ===== SET STRIP (ONE IMAGE PER SCENE) ===== */
.set-strip { border: 1px solid var(--line); border-radius: var(--radius-l); background: var(--surface); margin-bottom: 12px; }
.set-strip-head { display: flex; align-items: center; gap: 8px; padding: 4px 6px 4px 10px; border-bottom: 1px solid var(--line); background: var(--head); border-radius: var(--radius-l) var(--radius-l) 0 0; min-height: 34px; }
.set-strip-head h2 { flex: 1 1 auto; margin: 0; font-size: 11px; font-weight: 700; letter-spacing: .06em; color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.set-note { margin: 0; padding: 6px 10px 0; font-size: 11px; color: var(--muted); }
.set-strip-head .check { flex: none; white-space: nowrap; }
.set-strip-head { flex-wrap: wrap; }
.set-strip-head button { flex: none; }
.set-items { display: flex; gap: 8px; overflow-x: auto; padding: 8px; }
.set-item { flex: none; width: 112px; display: flex; flex-direction: column; gap: 1px; font-size: 11px; color: var(--muted); }

ALLOWED_PATHS = {
    "/web-app-cors/ping",
    "/web-app-cors/loras",
    "/sdapi/v1/txt2img",
    "/sdapi/v1/img2img",
    "/sdapi/v1/progress",
    "/sdapi/v1/interrupt",
    "/sdapi/v1/options",
    "/sdapi/v1/sd-models",

        (b"vary", b"Origin"),

const clone = (obj) => JSON.parse(JSON.stringify(obj));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const fmt = (text, vars) => text.replace(/\{(\w+)\}/g, (m, k) => (k in vars ? vars[k] : m));
const L = USER_SETTINGS.labels;
const M = USER_SETTINGS.messages;
const timestamp = () => {
  const d = new Date();
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
};
const clamp = (v, [min, max]) => Math.min(max, Math.max(min, v));
const latin1 = (bytes) => { let s = ""; for (const b of bytes) s += String.fromCharCode(b); return s; };
const letter = (i) => String.fromCharCode(65 + (i % 26)) + (i >= 26 ? Math.floor(i / 26) : "");

class UserError extends Error {}

function h(tag, props = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k === "html") el.innerHTML = v;
    else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2), v);
    else if (k in el && !["list", "form"].includes(k)) el[k] = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  el.append(...kids.flat().filter((x) => x !== null && x !== undefined && x !== false));
  return el;
}

function esc(text) {
  return String(text).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function setPill(pill, label, app) {
  pill.replaceChildren(h("span", { class: "pill-label", text: label }), h("span", { class: "pill-app", text: app }));
}

function formatDuration(ms) {
  const sec = Math.round(ms / 1000);
  if (sec < 60) return `${sec}秒`;
  const min = Math.floor(sec / 60);
  return min < 60 ? `${min}分${String(sec % 60).padStart(2, "0")}秒` : `${Math.floor(min / 60)}時間${String(min % 60).padStart(2, "0")}分`;
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = h("a", { href: url, download: filename });
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function setMsg(el, text, kind = "") {
  el.textContent = text;
  el.className = "msg" + (kind ? " " + kind : "");
}

function fillSelect(select, entries, value) {
  select.replaceChildren(...entries.map(([v, label]) => new Option(label, v)));
  if (value !== undefined && entries.some(([v]) => String(v) === String(value))) select.value = String(value);
}

function blobToDataUrl(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(blob);
  });
}

function dataUrlToBlob(dataUrl) {
  const [head, body] = dataUrl.split(",");
  const mime = (head.match(/data:([^;,]+)/) || [null, "application/octet-stream"])[1];
  const bin = atob(body);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], { type: mime });
}

async function scaledImage(blob, side) {
  const bmp = await createImageBitmap(blob);
  const k = Math.min(1, side / Math.max(bmp.width, bmp.height));
  const w = Math.max(1, Math.round(bmp.width * k)), hgt = Math.max(1, Math.round(bmp.height * k));
  const canvas = h("canvas", { width: w, height: hgt });
  canvas.getContext("2d").drawImage(bmp, 0, 0, w, hgt);
  bmp.close?.();
  return canvas;
}

function canvasBlob(canvas, type, quality) {
  return new Promise((resolve) => canvas.toBlob(resolve, type, quality));
}

function readJsonFile(file) {
  return file.text().then((t) => JSON.parse(t));
}

function safeName(text) {
  return String(text || "").replace(/[\\/:*?"<>|\s]+/g, "_").replace(/^_+|_+$/g, "").slice(0, 40);
}

// ===== LISTENER BAG (REMOVED ON DESTROY) =====
class Listeners {
  constructor() { this.items = []; }
  on(target, type, fn, opts) {
    target.addEventListener(type, fn, opts);
    this.items.push([target, type, fn, opts]);
  }
  destroy() {
    for (const [t, type, fn, opts] of this.items) t.removeEventListener(type, fn, opts);
    this.items = [];
  }
}

// ===== NETWORK =====
class Net {
  static async probe(url) {
    const timeout = USER_SETTINGS.probeTimeoutMs;
    try {
      const res = await fetch(url, { signal: AbortSignal.timeout(timeout) });
      Net.lastStatus = res.status;
      return res.ok ? "ok" : "error";
    } catch {
      try {
        await fetch(url, { mode: "no-cors", signal: AbortSignal.timeout(timeout) });
        return "cors";
      } catch {
        return "down";
      }
    }
  }

  static message(state) {
    const origin = location.protocol.startsWith("http") ? location.origin : "file://";
    return { ok: M.probeOk, cors: fmt(M.probeCors, { origin }), down: M.probeDown, error: fmt(M.probeError, { status: Net.lastStatus || "?" }) }[state];
  }
}

// ===== A1111 / FORGE CLIENT =====
class A1111Client {
  constructor(url) {
    this.base = url.replace(/\/+$/, "");
  }

  get probeUrl() { return `${this.base}/sdapi/v1/samplers`; }
  get keepsLoraTags() { return true; }

  async get(path) {
    const res = await fetch(this.base + path, { signal: AbortSignal.timeout(USER_SETTINGS.listTimeoutMs) });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
  }

  async loraList() {
    const quick = await fetch(this.base + "/web-app-cors/loras", { signal: AbortSignal.timeout(USER_SETTINGS.listTimeoutMs) }).catch(() => null);
    if (quick?.ok) {
      const list = await quick.json().catch(() => null);
      if (Array.isArray(list)) return list.map((l) => l?.name).filter(Boolean);
    }
    const res = await fetch(this.base + "/sdapi/v1/loras", { signal: AbortSignal.timeout(USER_SETTINGS.listTimeoutMs) });
    if (!res.ok) return [];
    const text = await res.text();
    const data = JSON.parse(text.replace(/(?<=[:\[,]\s*)-?(?:NaN|Infinity)(?=\s*[,\]}])/g, "null"));
    return Array.isArray(data) ? data.map((l) => l?.name).filter(Boolean) : [];
  }

  async resources() {
    const safe = (path, map) => this.get(path).then(map).catch(() => []);
    const [models, loras, samplers, schedulers, vaes] = await Promise.all([
      safe("/sdapi/v1/sd-models", (d) => d.map((m) => m.title)),
      this.loraList().catch(() => []),
      safe("/sdapi/v1/samplers", (d) => d.map((s) => s.name)),
      safe("/sdapi/v1/schedulers", (d) => d.map((s) => s.label || s.name)),
      safe("/sdapi/v1/sd-vae", (d) => d.map((v) => v.model_name)),
    ]);
    return { models, loras, samplers, schedulers, vaes: vaes.length ? ["Automatic", "None", ...vaes] : [] };
  }

  async generate(spec, { signal, onProgress }) {
    const s = spec.settings;
    const override = { CLIP_stop_at_last_layers: s.clipSkip };
    if (spec.model) override.sd_model_checkpoint = spec.model;
    if (spec.vae) override.sd_vae = spec.vae;
    const payload = {
      prompt: spec.prompt, negative_prompt: spec.negative,
      seed: s.seed, steps: s.steps, cfg_scale: s.cfg, sampler_name: s.sampler, width: spec.size.width, height: spec.size.height,
      batch_size: 1, n_iter: 1, send_images: true, save_images: true,
      override_settings: override, override_settings_restore_afterwards: false,
    };
    if (s.scheduler) payload.scheduler = s.scheduler;
    const timer = setInterval(async () => {
      try {
        const p = await this.get("/sdapi/v1/progress?skip_current_image=true");
        if (typeof p.progress === "number") onProgress?.(p.progress);
      } catch {}
    }, USER_SETTINGS.pollIntervalMs);
    try {
      const res = await fetch(`${this.base}/sdapi/v1/txt2img`, {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload), signal,
      });
      if (!res.ok) throw new Error(fmt(M.imageError, { status: res.status, text: (await res.text()).slice(0, 400) }));
      const json = await res.json();
      if (!json.images?.length) throw new Error(M.noImage);
      let seed = s.seed, info = "";
      try {
        const parsed = JSON.parse(json.info || "{}");
        seed = parsed.seed ?? seed;
        info = (Array.isArray(parsed.infotexts) && parsed.infotexts[0]) || "";
      } catch {}
      return { blob: dataUrlToBlob(`data:image/png;base64,${json.images[0]}`), seed, info };
    } finally {
      clearInterval(timer);
    }
  }

  freeVram() {
    return fetch(`${this.base}/sdapi/v1/unload-checkpoint`, { method: "POST", signal: AbortSignal.timeout(USER_SETTINGS.listTimeoutMs) }).then((r) => r.ok).catch(() => false);
  }

  restoreVram() {
    return fetch(`${this.base}/sdapi/v1/reload-checkpoint`, { method: "POST", signal: AbortSignal.timeout(USER_SETTINGS.vramReloadTimeoutMs) }).then((r) => r.ok).catch(() => false);
  }

  interrupt() {
    return fetch(`${this.base}/sdapi/v1/interrupt`, { method: "POST" }).catch(() => {});
  }
}

// ===== COMFYUI CLIENT =====
class ComfyClient {
  constructor(url) {
    this.base = url.replace(/\/+$/, "");
    this.clientId = uid() + uid();
  }

  get probeUrl() { return `${this.base}/system_stats`; }
  get keepsLoraTags() { return false; }

  async inputList(classType, key) {
    try {
      const res = await fetch(`${this.base}/object_info/${encodeURIComponent(classType)}`, { signal: AbortSignal.timeout(USER_SETTINGS.listTimeoutMs) });
      const info = (await res.json())[classType]?.input || {};
      const spec = info.required?.[key] || info.optional?.[key];
      if (Array.isArray(spec?.[0])) return spec[0];
      if (Array.isArray(spec?.[1]?.options)) return spec[1].options;
    } catch {}
    return [];
  }

  async resources() {
    const [models, loras, samplers, schedulers, vaes] = await Promise.all([
      this.inputList("CheckpointLoaderSimple", "ckpt_name"), this.inputList("LoraLoader", "lora_name"),
      this.inputList("KSampler", "sampler_name"), this.inputList("KSampler", "scheduler"),
      this.inputList("VAELoader", "vae_name"),
    ]);
    return { models, loras, samplers, schedulers, vaes };
  }

  static mapName(value, map) {
    return map[value] || value;
  }

  graph(spec) {
    const s = spec.settings;
    const cfg = USER_SETTINGS.comfy;
    const g = {};
    let model = ["1", 0], clip = ["1", 1];
    g["1"] = { class_type: "CheckpointLoaderSimple", inputs: { ckpt_name: spec.model } };
    spec.loras.forEach((l, i) => {
      const id = String(100 + i);
      g[id] = { class_type: "LoraLoader", inputs: { lora_name: l.name, strength_model: l.weight, strength_clip: l.weight, model, clip } };
      model = [id, 0];
      clip = [id, 1];
    });
    g["2"] = { class_type: "CLIPSetLastLayer", inputs: { stop_at_clip_layer: -Math.max(1, s.clipSkip || 1), clip } };
    g["3"] = { class_type: "CLIPTextEncode", inputs: { text: spec.prompt, clip: ["2", 0] } };
    g["4"] = { class_type: "CLIPTextEncode", inputs: { text: spec.negative, clip: ["2", 0] } };
    g["5"] = { class_type: "EmptyLatentImage", inputs: { width: spec.size.width, height: spec.size.height, batch_size: 1 } };
    g["6"] = {
      class_type: "KSampler",
      inputs: {
        seed: s.seed, steps: s.steps, cfg: s.cfg, sampler_name: ComfyClient.mapName(s.sampler, cfg.samplerMap), scheduler: ComfyClient.mapName(s.scheduler, cfg.schedulerMap),
        denoise: 1, model, positive: ["3", 0], negative: ["4", 0], latent_image: ["5", 0],
      },
    };
    let vae = ["1", 2];
    if (spec.vae && !USER_SETTINGS.autoValues.includes(spec.vae)) {
      g["9"] = { class_type: "VAELoader", inputs: { vae_name: spec.vae } };
      vae = ["9", 0];
    }
    g["10"] = { class_type: "VAEDecode", inputs: { samples: ["6", 0], vae } };
    g["11"] = { class_type: "SaveImage", inputs: { images: ["10", 0], filename_prefix: cfg.filePrefix } };
    return g;
  }

  async generate(spec, { signal, onProgress }) {
    if (!spec.model) throw Guide.fail(M.needModelComfy, "image:model");
    const res = await fetch(`${this.base}/prompt`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt: this.graph(spec), client_id: this.clientId }), signal,
    });
    if (!res.ok) throw new Error(fmt(M.comfyRejected, { status: res.status, text: (await res.text()).slice(0, 600) }));
    const promptId = (await res.json()).prompt_id;
    this.current = promptId;
    const stop = this.watch(promptId, onProgress);
    try {
      for (;;) {
        if (signal.aborted) throw new DOMException("aborted", "AbortError");
        const hist = await (await fetch(`${this.base}/history/${promptId}`, { signal })).json();
        const entry = hist[promptId];
        if (entry) {
          if (entry.status?.status_str === "error") {
            const err = (entry.status.messages || []).find((m) => m[0] === "execution_error");
            throw new Error(fmt(M.comfyError, { err: err?.[1]?.exception_message || "不明" }));
          }
          const images = Object.values(entry.outputs || {}).flatMap((o) => o.images || []);
          if (!images.length) throw new Error(M.noImage);
          const info = images[images.length - 1];
          const q = new URLSearchParams({ filename: info.filename, subfolder: info.subfolder || "", type: info.type || "output" });
          const blob = await (await fetch(`${this.base}/view?${q}`, { signal })).blob();
          return { blob, seed: spec.settings.seed, info: "" };
        }
        await sleep(USER_SETTINGS.pollIntervalMs);
      }
    } finally {
      stop();
      this.current = null;
    }
  }

  watch(promptId, onProgress) {
    let socket;
    try {
      socket = new WebSocket(`${this.base.replace(/^http/, "ws")}/ws?clientId=${this.clientId}`);
      socket.addEventListener("message", (ev) => {
        if (typeof ev.data !== "string") return;
        try {
          const msg = JSON.parse(ev.data);
          if (msg.type === "progress" && (!msg.data.prompt_id || msg.data.prompt_id === promptId)) onProgress?.(msg.data.value / msg.data.max);
        } catch {}
      });
      socket.addEventListener("error", () => {});
    } catch {}
    return () => { try { socket?.close(); } catch {} };
  }

  freeVram() {
    return fetch(`${this.base}/free`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ unload_models: true, free_memory: true }), signal: AbortSignal.timeout(USER_SETTINGS.listTimeoutMs) }).then((r) => r.ok).catch(() => false);
  }

  restoreVram() {
    return Promise.resolve(true);
  }

  interrupt() {
    const body = JSON.stringify(this.current ? { prompt_id: this.current } : {});
    return fetch(`${this.base}/interrupt`, { method: "POST", headers: { "Content-Type": "application/json" }, body }).catch(() => {});
  }
}

// ===== DEADLINE (TIME LIMIT THAT CAN TELL A STALL FROM A USER CANCEL) =====
class Deadline {
  static idle(parent, ms) {
    const ctl = new AbortController();
    const d = { signal: ctl.signal, timedOut: false };
    const onParent = () => ctl.abort(parent.reason);
    if (parent?.aborted) ctl.abort(parent.reason);
    else parent?.addEventListener("abort", onParent, { once: true });
    let timer = null;
    d.touch = () => {
      clearTimeout(timer);
      timer = setTimeout(() => { d.timedOut = true; ctl.abort(new DOMException("timed out", "TimeoutError")); }, ms);
    };
    d.stop = () => { clearTimeout(timer); parent?.removeEventListener("abort", onParent); };
    d.touch();
    return d;
  }
}

// ===== LLM CLIENT =====
class LlmClient {
  constructor(cfg) {
    this.cfg = cfg;
  }

  get base() { return String(this.cfg.url || "").replace(/\/+$/, ""); }

  headers() {
    const hd = { "Content-Type": "application/json" };
    if (this.cfg.apiKey) hd.Authorization = `Bearer ${this.cfg.apiKey}`;
    return hd;
  }

  async listModels() {
    const headers = this.cfg.apiKey ? { Authorization: `Bearer ${this.cfg.apiKey}` } : {};
    const res = await fetch(`${this.base}/models`, { headers, signal: AbortSignal.timeout(USER_SETTINGS.probeTimeoutMs) });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return ((await res.json()).data || []).map((m) => m.id);
  }

  static norm(url) { return String(url || "").trim().replace(/\/+$/, ""); }

  static appName(url) {
    const hit = USER_SETTINGS.llm.servers.find((s) => LlmClient.norm(s.url) === LlmClient.norm(url));
    return hit ? hit.name : LlmClient.norm(url).replace(/^https?:\/\//, "").replace(/\/v1$/, "");
  }

  static async detect(cfg = {}) {
    const servers = USER_SETTINGS.llm.servers.map((s) => ({ ...s, url: LlmClient.norm(s.url) }));
    const current = LlmClient.norm(cfg.url);
    if (current && !servers.some((s) => s.url === current)) servers.push({ name: "手入力のURL", url: current });
    const results = await Promise.all(servers.map(async (server) => {
      const state = await Net.probe(`${server.url}/models`);
      if (state !== "ok" && state !== "cors") return null;
      const models = state === "ok" ? await new LlmClient({ ...cfg, url: server.url }).listModels().catch(() => []) : [];
      return { ...server, state, models };
    }));
    return results.filter(Boolean);
  }

  async chat(system, userText, images, signal, { followUps = [], noThink = false } = {}) {
    const max = USER_SETTINGS.stall.retries;
    const min = Math.round(USER_SETTINGS.llm.timeoutMs / 60000);
    for (let k = 0; ; k++) {
      const idle = Deadline.idle(signal, USER_SETTINGS.llm.timeoutMs);
      try {
        return await this.chatOnce(system, userText, images, idle, { followUps, noThink });
      } catch (err) {
        if (!idle.timedOut) throw err;
        if (k >= max) throw new UserError(fmt(M.llmStalledFailed, { min, max }));
        LlmClient.onStall?.(fmt(M.llmStalled, { min, k: k + 1, max }));
        await sleep(USER_SETTINGS.llm.retryWaitMs);
      } finally {
        idle.stop();
      }
    }
  }

  body(system, userText, images, { followUps, noThink, stream, extras }) {
    const text = noThink ? userText + USER_SETTINGS.llm.noThinkSuffix : userText;
    const content = images?.length ? [{ type: "text", text }, ...images.map((url) => ({ type: "image_url", image_url: { url } }))] : text;
    return {
      model: this.cfg.model, temperature: Number(this.cfg.temperature), max_tokens: Number(this.cfg.maxTokens),
      messages: [{ role: "system", content: system }, { role: "user", content }, ...followUps],
      ...(stream ? { stream: true } : {}),
      ...(noThink && extras ? USER_SETTINGS.llm.noThinkExtras : {}),
    };
  }

  async chatOnce(system, userText, images, idle, { followUps, noThink }) {
    const stream = USER_SETTINGS.llm.stream && !LlmClient.noStream;
    const extras = !LlmClient.noExtras;
    const send = (opts) => fetch(`${this.base}/chat/completions`, {
      method: "POST", headers: this.headers(), signal: idle.signal,
      body: JSON.stringify(this.body(system, userText, images, { followUps, noThink, ...opts })),
    });
    const started = performance.now();
    const waitTimer = setInterval(() => LlmClient.onProgress?.(fmt(M.llmWaitingFirst, { sec: Math.round((performance.now() - started) / 1000) })), USER_SETTINGS.llm.progressEveryMs * 5);
    let res;
    try {
      res = await send({ stream, extras });
      if (res.status === 400 && (noThink && extras)) {
        LlmClient.noExtras = true;
        res = await send({ stream, extras: false });
      }
      if (res.status === 400 && stream) {
        LlmClient.noStream = true;
        res = await send({ stream: false, extras: extras && !LlmClient.noExtras });
      }
    } finally {
      clearInterval(waitTimer);
    }
    idle.touch();
    if (!res.ok) throw new Error(fmt(M.llmError, { status: res.status, text: (await res.text()).slice(0, 400) }));
    const type = res.headers.get("content-type") || "";
    const out = type.includes("text/event-stream") ? await this.readStream(res, idle) : this.readJson(await res.json());
    return this.finish(out);
  }

  static serverError(json) {
    return new UserError(fmt(M.llmServerError, { err: typeof json.error === "string" ? json.error : json.error.message || JSON.stringify(json.error) }));
  }

  readJson(json) {
    if (json?.error) throw LlmClient.serverError(json);
    const choice = json?.choices?.[0] || {};
    const msg = choice.message || {};
    return { content: msg.content || "", reasoning: msg.reasoning_content || msg.reasoning || "", finish: choice.finish_reason || "" };
  }

  async readStream(res, idle) {
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "", content = "", reasoning = "", finish = "", last = 0;
    const report = () => {
      const now = performance.now();
      if (now - last < USER_SETTINGS.llm.progressEveryMs) return;
      last = now;
      LlmClient.onProgress?.(fmt(M.llmReceiving, { think: reasoning.length + (content.match(/<think>[\s\S]*?(<\/think>|$)/)?.[0].length || 0), answer: content.replace(/<think>[\s\S]*?(<\/think>|$)/g, "").length }));
    };
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      idle.touch();
      buf += dec.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, nl).trim();
        buf = buf.slice(nl + 1);
        if (!line.startsWith("data:")) continue;
        const data = line.slice(5).trim();
        if (data === "[DONE]") continue;
        let json;
        try { json = JSON.parse(data); } catch { continue; }
        if (json.error) throw LlmClient.serverError(json);
        const choice = json.choices?.[0] || {};
        const d = choice.delta || choice.message || {};
        if (d.content) content += d.content;
        if (d.reasoning_content) reasoning += d.reasoning_content;
        else if (d.reasoning) reasoning += d.reasoning;
        if (choice.finish_reason) finish = choice.finish_reason;
        report();
      }
    }
    return { content, reasoning, finish };
  }

  finish({ content, reasoning, finish }) {
    const raw = content || "";
    let text = raw.replace(/<think>[\s\S]*?<\/think>/g, "");
    if (text.includes("</think>")) text = text.split("</think>").pop();
    if (/<think>/.test(text) && !/<\/think>/.test(text)) text = text.replace(/<think>[\s\S]*$/, "");
    const answered = !!text.trim();
    if (!answered) text = reasoning || "";
    return { text: text.trim(), raw, finish, thinkingOnly: !answered && (!!reasoning || /<think>/.test(raw)) };
  }

  async askJson(system, userText, images, signal, accept, badMessage) {
    const tryRead = (reply) => {
      for (const obj of LooseJson.candidates(reply.text, { allowClose: reply.finish !== "length" })) {
        try { return { ok: true, value: accept(obj) }; } catch {}
      }
      return { ok: false };
    };
    let reply = await this.chat(system, userText, images, signal);
    let got = tryRead(reply);
    if (got.ok) return got.value;
    let noThink = false;
    for (let attempt = 0; attempt < USER_SETTINGS.llm.jsonRetries; attempt++) {
      if (reply.thinkingOnly || !reply.text) {
        noThink = true;
        LlmClient.onStall?.(M.llmNoThinkRetry);
        reply = await this.chat(system, userText, images, signal, { noThink });
      } else {
        reply = await this.chat(system, userText, images, signal, {
          noThink,
          followUps: [
            { role: "assistant", content: reply.text.slice(0, 4000) },
            { role: "user", content: USER_SETTINGS.llm.retryPrompt },
          ],
        });
      }
      got = tryRead(reply);
      if (got.ok) return got.value;
    }
    const head = reply.text.replace(/\s+/g, " ").slice(0, USER_SETTINGS.llm.excerptChars);
    const why = reply.thinkingOnly && reply.finish === "length" ? M.llmThinkingOnly + M.llmTruncated : reply.finish === "length" ? M.llmTruncated : "";
    throw new UserError(`${badMessage}${why}${head ? fmt(M.llmReplyHead, { head }) : M.llmEmptyReply}`);
  }
}

// ===== TOLERANT JSON (LLM REPLIES) =====
class LooseJson {
  static objectsIn(text) {
    const out = [];
    for (let start = text.indexOf("{"); start >= 0; start = text.indexOf("{", start + 1)) {
      let depth = 0, inStr = false, quote = "", escd = false, end = -1;
      for (let i = start; i < text.length; i++) {
        const ch = text[i];
        if (inStr) {
          if (escd) escd = false;
          else if (ch === "\\") escd = true;
          else if (ch === quote) inStr = false;
          continue;
        }
        if (ch === '"') { inStr = true; quote = ch; continue; }
        if (ch === "{") depth++;
        else if (ch === "}" && --depth === 0) { end = i; break; }
      }
      out.push(end >= 0 ? text.slice(start, end + 1) : text.slice(start));
      if (end < 0) break;
    }
    return out;
  }

  static repair(s) {
    let t = s.replace(/[“”„″]/g, '"').replace(/[‘’]/g, "'").replace(/：/g, ":").replace(/，(?=\s*")/g, ",");
    t = t.replace(/,\s*([}\]])/g, "$1");
    if (!t.includes('"') && t.includes("'")) t = t.replace(/'/g, '"');
    t = t.replace(/([{,]\s*)([A-Za-z_][\w-]*)\s*:/g, '$1"$2":');
    return t;
  }

  static close(s) {
    let inStr = false, escd = false;
    const stack = [];
    for (const ch of s) {
      if (inStr) { if (escd) escd = false; else if (ch === "\\") escd = true; else if (ch === '"') inStr = false; continue; }
      if (ch === '"') inStr = true;
      else if (ch === "{" || ch === "[") stack.push(ch);
      else if (ch === "}" || ch === "]") stack.pop();
    }
    let t = s.replace(/,\s*$/, "");
    if (inStr) t += '"';
    t = t.replace(/,\s*"[^"]*"?\s*:?\s*$/, "");
    return t + stack.reverse().map((c) => (c === "{" ? "}" : "]")).join("");
  }

  static candidates(text, { allowClose = true } = {}) {
    const cleaned = String(text || "").replace(/```(?:json)?/gi, "").replace(/[“”„″]/g, '"');
    const found = [];
    for (const chunk of this.objectsIn(cleaned).reverse()) {
      const attempts = [chunk, this.repair(chunk)];
      if (allowClose) attempts.push(this.close(this.repair(chunk)));
      for (const attempt of attempts) {
        try {
          const obj = JSON.parse(attempt);
          if (obj && typeof obj === "object" && !Array.isArray(obj)) { found.push(obj); break; }
        } catch {}
      }
    }
    return found;
  }
}

// ===== ZIP (STORED, NO COMPRESSION) =====
class ZipWriter {
  static crcTable = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
      t[n] = c >>> 0;
    }
    return t;
  })();

  static crc32(bytes) {
    let c = 0xffffffff;
    for (const b of bytes) c = this.crcTable[(c ^ b) & 0xff] ^ (c >>> 8);
    return (c ^ 0xffffffff) >>> 0;
  }

  static dosTime(d) {
    return {
      time: (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1),
      date: ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate(),
    };
  }

  static build(files) {
    const enc = new TextEncoder();
    const { time, date } = this.dosTime(new Date());
    const parts = [], central = [];
    let offset = 0;
    for (const f of files) {
      const name = enc.encode(f.path);
      const data = typeof f.data === "string" ? enc.encode(f.data) : f.data;
      const crc = this.crc32(data);
      const local = new DataView(new ArrayBuffer(30));
      [[0, 0x04034b50, 4], [4, 20, 2], [6, 0x0800, 2], [8, 0, 2], [10, time, 2], [12, date, 2], [14, crc, 4], [18, data.length, 4], [22, data.length, 4], [26, name.length, 2], [28, 0, 2]]
        .forEach(([o, v, n]) => (n === 4 ? local.setUint32(o, v, true) : local.setUint16(o, v, true)));
      const dir = new DataView(new ArrayBuffer(46));
      [[0, 0x02014b50, 4], [4, 20, 2], [6, 20, 2], [8, 0x0800, 2], [10, 0, 2], [12, time, 2], [14, date, 2], [16, crc, 4], [20, data.length, 4], [24, data.length, 4], [28, name.length, 2], [30, 0, 2], [32, 0, 2], [34, 0, 2], [36, 0, 2], [38, 0, 4], [42, offset, 4]]
        .forEach(([o, v, n]) => (n === 4 ? dir.setUint32(o, v, true) : dir.setUint16(o, v, true)));
      parts.push(local, name, data);
      central.push(dir, name);
      offset += 30 + name.length + data.length;
    }
    const size = central.reduce((s, p) => s + p.byteLength, 0);
    const end = new DataView(new ArrayBuffer(22));
    [[0, 0x06054b50, 4], [4, 0, 2], [6, 0, 2], [8, files.length, 2], [10, files.length, 2], [12, size, 4], [16, offset, 4], [20, 0, 2]]
      .forEach(([o, v, n]) => (n === 4 ? end.setUint32(o, v, true) : end.setUint16(o, v, true)));
    return new Blob([...parts, ...central, end], { type: "application/zip" });
  }
}

// ===== PNG TEXT CHUNK WRITER =====
class PngText {
  static isPng(bytes) {
    return [137, 80, 78, 71, 13, 10, 26, 10].every((b, i) => bytes[i] === b);
  }

  static chunk(type, data) {
    const out = new Uint8Array(12 + data.length);
    const view = new DataView(out.buffer);
    view.setUint32(0, data.length);
    out.set([...type].map((c) => c.charCodeAt(0)), 4);
    out.set(data, 8);
    view.setUint32(8 + data.length, ZipWriter.crc32(out.subarray(4, 8 + data.length)));
    return out;
  }

  static withText(bytes, key, text) {
    const enc = new TextEncoder();
    const keyBytes = enc.encode(key);
    const body = enc.encode(text);
    const data = new Uint8Array(keyBytes.length + 5 + body.length);
    data.set(keyBytes, 0);
    data.set(body, keyBytes.length + 5);
    const itxt = this.chunk("iTXt", data);
    const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    const parts = [bytes.subarray(0, 8)];
    let pos = 8, inserted = false;
    while (pos + 8 <= bytes.length) {
      const length = view.getUint32(pos);
      const type = String.fromCharCode(...bytes.subarray(pos + 4, pos + 8));
      const whole = bytes.subarray(pos, pos + 12 + length);
      const isText = type === "tEXt" || type === "iTXt" || type === "zTXt";
      const sameKey = isText && latin1(bytes.subarray(pos + 8, pos + 8 + Math.min(length, 80))).split("\u0000")[0] === key;
      if (!sameKey) parts.push(whole);
      if (type === "IHDR" && !inserted) { parts.push(itxt); inserted = true; }
      if (type === "IEND") break;
      pos += 12 + length;
    }
    const total = parts.reduce((n, p) => n + p.length, 0);
    const out = new Uint8Array(total);
    let off = 0;
    for (const p of parts) { out.set(p, off); off += p.length; }
    return out;
  }
}

// ===== GENERATION INFO (A1111 "parameters" TEXT) =====
class Infotext {
  static displayName(name) {
    return String(name || "").replace(/\s*\[[0-9a-f]+\]$/i, "").split(/[\\/]/).pop().replace(/\.(safetensors|ckpt|pt|pth|bin|gguf|sft)$/i, "").trim();
  }

  static value(v) {
    const s = String(v);
    return /[,:"\n]/.test(s) ? JSON.stringify(s) : s;
  }

  static build(img, common) {
    const s = img.settings || {};
    const lines = [img.prompt];
    if ((img.negative || "").trim()) lines.push(`Negative prompt: ${img.negative.trim()}`);
    const params = [
      ["Steps", s.steps], ["Sampler", s.sampler], ["Schedule type", s.scheduler], ["CFG scale", s.cfg],
      ["Seed", img.seed], ["Size", `${img.width}x${img.height}`],
      ["Model", this.displayName(common.model) || null], ["VAE", USER_SETTINGS.autoValues.includes(common.vae || "") ? null : this.displayName(common.vae)],
      ["Clip skip", Number(s.clipSkip) > 1 ? s.clipSkip : null],
    ].filter(([, v]) => v !== null && v !== undefined && v !== "");
    lines.push(params.map(([k, v]) => `${k}: ${this.value(v)}`).join(", "));
    return lines.join("\n");
  }
}

// ===== METADATA (GENERATION INFO IN PNG / JPEG / WEBP) =====
class MetaReader {
  static async read(file) {
    const buffer = await file.arrayBuffer();
    let meta = null;
    const chunks = await this.pngChunks(buffer);
    if (typeof chunks.parameters === "string") meta = { ...PromptParser.parseA1111(chunks.parameters), raw: chunks.parameters };
    else if (typeof chunks.prompt === "string") {
      try { meta = PromptParser.parseComfy(JSON.parse(chunks.prompt)); } catch {}
    }
    if (!meta) {
      const text = this.userComment(new Uint8Array(buffer));
      if (text) meta = { ...PromptParser.parseA1111(text), raw: text };
    }
    return meta || PromptParser.empty();
  }

  static async pngChunks(buffer) {
    const bytes = new Uint8Array(buffer);
    if (!PngText.isPng(bytes)) return {};
    const view = new DataView(buffer);
    const out = {};
    let pos = 8;
    while (pos + 8 <= bytes.length) {
      const length = view.getUint32(pos);
      const type = String.fromCharCode(...bytes.subarray(pos + 4, pos + 8));
      const data = bytes.subarray(pos + 8, pos + 8 + length);
      if (type === "tEXt" || type === "zTXt" || type === "iTXt") {
        const entry = await this.decodeChunk(type, data);
        if (entry) out[entry.key] = entry.text;
      }
      if (type === "IEND") break;
      pos += 12 + length;
    }
    return out;
  }

  static async decodeChunk(type, data) {
    const nul = data.indexOf(0);
    if (nul < 0) return null;
    const key = latin1(data.subarray(0, nul));
    if (type === "tEXt") return { key, text: new TextDecoder("utf-8").decode(data.subarray(nul + 1)) };
    if (type === "zTXt") return { key, text: new TextDecoder("utf-8").decode(await this.inflate(data.subarray(nul + 2))) };
    const compressed = data[nul + 1] === 1;
    let p = nul + 3;
    p = data.indexOf(0, p) + 1;
    p = data.indexOf(0, p) + 1;
    const body = data.subarray(p);
    return { key, text: new TextDecoder("utf-8").decode(compressed ? await this.inflate(body) : body) };
  }

  static async inflate(bytes) {
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate"));
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }

  static userComment(bytes) {
    const marker = [0x55, 0x4e, 0x49, 0x43, 0x4f, 0x44, 0x45, 0x00];
    for (let i = 0; i + marker.length < bytes.length; i++) {
      if (!marker.every((b, k) => bytes[i + k] === b)) continue;
      const body = bytes.subarray(i + marker.length, Math.min(bytes.length, i + marker.length + 131072));
      for (const enc of ["utf-16be", "utf-16le"]) {
        const text = new TextDecoder(enc).decode(body).split("\u0000")[0];
        if (/Steps:/.test(text)) return text;
      }
    }
    return null;
  }
}

class PromptParser {
  static empty() {
    return { format: "none", prompt: "", negative: "", seed: null, model: "", vae: "", loras: [], settings: {}, width: null, height: null, raw: "" };
  }

  static parseA1111(raw) {
    const meta = this.empty();
    meta.format = "a1111";
    const lines = raw.trim().split("\n");
    let settingsIdx = -1;
    for (let i = lines.length - 1; i >= 0; i--) if (lines[i].startsWith("Steps:")) { settingsIdx = i; break; }
    const body = settingsIdx >= 0 ? lines.slice(0, settingsIdx) : lines;
    const prompt = [], negative = [];
    let inNeg = false;
    for (let line of body) {
      if (line.startsWith("Negative prompt:")) { inNeg = true; line = line.slice("Negative prompt:".length).trim(); }
      (inNeg ? negative : prompt).push(line);
    }
    const extra = {};
    const re = /\s*([\w ]+):\s*("(?:\\.|[^\\"])+"|[^,]*)(?:,|$)/g;
    for (const m of (settingsIdx >= 0 ? lines[settingsIdx] : "").matchAll(re)) {
      let v = m[2].trim();
      if (v.startsWith('"') && v.endsWith('"')) v = v.slice(1, -1);
      if (m[1].trim()) extra[m[1].trim()] = v;
    }
    const { text, loras } = LoraTags.extract(prompt.join("\n").trim());
    meta.prompt = text;
    meta.loras = loras;
    meta.negative = negative.join("\n").trim();
    meta.seed = /^-?\d+$/.test(extra.Seed || "") ? Number(extra.Seed) : null;
    meta.model = extra.Model || "";
    meta.vae = extra.VAE || "";
    if (extra.Size) [meta.width, meta.height] = extra.Size.split("x").map(Number);
    const s = meta.settings;
    let sampler = extra.Sampler || "";
    let scheduler = extra["Schedule type"] || "";
    const combined = sampler.match(USER_SETTINGS.combinedScheduler);
    if (combined && !scheduler) { scheduler = combined[1]; sampler = sampler.replace(USER_SETTINGS.combinedScheduler, ""); }
    if (sampler) s.sampler = sampler;
    if (scheduler) s.scheduler = scheduler;
    if (extra.Steps) s.steps = Number(extra.Steps);
    if (extra["CFG scale"]) s.cfg = Number(extra["CFG scale"]);
    if (extra["Clip skip"]) s.clipSkip = Number(extra["Clip skip"]);
    return meta;
  }

  static parseComfy(nodes) {
    const meta = this.empty();
    meta.format = "comfyui";
    const isLink = (v) => Array.isArray(v) && v.length === 2 && String(v[0]) in nodes;
    const textKeys = ["text", "text_g", "text_l", "string", "value", "prompt"];
    const collect = (id, depth = 0, seen = new Set()) => {
      if (depth > 10 || seen.has(id) || !(id in nodes)) return [];
      seen.add(id);
      const out = [];
      for (const [k, v] of Object.entries(nodes[id].inputs || {})) {
        if (textKeys.includes(k) && typeof v === "string" && v.trim()) out.push(v.trim());
        else if (isLink(v)) out.push(...collect(String(v[0]), depth + 1, seen));
      }
      return out;
    };
    for (const node of Object.values(nodes)) {
      const inp = node.inputs || {};
      if (isLink(inp.positive) && isLink(inp.negative) && !meta.prompt) {
        meta.prompt = collect(String(inp.positive[0])).join(", ");
        meta.negative = collect(String(inp.negative[0])).join(", ");
        const seed = inp.seed ?? inp.noise_seed;
        if (Number.isInteger(seed)) meta.seed = seed;
        if (typeof inp.sampler_name === "string") meta.settings.sampler = inp.sampler_name;
        if (typeof inp.scheduler === "string") meta.settings.scheduler = inp.scheduler;
        if (typeof inp.steps === "number") meta.settings.steps = inp.steps;
        if (typeof inp.cfg === "number") meta.settings.cfg = inp.cfg;
      }
      if (typeof inp.ckpt_name === "string" && !meta.model) meta.model = inp.ckpt_name;
      if (typeof inp.vae_name === "string" && !meta.vae) meta.vae = inp.vae_name;
      if (typeof inp.lora_name === "string") meta.loras.push({ name: inp.lora_name, weight: Number(inp.strength_model ?? 1) });
      for (const v of Object.values(inp)) {
        if (v && typeof v === "object" && !Array.isArray(v) && typeof v.lora === "string" && v.on !== false) meta.loras.push({ name: v.lora, weight: Number(v.strength ?? 1) });
      }
      if (typeof inp.stop_at_clip_layer === "number") meta.settings.clipSkip = Math.abs(inp.stop_at_clip_layer);
      if (Number.isInteger(inp.width) && Number.isInteger(inp.height) && !meta.width) { meta.width = inp.width; meta.height = inp.height; }
    }
    const { text, loras } = LoraTags.extract(meta.prompt);
    meta.prompt = text;
    meta.loras.push(...loras);
    return meta;
  }
}

// ===== BASE IMAGE (FAVORITE IMAGE -> COMMON SETTINGS) =====
class BaseImage {
  static async read(file) {
    const meta = await MetaReader.read(file);
    let thumb = "";
    try {
      const canvas = await scaledImage(file, USER_SETTINGS.baseThumbSide);
      thumb = canvas.toDataURL("image/jpeg", USER_SETTINGS.thumbQuality);
    } catch {}
    const { quality, rest } = this.split(meta.prompt);
    return {
      name: file.name, thumb, format: meta.format, raw: meta.raw || "", fullPrompt: meta.prompt, quality, prompt: rest,
      negative: meta.negative, seed: meta.seed, model: meta.model, vae: meta.vae, loras: meta.loras, settings: meta.settings,
      width: meta.width, height: meta.height, useSeed: false,
    };
  }

  static split(prompt) {
    const parts = String(prompt || "").split(",").map((t) => t.trim()).filter(Boolean);
    const quality = parts.filter((t) => USER_SETTINGS.qualityTags.test(t));
    const rest = parts.filter((t) => !USER_SETTINGS.qualityTags.test(t));
    return { quality: quality.join(", "), rest: rest.join(", ") };
  }

  static match(name, list) {
    if (!name || !list?.length) return name || "";
    const key = (n) => Infotext.displayName(n).toLowerCase();
    return list.find((x) => x === name) || list.find((x) => key(x) === key(name)) || name;
  }

  static samplerFor(backendKind, name, list) {
    if (!name) return name;
    const map = USER_SETTINGS.comfy.samplerMap;
    if (backendKind === "comfy") return map[name] || name;
    const back = Object.entries(map).find(([, v]) => v === name)?.[0];
    const value = back || name;
    return list?.length ? (list.find((x) => x.toLowerCase() === value.toLowerCase()) || value) : value;
  }

  static schedulerFor(backendKind, name, list) {
    if (!name) return name;
    const map = USER_SETTINGS.comfy.schedulerMap;
    if (backendKind === "comfy") return map[name] || name.toLowerCase();
    const back = Object.entries(map).find(([k, v]) => v === name && k !== "Automatic")?.[0];
    const value = back || name;
    return list?.length ? (list.find((x) => x.toLowerCase() === value.toLowerCase()) || value) : value;
  }

  static apply(doc, base, { res = {}, backendKind = "a1111" } = {}) {
    const c = doc.common;
    const s = c.settings;
    const used = [];
    const set = (key, fn) => { fn(); used.push(L.baseKeys[key]); };
    if (base.quality) set("quality", () => { c.quality = base.quality; });
    if (base.negative) set("negative", () => { c.negative = base.negative; });
    if (base.model) set("model", () => { c.model = this.match(base.model, res.models); });
    if (base.vae && !USER_SETTINGS.autoValues.includes(base.vae)) set("vae", () => { c.vae = this.match(base.vae, res.vaes); });
    const bs = base.settings || {};
    if (bs.sampler) set("sampler", () => { s.sampler = this.samplerFor(backendKind, bs.sampler, res.samplers); });
    if (bs.scheduler) set("scheduler", () => { s.scheduler = this.schedulerFor(backendKind, bs.scheduler, res.schedulers); });
    if (Number(bs.steps) > 0) set("steps", () => { s.steps = clamp(Number(bs.steps), USER_SETTINGS.limits.steps); });
    if (Number(bs.cfg) > 0) set("cfg", () => { s.cfg = clamp(Number(bs.cfg), USER_SETTINGS.limits.cfg); });
    if (Number(bs.clipSkip) > 0) set("clipSkip", () => { s.clipSkip = clamp(Number(bs.clipSkip), USER_SETTINGS.limits.clipSkip); });
    if (Number(base.width) > 0 && Number(base.height) > 0) set("size", () => { c.width = clamp(Number(base.width), USER_SETTINGS.limits.side); c.height = clamp(Number(base.height), USER_SETTINGS.limits.side); });
    if (base.loras?.length) set("loras", () => {
      const keep = LoraTags.extract(c.suffix).text;
      c.suffix = PromptBuilder.tidy([keep, ...base.loras.map((l) => LoraTags.tag(l.name, l.weight))]);
    });
    if (base.useSeed && Number.isInteger(base.seed) && base.seed >= 0) set("seed", () => { s.seed = base.seed; });
    return used;
  }

  static shareInfo(base) {
    if (!base) return null;
    return { raw: base.raw || "", prompt: base.fullPrompt || "", seed: base.seed ?? null };
  }
}

// ===== LORA TAGS (<lora:name:weight> IN PROMPTS) =====
class LoraTags {
  static regex() {
    return new RegExp(USER_SETTINGS.loraPattern.source, "gi");
  }

  static extract(prompt) {
    const loras = [];
    const text = String(prompt || "").replace(this.regex(), (m, name, weight) => {
      loras.push({ name: name.trim(), weight: weight === undefined ? 1 : Number(weight) });
      return "";
    });
    return { text: PromptBuilder.tidy([text]), loras };
  }

  static base(name) {
    return String(name).split(/[\\/]/).pop().replace(USER_SETTINGS.loraExtensions, "").toLowerCase();
  }

  static resolve(name, available) {
    const exact = available.find((a) => a === name);
    if (exact) return exact;
    const hit = available.find((a) => this.base(a) === this.base(name));
    if (hit) return hit;
    return USER_SETTINGS.loraExtensions.test(name) ? name : name + USER_SETTINGS.loraDefaultExtension;
  }

  static tag(name, weight = 1) {
    return `<lora:${Infotext.displayName(name)}:${weight}>`;
  }
}

// ===== PROMPT BUILDER (COMMON + CAST + SCENE + LOCATION) =====
class PromptBuilder {
  static tidy(parts) {
    return parts.map((p) => String(p || "").trim()).filter(Boolean).join(", ")
      .replace(/\s*,\s*(?:,\s*)+/g, ", ").replace(/^\s*,\s*|\s*,\s*$/g, "").replace(/[ \t]{2,}/g, " ").trim();
  }

  static castOf(doc, scene) {
    return (scene.cast || []).map((id) => doc.cast.find((c) => c.id === id)).filter(Boolean);
  }

  static build(doc, scene) {
    const c = doc.common;
    const loc = doc.locations.find((l) => l.id === scene.location);
    return {
      prompt: this.tidy([c.quality, scene.count, ...this.castOf(doc, scene).map((p) => p.prompt), scene.prompt, loc?.prompt, c.suffix]),
      negative: this.tidy([c.negative, scene.negative]),
    };
  }
}

// ===== DOCUMENT (SETTINGS JSON) =====
class Doc {
  static create() {
    return clone(USER_SETTINGS.defaultDoc);
  }

  static newScene(fields = {}) {
    return { ...clone(USER_SETTINGS.defaultScene), ...fields, id: "s" + uid() };
  }

  static normalize(src) {
    const base = this.create();
    const d = src && typeof src === "object" ? src : {};
    const out = { ...base, ...this.pickStrings(d, ["title", "synopsis", "brief"]) };
    out.base = d.base && typeof d.base === "object" ? clone(d.base) : null;
    if (Number.isFinite(Number(d.sceneCount))) out.sceneCount = clamp(Math.round(Number(d.sceneCount)), USER_SETTINGS.limits.sceneCount);
    out.common = { ...base.common, ...(d.common || {}), settings: { ...base.common.settings, ...(d.common?.settings || {}) } };
    out.run = { ...base.run, ...(d.run || {}) };
    out.cast = Array.isArray(d.cast) ? d.cast.map((c) => this.person(c)) : base.cast;
    out.locations = Array.isArray(d.locations) ? d.locations.map((l) => this.person(l, "l")) : [];
    const castIds = new Set(out.cast.map((c) => c.id));
    const locIds = new Set(out.locations.map((l) => l.id));
    out.scenes = Array.isArray(d.scenes) ? d.scenes.map((s) => {
      const sc = { ...clone(USER_SETTINGS.defaultScene), ...this.pickStrings(s || {}, ["title", "text", "count", "prompt", "negative", "location"]) };
      sc.id = typeof s?.id === "string" && s.id ? s.id : "s" + uid();
      sc.cast = Array.isArray(s?.cast) ? s.cast.filter((id) => castIds.has(id)) : [];
      if (!locIds.has(sc.location)) sc.location = "";
      sc.perScene = Number(s?.perScene) > 0 ? Math.round(Number(s.perScene)) : null;
      const side = (v) => (Number(v) > 0 ? clamp(Math.round(Number(v)), USER_SETTINGS.limits.side) : null);
      sc.width = side(s?.width);
      sc.height = side(s?.height);
      if (!sc.width || !sc.height) { sc.width = null; sc.height = null; }
      sc.seed = s?.seed !== null && s?.seed !== undefined && s?.seed !== "" && Number.isFinite(Number(s.seed)) ? clamp(Math.round(Number(s.seed)), [-1, USER_SETTINGS.seedMax]) : null;
      return sc;
    }) : [];
    return out;
  }

  static pickStrings(src, keys) {
    return Object.fromEntries(keys.filter((k) => typeof src[k] === "string").map((k) => [k, src[k]]));
  }

  static person(p, prefix = "c") {
    const o = p && typeof p === "object" ? p : {};
    return { id: typeof o.id === "string" && o.id ? o.id : prefix + uid(), name: String(o.name || ""), prompt: String(o.prompt || ""), note: String(o.note || "") };
  }

  static serialize(doc) {
    return { format: USER_SETTINGS.projectFormat, version: USER_SETTINGS.projectVersion, app: USER_SETTINGS.appName, savedAt: new Date().toISOString(), ...clone(doc) };
  }

  static isProject(obj) {
    return obj && typeof obj === "object" && [USER_SETTINGS.projectFormat, USER_SETTINGS.castFormat, USER_SETTINGS.situationFormat].includes(obj.format);
  }

  static situationFile(doc) {
    const slot = (id) => doc.cast.findIndex((c) => c.id === id);
    const locs = doc.locations.map(({ id, name, prompt, note }) => ({ id, name, prompt, note }));
    return {
      format: USER_SETTINGS.situationFormat, version: USER_SETTINGS.projectVersion, app: USER_SETTINGS.appName, savedAt: new Date().toISOString(),
      title: doc.title, synopsis: doc.synopsis, brief: doc.brief, sceneCount: doc.sceneCount, run: clone(doc.run), locations: locs,
      castSlots: doc.cast.length,
      scenes: doc.scenes.map(({ id, cast, ...rest }) => ({ ...clone(rest), castSlots: cast.map(slot).filter((i) => i >= 0) })),
    };
  }

  static loadSituation(doc, sit) {
    const slots = (sit.scenes || []).flatMap((s) => (Array.isArray(s?.castSlots) ? s.castSlots : [])).map(Number).filter((n) => Number.isInteger(n) && n >= 0);
    const need = Math.max(Number(sit.castSlots) || 0, slots.length ? Math.max(...slots) + 1 : 0);
    while (doc.cast.length < need) doc.cast.push(this.person({}, "c"));
    const mapped = {
      ...this.serialize(doc), ...this.pickStrings(sit, ["title", "synopsis", "brief"]),
      sceneCount: sit.sceneCount ?? doc.sceneCount,
      run: { ...doc.run, ...(sit.run || {}) },
      locations: Array.isArray(sit.locations) ? sit.locations : [],
      scenes: (Array.isArray(sit.scenes) ? sit.scenes : []).map((s) => ({
        ...s, id: undefined,
        cast: (Array.isArray(s?.castSlots) ? s.castSlots : []).map((i) => doc.cast[Number(i)]?.id).filter(Boolean),
      })),
    };
    return this.normalize(mapped);
  }

  static castFile(doc) {
    return { format: USER_SETTINGS.castFormat, version: USER_SETTINGS.projectVersion, cast: doc.cast.map(({ name, prompt, note }) => ({ name, prompt, note })) };
  }

  static swapCast(doc, incoming) {
    const list = (Array.isArray(incoming) ? incoming : []).map((c) => this.person(c));
    list.forEach((c, i) => {
      if (i < doc.cast.length) Object.assign(doc.cast[i], { name: c.name, prompt: c.prompt, note: c.note });
      else doc.cast.push({ ...c, id: "c" + uid() });
    });
    return list.length;
  }

  static perScene(doc, scene) {
    return clamp(Math.round(Number(scene.perScene) || Number(doc.run.perScene) || 1), USER_SETTINGS.limits.perScene);
  }
}

// ===== SETTINGS STORE (CONNECTIONS, KEPT IN THIS BROWSER) =====
