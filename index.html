    const previewDetails = h("details", { class: "preview-details", open: !!scene.customPrompt, ontoggle: () => AutoGrow.fitAll(preview) }, previewSummary, preview);
    // 登場人物: 1人ずつ区切り、出るかどうかと、要素（名前・作品 / 身体 / 服装）ごとに使うかを切り替える。出ないときは要素も使わない
    const castBox = h("div", { class: "cast-checks" }, ...doc.cast.map((c, i) => {
      const on = scene.cast.includes(c.id);
      const cb = h("input", { type: "checkbox", checked: on, "data-cast": c.id });
      const parts = USER_SETTINGS.castParts.map((k) => {
        const pc = h("input", { type: "checkbox", checked: on && Doc.partOn(scene, c.id, k), disabled: !on, "data-part": k });
        pc.addEventListener("change", () => {
          scene.castParts = { ...scene.castParts, [c.id]: { ...(scene.castParts?.[c.id] || {}), [k]: pc.checked } };
          changed();
        });
        return h("label", { class: "check part", title: `${L.castPartNames[k]}: ${c[k] || L.castPartEmpty}` }, pc, L.castPartShort[k]);
      });
      const block = h("div", { class: `cast-block${on ? " on" : ""}` },
        h("label", { class: "check cast-who" }, cb, h("span", { class: "tag", text: letter(i) }), c.name || L.castUnnamed),
        h("div", { class: "cast-parts" }, ...parts));
      cb.addEventListener("change", () => {
        scene.cast = doc.cast.map((x) => x.id).filter((id) => (id === c.id ? cb.checked : scene.cast.includes(id)));
        block.classList.toggle("on", cb.checked);
        for (const el of block.querySelectorAll("[data-part]")) {
          el.disabled = !cb.checked;
          el.checked = cb.checked && Doc.partOn(scene, c.id, el.dataset.part);
        }
        changed();
      });
      return block;
    }));
    const locEntries = [["", L.sceneNoLocation], ...doc.locations.map((l, i) => [l.id, `${i + 1}. ${l.name || "—"}`])];
    const countIn = Form.text(scene, "count", changed);
    const promptIn = Form.text(scene, "prompt", changed, { rows: 4, "data-key": "prompt" });
    const rewrite = h("button", { class: "mini", text: L.rewriteScene, title: L.rewriteSceneTitle, onclick: () => app.rewriteScene(scene, { countIn, promptIn }) });
    const el = h("div", { class: "scene", "data-scene": scene.id },
      h("div", { class: "scene-head" },
        h("span", { class: "drag-grip", title: L.dragTitle, "aria-hidden": "true" }),
        h("span", { class: "scene-no", text: pos ? `${pos.group + 1}-${pos.k + 1}` : String(index + 1) }),
        Form.text(scene, "title", () => { app.docChanged(false); app.setStrip.render(); }, { class: "title", placeholder: L.sceneTitle }),
        stat,
        pos && pos.k > 0 ? h("button", { class: "mini quiet", text: NL.groupSplit, onclick: () => app.splitGroup(scene) }) : null,
        h("button", { class: "mini quiet", text: L.duplicate, onclick: () => app.duplicateScene(scene) }),
        h("button", { class: "mini quiet", text: L.clearImages, onclick: () => app.clearScene(scene) }),
        h("button", { class: "mini quiet danger", text: L.remove, onclick: () => app.removeScene(scene) })),
      h("div", { class: "scene-body" },
        h("div", { class: "scene-fields" },
          Form.field(pos ? NL.blockText : L.sceneText, Form.text(scene, "text", () => { changed(); app.setStrip.render(); }, { rows: 2 })),
          Form.field(L.sceneCast, castBox),
          h("div", { class: "grid2" },
            Form.field(L.sceneLocation, Form.select(scene, "location", locEntries, changed)),
            Form.field(L.sceneCountTag, countIn)),
          h("div", { class: "field" }, h("div", { class: "row", style: "justify-content:space-between" }, h("span", { text: L.scenePrompt }), rewrite), promptIn),
          this.extraSection(scene, changed),
          previewDetails,
          h("button", { class: "primary scene-run", text: L.runScene, disabled: app.runner.busy, onclick: () => app.run([scene.id]) })),
        media));
    const nv = pos ? this.novelArea(scene) : null;
    if (nv) el.append(nv.el);
    this.cards.set(scene.id, { el, stat, media, preview, previewLabel, promptIn, lines: nv?.lines, video: nv?.video });
    this.updatePreview(scene.id);
    this.updateImages(scene.id);
    if (nv) { this.updateLines(scene.id); this.paintVideo(scene.id); }
    return el;
  }

  updatePreview(sceneId) {
    const card = this.cards.get(sceneId);
    const doc = this.app.doc;
    const scene = doc.scenes.find((s) => s.id === sceneId);
    if (!card || !scene) return;
    const size = Runner.sizeOf(doc, scene);
    const base = Runner.seedBase(doc, scene);
    const seed = Number(base) >= 0 ? fmt(L.previewSeedFrom, { v: base }) : L.previewSeedRandom;
    const meta = fmt(L.previewMeta, { w: size.width, h: size.height, seed, n: Doc.perScene(doc, scene) });
    card.previewLabel.textContent = scene.customPrompt ? L.previewPromptCustom : L.previewPrompt;
    card.el.classList.toggle("custom-prompt", !!scene.customPrompt);
    // 個別指定の入力中は、打っている欄を作り直さない（上の行だけ更新する）
    const metaEl = card.preview.querySelector(".preview-meta");
    if (scene.customPrompt && card.preview.dataset.mode === "custom" && metaEl) { metaEl.textContent = meta; return; }
    const app = this.app;
    const changed = () => { app.docChanged(false); };
    if (!scene.customPrompt) {
      const p = PromptBuilder.auto(doc, scene);
      card.preview.dataset.mode = "auto";
      card.preview.replaceChildren(h("p", { class: "note", text: L.customPromptOffNote }), h("pre", { class: "preview-prompt" }, h("span", { class: "preview-meta", text: meta }), `\n\n${p.prompt}\n\nNegative: ${p.negative}`));
      return;
    }
    const pos = Form.text(scene, "customText", changed, { rows: 4, "data-key": "customText" });
    const neg = Form.text(scene, "customNegative", changed, { rows: 2, "data-key": "customNegative" });
    const reset = h("button", { class: "mini", text: L.customPromptReset, onclick: () => {
      const auto = PromptBuilder.auto(doc, scene);
      pos.value = auto.prompt;
      neg.value = auto.negative;
      pos.dispatchEvent(new Event("input"));
      neg.dispatchEvent(new Event("input"));
      AutoGrow.fitAll(card.preview);
    } });
    card.preview.dataset.mode = "custom";
    card.preview.replaceChildren(
      h("p", { class: "note", text: L.customPromptNote }),
      h("pre", { class: "preview-prompt preview-meta", text: meta }),
      Form.field(L.customPromptText, pos),
      Form.field(L.customPromptNegative, neg),
      h("div", { class: "row" }, reset));
  }

  updateAllPreviews() {
    for (const id of this.cards.keys()) this.updatePreview(id);
  }

  updateAllImages() {
    for (const id of this.cards.keys()) this.updateImages(id);
  }

  updateImages(sceneId) {
    const card = this.cards.get(sceneId);
    if (!card) return;
    const app = this.app;
    const run = app.doc.run;
    const list = app.images.list(sceneId);
    const picked = app.pickOf(sceneId);
    const c = Judge.counts(list, run);
    const scene = app.doc.scenes.find((s) => s.id === sceneId);
    const total = scene ? Doc.perScene(app.doc, scene) : 0;
    card.stat.innerHTML = fmt(L.statLine, { total: `${c.total}/${total}`, good: c.good, ng: c.ng, pending: c.pending }) + (picked ? esc(fmt(L.statPicked, { n: list.indexOf(picked) + 1 })) : "");
    if (app.doc.mode === "novel") {
      card.media.replaceChildren(this.pickView(sceneId, list, picked),
        h("button", { class: "nv-pick-open", text: list.length ? fmt(NL.pickerOpen, { n: list.length }) : NL.pickerOpenEmpty, onclick: () => app.picker.open(sceneId) }));
      if (app.picker.sceneId === sceneId) app.picker.render();
      return;
    }
    if (!list.length) {
      card.media.replaceChildren(h("div", { class: "thumbs-empty", text: L.noImages }), this.mediaRunButton(sceneId));
      return;
    }
    card.media.replaceChildren(this.thumbs(sceneId, list, picked), this.mediaRunButton(sceneId), this.pickView(sceneId, list, picked));
  }

  thumbs(sceneId, list, picked, onPick = null) {
    const app = this.app;
    const run = app.doc.run;
    return h("div", { class: "thumbs" }, ...list.map((img, i) => {
      const v = Judge.verdict(img, run);
      const badge = img.check?.anatomy ? L.anatomyNg : img.check?.state === "done" ? fmt(L.scorePt, { score: img.check.score }) : img.check?.state === "error" ? "!" : img.manual ? (v ? L.ok : L.ng) : `#${i + 1}`;
      const pinned = app.picks.get(sceneId) === img.id;
      const cls = ["thumb", v === true ? "ok" : v === false ? "ng" : "pending", img === picked ? "picked" : "", pinned ? "pinned" : ""].filter(Boolean).join(" ");
      const select = () => (onPick ? onPick(img.id) : this.selectImage(sceneId, img.id));
      const ck = img.check;
      const tip = [`#${i + 1}`, ck?.state === "done" ? fmt(L.scorePt, { score: ck.score }) : ck?.error, ck?.anatomy ? L.anatomyNg : "", Number.isFinite(ck?.match) ? fmt(L.matchPct, { v: ck.match }) : "", ...(ck?.issues || []), ...(ck?.missing || []), L.thumbHint].filter(Boolean).join("\n");
      return h("div", { class: cls, title: tip, role: "button", tabindex: 0, "data-image": img.id, onclick: select, ondblclick: () => app.viewer.open(sceneId, img.id), onkeydown: (e) => { if (e.target === e.currentTarget && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); select(); } } },
        h("img", { src: img.thumb, alt: "", loading: "lazy" }),
        h("span", { class: `badge ${v === true ? "ok" : v === false ? "ng" : ""}`, text: badge }),
        h("button", { class: "pin", text: "★", title: L.pinTitle, "aria-pressed": String(pinned), disabled: !img.blob, onclick: (e) => { e.stopPropagation(); app.togglePin(sceneId, img.id); app.sceneChanged(sceneId); } }),
        h("button", { class: "del", text: "✕", title: L.thumbDelete, "aria-label": `#${i + 1} ${L.thumbDelete}`, ondblclick: (e) => e.stopPropagation(), onclick: (e) => { e.stopPropagation(); app.deleteImage(sceneId, img.id); } }));
    }));
  }

  // 1列に並ぶとき（狭い画面）だけ出す「このシーンを生成」。サムネイルと大きく出る1枚の間に置く。広いときは入力欄の下のものを使う
  mediaRunButton(sceneId) {
    return h("button", { class: "primary scene-run scene-run-media", text: L.runScene, disabled: this.app.runner.busy, onclick: () => this.app.run([sceneId]) });
  }

  selectImage(sceneId, imageId) {
    const app = this.app;
    const card = this.cards.get(sceneId);
    const list = app.images.list(sceneId);
    if (!card || !list.find((i) => i.id === imageId)?.blob) return;
    app.picks.set(sceneId, imageId);
    const picked = app.pickOf(sceneId);
    const c = Judge.counts(list, app.doc.run);
    const scene = app.doc.scenes.find((s) => s.id === sceneId);
    card.stat.innerHTML = fmt(L.statLine, { total: `${c.total}/${Doc.perScene(app.doc, scene)}`, good: c.good, ng: c.ng, pending: c.pending }) + esc(fmt(L.statPicked, { n: list.indexOf(picked) + 1 }));
    for (const el of card.media.querySelectorAll(".thumb")) {
      const on = el.dataset.image === imageId;
      el.classList.toggle("picked", on);
      el.classList.toggle("pinned", on);
      el.querySelector(".pin")?.setAttribute("aria-pressed", String(on));
    }
    card.media.querySelector(".scene-pick")?.replaceWith(this.pickView(sceneId, list, picked));
    app.setStrip.render();
    if (app.picker.sceneId === sceneId) app.picker.render();
    this.paintVideo(sceneId);
    app.left.paintSteps();
  }

  pickView(sceneId, list, picked) {
    if (!picked) return h("div", { class: "scene-pick" }, h("div", { class: "scene-pick-empty", text: L.pickNone }));
    const app = this.app;
    const score = picked.check?.state === "done" ? fmt(L.scorePt, { score: picked.check.score }) : L.viewerUnchecked;
    const mode = app.picks.get(sceneId) === picked.id ? L.setPinned : L.setAuto;
    return h("div", { class: "scene-pick" },
      h("button", { class: "scene-pick-frame", title: app.doc.mode === "novel" ? NL.pickerOpenEmpty : L.pickOpen, onclick: () => (app.doc.mode === "novel" ? app.picker.open(sceneId) : app.viewer.open(sceneId, picked.id)) }, h("img", { src: picked.url || picked.thumb, alt: "" })),
      h("div", { class: "scene-pick-cap", text: fmt(L.pickCap, { no: list.indexOf(picked) + 1, score, mode }) }));
  }

  setRunning(sceneId) {
    for (const [id, card] of this.cards) card.el.classList.toggle("running", id === sceneId);
    if (sceneId) this.cards.get(sceneId)?.el.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }

  focusScene(sceneId) {
    const card = this.cards.get(sceneId);
    card?.el.scrollIntoView({ block: "center", behavior: "smooth" });
    card?.promptIn.focus();
  }
}

// ===== SET STRIP (THE CHOSEN IMAGE OF EVERY SCENE) =====
class SetStrip {
  constructor(app) {
    this.app = app;
    this.root = $("set-strip");
  }

  destroy() { this.root.replaceChildren(); }

  render() {
    const app = this.app;
    const doc = app.doc;
    if (!doc.scenes.length) { this.root.replaceChildren(); return; }
    const ui = app.store.data.ui;
    const allGood = h("input", { type: "checkbox", checked: !!ui.exportAllGood });
    allGood.addEventListener("change", () => { ui.exportAllGood = allGood.checked; app.store.save(); });
    const items = doc.scenes.map((scene, i) => {
      const list = app.images.list(scene.id);
      const img = app.pickOf(scene.id);
      const pinned = !!img && app.picks.get(scene.id) === img.id;
      const score = img?.check?.state === "done" ? fmt(L.scorePt, { score: img.check.score }) : "";
      const mode = pinned ? L.setPinned : L.setAuto;
      const state = img ? fmt(L.setStatePicked, { no: list.indexOf(img) + 1, score: score || L.viewerUnchecked, mode }) : L.setStateNone;
      const full = fmt(L.setItemTitle, { n: i + 1, title: scene.title || L.sceneTitle, state, text: scene.text || "" }).trim();
      const frame = img
        ? h("button", { class: `frame${pinned ? " pinned" : ""}`, onclick: () => app.viewer.open(scene.id, img.id) }, h("img", { src: img.thumb, alt: "" }))
        : h("div", { class: "frame empty", text: L.setEmpty });
      return h("div", { class: "set-item", "data-scene": scene.id, title: full },
        frame,
        h("span", { class: "cap clip", "data-full": full, html: `<b>#${i + 1}</b> ${esc(scene.title || "")}` }),
        h("span", { class: "cap clip", "data-full": full, text: img ? `#${list.indexOf(img) + 1} ${score} ${mode}`.replace(/\s+/g, " ") : "" }));
    });
    this.root.replaceChildren(h("div", { class: "set-strip" },
      h("div", { class: "set-strip-head" },
        h("h2", { class: "clip", text: doc.mode === "novel" ? NL.setTitle : L.setTitle }),
        doc.mode === "novel" ? null : h("label", { class: "check" }, allGood, L.exportAllGood),
        h("button", { class: "mini", id: "btn-download", text: doc.mode === "novel" ? NL.exportZip : L.setDownload, onclick: () => app.exportSet() }),
        h("button", { class: "mini primary", id: "btn-post", text: L.setPost, onclick: () => app.postToPromptReel() })),
      h("p", { class: "set-note note clip", text: L.setNote, "data-full": L.setNote }),
      h("div", { class: "set-items" }, ...items)));
  }
}

// ===== IMAGE VIEWER =====
class Viewer {
  constructor(app) {
    this.app = app;
    this.dlg = $("viewer");
    this.bag = new Listeners();
    this.sceneId = null;
    this.imageId = null;
    this.bag.on(this.dlg, "click", (e) => { if (e.target.closest("[data-close]")) this.dlg.close(); });
    this.bag.on($("viewer-prev"), "click", () => this.step(-1));
    this.bag.on($("viewer-next"), "click", () => this.step(1));
    this.bag.on(this.dlg, "keydown", (e) => {
      if (e.target.matches("input, textarea, select")) return;
      if (e.key === "ArrowLeft") this.step(-1);
      if (e.key === "ArrowRight") this.step(1);
    });
  }

  destroy() { this.bag.destroy(); }

  open(sceneId, imageId) {
    this.sceneId = sceneId;
    this.imageId = imageId;
    this.render();
    if (!this.dlg.open) this.dlg.showModal();
  }

  step(d) {
    const list = this.app.images.list(this.sceneId);
    const i = list.findIndex((x) => x.id === this.imageId);
    const next = list[i + d];
    if (next) this.open(this.sceneId, next.id);
  }

  render() {
    const app = this.app;
    const list = app.images.list(this.sceneId);
    const img = list.find((x) => x.id === this.imageId);
    const scene = app.doc.scenes.find((s) => s.id === this.sceneId);
    if (!img || !scene) { if (this.dlg.open) this.dlg.close(); return; }
    const run = app.doc.run;
    const v = Judge.verdict(img, run);
    const pinned = app.picks.get(this.sceneId) === img.id;
    $("viewer-title").textContent = `#${app.doc.scenes.indexOf(scene) + 1} ${scene.title || ""} ・ ${list.indexOf(img) + 1}/${list.length}`;
    $("viewer-img").src = img.url || img.thumb;
    // 端まで来てボタンが押せなくなると、そこにあったフォーカスがダイアログの外へ外れて ← → が効かなくなるので、反対側へ移す
    const prev = $("viewer-prev"), next = $("viewer-next");
    const lost = document.activeElement;
    prev.disabled = list.indexOf(img) <= 0;
    next.disabled = list.indexOf(img) >= list.length - 1;
    if (lost?.disabled && this.dlg.open) (lost === next ? prev : next).disabled ? this.dlg.focus() : (lost === next ? prev : next).focus();
    const c = img.check;
    const scoreText = c?.state === "done" ? fmt(L.scorePt, { score: c.score }) : c?.state === "error" ? L.checkError : L.viewerUnchecked;
    const verdictText = v === true ? L.ok : v === false ? L.ng : "";
    const redo = (fn) => () => { fn(); app.sceneChanged(this.sceneId); this.render(); };
    $("viewer-info").replaceChildren(...[
      h("div", { class: `score-big ${v === true ? "ok" : v === false ? "ng" : ""}`, text: `${scoreText}${verdictText ? " ・ " + verdictText : ""}` }),
      img.manual ? h("div", { class: "note", text: fmt(L.viewerManual, { v: img.manual === "ok" ? L.ok : L.ng }) }) : null,
      c?.state === "error" ? h("div", { class: "msg err", text: c.error }) : null,
      c?.state === "done" ? h("div", { class: "note keep", text: [c.anatomy ? L.anatomyNg : "", Number.isFinite(c.match) ? fmt(L.matchPct, { v: c.match }) : ""].filter(Boolean).join(" ・ ") }) : null,
      c?.issues?.length ? h("ul", { class: "issues" }, ...c.issues.map((t) => h("li", { text: t }))) : null,
      c?.missing?.length ? h("div", { class: "note keep", text: L.missingHead }) : null,
      c?.missing?.length ? h("ul", { class: "issues" }, ...c.missing.map((t) => h("li", { text: t }))) : null,
      !img.blob ? h("div", { class: "msg warn", text: L.viewerNoFull }) : null,
      h("div", { class: "actions" },
        h("span", { class: `pick-state${pinned ? " on" : ""}`, text: pinned ? L.viewerPicked : L.viewerNotPicked }),
        h("button", { class: pinned ? "" : "primary", text: pinned ? L.viewerUnpick : L.viewerPick, disabled: !img.blob, onclick: redo(() => app.togglePin(this.sceneId, img.id)) }),
        h("button", { text: L.viewerOk, onclick: redo(() => { img.manual = "ok"; }) }),
        h("button", { text: L.viewerNg, onclick: redo(() => { img.manual = "ng"; }) }),
        img.manual ? h("button", { text: L.viewerAuto, onclick: redo(() => { img.manual = null; }) }) : null),
      h("div", { class: "actions" },
        h("button", { text: L.viewerRecheck, disabled: !img.blob || app.runner.busy, onclick: () => app.recheck(this.sceneId, img.id) }),
        h("button", { text: L.viewerFixSeed, onclick: () => app.fixSeed(scene, img) }),
        h("button", { text: L.viewerSave, disabled: !img.blob, onclick: () => app.saveImage(scene, img) }),
        h("button", { class: "danger", text: L.viewerDelete, onclick: () => { const next = list[list.indexOf(img) + 1] || list[list.indexOf(img) - 1]; app.deleteImage(this.sceneId, img.id); if (next) this.open(this.sceneId, next.id); else this.dlg.close(); } })),
      h("div", { class: "note keep", text: fmt(L.viewerSeed, { seed: img.seed, w: img.width, h: img.height }) }),
      h("details", { open: true }, h("summary", { text: L.viewerPromptHead }), h("pre", { text: `${img.prompt}\n\nNegative: ${img.negative}` })),
    ].filter(Boolean));
  }
}

// ===== IMAGE PICKER (NOVEL: CHOOSE THE ONE IMAGE, MAKE MORE) =====
class ImagePicker {
  constructor(app) {
    this.app = app;
    this.dlg = $("picker");
    this.body = $("picker-body");
    this.bag = new Listeners();
    this.sceneId = null;
    this.count = null;
    this.bag.on(this.dlg, "click", (e) => { if (e.target.closest("[data-close]")) this.dlg.close(); });
    this.bag.on(this.dlg, "close", () => { this.sceneId = null; this.count = null; });
  }

  destroy() { this.bag.destroy(); }

  open(sceneId) {
    this.sceneId = sceneId;
    this.count = null;
    this.render();
    if (!this.dlg.open) this.dlg.showModal();
  }

  render() {
    if (!this.sceneId) return;
    const app = this.app;
    const doc = app.doc;
    const scene = doc.scenes.find((s) => s.id === this.sceneId);
    if (!scene) { this.dlg.close(); return; }
    const list = app.images.list(scene.id);
    const picked = app.pickOf(scene.id);
    const busy = app.runner.busy || app.novel.busy;
    $("picker-title").textContent = fmt(NL.pickerTitle, { no: `#${doc.scenes.indexOf(scene) + 1}`, title: scene.title || "" });
    const count = this.count ?? Doc.perScene(doc, scene);
    const countIn = h("input", { type: "number", class: "picker-count", min: USER_SETTINGS.limits.perScene[0], max: USER_SETTINGS.limits.perScene[1], value: count });
    countIn.addEventListener("change", () => { this.count = clamp(Math.round(Number(countIn.value)) || 1, USER_SETTINGS.limits.perScene); countIn.value = this.count; });
    const top = this.body.querySelector(".picker-grid")?.scrollTop || 0;
    const grid = h("div", { class: "picker-grid" }, list.length
      ? app.board.thumbs(scene.id, list, picked, (id) => { app.board.selectImage(scene.id, id); this.render(); })
      : h("p", { class: "note keep", text: NL.pickerEmpty }));
    const score = picked?.check?.state === "done" ? fmt(L.scorePt, { score: picked.check.score }) : L.viewerUnchecked;
    const side = h("div", { class: "picker-side" }, picked
      ? [h("button", { class: "scene-pick-frame", title: L.pickOpen, onclick: () => app.viewer.open(scene.id, picked.id) }, h("img", { src: picked.url || picked.thumb, alt: "" })),
        h("div", { class: "scene-pick-cap", text: fmt(NL.pickerChosen, { no: list.indexOf(picked) + 1, score, mode: app.picks.get(scene.id) === picked.id ? L.setPinned : L.setAuto }) })]
      : h("div", { class: "scene-pick-empty", text: NL.pickerNone }));
    this.body.replaceChildren(
      h("p", { class: "note keep", text: NL.pickerNote }),
      h("div", { class: "picker-main" }, grid, side),
      h("div", { class: "row picker-foot" },
        h("span", { text: NL.pickerCount }), h("div", { class: "picker-count-box" }, countIn),
        h("button", { class: "primary", text: NL.pickerMore, disabled: busy, onclick: () => app.generateMore(scene.id, this.count ?? count) }),
        busy ? h("span", { class: "note keep", text: NL.pickerBusy }) : null,
        busy ? h("button", { class: "mini danger", text: NL.pickerStop, onclick: () => { app.novel.stop(); app.runner.stop(); } }) : null));
    grid.scrollTop = top;
  }
}

// ===== VOICE TAKES (NOVEL: CHOOSE ONE OF THE VOICES MADE FOR A LINE) =====
class VoicePicker {
  constructor(app) {
    this.app = app;
    this.dlg = $("takes");
    this.body = $("takes-body");
    this.bag = new Listeners();
    this.lineId = null;
    this.count = NV.takeCounts[0];
    this.bag.on(this.dlg, "click", (e) => { if (e.target.closest("[data-close]")) this.dlg.close(); });
    this.bag.on(this.dlg, "close", () => { this.lineId = null; this.app.novel.audio.pause(); });
  }

  destroy() { this.bag.destroy(); }

  open(lineId) {
    this.lineId = lineId;
    this.render();
    if (!this.dlg.open) this.dlg.showModal();
  }

  render() {
    if (!this.lineId) return;
    const app = this.app;
    const nr = app.novel;
    const line = app.doc.scenes.flatMap((s) => s.lines).find((l) => l.id === this.lineId);
    if (!line) { this.dlg.close(); return; }
    const { state, e } = nr.voiceState(line);
    const takes = e?.takes || [];
    const sig = nr.voiceSig(line);
    const busy = nr.busy || app.runner.busy;
    $("takes-title").textContent = fmt(NL.takesTitle, { who: NovelWriter.nameOf(app.doc, line.who) });
    const countSel = h("select", { class: "takes-count" });
    fillSelect(countSel, NV.takeCounts.map((n) => [String(n), `${n}`]), String(this.count));
    countSel.addEventListener("change", () => { this.count = Number(countSel.value); });
    this.body.replaceChildren(...[
      h("p", { class: "takes-line", text: `${line.emo || ""}${line.text}` }),
      h("p", { class: "note keep", text: NL.takesNote }),
      h("div", { class: "takes-list" }, takes.length ? takes.map((t, i) => {
        const using = t.id === e.pick;
        return h("div", { class: `take-row${using ? " using" : ""}`, "data-take": t.id },
          h("button", { class: "mini", text: NL.voicePlay, title: NL.voicePlayTitle, onclick: () => nr.play(t.url) }),
          h("span", { class: "take-no", text: fmt(NL.takesNo, { n: i + 1 }) }),
          h("span", { class: "take-sec", text: fmt(NL.voiceDone, { sec: (t.duration || 0).toFixed(1) }) }),
          t.sig !== sig ? h("span", { class: "nv-voice-state stale", text: NL.takesOld }) : h("span"),
          h("button", { class: `mini${using ? " primary" : ""}`, text: using ? NL.takesUsing : NL.takesUse, disabled: using, onclick: () => nr.pickTake(line.id, t.id) }),

// ===== KAMISHIBAI SLIDESHOW =====
class Slideshow {
  constructor(app) {
    this.app = app;
    this.dlg = $("show");
    this.bag = new Listeners();
    this.index = 0;
    this.timer = null;
    this.bag.on(this.dlg, "click", (e) => { if (e.target.closest("[data-close]")) this.dlg.close(); });
    this.bag.on(this.dlg, "close", () => { this.pause(); this.stageScene = null; this.app.novel.audio.pause(); });
    this.bag.on($("show-prev"), "click", () => this.go(this.index - 1));
    this.bag.on($("show-next"), "click", () => this.go(this.index + 1));
    this.bag.on($("show-play"), "click", () => (this.timer ? this.pause() : this.play()));
    this.bag.on($("show-stage"), "click", () => this.go(this.index + 1));
    this.bag.on(this.dlg, "keydown", (e) => {
      if (e.key === "ArrowLeft") this.go(this.index - 1);
      if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); this.go(this.index + 1); }
    });
  }

  destroy() { this.pause(); this.bag.destroy(); }

  get novel() { return this.app.doc.mode === "novel"; }

  steps() {
    if (!this.novel) return this.app.doc.scenes.map((scene) => ({ scene }));
    return this.app.doc.scenes.flatMap((scene) => {
      const lines = scene.lines.filter((l) => l.text.trim());
      return lines.length ? lines.map((line) => ({ scene, line })) : [{ scene }];
    });
  }

  open() {
    if (!this.app.doc.scenes.length) { this.app.notice(M.showNone, "warn", "story"); return; }
    this.index = 0;
    this.stageScene = null;
    this.render();
    this.dlg.showModal();
  }

  go(i) {
    const n = this.steps().length;
    if (i < 0 || i >= n) { this.pause(); return; }
    this.index = i;
    this.render();
    if (this.playing) this.speak();
    else if (this.novel) this.app.novel.play(this.voiceUrl(this.steps()[i]));
  }

  voiceUrl(step) {
    if (!step?.line) return null;
    const v = this.app.novel.voiceState(step.line);
    return v.state === "done" ? v.t.url : null;
  }

  play() {
    $("show-play").textContent = L.showPause;
    if (this.novel) {
      this.playing = true;
      this.timer = true;
      this.speak();
      return;
    }
    this.timer = setInterval(() => {
      if (this.index >= this.app.doc.scenes.length - 1) this.pause();
      else this.go(this.index + 1);
    }, USER_SETTINGS.showIntervalSec * 1000);
  }

  speak() {
    clearTimeout(this.wait);
    const step = this.steps()[this.index];
    const audio = this.app.novel.audio;
    const next = () => {
      if (!this.playing) return;
      if (this.index >= this.steps().length - 1) this.pause();
      else this.go(this.index + 1);
    };
    const voice = this.voiceUrl(step);
    if (!voice) { audio.pause(); this.wait = setTimeout(next, USER_SETTINGS.showIntervalSec * 1000); return; }
    audio.onended = () => { this.wait = setTimeout(next, NV.showGapMs); };
    this.app.novel.play(voice);
  }

  pause() {
    clearInterval(this.timer);
    clearTimeout(this.wait);
    this.timer = null;
    if (this.playing) { this.playing = false; this.app.novel.audio.onended = null; this.app.novel.audio.pause(); }
    $("show-play").textContent = L.showPlay;
  }

  render() {
    if (this.novel) { this.renderNovel(); return; }
    const doc = this.app.doc;
    const scene = doc.scenes[this.index];
    if (!scene) return;
    const img = this.app.pickOf(scene.id);
    $("show-stage").replaceChildren(img ? h("img", { src: img.url, alt: scene.title }) : h("div", { class: "show-missing", text: L.showNoImage }));
    $("show-title").textContent = `${this.index + 1}. ${scene.title || ""}`;
    $("show-text").textContent = scene.text || "";
    $("show-count").textContent = `${this.index + 1} / ${doc.scenes.length}`;
  }

  renderNovel() {
    const app = this.app;
    const list = this.steps();
    const step = list[this.index];
    if (!step) return;
    const { scene, line } = step;
    if (this.stageScene !== scene.id) {
      this.stageScene = scene.id;
      const img = app.pickOf(scene.id);
      const vid = scene.loop ? app.videos.get(scene.id) : null;
      $("show-stage").replaceChildren(vid?.url ? h("video", { src: vid.url, loop: true, muted: !app.doc.novel.video.sound, autoplay: true, playsInline: true })
        : img ? h("img", { src: img.url, alt: scene.title }) : h("div", { class: "show-missing", text: L.showNoImage }));
    }
    $("show-title").textContent = line && line.who !== NV.narrator ? NovelWriter.nameOf(app.doc, line.who) : "";
    $("show-text").textContent = line ? line.text : scene.text || "";
    $("show-count").textContent = `${this.index + 1} / ${list.length}`;
  }
}
