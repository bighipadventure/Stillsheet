      box.replaceChildren(h("p", { class: "note keep", text: M.probing }));
      const info = await this.app.stateInfo();
      box.replaceChildren(...info.map(([title, rows]) => this.card(title, h("dl", { class: "kv" }, ...rows.flatMap(([k, v]) => [h("dt", { text: k }), h("dd", { text: String(v ?? "—") })])))));
    };
    load();
    return [h("p", { class: "lead", text: P.lead }), h("div", { class: "row" }, h("button", { text: P.reload, onclick: load })), box];
  }

  helpPane() {
    return USER_SETTINGS.help.map((sec, i) => h("section", { class: "help-sec" },
      h("h4", {}, h("span", { class: "no", text: String(i + 1) }), sec.title),
      h("ul", {}, ...sec.items.map((t) => h("li", { text: t })))));
  }
}
// ===== APP =====
class App {
  constructor() {
    this.store = new SettingsStore();
    this.firstVisit = !localStorage.getItem(USER_SETTINGS.storageKey);
    try { localStorage.removeItem(USER_SETTINGS.legacyDocKey); } catch {}
    this.doc = Doc.create();
    this.dirty = false;
    this.images = new ImageStore();
    this.picks = new Map();
    this.res = {};
    this.clock = new RunClock();
    this.lastRun = null;
    this.lastText = null;
    this.conn = { image: "idle", llm: "idle" };
    this.runner = new Runner(this);
    this.bag = new Listeners();
    this.numbers = NumberControl.watch(document.body);
    this.left = new LeftPanel(this);
    this.right = new RightPanel(this);
    this.board = new SceneBoard(this);
    this.setStrip = new SetStrip(this);
    this.viewer = new Viewer(this);
    this.show = new Slideshow(this);
    this.settings = new SettingsDialog(this);
    this.etaTimer = null;
    LlmClient.onProgress = (text) => this.status(text);
    LlmClient.onStall = (text) => this.status(text);
    this.bindTop();
    this.bindSplitters();
    this.applySideWidths();
    this.applyHelp();
    ClipTitle.attach(document.body, this.bag);
    fillSelect($("run-target"), USER_SETTINGS.runTargets, this.doc.run.target);
    this.left.render();
    this.right.render();
    this.renderAll();
    this.phase("idle", "");
    this.status(M.runIdle);
    this.probeAll();
    if (this.firstVisit) { this.store.save(); this.settings.open("guide"); }
  }

  destroy() {
    this.runner.stop();
    clearInterval(this.etaTimer);
    this.numbers.disconnect();
    for (const part of [this.bag, this.left, this.right, this.board, this.setStrip, this.viewer, this.show, this.settings]) part.destroy();
    this.images.clearAll();
  }

  // SIDE PANEL WIDTHS AND HELP TEXT
  applySideWidths() {
    const ui = this.store.data.ui;
    const cfg = USER_SETTINGS.sidePanels;
    const layout = document.querySelector(".layout");
    layout.style.setProperty("--left-w", `${ui.leftW || cfg.left[2]}px`);
    layout.style.setProperty("--right-w", `${ui.rightW || cfg.right[2]}px`);
  }

  bindSplitters() {
    const cfg = USER_SETTINGS.sidePanels;
    const layout = document.querySelector(".layout");
    document.querySelectorAll(".splitter").forEach((bar) => {
      const side = bar.dataset.side;
      const key = side === "left" ? "leftW" : "rightW";
      const [min, max, initial] = cfg[side];
      let active = false;
      this.bag.on(bar, "pointerdown", (e) => {
        if (e.button !== 0) return;
        active = true;
        bar.setPointerCapture(e.pointerId);
        bar.classList.add("dragging");
        document.body.classList.add("resizing");
      });
      this.bag.on(bar, "pointermove", (e) => {
        if (!active) return;
        const ui = this.store.data.ui;
        const rect = layout.getBoundingClientRect();
        const other = side === "left" ? (ui.rightW || cfg.right[2]) : (ui.leftW || cfg.left[2]);
        const raw = side === "left" ? e.clientX - rect.left : rect.right - e.clientX;
        const limit = Math.min(max, rect.width - other - cfg.centerMin - cfg.splitterPx * 2);
        ui[key] = Math.round(Math.min(Math.max(raw, min), Math.max(min, limit)));
        this.applySideWidths();
      });
      const end = () => {
        if (!active) return;
        active = false;
        bar.classList.remove("dragging");
        document.body.classList.remove("resizing");
        this.store.save();
      };
      this.bag.on(bar, "pointerup", end);
      this.bag.on(bar, "pointercancel", end);
      this.bag.on(bar, "dblclick", () => {
        this.store.data.ui[key] = initial;
        this.store.save();
        this.applySideWidths();
      });
    });
  }

  applyHelp() {
    const on = this.store.data.ui.help !== false;
    $("help-toggle").checked = on;
    document.body.classList.toggle("no-help", !on);
  }

  // CONNECTIONS
  backend() {
    const url = this.store.url;
    if (!this.client || this.client.kind !== this.store.data.backend || this.client.url !== url) {
      const inst = this.store.data.backend === "comfy" ? new ComfyClient(url) : new A1111Client(url);
      this.client = { kind: this.store.data.backend, url, inst };
    }
    return this.client.inst;
  }

  llm() {
    return new LlmClient(this.store.data.llm);
  }

  async probeAll() {
    const llmPill = $("pill-llm"), imgPill = $("pill-img");
    const short = USER_SETTINGS.backends[this.store.data.backend].short;
    setPill(llmPill, "文章AI", M.probing);
    setPill(imgPill, "画像AI", M.probing);
    const llmCfg = this.store.data.llm;
    const llmUrl = LlmClient.norm(llmCfg.url);
    const [ls, is] = await Promise.all([Net.probe(`${llmUrl}/models`), Net.probe(this.backend().probeUrl)]);
    this.conn = { image: is, llm: ls };
    const label = (state, name) => (state === "ok" ? name : state === "cors" ? `${name}（${M.pillCors}）` : `${name}（${M.pillDown}）`);
    const stateOf = (s) => (s === "ok" ? "ok" : s === "cors" ? "warn" : "down");
    llmPill.dataset.state = stateOf(ls);
    imgPill.dataset.state = stateOf(is);
    const llmName = LlmClient.appName(llmUrl) + (llmCfg.model ? ` · ${llmCfg.model}` : "");
    setPill(llmPill, "文章AI", label(ls, llmName));
    setPill(imgPill, "画像AI", label(is, short));
    llmPill.title = `文章AI: ${llmName}（${llmUrl}）`;
    imgPill.title = `画像AI: ${short}（${this.store.url}）`;
    if (is === "ok" && !this.res.models) await this.loadResources();
    return this.conn;
  }

  async refreshConnections() {
    const llmCfg = this.store.data.llm;
    const state = await Net.probe(`${LlmClient.norm(llmCfg.url)}/models`);
    if (state !== "ok") {
      const found = (await LlmClient.detect(llmCfg)).find((f) => f.state === "ok");
      if (found) {
        llmCfg.url = found.url;
        if (!found.models.includes(llmCfg.model)) llmCfg.model = found.models[0] || "";
        this.store.save();
      }
    }
    this.res = {};
    const conn = await this.probeAll();
    if (conn.image !== "ok") this.notice(conn.image === "cors" ? M.fix.imageCors : M.fix.imageDown, "err", conn.image === "cors" ? "settingsGuide" : "settings");
    else if (conn.llm !== "ok") this.notice(conn.llm === "cors" ? M.fix.llmCors : M.fix.llmDown, "warn", "settingsLlm");
    else this.notice(M.probeOk, "ok");
  }

  async loadResources(msgEl) {
    try {
      this.res = await this.backend().resources();
      if (msgEl) setMsg(msgEl, fmt(M.listsLoaded, { models: this.res.models.length, loras: this.res.loras.length }), "ok");
      this.right.render();
    } catch (err) {
      if (msgEl) setMsg(msgEl, fmt(M.listsFailed, { err: Guide.text(err, "image") }), "err");
    }
  }

  async connectionReport() {
    const conn = await this.probeAll();
    const lines = [];
    lines.push(`画像AI: ${Net.message(conn.image)}`);
    if (conn.image === "ok") {
      const ping = await CorsExtension.ping(this.store.data.backend, this.store.url);
      lines.push(ping ? fmt(M.corsPing, { version: ping.version, server: ping.server }) : M.corsPingNone);
    }
    lines.push(`文章AI: ${Net.message(conn.llm)}`);
    return { ok: conn.image === "ok" && conn.llm === "ok", text: lines.join("\n") };
  }

  async stateInfo() {
    const P = USER_SETTINGS.pages.state;
    const d = this.store.data;
    const conn = await this.probeAll();
    const ping = conn.image === "ok" ? await CorsExtension.ping(d.backend, this.store.url) : null;
    let bytes = 0, full = 0;
    for (const list of this.images.byScene.values()) for (const img of list) if (img.blob) { bytes += img.blob.size; full++; }
    const sec = (ms) => (ms == null ? "—" : formatDuration(ms));
    const r = this.lastRun;
    return [
      [P.image, [["ソフト", USER_SETTINGS.backends[d.backend].label], ["URL", this.store.url], ["状態", Net.message(conn.image)], ["web-app-cors", ping ? `v${ping.version}（${ping.server}）` : M.corsPingNone],
        ["Checkpoint", this.res.models ? `${this.res.models.length} 件` : "—"], ["LoRA", this.res.loras ? `${this.res.loras.length} 件` : "—"], ["選んでいる Checkpoint", this.doc.common.model || L.keepCurrent]]],
      [P.llm, [["アプリ", LlmClient.appName(d.llm.url)], ["URL", d.llm.url], ["状態", Net.message(conn.llm)], ["モデル", d.llm.model || L.llmModelAuto], ["温度 / 最大トークン", `${d.llm.temperature} / ${d.llm.maxTokens}`]]],
      [P.work, [["シーン", `${this.doc.scenes.length} 件`], ["登場人物 / 場所", `${this.doc.cast.length} 人 / ${this.doc.locations.length} 件`], ["ベース画像", this.doc.base?.name || "—"],
        ["生成した画像", `${this.images.total} 枚（元の画像を保持 ${full} 枚・約 ${(bytes / 1048576).toFixed(1)} MB）`], ["保存していない変更", this.dirty ? "あり" : "なし"]]],
      [P.run, [["1枚の生成", sec(this.clock.avg.gen)], ["1枚のチェック", sec(this.clock.avg.check)], ["VRAM の入れ替え", sec(this.clock.avg.vram)],
        ["結果", r ? `${r.scenes} シーン・${r.made} 枚・合格 ${r.good} 枚・${r.time}` : "—"]]],
    ];
  }

  async preflight(scenes) {
    const doc = this.doc;
    const empty = scenes.find((s) => !(s.prompt.trim() || s.count.trim() || s.cast.length));
    if (empty) {
      const n = doc.scenes.indexOf(empty) + 1;
      throw Guide.fail(fmt(M.fix.emptyPrompt, { n }), `scene:${empty.id}`);
    }
    if (this.store.data.backend === "comfy" && !doc.common.model) throw Guide.fail(M.needModelComfy, "image:model");
    this.phase("idle", "");
    this.status(M.runPreparing);
    const image = await Net.probe(this.backend().probeUrl);
    if (image === "down") throw Guide.fail(M.fix.imageDown, "refresh");
    if (image === "cors") throw Guide.fail(M.fix.imageCors, "settingsGuide");
    if (doc.run.check) {
      const llm = await Net.probe(`${LlmClient.norm(this.store.data.llm.url)}/models`);
      if (llm !== "ok") throw Guide.fail(M.fix.checkNoLlm, "run");
    }
  }

  // DOCUMENT STATE
  docChanged(structural) {
    this.dirty = true;
    if (structural) this.renderAll();
  }

  replaceDoc(doc) {
    this.runner.stop();
    this.images.clearAll();
    this.picks.clear();
    this.doc = doc;
    this.dirty = false;
    fillSelect($("run-target"), USER_SETTINGS.runTargets, doc.run.target);
    this.left.render();
    this.right.render();
    this.renderAll();
  }

  renderHead() {
    $("story-title").textContent = this.doc.title || L.untitled;
    const syn = $("story-synopsis");
    syn.textContent = this.doc.synopsis || "";
    syn.dataset.full = this.doc.synopsis || "";
    this.dirty = true;
  }

  renderAll() {
    const wasDirty = this.dirty;
    this.images.keepOnly(this.doc.scenes.map((s) => s.id));
    for (const id of [...this.picks.keys()]) if (!this.doc.scenes.some((s) => s.id === id)) this.picks.delete(id);
    this.renderHead();
    this.dirty = wasDirty;
    this.board.render();
    this.setStrip.render();
    this.updateRunNote();
  }

  sceneChanged(sceneId) {
    this.board.updateImages(sceneId);
    this.setStrip.render();
    if (this.viewer.dlg.open && this.viewer.sceneId === sceneId) this.viewer.render();
  }

  updateRunNote() {
    const r = this.doc.run;
    const ids = this.doc.scenes.map((s) => s.id);
    const total = this.doc.scenes.reduce((n, s) => n + Doc.perScene(this.doc, s), 0);
    const timing = (USER_SETTINGS.checkTimings.find(([k]) => k === r.timing) || [, ""])[1].replace(/（.*）/, "");
    const check = r.check ? fmt(L.runNoteCheck, { timing, threshold: r.threshold }) : L.runNoteNoCheck;
    $("run-note").textContent = ids.length ? fmt(L.runNote, { scenes: ids.length, per: r.perScene, total, check }) : "";
  }

  // STATUS (PHASE, MESSAGE WITH A FIX BUTTON, PROGRESS, REMAINING TIME)
  status(text) {
    const el = $("run-status");
    el.replaceChildren(text);
    el.dataset.kind = "";
  }

  notice(text, kind = "", action = null) {
    const el = $("run-status");
    const kids = [h("span", { text })];
    const label = this.actionLabel(action);
    if (label) kids.push(h("button", { class: "fix", text: label, onclick: () => this.runAction(action) }));
    el.replaceChildren(...kids);
    el.dataset.kind = kind;
  }

  phase(kind, title) {
    const el = $("run-phase");
    el.dataset.phase = kind;
    el.textContent = USER_SETTINGS.phases[kind] || kind;
    if (title !== undefined) { $("run-title").textContent = title; $("run-title").dataset.full = title; }
  }

  progress(p) {
    const pct = Math.round(clamp(Number(p) || 0, [0, 1]) * 100);
    $("run-bar").style.width = `${pct}%`;
    $("progress-pct").textContent = `${pct}%`;
    $("progress").setAttribute("aria-valuenow", String(pct));
    document.title = this.runner.busy ? `(${pct}%) ${USER_SETTINGS.appName}` : USER_SETTINGS.appName;
  }

  updateEta(est, maybeEarlier = false) {
    const el = $("run-eta");
    clearInterval(this.etaTimer);
    this.etaTimer = null;
    if (!this.runner.busy) { el.textContent = ""; el.title = ""; document.title = USER_SETTINGS.appName; return; }
    if (!est) { el.textContent = M.etaMeasuring; return; }
    const deadline = Date.now() + est.ms;
    const tpl = maybeEarlier || est.partial ? M.etaMax : M.eta;
    const paint = () => { el.textContent = fmt(tpl, { time: formatDuration(Math.max(0, deadline - Date.now())) }); };
    el.title = fmt(M.etaTitle, { gen: formatDuration(this.clock.avg.gen || 0), check: this.clock.has("check") ? formatDuration(this.clock.avg.check) : "—" });
    paint();
    this.etaTimer = setInterval(paint, 1000);
  }

  actionLabel(action) {
    if (!action) return "";
    const A = M.fixActions;
    const [kind, arg] = action.split(":");
    if (kind === "scene") return fmt(A.scene, { n: this.doc.scenes.findIndex((s) => s.id === arg) + 1 });
    return A[kind] || "";
  }

  runAction(action) {
    const [kind, arg] = String(action).split(":");
    if (kind === "settings") this.settings.open("conn");
    else if (kind === "settingsLlm") this.settings.open("llm");
    else if (kind === "settingsGuide") this.settings.open("guide");
    else if (kind === "refresh") this.refreshConnections();
    else if (kind === "image") this.right.show("image", arg);
    else if (kind === "run") this.right.show("run", "threshold");
    else if (kind === "story") this.left.focus("story", "#brief");
    else if (kind === "scene") this.board.focusScene(arg);
    else if (kind === "target") { this.doc.run.target = "all"; $("run-target").value = "all"; this.status(M.runIdle); }
  }

  runStateChanged(running) {
    $("btn-run").disabled = running;
    $("btn-stop").hidden = !running;
    for (const b of document.querySelectorAll(".scene-run")) b.disabled = running;
    if (!running) this.progress($("run-bar").style.width === "100%" ? 1 : 0);
  }

  markRunning(sceneId) { this.board.setRunning(sceneId); }

  // PICKS
  pickOf(sceneId) {
    return Judge.pick(this.images.list(sceneId), this.doc.run, this.picks.get(sceneId));
  }

  togglePin(sceneId, imageId) {
    if (this.picks.get(sceneId) === imageId) this.picks.delete(sceneId);
    else this.picks.set(sceneId, imageId);
  }

  // STORY
  async writeStory(msgEl) {
    if (this.runner.busy) { setMsg(msgEl, M.runBusy, "err"); return; }
    if (!this.doc.brief.trim()) { setMsg(msgEl, M.fix.needBrief, "err"); this.left.focus("story", "#brief"); return; }
    const count = this.doc.scenes.reduce((n, s) => n + this.images.list(s.id).length, 0);
    if (this.doc.scenes.length && !confirm(fmt(M.storyReplace, { n: count }))) return;
    setMsg(msgEl, M.storyRunning);
    this.phase("llm", M.storyRunning);
    this.status(M.storyRunning);
    this.storyCtl = new AbortController();
    $("btn-stop").hidden = false;
    try {
      const out = await StoryWriter.write(this.llm(), this.doc, this.storyCtl.signal);
      if (out.title) this.doc.title = out.title;
      if (out.synopsis) this.doc.synopsis = out.synopsis;
      this.doc.scenes = out.scenes;
      if (this.doc.sceneCount !== out.scenes.length) this.doc.sceneCount = clamp(out.scenes.length, USER_SETTINGS.limits.sceneCount);
      this.docChanged(true);
      this.left.render();
      const done = fmt(M.storyDone, { n: out.scenes.length });
      this.phase("done", "");
      this.notice(done, "ok");
      const m = $("story-msg");
      if (m) setMsg(m, done, "ok");
    } catch (err) {
      const why = Guide.explain(err, "llm");
      setMsg(msgEl, why.text, why.aborted ? "" : "err");
      this.phase(why.aborted ? "stop" : "error", "");
      this.notice(why.text, why.aborted ? "" : "err", why.action);
    } finally {
      this.storyCtl = null;
      $("btn-stop").hidden = !this.runner.busy;
    }
  }

  async rewriteScene(scene, { countIn, promptIn }) {
    const n = this.doc.scenes.indexOf(scene) + 1;
    if (!scene.title.trim() && !scene.text.trim()) { this.notice(M.fix.needSceneText, "warn", `scene:${scene.id}`); return; }
    this.phase("llm", fmt(M.rewriteRunning, { n }));
    this.status(fmt(M.rewriteRunning, { n }));
    try {
      const out = await StoryWriter.rewriteScene(this.llm(), this.doc, scene, new AbortController().signal);
      if (out.count) { scene.count = out.count; countIn.value = out.count; }
      scene.prompt = out.prompt;
      promptIn.value = out.prompt;
      this.docChanged(false);
      this.board.updatePreview(scene.id);
      this.phase("done", "");
      this.notice(fmt(M.rewriteDone, { n }), "ok");
    } catch (err) {
      const why = Guide.explain(err, "llm");
      this.phase("error", "");
      this.notice(why.text, "err", why.action);
    }
  }

  // SCENES
  addScene() {
    this.doc.scenes.push(Doc.newScene({ cast: this.doc.cast.slice(0, 1).map((c) => c.id) }));
    this.docChanged(true);
    this.board.cards.get(this.doc.scenes.at(-1).id)?.el.scrollIntoView({ behavior: "smooth", block: "center" });
  }

  duplicateScene(scene) {
    const i = this.doc.scenes.indexOf(scene);
    const { id, ...rest } = clone(scene);
    this.doc.scenes.splice(i + 1, 0, Doc.newScene(rest));
    this.docChanged(true);
  }

  clearScene(scene) {
    const count = this.images.list(scene.id).length;
    if (!count) return;
    if (this.runner.busy) { this.notice(M.runBusy, "warn"); return; }
    if (!confirm(fmt(M.clearConfirm, { n: this.doc.scenes.indexOf(scene) + 1, count }))) return;
    this.images.clear(scene.id);
    this.picks.delete(scene.id);
    this.sceneChanged(scene.id);
  }

  removeScene(scene) {
    if (this.runner.busy) { this.notice(M.runBusy, "warn"); return; }
    const count = this.images.list(scene.id).length;
    if (!confirm(fmt(M.deleteSceneConfirm, { n: this.doc.scenes.indexOf(scene) + 1, count }))) return;
    this.doc.scenes = this.doc.scenes.filter((s) => s !== scene);
    this.docChanged(true);
  }

  deleteImage(sceneId, imageId) {
    if (this.picks.get(sceneId) === imageId) this.picks.delete(sceneId);
    this.images.remove(sceneId, imageId);
    this.sceneChanged(sceneId);
  }

  fixSeed(scene, img) {
    scene.seed = img.seed;
    this.docChanged(true);
    this.notice(fmt(L.viewerSeed, { seed: img.seed, w: img.width, h: img.height }) + ` → #${this.doc.scenes.indexOf(scene) + 1}`, "ok", `scene:${scene.id}`);
  }

  async recheck(sceneId, imageId) {
    const scene = this.doc.scenes.find((s) => s.id === sceneId);
    const img = this.images.list(sceneId).find((i) => i.id === imageId);
    if (!scene || !img?.blob) return;
    img.check = { state: "pending" };
    this.sceneChanged(sceneId);
    try {
      img.check = await ImageChecker.check(this.llm(), this.doc, scene, img, new AbortController().signal);
    } catch (err) {
      const why = Guide.explain(err, "llm");
      img.check = { state: "error", error: why.text };
      this.notice(why.text, "err", why.action);
    }
    this.sceneChanged(sceneId);
  }

  // RUN
  targetScenes() {
    const run = this.doc.run;
    if (run.target === "lacking") return this.doc.scenes.filter((s) => Judge.lacking(this.images.list(s.id), run)).map((s) => s.id);
    return this.doc.scenes.map((s) => s.id);
  }

  async run(sceneIds) {
    try {
      return await this.runner.run(sceneIds || this.targetScenes());
    } catch (err) {
      if (err?.shown) return null;
      const why = Guide.explain(err, "image");
      this.phase("error", "");
      this.notice(why.text, "err", why.action);
      return null;
    }
  }

  // FILES
  imageCount() { return this.images.total; }

  saveProject() {
    const blob = new Blob([JSON.stringify(Doc.serialize(this.doc), null, 2)], { type: "application/json" });
    downloadBlob(blob, `${USER_SETTINGS.fileNamePrefix}${safeName(this.doc.title) || "project"}_${timestamp()}.json`);
    this.dirty = false;
    this.notice(M.savedProject, "ok");
  }

  async openProject(file) {
    try {
      const obj = await readJsonFile(file);
      if (!Doc.isProject(obj) || obj.format !== USER_SETTINGS.projectFormat) throw Guide.fail(M.notProject);
      const n = this.imageCount();
      if (n && !confirm(fmt(M.loadDiscard, { n }))) return;
      this.replaceDoc(Doc.normalize(obj));
      this.notice(fmt(M.loadedProject, { n: this.doc.scenes.length }), "ok");
    } catch (err) {
      this.notice(err instanceof UserError ? err.message : M.loadFailed, "err");
    }
  }

  async openFile(file) {
    if (/^image\//.test(file.type) || /\.(png|jpe?g|webp)$/i.test(file.name)) { await this.loadBase(file); return; }
    let obj;
    try {
      obj = await readJsonFile(file);
    } catch {
      this.notice(M.loadFailed, "err");
      return;
    }
    if (obj?.format === USER_SETTINGS.situationFormat) return this.openSituation(obj);
    if (obj?.format === USER_SETTINGS.castFormat) return this.swapCastFrom(obj);
    return this.openProject(file);
  }

  saveSituation() {
    const blob = new Blob([JSON.stringify(Doc.situationFile(this.doc), null, 2)], { type: "application/json" });
    downloadBlob(blob, `${USER_SETTINGS.fileNamePrefix}situation_${safeName(this.doc.title) || "story"}_${timestamp()}.json`);
    this.notice(fmt(M.savedSituation, { n: this.doc.scenes.length }), "ok");
  }

  openSituation(obj) {
    const n = this.imageCount();
    if ((n || this.doc.scenes.length) && !confirm(fmt(M.situationDiscard, { n }))) return;
    const doc = Doc.loadSituation(this.doc, obj);
    this.replaceDoc(doc);
    this.dirty = true;
    this.notice(fmt(M.loadedSituation, { n: doc.scenes.length }), "ok");
  }

  async loadBase(file) {
    try {
      this.doc.base = await BaseImage.read(file);
      const used = this.applyBase();
      if (!this.doc.scenes.length && this.doc.base.prompt) this.addSceneFromBase(true);
      this.left.render();
      this.notice(used.length ? fmt(M.baseApplied, { list: used.join("・") }) : M.baseAppliedNone, used.length ? "ok" : "warn", used.length ? "image" : null);
    } catch {
      this.notice(M.baseFailed, "err");
    }
  }

  applyBase() {
    const base = this.doc.base;
    if (!base) return [];
    const used = BaseImage.apply(this.doc, base, { res: this.res, backendKind: this.store.data.backend });
    this.right.show("image");
    this.docChanged(true);
    return used;
  }

  addSceneFromBase(quiet = false) {
    const base = this.doc.base;
    if (!base) return;
    this.doc.scenes.push(Doc.newScene({ title: base.name.replace(/\.[^.]+$/, ""), prompt: base.prompt }));
    this.docChanged(true);
    if (!quiet) this.notice(fmt(M.baseSceneAdded, { n: this.doc.scenes.length }), "ok", `scene:${this.doc.scenes.at(-1).id}`);
  }

  baseToCast() {
    const base = this.doc.base;
    if (!base) return;
    if (!this.doc.cast.length) this.doc.cast.push(Doc.person({}, "c"));
    this.doc.cast[0].prompt = base.prompt;
    this.docChanged(true);
    this.left.render();
    this.notice(M.baseCastSet, "ok");
  }

  async swapCastFrom(obj) {
    if (!Doc.isProject(obj)) { this.notice(M.notProject, "err"); return; }
    if (!Array.isArray(obj.cast) || !obj.cast.length) { this.notice(M.castNone, "err"); return; }
    const n = Doc.swapCast(this.doc, obj.cast);
    this.docChanged(true);
    this.left.render();
    this.notice(fmt(M.castSwapped, { n }), "ok");
  }

  saveCast() {
    const blob = new Blob([JSON.stringify(Doc.castFile(this.doc), null, 2)], { type: "application/json" });
    downloadBlob(blob, `${USER_SETTINGS.fileNamePrefix}cast_${timestamp()}.json`);
  }

  newProject() {
    const n = this.imageCount();
    if ((this.dirty || n) && !confirm(fmt(M.newDiscard, { n }))) return;
    this.replaceDoc(Doc.create());
    this.phase("idle", "");
    this.status(M.runIdle);
  }

  async pngBytes(img) {
    let bytes = new Uint8Array(await img.blob.arrayBuffer());
    if (PngText.isPng(bytes)) bytes = PngText.withText(bytes, "parameters", img.info || Infotext.build(img, this.doc.common));
    return bytes;
  }

  async saveImage(scene, img) {
    if (!img.blob) return;
    const n = this.doc.scenes.indexOf(scene) + 1;
    downloadBlob(new Blob([await this.pngBytes(img)], { type: "image/png" }), `${USER_SETTINGS.fileNamePrefix}${String(n).padStart(2, "0")}_${img.seed}.png`);
  }

  storyText() {
    const lines = [this.doc.title || L.untitled, this.doc.synopsis, ""];
    this.doc.scenes.forEach((s, i) => lines.push(`${i + 1}. ${s.title}`, s.text, ""));
    return lines.join("\r\n");
  }

  async buildExport(allGood) {
    const files = [];
    const pad = (n) => String(n).padStart(2, "0");
    for (let i = 0; i < this.doc.scenes.length; i++) {
      const scene = this.doc.scenes[i];
      const stem = `${pad(i + 1)}_${safeName(scene.title) || "scene"}`;
      const pick = this.pickOf(scene.id);
      if (pick) files.push({ path: `${stem}.png`, data: await this.pngBytes(pick) });
      if (allGood) {
        for (const img of this.images.list(scene.id)) {
          if (img.blob && Judge.verdict(img, this.doc.run) === true) files.push({ path: `good/${stem}/${img.seed}_${img.id}.png`, data: await this.pngBytes(img) });
        }
      }
    }
    const count = files.length;
    if (!count) return null;
    files.push({ path: "story.txt", data: this.storyText() }, { path: "stillsheet.json", data: JSON.stringify(Doc.serialize(this.doc), null, 2) });
    return { zip: ZipWriter.build(files), count };
  }

  async shareFiles() {
    const stamp = timestamp();
    const files = [];
    for (let i = 0; i < this.doc.scenes.length; i++) {
      const pick = this.pickOf(this.doc.scenes[i].id);
      if (!pick) continue;
      const name = `${USER_SETTINGS.fileNamePrefix}${stamp}_${String(i + 1).padStart(2, "0")}.png`;
      files.push({ blob: new Blob([await this.pngBytes(pick)], { type: "image/png" }), name, mime: "image/png" });
    }
    return { files, stamp };
  }

  handoffDb() {
    const cfg = USER_SETTINGS.shareHandoff;
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(cfg.db, 1);
      req.onupgradeneeded = () => { if (!req.result.objectStoreNames.contains(cfg.store)) req.result.createObjectStore(cfg.store); };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  openWaitingTab() {
    const win = window.open("", "_blank");
    if (!win) return null;
    try {
      win.document.title = "Prompt Reel";
      win.document.body.textContent = M.shareOpening;
    } catch {}
    return win;
  }

  async postToPromptReel() {
    const cfg = USER_SETTINGS.shareHandoff;
    const target = new URL(USER_SETTINGS.shareAppUrl, location.href);
    if (target.origin !== location.origin) { this.notice(fmt(M.shareOtherOrigin, { origin: target.origin }), "err"); return; }
    if (!this.doc.scenes.some((s) => this.pickOf(s.id))) { this.notice(M.exportNone, "warn"); return; }
    const win = this.openWaitingTab();
    if (!win) { this.notice(M.sharePopupBlocked, "err"); return; }
    this.status(M.sharePreparing);
    try {
      const { files, stamp } = await this.shareFiles();
      const key = `${cfg.keyPrefix}_${stamp}_${uid()}`;
      const record = {
        source: cfg.importName, createdAt: Date.now(),
        images: files.map((f) => ({ blob: f.blob, name: f.name, mime: f.mime })),
        blob: files[0].blob, name: files[0].name, mime: files[0].mime,
        meta: {
          format: cfg.format, app: USER_SETTINGS.appName, title: this.doc.title, synopsis: this.doc.synopsis,
          scenes: this.doc.scenes.filter((s) => this.pickOf(s.id)).map((s) => ({ title: s.title, text: s.text })),
          base: BaseImage.shareInfo(this.doc.base), mode: "scenes",
        },
      };
      const db = await this.handoffDb();
      await new Promise((resolve, reject) => {
        const tx = db.transaction(cfg.store, "readwrite");
        tx.objectStore(cfg.store).put(record, key);
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });
      db.close();
      target.searchParams.set("import", cfg.importName);
      target.searchParams.set("key", key);
      win.location.href = target.href;
      this.notice(fmt(M.shareOpened, { n: files.length }), "ok");
      return key;
    } catch (err) {
      win.close();
      this.notice(fmt(M.shareFailed, { err: err.message || err }), "err");
    }
  }

  async exportSet() {
    const allGood = !!this.store.data.ui.exportAllGood;
    const out = await this.buildExport(allGood);
    if (!out) { this.notice(M.exportNone, "warn"); return; }
    downloadBlob(out.zip, `${USER_SETTINGS.fileNamePrefix}${safeName(this.doc.title) || "set"}_${timestamp()}.zip`);
    this.notice(fmt(M.exportDone, { n: out.count }), "ok");
  }

  toggleSaveMenu() {
    const menu = $("save-menu");
    if (!menu.hidden) { menu.hidden = true; return; }
    const item = (label, note, fn) => h("button", { onclick: () => { menu.hidden = true; fn(); } }, label, h("small", { text: note }));
    menu.replaceChildren(
      item(L.saveAll, L.saveAllNote, () => this.saveProject()),
      item(L.saveSituation, L.saveSituationNote, () => this.saveSituation()),
      item(L.saveCast, L.saveCastNote, () => this.saveCast()));
    const r = $("btn-save").getBoundingClientRect();
    menu.style.top = `${r.bottom + 4}px`;
    menu.hidden = false;
    menu.style.left = `${Math.max(8, Math.min(r.left, innerWidth - menu.offsetWidth - 8))}px`;
  }

  // TOP BAR AND KEYS
  bindTop() {
    const on = (id, fn) => this.bag.on($(id), "click", fn);
    on("btn-settings", () => this.settings.open());
    on("btn-help", () => this.settings.open("help"));
    on("pill-llm", () => this.settings.open("llm"));
    on("pill-img", () => this.settings.open("conn"));
    on("refresh-conn", () => this.refreshConnections());
    on("btn-new", () => this.newProject());
    on("btn-save", (e) => { e.stopPropagation(); this.toggleSaveMenu(); });
    on("btn-open", () => $("file-open").click());
    on("btn-show", () => this.show.open());
    on("btn-add-scene", () => this.addScene());
    on("btn-run", () => this.run());
    on("btn-stop", () => { this.runner.stop(); this.storyCtl?.abort(); });
    this.bag.on($("help-toggle"), "change", () => { this.store.data.ui.help = $("help-toggle").checked; this.store.save(); this.applyHelp(); });
    this.bag.on(document, "click", (e) => { if (!e.target.closest("#save-menu")) $("save-menu").hidden = true; });
    this.bag.on(document, "keydown", (e) => { if (e.key === "Escape") $("save-menu").hidden = true; });
    this.bag.on(document, "focusin", (e) => {
      if (e.target.closest?.(".layout") && e.target.matches("textarea, input[type=text], input:not([type])")) this.lastText = e.target;
    });
    this.bag.on($("run-target"), "change", () => { this.doc.run.target = $("run-target").value; this.dirty = true; });
    const pickFile = (id, fn) => this.bag.on($(id), "change", (e) => {
      const f = e.target.files?.[0];
      e.target.value = "";
      if (f) fn(f);
    });
    pickFile("file-open", (f) => this.openFile(f));
    pickFile("file-base", (f) => this.loadBase(f));
    this.bag.on(window, "beforeunload", (e) => {
      if (this.runner.busy || this.dirty || this.imageCount()) { e.preventDefault(); e.returnValue = M.leaveConfirm; }
    });
    this.bag.on(document, "dragover", (e) => e.preventDefault());
    this.bag.on(document, "drop", (e) => {
      const f = [...(e.dataTransfer?.files || [])].find((x) => /\.(json|png|jpe?g|webp)$/i.test(x.name));
      e.preventDefault();
      if (f) this.openFile(f);
    });
  }
}

document.addEventListener("DOMContentLoaded", () => {
  window.stillsheet = new App();
});
</script>
