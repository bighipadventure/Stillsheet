    return this.order.find((k) => !this.skipped(k) && this.pending(k)) || null;
  }

  start(fromKey, { explicit = false } = {}) {
    const order = this.order;
    const from = fromKey ? order.indexOf(fromKey) : order.indexOf(this.firstRun());
    if (from < 0) { this.app.notice(NM.allDone, "ok"); return Promise.resolve(true); }
    return this.task(async (signal) => {
      for (let i = from; i < order.length; i++) {
        const k = order[i];
        const first = explicit && i === from;
        if (!first && this.skipped(k)) continue;
        if (k === "plan" && !first && !this.pending(k)) continue;
        this.stage = k;
        this.app.left.paintSteps();
        const ok = await this[k](signal, { force: first });
        if (ok === false) return false;
        if (signal.aborted) throw new DOMException("aborted", "AbortError");
      }
      this.app.phase("done", "");
      this.app.progress(1);
      this.app.notice(NM.allDone, "ok");
      return true;
    });
  }

  extra() {
    const keys = NV.extraKeys.filter((k) => !this.skipped(k));
    if (!keys.length) { this.app.notice(NM.extraNone, "warn"); return Promise.resolve(false); }
    const app = this.app;
    const doc = this.doc;
    return this.task(async (signal) => {
      const takes = (m) => [...m.values()].reduce((n, e) => n + (e?.takes?.length || 0), 0);
      const before = { images: app.images.total, voices: takes(app.voices), videos: takes(app.videos) };
      for (const k of keys) {
        this.stage = k;
        app.left.paintSteps();
        if (k === "images") {
          const ids = doc.scenes.filter((s) => !s.noImage).map((s) => s.id);
          if (!ids.length) continue;
          app.snapAspect();
          await app.runner.run(ids);
        } else if (k === "voice") {
          const lines = this.allLines().filter((l) => this.autoVoiced(l));
          if (lines.length) await this.voice(signal, { lines, keepPick: true });
        } else {
          const ids = doc.scenes.filter((s) => s.loop && !s.noImage && app.pickOf(s.id)).map((s) => s.id);
          if (ids.length) await this.video(signal, { ids, keepPick: true });
        }
        if (signal.aborted) throw new DOMException("aborted", "AbortError");
      }
      app.notice(fmt(NM.extraDone, { images: Math.max(0, app.images.total - before.images), voices: takes(app.voices) - before.voices, videos: takes(app.videos) - before.videos }), "ok");
      return true;
    });
  }

  // ① PLAN
  async plan(signal) {
    const app = this.app;
    const doc = this.doc;
    if (!doc.brief.trim() && !doc.manuscript.trim()) { app.left.focus("story", "#brief"); throw Guide.fail(NM.needBrief, "story"); }
    const count = doc.scenes.reduce((n, s) => n + app.images.list(s.id).length, 0);
    if (doc.scenes.length && !confirm(fmt(NM.planReplace, { n: doc.scenes.length, count }))) return false;
    const fromText = NovelWriter.fromManuscript(doc);
    if (!fromText) { app.phase("llm", NM.planRunning); app.status(NM.planRunning); }
    const out = fromText || await NovelWriter.plan(app.llm(), doc, signal);
    if (out.title) doc.title = out.title;
    if (out.synopsis) doc.synopsis = out.synopsis;
    doc.scenes = out.scenes;
    doc.novel.imageCount = clamp(out.scenes.length, NV.limits.imageCount);
    app.clearNovelMedia();
    app.docChanged(true);
    app.left.render();
    const lines = out.scenes.reduce((n, s) => n + s.lines.length, 0);
    app.notice(fromText ? fmt(NM.manuscriptJson, { n: out.scenes.length, g: Doc.groups(doc).length, lines }) : fmt(NM.planDone, { n: out.scenes.length, g: Doc.groups(doc).length }), "ok");
    return true;
  }

  // ② IMAGES
  async images(signal, { force } = {}) {
    const app = this.app;
    const ids = this.doc.scenes.filter((s) => !s.noImage && !app.pickOf(s.id)).map((s) => s.id);
    if (!ids.length) { if (force) app.notice(NM.imagesNothing, "ok"); return true; }
    app.snapAspect();
    await app.runner.run(ids);
    if (signal.aborted) throw new DOMException("aborted", "AbortError");
    return !this.doc.scenes.some((s) => !s.noImage && !app.pickOf(s.id));
  }

  // ③ SCRIPT
  async script(signal, { force } = {}) {
    const app = this.app;
    const doc = this.doc;
    const missing = doc.scenes.filter((s) => !s.noImage && !app.pickOf(s.id));
    if (missing.length) { app.notice(fmt(NM.scriptNeedPicks, { list: missing.map((s) => `#${doc.scenes.indexOf(s) + 1}`).join("・") }), "warn", `scene:${missing[0].id}`); return false; }
    const groups = Doc.groups(doc);
    let todo = groups.map((g, gi) => gi).filter((gi) => groups[gi].scenes.some((s) => !s.lines.some((l) => l.text.trim())));
    if (!todo.length) {
      if (!force || !confirm(NM.scriptRedo)) return true;
      todo = groups.map((g, gi) => gi);
    }
    const llm = app.llm();
    await app.runner.freeImageVram();
    let total = 0;
    for (let t = 0; t < todo.length; t++) {
      const gi = todo[t];
      const text = fmt(NM.scriptRunning, { i: t + 1, n: todo.length });
      app.phase("llm", text);
      app.status(text);
      app.progress(t / todo.length);
      const images = [];
      for (const s of groups[gi].scenes) if (!s.noImage) images.push(await ImageChecker.imageUrl(app.pickOf(s.id).blob));
      const prev = gi > 0 ? groups[gi - 1].scenes.flatMap((s) => s.lines).filter((l) => l.text.trim()) : [];
      const out = await NovelWriter.script(llm, doc, groups, gi, prev, images, signal);
      groups[gi].scenes.forEach((s, k) => {
        s.lines = out[k];
        total += out[k].length;
        app.board.updateLines(s.id);
      });
      app.docChanged(false);
      app.left.paintSteps();
    }
    app.progress(1);
    app.board.render();
    app.notice(fmt(NM.scriptDone, { lines: total }), "ok");
    return true;
  }

  // ④ VOICE
  async voice(signal, { force, lines, count = 1, keepPick = false } = {}) {
    const app = this.app;
    let todo = lines ? lines.filter((l) => this.voiced(l)).flatMap((l) => Array(count).fill(l)) : this.allLines().filter((l) => this.autoVoiced(l) && ["stale", "error"].includes(this.voiceState(l).state));
    if (!todo.length) {
      const all = this.allLines().filter((l) => this.autoVoiced(l));
      if (!force || !all.length || !confirm(NM.voiceRedo)) { if (force) app.notice(NM.voiceNothing, "ok"); return true; }
      todo = all;
    }
    const client = app.voiceClient();
    const ready = await client.check();
    if (ready.state !== "ok") throw Guide.fail(ready.text, "settingsVoice");
    await app.runner.freeImageVram();
    let made = 0;
    const waiting = [...new Set(todo)];
    for (const l of waiting) {
      app.voices.set(l.id, { ...(app.voices.get(l.id) || { takes: [], pick: null }), state: "wait" });
      app.board.updateVoice(l.id);
    }
    try {
    for (let i = 0; i < todo.length; i++) {
      const line = todo[i];
      app.phase("voice", fmt(NM.voiceRunning, { i: i + 1, n: todo.length, state: "" }));
      app.progress(i / todo.length);
      const sig = this.voiceSig(line);
      const e = app.voices.get(line.id) || { takes: [], pick: null };
      const body = await this.voiceBody(line, e.takes.filter((t) => t.sig === sig).length);
      app.voices.set(line.id, { ...e, state: "run", error: "" });
      app.board.updateVoice(line.id);
      try {
        const out = await client.speak(body, signal, (st) => app.status(fmt(NM.voiceRunning, { i: i + 1, n: todo.length, state: st.state === "retry" ? fmt(NM.voiceRetry, { n: st.n }) : st.state === "queued" ? fmt(NM.voiceQueued, { n: st.queue_position || 1 }) : `${st.note || ""} ${Math.round(st.elapsed || 0)}s` })));
        const take = { id: "t" + uid(), blob: out.blob, url: URL.createObjectURL(out.blob), duration: out.duration, sig, at: Date.now() };
        const keep = keepPick && e.takes.some((t) => t.id === e.pick && t.sig === sig);
        app.voices.set(line.id, { takes: [...e.takes, take], pick: keep ? e.pick : take.id, state: todo.indexOf(line, i + 1) > i ? "wait" : "", error: "" });
        made++;
      } catch (err) {
        app.voices.set(line.id, { ...e, state: err?.name === "AbortError" ? "" : "error", error: Guide.text(err, "voice") });
        app.board.updateVoice(line.id);
        throw err;
      }
      app.board.updateVoice(line.id);
      app.left.paintSteps();
    }
    } finally {
      for (const l of waiting) {
        const e = app.voices.get(l.id);
        if (e?.state === "wait") { e.state = ""; app.board.updateVoice(l.id); }
      }
    }
    app.progress(1);
    app.notice(fmt(NM.voiceDone, { n: made }), "ok");
    return true;
  }

  seedOf(who, v, take = 0) {
    const n = Number(String(v.seed ?? "").trim());
    if (String(v.seed ?? "").trim() !== "" && Number.isFinite(n)) return Math.round(n) + take;
    let h = 0;
    for (const ch of String(who)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
    return NV.voice.seedBase + ((h + take) % NV.voice.seedSpan);
  }

  async voiceBody(line, take = 0) {
    const v = this.voiceOf(line.who);
    const cfg = this.app.store.data.voice;
    const who = NovelWriter.nameOf(this.doc, line.who);
    const text = `${Doc.emo(line.emo)}${line.text.trim()}`;
    if (text.length > NV.voice.maxTextChars) throw new UserError(fmt(NM.voiceTooLong, { n: NV.voice.maxTextChars }));
    const files = this.app.voiceFiles.get(line.who) || {};
    const voice = { mode: v.mode };
    if (v.mode === "cassette") {
      if (!files.cassette) throw Guide.fail(fmt(NM.voiceNeedCassette, { who }), "cast");
      voice.cassette_upload_base64 = await IrodoriClient.fileToDataUrl(files.cassette);
      voice.cassette_name = files.cassette.name;
    } else if (v.mode === "reference") {
      if (!files.refs?.length) throw Guide.fail(fmt(NM.voiceNeedRefs, { who }), "cast");
      voice.reference_audio_base64 = await Promise.all(files.refs.map(async (f) => ({ name: f.name, data: await IrodoriClient.fileToDataUrl(f) })));
    }
    const steps = String(cfg.numSteps ?? "").trim();
    return {
      text, caption: v.caption.trim() || null, checkpoint: cfg.checkpoint, voice,
      seed: this.seedOf(line.who, v, take), num_steps: steps === "" ? null : Number(steps), duration_scale: Number(cfg.durationScale) || 1, length_check: false,
    };
  }

  makeVoices(lines, count = 1) {
    return this.task((signal) => this.voice(signal, { lines, count }));
  }

  testVoice(who, msgEl) {
    return this.task(async (signal) => {
      setMsg(msgEl, NL.voiceRun);
      const out = await this.app.voiceClient().speak(await this.voiceBody(Doc.newLine({ who, text: NL.voiceTestText })), signal);
      const url = URL.createObjectURL(out.blob);
      this.play(url);
      setTimeout(() => URL.revokeObjectURL(url), Math.max(10, out.duration + 5) * 1000);
      setMsg(msgEl, fmt(NL.voiceDone, { sec: out.duration.toFixed(1) }), "ok");
      return true;
    }).then((ok) => { if (!ok) setMsg(msgEl, $("run-status").textContent, "err"); return ok; });
  }

  // ⑤ LOOP VIDEO
  async video(signal, { force, ids, keepPick = false } = {}) {
    const app = this.app;
    const doc = this.doc;
    let todo = ids ? ids.map((id) => doc.scenes.find((s) => s.id === id)).filter(Boolean) : doc.scenes.filter((s) => ["stale", "error"].includes(this.videoState(s).state));
    if (!todo.length) {
      const all = doc.scenes.filter((s) => s.loop);
      if (!force || !all.length || !confirm(NM.videoRedo)) { if (force) app.notice(NM.videoNothing, "ok"); return true; }
      todo = all;
    }
    const noPick = todo.find((s) => !app.pickOf(s.id));
    if (noPick) { app.notice(fmt(NM.scriptNeedPicks, { list: `#${doc.scenes.indexOf(noPick) + 1}` }), "warn", `scene:${noPick.id}`); return false; }
    for (const s of todo) {
      app.videos.set(s.id, { ...(app.videos.get(s.id) || { takes: [], pick: null }), state: "wait" });
      app.board.paintVideo(s.id);
    }
    try {
    const client = app.videoClient();
    const state = await Net.probe(client.probeUrl);
    if (state !== "ok") throw Guide.fail(state === "cors" ? NM.videoCors : fmt(NM.videoDown, { url: client.base }), "settingsVideo");
    const needPrompt = todo.filter((s) => !s.videoPrompt.trim());
    if (needPrompt.length) {
      await app.runner.freeImageVram();
      const llm = app.llm();
      for (let i = 0; i < needPrompt.length; i++) {
        const s = needPrompt[i];
        app.phase("llm", fmt(NM.videoPrompting, { i: i + 1, n: needPrompt.length }));
        app.status(fmt(NM.videoPrompting, { i: i + 1, n: needPrompt.length }));
        s.videoPrompt = await NovelWriter.videoPrompt(llm, doc, s, app.pickOf(s.id), signal);
        app.docChanged(false);
        app.board.paintVideo(s.id);
      }
    }
    await app.freeForMedia();
    await app.backend().freeVram();
    app.runner.vramFreed = true;
    const v = doc.novel.video;
    for (let i = 0; i < todo.length; i++) {
      const s = todo[i];
      const pick = app.pickOf(s.id);
      const sig = this.videoSig(s);
      const old = app.videos.get(s.id) || { takes: [], pick: null };
      const label = (p) => fmt(NM.videoRunning, { i: i + 1, n: todo.length, pct: p == null ? "" : `${Math.round(p * 100)}%` });
      app.phase("video", label());
      app.status(label());
      app.progress(i / todo.length);
      app.videos.set(s.id, { ...old, state: "run", error: "" });
      app.board.paintVideo(s.id);
      try {
        const out = await client.make({
          blob: pick.blob, prompt: s.videoPrompt, seconds: v.seconds, megapixels: v.megapixels, turbo: v.turbo,
          seed: Math.floor(Math.random() * USER_SETTINGS.seedMax), width: pick.width, height: pick.height,
        }, { signal, onProgress: (p) => { app.status(label(p)); app.progress((i + clamp(Number(p) || 0, [0, 0.99])) / todo.length); } });
        const take = { id: "v" + uid(), blob: out.blob, url: URL.createObjectURL(out.blob), sig, name: out.name, at: Date.now() };
        const keep = keepPick && old.takes.some((t) => t.id === old.pick && t.sig === sig);
        app.videos.set(s.id, { takes: [...old.takes, take], pick: keep ? old.pick : take.id, state: "", error: "" });
      } catch (err) {
        app.videos.set(s.id, { ...old, state: err?.name === "AbortError" ? "" : "error", error: Guide.text(err, "video") });
        app.board.paintVideo(s.id);
        throw err;
      }
      app.board.paintVideo(s.id);
      app.left.paintSteps();
    }
    } finally {
      for (const s of todo) {
        const e = app.videos.get(s.id);
        if (e?.state === "wait") { e.state = ""; app.board.paintVideo(s.id); }
      }
    }
    app.progress(1);
    app.notice(fmt(NM.videoDone, { n: todo.length }), "ok");
    return true;
  }

  makeVideos(ids) {
    return this.task((signal) => this.video(signal, { ids }));
  }
}

// ===== NUMBER CONTROL (SLIDER + STEPPER + CLICK TO TYPE) =====
class NumberControl {
  static watch(root) {
    root.querySelectorAll('input[type="number"]').forEach((el) => this.enhance(el));
    const obs = new MutationObserver((list) => {
      for (const rec of list) for (const node of rec.addedNodes) {
        if (node.nodeType !== 1) continue;
        if (node.matches?.('input[type="number"]')) this.enhance(node);
        node.querySelectorAll?.('input[type="number"]').forEach((el) => this.enhance(el));
      }
    });
    obs.observe(root, { childList: true, subtree: true });
    return obs;
  }

  static num(v) {
    const n = Number(v);
    return v === "" || v === null || v === undefined || !Number.isFinite(n) ? null : n;
  }

  static decimals(step) {
    const t = String(step || 1);
    return t.includes(".") ? t.split(".")[1].length : 0;
  }

  static enhance(src) {
    if (src.dataset.numctl || src.closest(".numctl")) return;
    src.dataset.numctl = "1";
    const cfg = USER_SETTINGS.numberControl;
    const box = h("div", { class: "numctl" });
    src.replaceWith(box);
    src.classList.add("numctl-src");
    const minus = h("button", { type: "button", class: "numctl-step dec", text: "−", "aria-label": "減らす" });
    const plus = h("button", { type: "button", class: "numctl-step inc", text: "+", "aria-label": "増やす" });
    const range = h("input", { type: "range", class: "numctl-range", tabindex: "-1" });
    const val = h("button", { type: "button", class: "numctl-val", title: "クリックして数値を入力" });
    box.append(src, minus, range, plus, val);
    const proto = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, "value");
    const read = () => proto.get.call(src);
    const bounds = () => ({
      min: this.num(src.getAttribute("min")), max: this.num(src.getAttribute("max")),
      smin: this.num(src.dataset.sliderMin), smax: this.num(src.dataset.sliderMax),
      step: this.num(src.getAttribute("step")) || 1,
    });
    const sync = () => {
      const b = bounds();
      const v = this.num(read());
      const slider = b.smin !== null && b.smax !== null;
      box.classList.toggle("no-slider", !slider);
      range.hidden = !slider;
      if (slider) { Object.assign(range, { min: b.smin, max: b.smax, step: b.step }); range.value = v ?? b.smin; }
      val.textContent = v === null ? (src.placeholder || "—") : v.toFixed(Math.min(this.decimals(b.step), 4)).replace(/(\.\d*?)0+$/, "$1").replace(/\.$/, "");
      val.classList.toggle("empty", v === null);
      box.classList.toggle("disabled", src.disabled);
      [minus, plus, range, val].forEach((el) => { el.disabled = src.disabled; });
    };
    const commit = (v) => {
      const b = bounds();
      let out = "";
      if (v !== null) {
        let n = v;
        if (b.min !== null) n = Math.max(b.min, n);
        if (b.max !== null) n = Math.min(b.max, n);
        out = String(Number(n.toFixed(Math.min(this.decimals(b.step) + 2, 6))));
      }
      if (out === read()) { sync(); return; }
      proto.set.call(src, out);
      sync();
      src.dispatchEvent(new Event("input", { bubbles: true }));
      src.dispatchEvent(new Event("change", { bubbles: true }));
    };
    Object.defineProperty(src, "value", { configurable: true, get: read, set: (v) => { proto.set.call(src, v); sync(); } });
    new MutationObserver(sync).observe(src, { attributes: true, attributeFilter: ["min", "max", "step", "disabled", "placeholder"] });
    const bump = (dir) => {
      const b = bounds();
      const cur = this.num(read()) ?? this.num(String(src.placeholder || "").match(/-?\d+(\.\d+)?/)?.[0]) ?? b.smin ?? b.min ?? 0;
      commit(Math.round((cur + dir * b.step) / b.step) * b.step);
    };
    for (const [btn, dir] of [[minus, -1], [plus, 1]]) {
      let timer = null;
      const stop = () => { clearTimeout(timer); clearInterval(timer); timer = null; };
      btn.addEventListener("pointerdown", (e) => {
        if (e.button !== 0) return;
        e.preventDefault();
        bump(dir);
        timer = setTimeout(() => { timer = setInterval(() => bump(dir), cfg.repeatMs); }, cfg.repeatDelayMs);
      });
      ["pointerup", "pointerleave", "pointercancel"].forEach((ev) => btn.addEventListener(ev, stop));
      btn.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); bump(dir); } });
    }
    range.addEventListener("input", () => commit(Number(range.value)));
    val.addEventListener("click", () => {
      const edit = h("input", { type: "text", class: "numctl-edit", inputmode: "decimal", value: read(), "aria-label": "数値を入力" });
      let done = false;
      const finish = (ok) => {
        if (done) return;
        done = true;
        edit.replaceWith(val);
        if (ok) {
          const t = edit.value.trim().replace(/[０-９．－]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xfee0)).replace("ー", "-");
          if (t === "") commit(null);
          else if (Number.isFinite(Number(t))) commit(Number(t));
        }
        sync();
      };
      edit.addEventListener("keydown", (e) => {
        if (e.key === "Enter") { e.preventDefault(); finish(true); }
        else if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); finish(false); }
      });
      edit.addEventListener("blur", () => finish(true));
      val.replaceWith(edit);
      edit.focus();
      edit.select();
    });
    sync();
  }
}

// ===== CLIPPED TEXT (HOVER SHOWS THE WHOLE TEXT) =====
class ClipTitle {
  static selector = ".clip, .clip-lines, .prop-label, .pill-app, .set-item .cap, .scene-stat";

  static attach(root, bag) {
    bag.on(root, "mouseover", (e) => {
      const el = e.target.closest?.(this.selector);
      if (!el) return;
      if (el.dataset.full) { el.title = el.dataset.full; return; }
      if (el.title && !el.dataset.autoTitle) return;
      const cut = el.scrollWidth > el.clientWidth + 1 || el.scrollHeight > el.clientHeight + 1;
      if (cut) { el.title = el.innerText.trim(); el.dataset.autoTitle = "1"; }
      else if (el.dataset.autoTitle) { el.removeAttribute("title"); delete el.dataset.autoTitle; }
    });
  }
}

// ===== AUTO-GROWING TEXT AREAS (THE WHOLE TEXT IS ALWAYS VISIBLE) =====
class AutoGrow {
  static fit(el) {
    if (!el.isConnected || !el.offsetParent) return;
    if (el.dataset.manual) { el.style.overflowY = "auto"; return; }
    el.style.height = "0px";
    const full = el.scrollHeight + el.offsetHeight - el.clientHeight;
    const max = USER_SETTINGS.textGrowMaxPx;
    el.style.height = `${Math.min(full, max)}px`;
    el.style.overflowY = full > max ? "auto" : "hidden";
  }

  static fitAll(root) {
    root.querySelectorAll?.("textarea.autogrow").forEach((el) => this.fit(el));
  }

  static watch(root, columns, bag) {
    const mark = (el) => { el.classList.add("autogrow"); requestAnimationFrame(() => this.fit(el)); };
    root.querySelectorAll("textarea").forEach(mark);
    const obs = new MutationObserver((list) => {
      for (const rec of list) for (const node of rec.addedNodes) {
        if (node.nodeType !== 1) continue;
        if (node.matches("textarea")) mark(node);
        node.querySelectorAll("textarea").forEach(mark);
      }
    });
    obs.observe(root, { childList: true, subtree: true });
    bag.on(root, "input", (e) => { if (e.target.matches?.("textarea.autogrow")) this.fit(e.target); });
    bag.on(root, "pointerdown", (e) => {
      const t = e.target;
      if (!t.matches?.("textarea.autogrow")) return;
      const r = t.getBoundingClientRect();
      if (e.clientX < r.right - USER_SETTINGS.resizeGripPx || e.clientY < r.bottom - USER_SETTINGS.resizeGripPx) return;
      const before = t.offsetHeight;
      const up = () => { window.removeEventListener("pointerup", up, true); if (t.offsetHeight !== before) t.dataset.manual = "1"; };
      window.addEventListener("pointerup", up, true);
    });
    bag.on(root, "toggle", (e) => this.fitAll(e.target), true);
    const widths = new Map();
    const ro = new ResizeObserver((entries) => {
      for (const en of entries) {
        const w = Math.round(en.contentRect.width);
        if (widths.get(en.target) === w) continue;
        widths.set(en.target, w);
        this.fitAll(en.target);
      }
    });
    columns.forEach((el) => ro.observe(el));
    return { disconnect() { obs.disconnect(); ro.disconnect(); } };
  }
}

// ===== CORS EXTENSIONS FOR FORGE / COMFYUI (DOWNLOAD) =====
class CorsExtension {
  static origins(backend) {
    const cfg = USER_SETTINGS.corsExtensions[backend];
    const page = location.protocol.startsWith("http") ? location.origin : null;
    return [...new Set([...(page ? [page] : []), ...cfg.defaultOrigins])];
  }

  static pingUrl(backend, baseUrl) {
    return `${String(baseUrl || USER_SETTINGS.backends[backend].url).replace(/\/+$/, "")}${USER_SETTINGS.corsExtensions[backend].pingPath}`;
  }

  static zip(backend) {
    const cfg = USER_SETTINGS.corsExtensions[backend];
    const origins = this.origins(backend);
    const source = cfg.source.replace("__ORIGINS__", origins.map((o) => `    ${JSON.stringify(o)},`).join("\n"));
    const readme = cfg.readme.replace("__ORIGINS_TEXT__", origins.join(" / ")).replace(/\n/g, "\r\n");
    return ZipWriter.build([
      { path: `${cfg.folder}/${cfg.file}`, data: source },
      { path: `${cfg.folder}/README.txt`, data: readme },
    ]);
  }

  static download(backend) {
    downloadBlob(this.zip(backend), USER_SETTINGS.corsExtensions[backend].zipName);
  }

  static async ping(backend, baseUrl) {
    try {
      const res = await fetch(this.pingUrl(backend, baseUrl), { signal: AbortSignal.timeout(USER_SETTINGS.probeTimeoutMs) });
      return res.ok ? await res.json() : null;
    } catch {
      return null;
    }
  }
}

// ===== FORM HELPERS (CONTROLS BOUND TO AN OBJECT KEY) =====
class Form {
  static field(label, control, extra) {
    return h("label", { class: "field" }, label, control, extra);
  }

  static prop(label, control, { note, title, top } = {}) {
    return [
      h("div", { class: `prop${top ? " top" : ""}`, title }, h("span", { class: "prop-label", text: label }), control),
      note ? h("p", { class: "note", text: note }) : null,
    ];
  }

  static text(obj, key, onChange, props = {}) {
    const el = h(props.rows ? "textarea" : "input", { ...props, value: obj[key] ?? "" });
    el.addEventListener("input", () => { obj[key] = el.value; onChange?.(key, el.value); });
    return el;
  }

  static number(obj, key, onChange, range, props = {}) {
    const { slider, allowEmpty, ...rest } = props;
    const attrs = { type: "number", min: range?.[0], ...rest, value: obj[key] ?? "" };
    if (slider) Object.assign(attrs, { max: range?.[1], "data-slider-min": slider[0], "data-slider-max": slider[1] });
    const el = h("input", attrs);
    el.addEventListener("change", () => {
      if (el.value === "" && allowEmpty) { obj[key] = null; onChange?.(key, null); return; }
      let v = Number(el.value);
      if (!Number.isFinite(v) || el.value === "") v = Number(obj[key]) || (range ? range[0] : 0);
      if (range) v = clamp(v, range);
      if (String(v) !== el.value) el.value = v;
      obj[key] = v;
      onChange?.(key, v);
    });
    return el;
  }

  static check(obj, key, label, onChange) {
    const el = h("input", { type: "checkbox", checked: !!obj[key] });
    el.addEventListener("change", () => { obj[key] = el.checked; onChange?.(key, el.checked); });
    return h("label", { class: "check" }, el, label);
  }

  static select(obj, key, entries, onChange, props = {}) {
    const { listed, ...attrs } = props;
    const el = h("select", attrs);
    const value = obj[key] ?? "";
    const list = entries.some(([v]) => String(v) === String(value)) ? entries : [...entries, [value, entries.length && listed !== false ? `${value} ${L.notInList}` : String(value)]];
    fillSelect(el, list, value);
    el.addEventListener("change", () => { obj[key] = el.value; onChange?.(key, el.value); });
    return el;
  }

  static seg(entries, value, onPick) {
    const box = h("div", { class: "seg", role: "group" });
    const paint = (v) => box.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.value === String(v))));
    box.append(...entries.map(([v, label]) => h("button", { type: "button", "data-value": v, text: label, onclick: () => { paint(v); onPick(v); } })));
    paint(value);
    return box;
  }

  static section(key, title, body, tools = []) {
    return h("section", { class: "psec", "data-sec": key },
      h("h2", { class: "psec-title" }, h("span", { class: "clip", text: title }), tools.length ? h("span", { class: "tools" }, ...tools) : null),
      h("div", { class: "psec-body" }, ...body.flat().filter(Boolean)));
  }
}
// ===== LEFT PANEL (BASE IMAGE / STORY / CAST / LOCATIONS) =====

  changed(structural = false) { this.app.docChanged(structural); }

  render() {
    const top = this.root.scrollTop;
    const novel = this.app.doc.mode === "novel";
    this.stepsEl = null;
    this.root.replaceChildren(...[this.modeSection(), this.baseSection(), novel ? this.novelStorySection() : this.storySection(), this.castSection(), this.locationSection(), novel ? this.stepsSection() : null].filter(Boolean));
    this.root.scrollTop = top;

  modeSection() {
    const app = this.app;
    return Form.section("mode", NL.secMode, [

  novelStorySection() {

    if (novelCast) this.voiceDrop(item, p.voice, p.id, p.name);
    return item;
  }

  voiceSwitch(obj, label, key = "on") {
    const sw = Form.check(obj, key, label, () => { this.changed(); this.render(); this.app.board.paintNovel(); this.paintSteps(); });
    sw.classList.add("voice-switch");
    return sw;
  }

  voiceDrop(el, voice, key, name) {
    const hasFiles = (e) => [...(e.dataTransfer?.types || [])].includes("Files");
    el.title = NL.voiceDrop;
    el.addEventListener("dragover", (e) => { if (!hasFiles(e)) return; e.preventDefault(); e.stopPropagation(); el.classList.add("drop-on"); });
    el.addEventListener("dragleave", (e) => { if (!el.contains(e.relatedTarget)) el.classList.remove("drop-on"); });
    el.addEventListener("drop", (e) => {
      el.classList.remove("drop-on");
      const files = [...(e.dataTransfer?.files || [])];
      if (!files.length) return;
      e.preventDefault();
      e.stopPropagation();
      this.app.loadVoiceFiles(key, voice, files, name);
    });
  }

  narratorItem() {
    const nv = this.app.doc.novel;
    const item = h("div", { class: "item narrator-item" },
      h("div", { class: "item-head" }, h("span", { class: "tag", text: "—" }), h("b", { text: NL.narratorVoice })),
      this.voiceSwitch(nv, NL.narrate, "narrate"),
      nv.narrate ? this.voiceBox(nv.narrator, NV.narrator) : null);
    this.voiceDrop(item, nv.narrator, NV.narrator, NL.narratorName);
    return item;
  }

  castTools(p) {
    const app = this.app;
    const doc = app.doc;
    const scenes = doc.scenes.filter((s) => s.cast.includes(p.id));
    const lines = doc.scenes.flatMap((s) => s.lines).filter((l) => l.who === p.id && l.text.trim());
    const busy = app.runner.busy || app.novel.busy;
    return h("div", { class: "cast-tools", "data-cast": p.id },
      h("p", { class: "note keep cast-usage", text: fmt(NL.castUsage, { images: scenes.length, lines: lines.length }) }),
      h("div", { class: "row" },
        h("button", { class: "mini", text: NL.castRegenImages, title: NL.castRegenImagesTitle, disabled: !scenes.length || busy, onclick: () => app.regenCastImages(p) }),
        h("button", { class: "mini", text: NL.castRegenVoices, title: NL.castRegenVoicesTitle, disabled: !lines.length || busy, onclick: () => app.novel.makeVoices(lines) })));
  }

  // 名前は打つたびにシーンを描き直すと重いので、入力欄から離れたとき（Enter を含む）にシーンへ反映する
  nameInput(p, placeholder) {
    const el = Form.text(p, "name", () => this.changed(false), { placeholder });
    el.addEventListener("change", () => this.changed(true));
    return el;
  }

  castFileRow() {
    const app = this.app;
    const input = h("input", { type: "file", accept: ".json,application/json", hidden: true });
    input.addEventListener("change", async () => {
      const f = input.files?.[0];
      input.value = "";
      if (!f) return;
      try { await app.swapCastFrom(await readJsonFile(f)); } catch { app.notice(M.loadFailed, "err"); }
    });
    return h("div", { class: "row request-row" },
      h("button", { class: "small", text: NL.castLoad, title: NL.castLoadTitle, onclick: () => input.click() }),
      h("button", { class: "small", text: NL.castSave, onclick: () => app.saveCast() }),
      input);
  }

  castSection() {
    const doc = this.app.doc;
    return Form.section("cast", L.secCast, [
      h("p", { class: "note", text: L.castNote }),
      h("p", { class: "note", text: L.castPromptNote }),
      ...doc.cast.map((p, i) => this.personItem(doc.cast, p, i, "cast")),
      h("button", { text: L.addCast, onclick: () => { doc.cast.push(Doc.person({}, "c")); this.changed(true); this.render(); } }),
      doc.mode === "novel" ? this.castFileRow() : null,
      doc.mode === "novel" ? h("p", { class: "note", text: NL.silentNote }) : null,
      doc.mode === "novel" ? this.narratorItem() : null,
    ]);
  }

  locationSection() {
    const doc = this.app.doc;
    return Form.section("locations", L.secLocations, [
      h("p", { class: "note", text: L.locationsNote }),
      ...doc.locations.map((p, i) => this.personItem(doc.locations, p, i, "loc")),
      h("button", { text: L.addLocation, onclick: () => { doc.locations.push(Doc.person({}, "l")); this.changed(true); this.render(); } }),
    ]);
  }
}

// ===== RIGHT PANEL (COMMON IMAGE SETTINGS / RUN AND CHECK) =====
class RightPanel {
  constructor(app) {
    this.app = app;
    this.root = $("right-panel");
    this.tabs = $("right-tabs");
    this.bag = new Listeners();
    this.tabs.replaceChildren(...USER_SETTINGS.rightTabs.map(([k, label]) => h("button", { role: "tab", "data-tab": k, text: label })));
    this.bag.on(this.tabs, "click", (e) => {
      const tab = e.target.closest("[data-tab]")?.dataset.tab;
      if (tab) this.show(tab);
    });
  }

  destroy() { this.bag.destroy(); this.root.replaceChildren(); }

  get tab() {
    const t = this.app.store.data.ui.rightTab;
    return USER_SETTINGS.rightTabs.some(([k]) => k === t) ? t : USER_SETTINGS.rightTabs[0][0];
  }

  show(tab, focusKey) {
    this.app.store.data.ui.rightTab = tab;
    this.app.store.save();
    this.render();
    if (focusKey) {
      const el = this.root.querySelector(`[data-key="${focusKey}"]`);
      el?.scrollIntoView({ block: "center", behavior: "smooth" });
      el?.focus();

        res.forgeNeo || res.textEncoders?.length || c.textEncoder
          ? Form.prop(L.textEncoder, Form.select(c, "textEncoder", this.listEntries(res.textEncoders, [["Automatic", L.vaeAuto]]), () => this.changed(), { "data-key": "textEncoder", listed: !!res.textEncoders?.length }), { title: L.textEncoderTitle })
          : null,
        Form.prop(L.family, famSel, { title: L.familyTitle }),

      ], [loadBtn]),
      Form.section("prompt", L.secPrompt, [
        Form.prop(L.quality, Form.text(c, "quality", () => this.changed(), { rows: 2, "data-key": "quality" }), { top: true, note: L.qualityNote }),
        Form.prop(L.suffix, suffixEl, { top: true, note: L.suffixNote }),

        Form.prop(L.negative, Form.text(c, "negative", () => this.changed(), { rows: 4 }), { top: true }),
        Form.prop(L.promptLayout, Form.seg([["lines", L.promptLayoutLines], ["inline", L.promptLayoutInline]], c.promptLayout, (v) => { c.promptLayout = v; this.changed(); }), { note: L.promptLayoutNote }),
      ]),

        Form.prop(L.sampler, Form.select(s, "sampler", this.listEntries(res.samplers), () => this.changed(), { listed: !!res.samplers?.length })),
        Form.prop(L.scheduler, Form.select(s, "scheduler", this.listEntries(res.schedulers), () => this.changed(), { listed: !!res.schedulers?.length })),
        Form.prop(L.steps, Form.number(s, "steps", () => this.changed(), lim.steps, { slider: sl.steps })),
        Form.prop(L.cfg, Form.number(s, "cfg", () => this.changed(), lim.cfg, { step: 0.5, slider: sl.cfg })),

// ===== DRAG SORT (REORDER BY DRAGGING, OTHERS MOVE LIVE) =====
class DragSort {
  constructor({ container, item, handle, id, onEnd, threshold = 5 }) {
    this.o = { container, item, handle, id, onEnd, threshold };
    this.down = (e) => this.start(e);
    container.addEventListener("pointerdown", this.down);
  }

  destroy() {
    this.o.container.removeEventListener("pointerdown", this.down);
    this.stop?.();
  }

  items() {
    return [...this.o.container.children].filter((el) => el.matches(this.o.item));
  }

  start(e) {
    if (e.button !== 0) return;
    const grip = e.target.closest(this.o.handle);
    const el = grip?.closest(this.o.item);
    if (!el || el.parentElement !== this.o.container) return;
    e.preventDefault();
    const c = this.o.container;
    const doc = c.ownerDocument;
    const win = doc.defaultView;
    const before = this.items().map(this.o.id);
    const s = { x: e.clientX, y: e.clientY, on: false, last: e, raf: 0 };
    const local = (ev) => {
      const r = c.getBoundingClientRect();
      return { x: ev.clientX - r.left - c.clientLeft, y: ev.clientY - r.top - c.clientTop };
    };
    const flip = (els, first) => {
      for (const sib of els) {
        const f = first.get(sib);
        const dx = f.x - sib.offsetLeft, dy = f.y - sib.offsetTop;
        if (!dx && !dy) continue;
        sib.style.transition = "none";
        sib.style.transform = `translate(${dx}px, ${dy}px)`;
        sib.getBoundingClientRect();
        sib.style.transition = "transform .2s ease";
        sib.style.transform = "";
      }
    };
    const follow = () => {
      const p = local(s.last);
      el.style.transform = `translate(${s.ox + p.x - s.px - el.offsetLeft}px, ${s.oy + p.y - s.py - el.offsetTop}px)`;
    };
    const place = () => {
      const p = local(s.last);
      const cx = s.ox + p.x - s.px + el.offsetWidth / 2;
      const cy = s.oy + p.y - s.py + el.offsetHeight / 2;
      const sibs = this.items().filter((x) => x !== el);
      const at = sibs.filter((x) => {
        const sy = x.offsetTop + x.offsetHeight / 2;
        if (Math.abs(sy - cy) < Math.min(x.offsetHeight, el.offsetHeight) / 2) return x.offsetLeft + x.offsetWidth / 2 < cx;
        return sy < cy;
      }).length;
      const now = this.items().indexOf(el);
      if (at !== now) {
        const first = new Map(sibs.map((x) => [x, { x: x.offsetLeft, y: x.offsetTop }]));
        const ref = sibs[at];
        c.insertBefore(el, ref || sibs[sibs.length - 1].nextSibling);
        flip(sibs, first);
      }
      follow();
    };
    const scroll = () => {
      s.raf = 0;
      if (!s.on) return;
      const edge = 60, y = s.last.clientY, vh = win.innerHeight;
      const dy = y < edge ? -(edge - y) / 3 : y > vh - edge ? (y - (vh - edge)) / 3 : 0;
      if (!dy) return;
      let box = c.parentElement;
      while (box && box !== doc.body && !(box.scrollHeight > box.clientHeight && /(auto|scroll)/.test(win.getComputedStyle(box).overflowY))) box = box.parentElement;
      if (box && box !== doc.body) box.scrollTop += dy; else win.scrollBy(0, dy);
      place();
      s.raf = win.requestAnimationFrame(scroll);
    };
    const move = (ev) => {
      s.last = ev;
      if (!s.on) {
        if (Math.hypot(ev.clientX - s.x, ev.clientY - s.y) < this.o.threshold) return;
        s.on = true;
        c.classList.add("drag-sorting");
        const p = local(e);
        Object.assign(s, { px: p.x, py: p.y, ox: el.offsetLeft, oy: el.offsetTop });
        el.classList.add("drag-lifted");
        doc.body.classList.add("drag-active");
      }
      place();
      if (!s.raf) s.raf = win.requestAnimationFrame(scroll);
    };
    const end = () => {
      this.stop();
      if (!s.on) return;
      el.style.transition = "transform .2s ease";
      el.style.transform = "";
      const after = this.items().map(this.o.id);
      win.setTimeout(() => {
        el.classList.remove("drag-lifted");
        c.classList.remove("drag-sorting");
        for (const x of this.items()) { x.style.transition = ""; x.style.transform = ""; }
        if (after.join("\n") !== before.join("\n")) this.o.onEnd(after);
      }, 210);
      const swallow = (ev) => { ev.stopPropagation(); ev.preventDefault(); };
      doc.addEventListener("click", swallow, { capture: true, once: true });
      win.setTimeout(() => doc.removeEventListener("click", swallow, { capture: true }), 0);
    };
    this.stop = () => {
      doc.removeEventListener("pointermove", move);
      doc.removeEventListener("pointerup", end);
      doc.removeEventListener("pointercancel", end);
      if (s.raf) win.cancelAnimationFrame(s.raf);
      s.raf = 0;
      doc.body.classList.remove("drag-active");
      this.stop = null;
    };
    doc.addEventListener("pointermove", move);
    doc.addEventListener("pointerup", end);
    doc.addEventListener("pointercancel", end);
  }
}

// ===== SCENE BOARD (ONE CARD PER SCENE) =====
class SceneBoard {
  constructor(app) {
    this.app = app;
    this.root = $("scenes");
    this.cards = new Map();
    this.sort = new DragSort({ container: this.root, item: ".scene", handle: ".drag-grip", id: (el) => el.dataset.scene, onEnd: (ids) => app.reorderScenes(ids) });
    this.groupSort = new DragSort({ container: this.root, item: ".nv-group", handle: ".nv-group-grip", id: (el) => el.dataset.group, onEnd: (ids) => app.reorderGroups(ids) });
    this.lineDrag = (e) => this.startLineDrag(e);
    this.root.addEventListener("pointerdown", this.lineDrag);
    this.groupSorts = [];
    this.collapsed = new Set();
  }

  destroy() { this.sort.destroy(); this.groupSort.destroy(); this.groupSorts.forEach((x) => x.destroy()); this.root.removeEventListener("pointerdown", this.lineDrag); this.cards.clear(); this.root.replaceChildren(); }

  render() {
    const doc = this.app.doc;
    this.cards.clear();
    this.groupSorts.forEach((x) => x.destroy());
    this.groupSorts = [];
    if (!doc.scenes.length) {
      this.root.replaceChildren(h("div", { class: "empty-board", text: L.emptyBoard, style: "white-space:pre-line" }));
      return;
    }
    if (doc.mode === "novel") { this.root.replaceChildren(...this.novelGroups()); return; }
    this.root.replaceChildren(...doc.scenes.map((s, i) => this.card(s, i)));
  }

  // NOVEL GAME: SCENE GROUPS, LINES AND LOOP VIDEO
  novelGroups() {
    const app = this.app;
    const doc = app.doc;
    return Doc.groups(doc).map((g, gi) => {
      const head = g.head;
      const lines = g.scenes.reduce((n, s) => n + s.lines.filter((l) => l.text.trim()).length, 0);
      const body = h("div", { class: "nv-group-body" }, ...g.scenes.map((s, k) => this.card(s, doc.scenes.indexOf(s), { group: gi, k })));
      this.groupSorts.push(new DragSort({ container: body, item: ".scene", handle: ".drag-grip", id: (el) => el.dataset.scene, onEnd: (ids) => app.reorderInGroup(head.id, ids) }));
      const sec = h("section", { class: `nv-group${this.collapsed.has(head.id) ? " collapsed" : ""}`, "data-group": head.id });
      const toggle = h("button", { class: "mini quiet nv-group-toggle", title: NL.groupToggle, text: this.collapsed.has(head.id) ? "▸" : "▾", onclick: () => {
        const on = !this.collapsed.has(head.id);
        if (on) this.collapsed.add(head.id); else this.collapsed.delete(head.id);
        sec.classList.toggle("collapsed", on);
        toggle.textContent = on ? "▸" : "▾";
      } });
      sec.append(
        h("div", { class: "nv-group-head" },
          h("span", { class: "nv-group-grip", title: NL.groupGrip, "aria-hidden": "true" }),
          toggle,

  startLineDrag(e) {
    const grip = e.target.closest(".nv-line-grip");
    if (!grip || e.button !== 0) return;
    const row = grip.closest(".nv-line");
    const lineId = row?.dataset.line;
    if (!lineId) return;
    e.preventDefault();
    const doc = row.ownerDocument;
    const win = doc.defaultView;
    const grab = e.clientY - row.getBoundingClientRect().top;
    const lists = [...this.root.querySelectorAll(".nv-lines")];
    const s = { x: e.clientX, y: e.clientY, on: false, raf: 0, shift: 0 };
    const rowsOf = (list) => [...list.children].filter((el) => el.matches(".nv-line") && el !== row);
    const listAt = () => {
      row.style.visibility = "hidden";
      const hit = doc.elementFromPoint(s.x, s.y)?.closest(".scene");
      row.style.visibility = "";
      return (hit && !hit.closest(".nv-group.collapsed") && hit.querySelector(".nv-lines")) || row.parentElement;
    };
    const reorder = () => {
      const list = listAt();
      const rows = rowsOf(list);
      const p = s.y - list.getBoundingClientRect().top;
      const ref = rows[rows.filter((el) => el.offsetTop + el.offsetHeight / 2 < p).length] || null;
      if (row.parentElement === list && row.nextElementSibling === ref) return;
      const moving = list === row.parentElement ? rows : [...rows, ...rowsOf(row.parentElement)];
      const visual = moving.map((el) => el.getBoundingClientRect().top);
      list.insertBefore(row, ref);
      for (const el of moving) { el.style.transition = "none"; el.style.transform = ""; }
      const natural = moving.map((el) => el.getBoundingClientRect().top);
      moving.forEach((el, i) => { const d = visual[i] - natural[i]; el.style.transform = d ? `translateY(${d}px)` : ""; });
      doc.body.getBoundingClientRect();
      for (const el of moving) { el.style.transition = ""; el.style.transform = ""; }
    };
    const place = () => {
      const natural = row.getBoundingClientRect().top - s.shift;
      s.shift = s.y - grab - natural;
      row.style.transform = `translateY(${s.shift}px)`;
    };
    const update = () => { reorder(); place(); };
    const scroll = () => {
      s.raf = 0;
      const edge = USER_SETTINGS.dragEdgePx, vh = win.innerHeight;
      const dy = s.y < edge ? -(edge - s.y) / 3 : s.y > vh - edge ? (s.y - (vh - edge)) / 3 : 0;
      if (!dy) return;
      win.scrollBy(0, dy);
      update();
      s.raf = win.requestAnimationFrame(scroll);
    };
    const move = (ev) => {
      s.x = ev.clientX;
      s.y = ev.clientY;
      if (!s.on) {
        if (Math.hypot(ev.clientX - e.clientX, ev.clientY - e.clientY) < USER_SETTINGS.dragThresholdPx) return;
        s.on = true;
        for (const l of lists) l.classList.add("nv-sorting");
        row.classList.add("nv-line-lifted");
        doc.body.classList.add("drag-active");
      }
      update();
      if (!s.raf) s.raf = win.requestAnimationFrame(scroll);
    };
    const end = () => {
      doc.removeEventListener("pointermove", move);
      doc.removeEventListener("pointerup", end);
      doc.removeEventListener("pointercancel", end);
      if (s.raf) win.cancelAnimationFrame(s.raf);
      doc.body.classList.remove("drag-active");
      if (!s.on) return;
      row.classList.remove("nv-line-lifted");
      row.style.transform = "";
      const target = row.closest(".scene")?.dataset.scene;
      const index = [...row.parentElement.children].filter((el) => el.matches(".nv-line")).indexOf(row);
      win.setTimeout(() => {
        for (const l of lists) l.classList.remove("nv-sorting");
        this.moveLine(lineId, target, index);
      }, USER_SETTINGS.dragSettleMs);
    };
    doc.addEventListener("pointermove", move);
    doc.addEventListener("pointerup", end);
    doc.addEventListener("pointercancel", end);
  }

    const doc = this.app.doc;
    const scene = doc.scenes.find((s) => s.id === sceneId);
    if (!card || !scene) return;
    const size = Runner.sizeOf(doc, scene);
    const base = Runner.seedBase(doc, scene);
    const seed = Number(base) >= 0 ? fmt(L.previewSeedFrom, { v: base }) : L.previewSeedRandom;
    const meta = fmt(L.previewMeta, { w: size.width, h: size.height, seed, n: Doc.perScene(doc, scene) });
    card.previewLabel.textContent = scene.customPrompt ? L.previewPromptCustom : L.previewPrompt;
    card.el.classList.toggle("custom-prompt", !!scene.customPrompt);
    // 個別指定の入力中は、打っている欄を作り直さない（上の行だけ更新する）
    const metaEl = card.preview.querySelector(".preview-meta");
    if (scene.customPrompt && card.preview.dataset.mode === "custom" && metaEl) { metaEl.textContent = meta; return; }
    const app = this.app;
    const changed = () => { app.docChanged(false); };
    if (!scene.customPrompt) {
      const p = PromptBuilder.auto(doc, scene);
      card.preview.dataset.mode = "auto";
      card.preview.replaceChildren(h("p", { class: "note", text: L.customPromptOffNote }), h("pre", { class: "preview-prompt" }, h("span", { class: "preview-meta", text: meta }), `\n\n${p.prompt}\n\nNegative: ${p.negative}`));
      return;
    }
    const pos = Form.text(scene, "customText", changed, { rows: 4, "data-key": "customText" });
    const neg = Form.text(scene, "customNegative", changed, { rows: 2, "data-key": "customNegative" });
    const reset = h("button", { class: "mini", text: L.customPromptReset, onclick: () => {
      const auto = PromptBuilder.auto(doc, scene);
      pos.value = auto.prompt;
      neg.value = auto.negative;
      pos.dispatchEvent(new Event("input"));
      neg.dispatchEvent(new Event("input"));
      AutoGrow.fitAll(card.preview);
    } });
    card.preview.dataset.mode = "custom";
    card.preview.replaceChildren(
      h("p", { class: "note", text: L.customPromptNote }),
      h("pre", { class: "preview-prompt preview-meta", text: meta }),
      Form.field(L.customPromptText, pos),
      Form.field(L.customPromptNegative, neg),
      h("div", { class: "row" }, reset));
  }

  updateAllPreviews() {
    for (const id of this.cards.keys()) this.updatePreview(id);
  }

  updateAllImages() {
    for (const id of this.cards.keys()) this.updateImages(id);
  }

  updateImages(sceneId) {
    const card = this.cards.get(sceneId);
    if (!card) return;
    const app = this.app;
    const run = app.doc.run;
    const list = app.images.list(sceneId);
    const picked = app.pickOf(sceneId);
    const c = Judge.counts(list, run);
    const scene = app.doc.scenes.find((s) => s.id === sceneId);
    const total = scene ? Doc.perScene(app.doc, scene) : 0;
    card.stat.innerHTML = fmt(L.statLine, { total: `${c.total}/${total}`, good: c.good, ng: c.ng, pending: c.pending }) + (picked ? esc(fmt(L.statPicked, { n: list.indexOf(picked) + 1 })) : "");
    if (app.doc.mode === "novel") {
      const scene = app.doc.scenes.find((s) => s.id === sceneId);
      const sw = Form.check(scene, "noImage", NL.noImage, () => { app.docChanged(false); this.updateImages(sceneId); this.paintVideo(sceneId); app.left.paintSteps(); });
      sw.classList.add("nv-noimage-switch");
      card.el.classList.toggle("no-image", !!scene.noImage);
      const scrolled = card.media.querySelector(".thumbs.strip")?.scrollLeft || 0;
      if (scene.noImage) card.media.replaceChildren(sw, h("div", { class: "nv-noimage", text: NL.noImageNote }));
      else card.media.replaceChildren(sw, ...(list.length ? [this.thumbs(sceneId, list, picked, null, { strip: true })] : []), this.pickView(sceneId, list, picked),
        h("button", { class: "nv-pick-open", text: list.length ? fmt(NL.pickerOpen, { n: list.length }) : NL.pickerOpenEmpty, onclick: () => app.picker.open(sceneId) }));
      const strip = card.media.querySelector(".thumbs.strip");
      if (strip) strip.scrollLeft = scrolled;
      if (app.picker.sceneId === sceneId) app.picker.render();
      return;
    }
    if (!list.length) {
      card.media.replaceChildren(h("div", { class: "thumbs-empty", text: L.noImages }), this.mediaRunButton(sceneId));
      return;
    }
    card.media.replaceChildren(this.thumbs(sceneId, list, picked), this.mediaRunButton(sceneId), this.pickView(sceneId, list, picked));
  }

  thumbs(sceneId, list, picked, onPick = null, { strip = false } = {}) {
    const app = this.app;
    const run = app.doc.run;
    return h("div", { class: strip ? "thumbs strip" : "thumbs" }, ...(strip ? [...list].reverse() : list).map((img) => {
      const i = list.indexOf(img);
      const v = Judge.verdict(img, run);
      const badge = img.check?.anatomy ? L.anatomyNg : img.check?.state === "done" ? fmt(L.scorePt, { score: img.check.score }) : img.check?.state === "error" ? "!" : img.manual ? (v ? L.ok : L.ng) : `#${i + 1}`;
      const pinned = app.picks.get(sceneId) === img.id;
      const cls = ["thumb", v === true ? "ok" : v === false ? "ng" : "pending", img === picked ? "picked" : "", pinned ? "pinned" : ""].filter(Boolean).join(" ");
      const select = () => (onPick ? onPick(img.id) : this.selectImage(sceneId, img.id));
      let timer = 0;
      const click = () => {
        if (!strip) { select(); return; }
        clearTimeout(timer);
        timer = setTimeout(select, USER_SETTINGS.dblClickWaitMs);
      };
      const open = () => { clearTimeout(timer); app.viewer.open(sceneId, img.id); };
      const ck = img.check;
      const tip = [`#${i + 1}`, ck?.state === "done" ? fmt(L.scorePt, { score: ck.score }) : ck?.error, ck?.anatomy ? L.anatomyNg : "", Number.isFinite(ck?.match) ? fmt(L.matchPct, { v: ck.match }) : "", ...(ck?.issues || []), ...(ck?.missing || []), L.thumbHint].filter(Boolean).join("\n");
      return h("div", { class: cls, title: tip, role: "button", tabindex: 0, "data-image": img.id, onclick: click, ondblclick: open, onkeydown: (e) => { if (e.target === e.currentTarget && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); select(); } } },
        h("img", { src: img.thumb, alt: "", loading: "lazy" }),
        h("span", { class: `badge ${v === true ? "ok" : v === false ? "ng" : ""}`, text: badge }),
        h("button", { class: "pin", text: "★", title: L.pinTitle, "aria-pressed": String(pinned), disabled: !img.blob, onclick: (e) => { e.stopPropagation(); app.togglePin(sceneId, img.id); app.sceneChanged(sceneId); } }),
        h("button", { class: "del", text: "✕", title: L.thumbDelete, "aria-label": `#${i + 1} ${L.thumbDelete}`, ondblclick: (e) => e.stopPropagation(), onclick: (e) => { e.stopPropagation(); app.deleteImage(sceneId, img.id); } }));
    }));
  }

  // 1列に並ぶとき（狭い画面）だけ出す「このシーンを生成」。サムネイルと大きく出る1枚の間に置く。広いときは入力欄の下のものを使う
  mediaRunButton(sceneId) {
    return h("button", { class: "primary scene-run scene-run-media", text: L.runScene, disabled: this.app.runner.busy, onclick: () => this.app.run([sceneId]) });
  }

  selectImage(sceneId, imageId) {
    const app = this.app;
    const card = this.cards.get(sceneId);
    const list = app.images.list(sceneId);
    if (!card || !list.find((i) => i.id === imageId)?.blob) return;
    app.picks.set(sceneId, imageId);
    const picked = app.pickOf(sceneId);
    const c = Judge.counts(list, app.doc.run);
    const scene = app.doc.scenes.find((s) => s.id === sceneId);
    card.stat.innerHTML = fmt(L.statLine, { total: `${c.total}/${Doc.perScene(app.doc, scene)}`, good: c.good, ng: c.ng, pending: c.pending }) + esc(fmt(L.statPicked, { n: list.indexOf(picked) + 1 }));
    for (const el of card.media.querySelectorAll(".thumb")) {
      const on = el.dataset.image === imageId;
      el.classList.toggle("picked", on);
      el.classList.toggle("pinned", on);
      el.querySelector(".pin")?.setAttribute("aria-pressed", String(on));
    }
    card.media.querySelector(".scene-pick")?.replaceWith(this.pickView(sceneId, list, picked));
    app.setStrip.render();
    if (app.picker.sceneId === sceneId) app.picker.render();
    this.paintVideo(sceneId);
    app.left.paintSteps();
  }

  pickView(sceneId, list, picked) {
    if (!picked) return h("div", { class: "scene-pick empty" }, h("div", { class: "scene-pick-empty", text: L.pickNone }));
    const app = this.app;
    const score = picked.check?.state === "done" ? fmt(L.scorePt, { score: picked.check.score }) : L.viewerUnchecked;
    const mode = app.picks.get(sceneId) === picked.id ? L.setPinned : L.setAuto;
    return h("div", { class: "scene-pick" },
      h("button", { class: "scene-pick-frame", title: app.doc.mode === "novel" ? NL.pickerOpenEmpty : L.pickOpen, onclick: () => (app.doc.mode === "novel" ? app.picker.open(sceneId) : app.viewer.open(sceneId, picked.id)) }, h("img", { src: picked.url || picked.thumb, alt: "" })),
      h("div", { class: "scene-pick-cap", text: fmt(L.pickCap, { no: list.indexOf(picked) + 1, score, mode }) }));
  }

  setRunning(sceneId, waiting = []) {
    for (const [id, card] of this.cards) {
      card.el.classList.toggle("running", id === sceneId);
      card.el.classList.toggle("waiting", id !== sceneId && waiting.includes(id));
    }
    if (sceneId) this.cards.get(sceneId)?.el.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }

  focusScene(sceneId) {
    const card = this.cards.get(sceneId);
    card?.el.scrollIntoView({ block: "center", behavior: "smooth" });
    card?.promptIn.focus();
  }
}

// ===== SET STRIP (THE CHOSEN IMAGE OF EVERY SCENE) =====
class SetStrip {
  constructor(app) {
    this.app = app;
    this.root = $("set-strip");
  }

  destroy() { this.root.replaceChildren(); }

  render() {
    const app = this.app;
    const doc = app.doc;
    if (!doc.scenes.length) { this.root.replaceChildren(); return; }
    const ui = app.store.data.ui;
    const allGood = h("input", { type: "checkbox", checked: !!ui.exportAllGood });
    allGood.addEventListener("change", () => { ui.exportAllGood = allGood.checked; app.store.save(); });
    const items = doc.scenes.map((scene, i) => {
      const list = app.images.list(scene.id);
      const img = app.pickOf(scene.id);
      const pinned = !!img && app.picks.get(scene.id) === img.id;
      const score = img?.check?.state === "done" ? fmt(L.scorePt, { score: img.check.score }) : "";
      const mode = pinned ? L.setPinned : L.setAuto;
      const state = img ? fmt(L.setStatePicked, { no: list.indexOf(img) + 1, score: score || L.viewerUnchecked, mode }) : L.setStateNone;
      const full = fmt(L.setItemTitle, { n: i + 1, title: scene.title || L.sceneTitle, state, text: scene.text || "" }).trim();
      const frame = img
        ? h("button", { class: `frame${pinned ? " pinned" : ""}`, onclick: () => app.viewer.open(scene.id, img.id) }, h("img", { src: img.thumb, alt: "" }))
        : h("div", { class: "frame empty", text: L.setEmpty });
      return h("div", { class: "set-item", "data-scene": scene.id, title: full },
        frame,
        h("span", { class: "cap clip", "data-full": full, html: `<b>#${i + 1}</b> ${esc(scene.title || "")}` }),
        h("span", { class: "cap clip", "data-full": full, text: img ? `#${list.indexOf(img) + 1} ${score} ${mode}`.replace(/\s+/g, " ") : "" }));
    });
    this.root.replaceChildren(h("div", { class: "set-strip" },
      h("div", { class: "set-strip-head" },
        h("h2", { class: "clip", text: doc.mode === "novel" ? NL.setTitle : L.setTitle }),
        doc.mode === "novel" ? null : h("label", { class: "check" }, allGood, L.exportAllGood),
        h("button", { class: "mini", id: "btn-download", text: doc.mode === "novel" ? NL.exportZip : L.setDownload, onclick: () => app.exportSet() }),
        h("button", { class: "mini primary", id: "btn-post", text: L.setPost, onclick: () => app.postToPromptReel() })),
      h("p", { class: "set-note note clip", text: L.setNote, "data-full": L.setNote }),
      h("div", { class: "set-items" }, ...items)));
  }
}

// ===== IMAGE VIEWER =====
class Viewer {
  constructor(app) {
    this.app = app;
    this.dlg = $("viewer");
    this.bag = new Listeners();
    this.sceneId = null;
    this.imageId = null;
    this.bag.on(this.dlg, "click", (e) => { if (e.target.closest("[data-close]")) this.dlg.close(); });
    this.bag.on($("viewer-prev"), "click", () => this.step(-1));
    this.bag.on($("viewer-next"), "click", () => this.step(1));
    this.bag.on(this.dlg, "keydown", (e) => {
      if (e.target.matches("input, textarea, select")) return;
      if (e.key === "ArrowLeft") this.step(-1);
      if (e.key === "ArrowRight") this.step(1);
    });
  }

  destroy() { this.bag.destroy(); }

  open(sceneId, imageId) {
    this.sceneId = sceneId;
    this.imageId = imageId;
    this.render();
    if (!this.dlg.open) this.dlg.showModal();
  }

  step(d) {
    const list = this.app.images.list(this.sceneId);
    const i = list.findIndex((x) => x.id === this.imageId);
    const next = list[i + d];
    if (next) this.open(this.sceneId, next.id);
  }

  render() {
    const app = this.app;
    const list = app.images.list(this.sceneId);
    const img = list.find((x) => x.id === this.imageId);
    const scene = app.doc.scenes.find((s) => s.id === this.sceneId);
    if (!img || !scene) { if (this.dlg.open) this.dlg.close(); return; }
    const run = app.doc.run;
    const v = Judge.verdict(img, run);
    const pinned = app.picks.get(this.sceneId) === img.id;
    $("viewer-title").textContent = `#${app.doc.scenes.indexOf(scene) + 1} ${scene.title || ""} ・ ${list.indexOf(img) + 1}/${list.length}`;
    $("viewer-img").src = img.url || img.thumb;
    // 端まで来てボタンが押せなくなると、そこにあったフォーカスがダイアログの外へ外れて ← → が効かなくなるので、反対側へ移す
    const prev = $("viewer-prev"), next = $("viewer-next");
    const lost = document.activeElement;
    prev.disabled = list.indexOf(img) <= 0;
    next.disabled = list.indexOf(img) >= list.length - 1;
    if (lost?.disabled && this.dlg.open) (lost === next ? prev : next).disabled ? this.dlg.focus() : (lost === next ? prev : next).focus();
    const c = img.check;
    const scoreText = c?.state === "done" ? fmt(L.scorePt, { score: c.score }) : c?.state === "error" ? L.checkError : L.viewerUnchecked;
    const verdictText = v === true ? L.ok : v === false ? L.ng : "";
    const redo = (fn) => () => { fn(); app.sceneChanged(this.sceneId); this.render(); };
    $("viewer-info").replaceChildren(...[
      h("div", { class: `score-big ${v === true ? "ok" : v === false ? "ng" : ""}`, text: `${scoreText}${verdictText ? " ・ " + verdictText : ""}` }),
      img.manual ? h("div", { class: "note", text: fmt(L.viewerManual, { v: img.manual === "ok" ? L.ok : L.ng }) }) : null,
      c?.state === "error" ? h("div", { class: "msg err", text: c.error }) : null,
      c?.state === "done" ? h("div", { class: "note keep", text: [c.anatomy ? L.anatomyNg : "", Number.isFinite(c.match) ? fmt(L.matchPct, { v: c.match }) : ""].filter(Boolean).join(" ・ ") }) : null,
      c?.issues?.length ? h("ul", { class: "issues" }, ...c.issues.map((t) => h("li", { text: t }))) : null,
      c?.missing?.length ? h("div", { class: "note keep", text: L.missingHead }) : null,
      c?.missing?.length ? h("ul", { class: "issues" }, ...c.missing.map((t) => h("li", { text: t }))) : null,
      !img.blob ? h("div", { class: "msg warn", text: L.viewerNoFull }) : null,
      h("div", { class: "actions" },
        h("span", { class: `pick-state${pinned ? " on" : ""}`, text: pinned ? L.viewerPicked : L.viewerNotPicked }),
        h("button", { class: pinned ? "" : "primary", text: pinned ? L.viewerUnpick : L.viewerPick, disabled: !img.blob, onclick: redo(() => app.togglePin(this.sceneId, img.id)) }),
        h("button", { text: L.viewerOk, onclick: redo(() => { img.manual = "ok"; }) }),
        h("button", { text: L.viewerNg, onclick: redo(() => { img.manual = "ng"; }) }),
        img.manual ? h("button", { text: L.viewerAuto, onclick: redo(() => { img.manual = null; }) }) : null),
      h("div", { class: "actions" },
        h("button", { text: L.viewerRecheck, disabled: !img.blob || app.runner.busy, onclick: () => app.recheck(this.sceneId, img.id) }),
        h("button", { text: L.viewerFixSeed, onclick: () => app.fixSeed(scene, img) }),
        h("button", { text: L.viewerSave, disabled: !img.blob, onclick: () => app.saveImage(scene, img) }),
        h("button", { class: "danger", text: L.viewerDelete, onclick: () => { const next = list[list.indexOf(img) + 1] || list[list.indexOf(img) - 1]; app.deleteImage(this.sceneId, img.id); if (next) this.open(this.sceneId, next.id); else this.dlg.close(); } })),
      h("div", { class: "note keep", text: fmt(L.viewerSeed, { seed: img.seed, w: img.width, h: img.height }) }),
      h("details", { open: true }, h("summary", { text: L.viewerPromptHead }), h("pre", { text: `${img.prompt}\n\nNegative: ${img.negative}` })),
    ].filter(Boolean));
  }
}

// ===== IMAGE PICKER (NOVEL: CHOOSE THE ONE IMAGE, MAKE MORE) =====
class ImagePicker {
  constructor(app) {
    this.app = app;
    this.dlg = $("picker");
    this.body = $("picker-body");
    this.bag = new Listeners();
    this.sceneId = null;
    this.count = null;
    this.bag.on(this.dlg, "click", (e) => { if (e.target.closest("[data-close]")) this.dlg.close(); });
    this.bag.on(this.dlg, "close", () => { this.sceneId = null; this.count = null; });
    fileDrop(this.dlg, (files) => this.sceneId && this.app.addImageFiles(this.sceneId, files));
  }

  destroy() { this.bag.destroy(); }

  open(sceneId) {
    this.sceneId = sceneId;
    this.count = null;
    this.render();
    if (!this.dlg.open) this.dlg.showModal();
  }

  render() {
    if (!this.sceneId) return;
    const app = this.app;
    const doc = app.doc;
    const scene = doc.scenes.find((s) => s.id === this.sceneId);
    if (!scene) { this.dlg.close(); return; }
    const list = app.images.list(scene.id);
    const picked = app.pickOf(scene.id);
    const busy = app.runner.busy || app.novel.busy;
    $("picker-title").textContent = fmt(NL.pickerTitle, { no: `#${doc.scenes.indexOf(scene) + 1}`, title: scene.title || "" });
    const count = this.count ?? Doc.perScene(doc, scene);
    const countIn = h("input", { type: "number", class: "picker-count", min: USER_SETTINGS.limits.perScene[0], max: USER_SETTINGS.limits.perScene[1], value: count });
    countIn.addEventListener("change", () => { this.count = clamp(Math.round(Number(countIn.value)) || 1, USER_SETTINGS.limits.perScene); countIn.value = this.count; });
    const top = this.body.querySelector(".picker-grid")?.scrollTop || 0;
    const grid = h("div", { class: "picker-grid" }, list.length
      ? app.board.thumbs(scene.id, list, picked, (id) => { app.board.selectImage(scene.id, id); this.render(); })
      : h("p", { class: "note keep", text: NL.pickerEmpty }));
    const score = picked?.check?.state === "done" ? fmt(L.scorePt, { score: picked.check.score }) : L.viewerUnchecked;
    const side = h("div", { class: "picker-side" }, picked
      ? [h("button", { class: "scene-pick-frame", title: L.pickOpen, onclick: () => app.viewer.open(scene.id, picked.id) }, h("img", { src: picked.url || picked.thumb, alt: "" })),
        h("div", { class: "scene-pick-cap", text: fmt(NL.pickerChosen, { no: list.indexOf(picked) + 1, score, mode: app.picks.get(scene.id) === picked.id ? L.setPinned : L.setAuto }) })]
      : h("div", { class: "scene-pick-empty", text: NL.pickerNone }));
    this.body.replaceChildren(
      h("p", { class: "note keep", text: `${NL.pickerNote}${NL.pickerDropNote}` }),
      h("div", { class: "picker-main" }, grid, side),
      h("div", { class: "row picker-foot" },
        h("span", { text: NL.pickerCount }), h("div", { class: "picker-count-box" }, countIn),
        h("button", { class: "primary", text: NL.pickerMore, disabled: busy, onclick: () => app.generateMore(scene.id, this.count ?? count) }),
        fileButton(NL.pickerAddFile, "image/*", (files) => app.addImageFiles(scene.id, files)),
        busy ? h("span", { class: "note keep", text: NL.pickerBusy }) : null,
        busy ? h("button", { class: "mini danger", text: NL.pickerStop, onclick: () => { app.novel.stop(); app.runner.stop(); } }) : null));
    grid.scrollTop = top;
  }
}

// ===== VOICE TAKES (NOVEL: CHOOSE ONE OF THE VOICES MADE FOR A LINE) =====
class VoicePicker {
  constructor(app) {
    this.app = app;
    this.dlg = $("takes");
    this.body = $("takes-body");
    this.bag = new Listeners();
    this.lineId = null;
    this.count = NV.takeCounts[0];
    this.bag.on(this.dlg, "click", (e) => { if (e.target.closest("[data-close]")) this.dlg.close(); });
    this.bag.on(this.dlg, "close", () => { this.lineId = null; this.app.novel.audio.pause(); });
    fileDrop(this.dlg, (files) => this.lineId && this.app.novel.addVoiceFiles(this.lineId, files));
  }

  destroy() { this.bag.destroy(); }

  open(lineId) {
    this.lineId = lineId;
    this.render();
    if (!this.dlg.open) this.dlg.showModal();
  }

  render() {
    if (!this.lineId) return;
    const app = this.app;
    const nr = app.novel;
    const line = app.doc.scenes.flatMap((s) => s.lines).find((l) => l.id === this.lineId);
    if (!line) { this.dlg.close(); return; }
    const { state, e } = nr.voiceState(line);
    const takes = e?.takes || [];
    const sig = nr.voiceSig(line);
    const busy = nr.busy || app.runner.busy;
    $("takes-title").textContent = fmt(NL.takesTitle, { who: NovelWriter.nameOf(app.doc, line.who) });
    const countSel = h("select", { class: "takes-count" });
    fillSelect(countSel, NV.takeCounts.map((n) => [String(n), `${n}`]), String(this.count));
    countSel.addEventListener("change", () => { this.count = Number(countSel.value); });

// ===== EMOJI MENU (NOVEL: HOW A LINE IS SPOKEN) =====
class EmojiMenu {
  constructor(app) {
    this.app = app;
    this.el = h("div", { class: "emo-menu", hidden: true, role: "dialog" });
    document.body.append(this.el);
    this.bag = new Listeners();
    this.bag.on(document, "pointerdown", (e) => { if (!this.el.hidden && !this.el.contains(e.target) && e.target !== this.anchor) this.close(); }, true);
    this.bag.on(document, "keydown", (e) => { if (e.key === "Escape" && !this.el.hidden) { e.stopPropagation(); this.close(); } }, true);
    this.bag.on(window, "resize", () => this.close());
  }

  destroy() { this.bag.destroy(); this.el.remove(); }

  open(anchor, line, onChange) {
    if (!this.el.hidden && this.anchor === anchor) { this.close(); return; }
    this.anchor = anchor;
    this.line = line;
    this.onChange = onChange;
    this.render();
    this.el.hidden = false;
    const r = anchor.getBoundingClientRect();
    const w = this.el.offsetWidth, hh = this.el.offsetHeight;
    this.el.style.left = `${Math.max(8, Math.min(r.left, innerWidth - w - 8))}px`;
    this.el.style.top = `${r.bottom + hh + 8 > innerHeight ? Math.max(8, r.top - hh - 4) : r.bottom + 4}px`;
  }

  close() {
    this.el.hidden = true;
    this.anchor = null;
  }

  set(emo) {
    this.line.emo = emo;
    this.onChange?.();
    const anchor = this.anchor && document.contains(this.anchor) ? this.anchor : null;
    if (anchor) { anchor.textContent = emo || NL.emoPick; anchor.classList.toggle("empty", !emo); }
    this.render();
  }

  render() {
    const chosen = Doc.emoList(this.line.emo);
    const toggle = (e) => {
      let next = chosen.includes(e) ? chosen.filter((x) => x !== e) : [...chosen, e];
      if (next.length > NV.maxEmo) next = next.slice(next.length - NV.maxEmo);
      this.set(next.join(""));
    };
    this.el.replaceChildren(
      h("div", { class: "emo-menu-head" }, h("span", { text: fmt(NL.emoMenuTitle, { max: NV.maxEmo }) }),
        h("button", { type: "button", class: "mini quiet", text: NL.emoNone, onclick: () => this.set("") })),
      h("div", { class: "emo-grid" }, ...NV.emojis.map(([e, a, b]) => h("button", {
        type: "button", class: `emo-item${chosen.includes(e) ? " on" : ""}`, title: `${a}（${b}）`, "aria-pressed": String(chosen.includes(e)), onclick: () => toggle(e),
      }, h("span", { class: "emo-glyph", text: e }), h("span", { class: "emo-name", text: a })))));
  }
}

// ===== NOVEL GAME (SAME PLAYER AS PROMPT REEL) =====
class NovelGame {
  constructor(app) {
    this.app = app;
    this.dlg = $("game");
    this.frame = $("game-frame");
    this.bag = new Listeners();
    this.bag.on(this.dlg, "click", (e) => { if (e.target.closest("[data-close]")) this.dlg.close(); });
    this.bag.on(this.dlg, "close", () => { this.frame.srcdoc = ""; this.frame.removeAttribute("srcdoc"); });
    this.bag.on(this.frame, "load", () => this.frame.contentWindow?.addEventListener("keydown", (e) => { if (e.key === "Escape") this.dlg.close(); }));
  }

  destroy() { this.bag.destroy(); }

  scenario() {
    const app = this.app;
    const doc = app.doc;
    return Doc.groups(doc).flatMap((g) => g.scenes.map((s, k) => {
      const vid = app.novel.videoState(s).state === "done" ? app.novel.videoTake(s) : null;
      const pick = s.noImage ? null : app.pickOf(s.id);
      const entry = { bg: vid ? vid.url : pick ? pick.url || pick.thumb : "", own: true, bgKind: vid ? "video" : "image", bgSound: !!(vid && doc.novel.video.sound), sound: "", soundLoop: true };
      if (k === 0) Object.assign(entry, { sceneStart: true, sceneTitle: g.head.sceneTitle || "", sceneSound: "", sceneSoundLoop: true });
      if (vid?.name) entry.bgName = vid.name;
      entry.lines = s.lines.filter((l) => l.text.trim()).map((l) => {
        const v = app.novel.voiceState(l);
        return { name: l.who === NV.narrator ? "" : NovelWriter.nameOf(doc, l.who), text: l.text.trim(), voice: v.state === "done" ? v.t.url : "" };
      });
      if (!entry.lines.length) entry.lines = [{ name: "", text: "" }];
      return entry;
    }));
  }

  html(scenario) {
    const P = NOVEL_PLAYER_SRC;
    const safe = (t) => String(t).replace(/<\/(script)/gi, "<\\/$1");
    const js = Object.entries(P.consts).map(([k, v]) => `const ${k} = ${JSON.stringify(v)};`).join("\n") + "\n" + P.js +
      `\nconst SCENARIO = ${JSON.stringify(scenario)};\ndocument.addEventListener("DOMContentLoaded", function () { window.novelPlayer = createNovelPlayer(document.getElementById("novel"), SCENARIO, ${JSON.stringify(NV.player.options)}); });\n`;
    return `<!DOCTYPE html>\n<html lang="ja">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<style>\n${P.css}\n${NV.player.frameCss}\n</style>\n</head>\n<body>\n<div class="novel-standalone"><div id="novel"></div></div>\n<script>\n${safe(js)}<\/script>\n</body>\n</html>\n`;
  }

  open() {
    const app = this.app;
    if (!app.doc.scenes.length) { app.notice(M.showNone, "warn", "story"); return; }
    $("game-title").textContent = `${NL.gameTitle}${app.doc.title ? ` — ${app.doc.title}` : ""}`;
    this.dlg.querySelector("[data-close]").textContent = NL.gameClose;
    this.frame.srcdoc = this.html(this.scenario());
    if (!this.dlg.open) this.dlg.showModal();
  }
}

// ===== KAMISHIBAI SLIDESHOW =====
class Slideshow {
  constructor(app) {
    this.app = app;
    this.dlg = $("show");
    this.bag = new Listeners();
    this.index = 0;
    this.timer = null;
    this.bag.on(this.dlg, "click", (e) => { if (e.target.closest("[data-close]")) this.dlg.close(); });
    this.bag.on(this.dlg, "close", () => { this.pause(); this.stageScene = null; this.app.novel.audio.pause(); });
    this.bag.on($("show-prev"), "click", () => this.go(this.index - 1));
    this.bag.on($("show-next"), "click", () => this.go(this.index + 1));
    this.bag.on($("show-play"), "click", () => (this.timer ? this.pause() : this.play()));
    this.bag.on($("show-stage"), "click", () => this.go(this.index + 1));
    this.bag.on(this.dlg, "keydown", (e) => {
      if (e.key === "ArrowLeft") this.go(this.index - 1);
      if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); this.go(this.index + 1); }
    });
  }

  destroy() { this.pause(); this.bag.destroy(); }

  get novel() { return this.app.doc.mode === "novel"; }

  steps() {
    if (!this.novel) return this.app.doc.scenes.map((scene) => ({ scene }));
    return this.app.doc.scenes.flatMap((scene) => {
      const lines = scene.lines.filter((l) => l.text.trim());
      return lines.length ? lines.map((line) => ({ scene, line })) : [{ scene }];
    });
  }

  open() {
    if (this.novel) { this.app.game.open(); return; }
    if (!this.app.doc.scenes.length) { this.app.notice(M.showNone, "warn", "story"); return; }
    this.index = 0;
    this.stageScene = null;
    this.render();
    this.dlg.showModal();
  }

  go(i) {
    const n = this.steps().length;
    if (i < 0 || i >= n) { this.pause(); return; }
    this.index = i;
    this.render();
    if (this.playing) this.speak();
    else if (this.novel) this.app.novel.play(this.voiceUrl(this.steps()[i]));
  }

  voiceUrl(step) {
    if (!step?.line) return null;
    const v = this.app.novel.voiceState(step.line);
    return v.state === "done" ? v.t.url : null;
  }

  play() {
    $("show-play").textContent = L.showPause;
    if (this.novel) {
      this.playing = true;
      this.timer = true;
      this.speak();
      return;
    }
    this.timer = setInterval(() => {
      if (this.index >= this.app.doc.scenes.length - 1) this.pause();
      else this.go(this.index + 1);
    }, USER_SETTINGS.showIntervalSec * 1000);
  }

  speak() {
    clearTimeout(this.wait);
    const step = this.steps()[this.index];
    const audio = this.app.novel.audio;
    const next = () => {
      if (!this.playing) return;
      if (this.index >= this.steps().length - 1) this.pause();
      else this.go(this.index + 1);
    };
    const voice = this.voiceUrl(step);
    if (!voice) { audio.pause(); this.wait = setTimeout(next, USER_SETTINGS.showIntervalSec * 1000); return; }
    audio.onended = () => { this.wait = setTimeout(next, NV.showGapMs); };
    this.app.novel.play(voice);
  }

  pause() {
    clearInterval(this.timer);
    clearTimeout(this.wait);
    this.timer = null;
    if (this.playing) { this.playing = false; this.app.novel.audio.onended = null; this.app.novel.audio.pause(); }
    $("show-play").textContent = L.showPlay;
  }

  render() {
    if (this.novel) { this.renderNovel(); return; }
    const doc = this.app.doc;
    const scene = doc.scenes[this.index];
    if (!scene) return;
    const img = this.app.pickOf(scene.id);
    $("show-stage").replaceChildren(img ? h("img", { src: img.url, alt: scene.title }) : h("div", { class: "show-missing", text: L.showNoImage }));
    $("show-title").textContent = `${this.index + 1}. ${scene.title || ""}`;
    $("show-text").textContent = scene.text || "";
    $("show-count").textContent = `${this.index + 1} / ${doc.scenes.length}`;
  }

  renderNovel() {
    const app = this.app;
    const list = this.steps();
    const step = list[this.index];
    if (!step) return;
    const { scene, line } = step;
    if (this.stageScene !== scene.id) {
      this.stageScene = scene.id;
      const img = scene.noImage ? null : app.pickOf(scene.id);
      const vid = scene.loop && !scene.noImage ? app.novel.videoTake(scene) : null;
      $("show-stage").replaceChildren(vid?.url ? h("video", { src: vid.url, loop: true, muted: !app.doc.novel.video.sound, autoplay: true, playsInline: true })
        : img ? h("img", { src: img.url, alt: scene.title }) : h("div", { class: "show-missing", text: scene.noImage ? "" : L.showNoImage }));
    }
    $("show-title").textContent = line && line.who !== NV.narrator ? NovelWriter.nameOf(app.doc, line.who) : "";
    $("show-text").textContent = line ? line.text : scene.text || "";
    $("show-count").textContent = `${this.index + 1} / ${list.length}`;
  }
}

class SettingsDialog {
  constructor(app) {
    this.app = app;
    this.dlg = $("settings");
    this.body = $("settings-body");
    this.nav = $("settings-tabs");
    this.bag = new Listeners();
    this.nav.replaceChildren(...USER_SETTINGS.settingsPanes.map(([k, label]) => h("button", { role: "tab", "data-pane": k, text: label })));
    this.bag.on(this.nav, "click", (e) => {
      const pane = e.target.closest("[data-pane]")?.dataset.pane;
      if (pane) this.show(pane);
    });
    this.bag.on(this.dlg, "click", (e) => { if (e.target.closest("[data-close]")) this.dlg.close(); });
    this.bag.on(this.dlg, "close", () => this.app.probeAll());
  }

  destroy() { this.bag.destroy(); }

  open(pane) {
    this.show(pane || this.app.store.data.ui.settingsPane);
    if (!this.dlg.open) this.dlg.showModal();
  }

  show(pane) {
    const p = USER_SETTINGS.settingsPanes.some(([k]) => k === pane) ? pane : USER_SETTINGS.settingsPanes[0][0];
    this.app.store.data.ui.settingsPane = p;
