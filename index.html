// ===== IMAGE STORE (GENERATED IMAGES, IN MEMORY ONLY) =====
class ImageStore {
  constructor() {
    this.byScene = new Map();
  }

  list(sceneId) {
    if (!this.byScene.has(sceneId)) this.byScene.set(sceneId, []);
    return this.byScene.get(sceneId);
  }

  find(imageId) {
    for (const [sceneId, list] of this.byScene) {
      const img = list.find((i) => i.id === imageId);
      if (img) return { sceneId, img };
    }
    return null;
  }

  get total() {
    let n = 0;
    for (const list of this.byScene.values()) n += list.length;
    return n;
  }

  async add(sceneId, fields) {
    const img = { id: "i" + uid(), check: null, manual: null, createdAt: Date.now(), ...fields };
    img.url = URL.createObjectURL(img.blob);
    try {
      const canvas = await scaledImage(img.blob, USER_SETTINGS.thumbSide);
      img.thumb = URL.createObjectURL(await canvasBlob(canvas, "image/jpeg", USER_SETTINGS.thumbQuality));
    } catch {
      img.thumb = img.url;
    }
    this.list(sceneId).push(img);
    return img;
  }

  dropFull(img) {
    if (!img.blob) return;
    if (img.url && img.url !== img.thumb) URL.revokeObjectURL(img.url);
    img.blob = null;
    img.url = null;
  }

  revoke(img) {
    if (img.url) URL.revokeObjectURL(img.url);
    if (img.thumb && img.thumb !== img.url) URL.revokeObjectURL(img.thumb);
    img.blob = null;
  }

  remove(sceneId, imageId) {
    const list = this.list(sceneId);
    const i = list.findIndex((x) => x.id === imageId);
    if (i < 0) return;
    this.revoke(list[i]);
    list.splice(i, 1);
  }

  clear(sceneId) {
    for (const img of this.list(sceneId)) this.revoke(img);
    this.byScene.delete(sceneId);
  }

  clearAll() {
    for (const id of [...this.byScene.keys()]) this.clear(id);
  }

  keepOnly(sceneIds) {
    const keep = new Set(sceneIds);
    for (const id of [...this.byScene.keys()]) if (!keep.has(id)) this.clear(id);
  }
}

// ===== VERDICT AND SET PICKING =====
class Judge {
  static verdict(img, run) {
    if (img.manual === "ok") return true;
    if (img.manual === "ng") return false;
    const c = img.check;
    if (!c || c.state !== "done") return null;
    return c.score >= run.threshold && !c.broken && !(run.strictScene && c.mismatch);
  }

  static counts(list, run) {
    const out = { total: list.length, good: 0, ng: 0, pending: 0 };
    for (const img of list) {
      const v = this.verdict(img, run);
      if (v === true) out.good++;
      else if (v === false) out.ng++;
      else out.pending++;
    }
    return out;
  }

  static pick(list, run, pinnedId) {
    const pinned = list.find((i) => i.id === pinnedId && i.blob);
    if (pinned) return pinned;
    const usable = list.filter((i) => i.blob);
    const good = usable.filter((i) => this.verdict(i, run) === true)
      .sort((a, b) => (b.manual === "ok") - (a.manual === "ok") || (b.check?.score ?? 0) - (a.check?.score ?? 0) || a.createdAt - b.createdAt);
    if (good.length) return good[0];
    if (run.check) return null;
    return usable.find((i) => this.verdict(i, run) === null) || null;
  }

  static lacking(list, run) {
    const need = Math.max(1, Number(run.targetGood) || 0);
    if (!run.check) return list.filter((i) => this.verdict(i, run) !== false).length < 1;
    return this.counts(list, run).good < need;
  }
}

// ===== STORY WRITER (ROUGH IDEA -> SCENES) =====
class StoryWriter {
  static castLines(doc) {
    return doc.cast.map((c, i) => `- id: ${c.id} (${letter(i)}) / name: ${c.name || "(unnamed)"} / notes: ${c.note || "-"} / look: ${c.prompt || "-"}`).join("\n") || "(none)";
  }

  static locationLines(doc) {
    return doc.locations.map((l) => `- id: ${l.id} / name: ${l.name || "(unnamed)"} / notes: ${l.note || "-"} / look: ${l.prompt || "-"}`).join("\n") || "(none)";
  }

  static userText(doc) {
    return [
      `Idea from the user:\n${doc.brief.trim()}`,
      `Number of scenes: ${doc.sceneCount}`,
      USER_SETTINGS.styleRules[doc.common.style] || USER_SETTINGS.styleRules.tags,
      `Cast:\n${this.castLines(doc)}`,
      `Locations:\n${this.locationLines(doc)}`,
      doc.title.trim() ? `Working title: ${doc.title.trim()}` : "",
    ].filter(Boolean).join("\n\n");
  }

  static accept(doc, obj) {
    const castIds = new Set(doc.cast.map((c) => c.id));
    const locIds = new Set(doc.locations.map((l) => l.id));
    const str = (v) => (Array.isArray(v) ? v.join(", ") : typeof v === "string" ? v : v == null ? "" : String(v)).trim();
    const raw = Array.isArray(obj.scenes) ? obj.scenes : null;
    if (!raw?.length) throw new Error("no scenes");
    const scenes = raw.filter((s) => s && typeof s === "object").map((s) => Doc.newScene({
      title: str(s.title), text: str(s.text || s.narration),
      cast: (Array.isArray(s.cast) ? s.cast : []).map(String).filter((id) => castIds.has(id)),
      location: locIds.has(String(s.location || "")) ? String(s.location) : "",
      count: str(s.count), prompt: str(s.prompt),
    }));
    if (!scenes.some((s) => s.prompt)) throw new Error("no prompts");
    return { title: str(obj.title), synopsis: str(obj.synopsis), scenes };
  }

  static async write(llm, doc, signal) {
    return llm.askJson(USER_SETTINGS.storyPrompt, this.userText(doc), [], signal, (obj) => this.accept(doc, obj), M.storyBad);
  }

  static async rewriteScene(llm, doc, scene, signal) {
    const cast = PromptBuilder.castOf(doc, scene);
    const loc = doc.locations.find((l) => l.id === scene.location);
    const text = [
      `Scene title: ${scene.title || "-"}`,
      `Narration: ${scene.text || "-"}`,
      `Characters in the scene:\n${cast.map((c) => `- ${c.name || "(unnamed)"} / notes: ${c.note || "-"} / look: ${c.prompt || "-"}`).join("\n") || "(none)"}`,
      `Location: ${loc ? `${loc.name} / ${loc.prompt}` : "(none: describe the place in the prompt)"}`,
      USER_SETTINGS.styleRules[doc.common.style] || USER_SETTINGS.styleRules.tags,
    ].join("\n\n");
    return llm.askJson(USER_SETTINGS.sceneRewritePrompt, text, [], signal, (obj) => {
      const prompt = typeof obj.prompt === "string" ? obj.prompt.trim() : "";
      if (!prompt) throw new Error("no prompt");
      return { count: typeof obj.count === "string" ? obj.count.trim() : "", prompt };
    }, M.rewriteBad);
  }
}

// ===== IMAGE CHECKER (VISION LLM LOOKS FOR BROKEN DRAWING) =====
class ImageChecker {
  static userText(doc, scene) {
    const cast = PromptBuilder.castOf(doc, scene);
    return [
      "What this scene should show:",
      `- title: ${scene.title || "-"}`,
      `- narration: ${scene.text || "-"}`,
      `- people: ${scene.count || "-"}${cast.length ? ` (${cast.map((c) => c.name || "unnamed").join(", ")})` : ""}`,
      `- prompt: ${scene.prompt || "-"}`,
      "Check the attached image.",
    ].join("\n");
  }

  static accept(obj) {
    const score = Number(obj.score);
    if (!Number.isFinite(score)) throw new Error("no score");
    const bool = (v) => v === true || v === "true" || v === "yes";
    const issues = (Array.isArray(obj.issues) ? obj.issues : typeof obj.issues === "string" ? [obj.issues] : []).map((x) => String(x).trim()).filter(Boolean);
    return { state: "done", score: clamp(Math.round(score), [0, 100]), broken: bool(obj.broken), mismatch: bool(obj.mismatch), issues };
  }

  static async imageUrl(blob) {
    const llm = USER_SETTINGS.llm;
    const canvas = await scaledImage(blob, llm.imageSide);
    return canvas.toDataURL("image/jpeg", llm.imageQuality);
  }

  static async check(llm, doc, scene, img, signal) {
    const url = await this.imageUrl(img.blob);
    return llm.askJson(USER_SETTINGS.checkPrompt, this.userText(doc, scene), [url], signal, (obj) => this.accept(obj), M.checkBad);
  }
}

// ===== GUIDE (ERROR -> ONE SENTENCE THAT SAYS WHERE TO GO NEXT) =====
class Guide {
  static fail(text, action = null) {
    return Object.assign(new UserError(text), { action });
  }

  static explain(err, who = "image") {
    const F = M.fix;
    const llm = who === "llm";
    if (err?.name === "AbortError") return { text: M.cancelled, action: null, aborted: true };
    if (err instanceof UserError) return { text: err.message, action: err.action || null };
    if (err?.name === "TimeoutError") return { text: llm ? F.llmTimeout : F.imageTimeout, action: llm ? "settingsLlm" : "refresh" };
    if (err instanceof TypeError) return { text: llm ? F.llmDown : F.imageDown, action: "refresh" };
    const msg = String(err?.message || err || "");
    if (llm && /image|vision|multimodal|image_url|mmproj/i.test(msg)) return { text: F.llmVision, action: "settingsLlm" };
    if (llm && /model/i.test(msg) && /not found|does not exist|no model|not loaded|404/i.test(msg)) return { text: F.llmModel, action: "settingsLlm" };
    if (!llm && /value_not_in_list|not in list|ckpt_name|lora_name|vae_name/i.test(msg)) return { text: F.comfyMissing, action: "image:model" };
    return { text: msg, action: llm ? "settingsLlm" : null };
  }

  static text(err, who) {
    return this.explain(err, who).text;
  }
}

// ===== RUN CLOCK (AVERAGE TIME PER STEP -> REMAINING TIME) =====
class RunClock {
  constructor() {
    this.avg = {};
    this.count = {};
  }

  add(kind, ms) {
    const a = USER_SETTINGS.etaSmoothing;
    this.avg[kind] = this.avg[kind] == null ? ms : this.avg[kind] * (1 - a) + ms * a;
    this.count[kind] = (this.count[kind] || 0) + 1;
  }

  async time(kind, fn) {
    const t = performance.now();
    try { return await fn(); } finally { this.add(kind, performance.now() - t); }
  }

  has(kind) { return this.avg[kind] != null; }

  estimate({ gens, checks, swaps }) {
    if (!this.has("gen")) return null;
    const partial = (checks > 0 && !this.has("check")) || (swaps > 0 && !this.has("vram"));
    const ms = gens * this.avg.gen + checks * (this.avg.check || 0) + swaps * (this.avg.vram || 0);
    return { ms, partial };
  }
}

// ===== RUNNER (GENERATE N IMAGES PER SCENE, CHECK, PICK) =====
class Runner {
  constructor(app) {
    this.app = app;
    this.ctl = null;
    this.vramFreed = false;
    this.plan = [];
  }

  get busy() { return !!this.ctl; }

  stop() {
    if (!this.ctl) return;
    this.ctl.abort();
    this.app.backend().interrupt();
  }

  chunkSize(run, total) {
    if (!run.check) return total;
    return { each: 1, chunk: clamp(Number(run.chunk) || 1, USER_SETTINGS.limits.chunk), scene: total, end: total }[run.timing] || total;
  }

  seedFor(base, index) {
    const n = Number(base);
    if (Number.isFinite(n) && n >= 0) return (n + index) % (USER_SETTINGS.seedMax + 1);
    return Math.floor(Math.random() * USER_SETTINGS.seedMax);
  }

  static sizeOf(doc, scene) {
    const c = doc.common;
    const own = Number(scene.width) > 0 && Number(scene.height) > 0;
    const w = own ? scene.width : c.width, hh = own ? scene.height : c.height;
    return { width: clamp(Number(w) || 0, USER_SETTINGS.limits.side), height: clamp(Number(hh) || 0, USER_SETTINGS.limits.side) };
  }

  static seedBase(doc, scene) {
    return scene.seed !== null && scene.seed !== undefined && scene.seed !== "" ? Number(scene.seed) : Number(doc.common.settings.seed);
  }

  spec(doc, scene, index) {
    const backend = this.app.backend();
    const { prompt, negative } = PromptBuilder.build(doc, scene);
    const c = doc.common;
    const settings = { ...c.settings, seed: this.seedFor(Runner.seedBase(doc, scene), index) };
    const size = Runner.sizeOf(doc, scene);
    if (backend.keepsLoraTags) return { prompt, negative, loras: [], model: c.model, vae: c.vae, size, settings, shownPrompt: prompt };
    const pos = LoraTags.extract(prompt);
    const neg = LoraTags.extract(negative);
    const available = this.app.res.loras || [];
    const loras = pos.loras.map((l) => ({ ...l, name: LoraTags.resolve(l.name, available) }));
    return { prompt: pos.text, negative: neg.text, loras, model: c.model, vae: c.vae, size, settings, shownPrompt: prompt };
  }

  // PLAN AND REMAINING WORK
  swapsFor(run, gens, sceneLeft) {
    if (!run.check || this.checkDisabled || !this.app.store.data.llm.freeVram) return 0;
    if (run.timing === "end") return this.endChecked ? 0 : 1;
    if (run.timing === "each") return gens * 2;
    if (run.timing === "chunk") return Math.ceil(gens / clamp(Number(run.chunk) || 1, USER_SETTINGS.limits.chunk)) * 2;
    return sceneLeft * 2;
  }

  remaining() {
    const run = this.app.doc.run;
    let gens = 0, scenesLeft = 0, pending = 0;
    for (const p of this.plan) {
      if (p.closed) continue;
      const left = Math.max(0, p.total - p.done);
      gens += left;
      if (left > 0) scenesLeft++;
    }
    if (run.check && !this.checkDisabled) {
      for (const p of this.plan) pending += this.app.images.list(p.id).filter((i) => i.blob && (!i.check || i.check.state === "pending")).length;
    }
    const checks = run.check && !this.checkDisabled ? gens + pending : 0;
    return { gens, checks, swaps: this.swapsFor(run, gens, scenesLeft) };
  }

  report(fraction = 0) {
    const r = this.remaining();
    const left = r.gens + r.checks - fraction;
    const total = this.doneUnits + Math.max(0, left);
    const pct = total > 0 ? (this.doneUnits + fraction) / total : 0;
    this.app.progress(pct);
    this.app.updateEta(this.app.clock.estimate(r), Number(this.app.doc.run.targetGood) > 0);
  }

  // VRAM
  async ensureImageVram(signal) {
    if (!this.vramFreed) return;
    this.app.phase("vram");
    this.app.status(M.runRestoreVram);
    await this.app.clock.time("vram", () => this.app.backend().restoreVram());
    this.vramFreed = false;
    if (signal.aborted) throw new DOMException("aborted", "AbortError");
  }

  async freeImageVram() {
    if (!this.app.store.data.llm.freeVram || this.vramFreed) return;
    this.app.phase("vram");
    this.app.status(M.runFreeVram);
    await this.app.clock.time("vram", () => this.app.backend().freeVram());
    this.vramFreed = true;
  }

  // ONE IMAGE / CHECKS
  async generateOne(doc, scene, index, signal) {
    const spec = this.spec(doc, scene, index);
    const out = await this.app.clock.time("gen", () => this.app.backend().generate(spec, {
      signal,
      onProgress: (p) => {
        this.app.status(fmt(M.runImage, { pct: Math.round(clamp(Number(p) || 0, [0, 1]) * 100) }));
        this.report(clamp(Number(p) || 0, [0, 0.99]));
      },
    }));
    return this.app.images.add(scene.id, {
      blob: out.blob, seed: out.seed, info: out.info, prompt: spec.shownPrompt, negative: spec.negative,
      width: spec.size.width, height: spec.size.height, settings: clone(spec.settings),
    });
  }

  async checkPending(doc, scene, signal, title) {
    const run = doc.run;
    const pending = this.app.images.list(scene.id).filter((i) => i.blob && (!i.check || i.check.state === "pending"));
    if (!pending.length || this.checkDisabled) return;
    await this.freeImageVram();
    const llm = this.app.llm();
    for (let k = 0; k < pending.length; k++) {
      if (signal.aborted) throw new DOMException("aborted", "AbortError");
      const img = pending[k];
      this.app.phase("check", title());
      this.app.status(fmt(M.runCheck, { k: k + 1, m: pending.length }));
      try {
        img.check = await this.app.clock.time("check", () => ImageChecker.check(llm, doc, scene, img, signal));
        this.checkFails = 0;
      } catch (err) {
        if (err?.name === "AbortError" || signal.aborted) throw err;
        const why = Guide.explain(err, "llm");
        img.check = { state: "error", error: why.text };
        this.checkFails++;
        if (this.checkFails >= USER_SETTINGS.checkFailLimit) {
          this.checkDisabled = true;
          this.app.sceneChanged(scene.id);
          this.app.notice(fmt(M.checkOff, { fix: why.text }), "warn", why.action);
          this.report();
          return;
        }
      }
      this.doneUnits++;
      if (Judge.verdict(img, run) === false && !run.keepRejected) this.app.images.dropFull(img);
      this.app.sceneChanged(scene.id);
      this.report();
    }
  }

  async run(sceneIds) {
    const app = this.app;
    if (this.busy) throw Guide.fail(M.runBusy);
    const doc = app.doc;
    const run = doc.run;
    const scenes = sceneIds.map((id) => doc.scenes.find((s) => s.id === id)).filter(Boolean);
    if (!scenes.length) throw Guide.fail(doc.scenes.length ? M.fix.noTarget : M.fix.noScenes, doc.scenes.length ? "target" : "story");
    this.ctl = new AbortController();
    const signal = this.ctl.signal;
    this.checkFails = 0;
    this.checkDisabled = false;
    this.endChecked = false;
    this.doneUnits = 0;
    this.plan = scenes.map((s) => ({ id: s.id, total: Doc.perScene(doc, s), done: 0, closed: false }));
    const started = Date.now();
    let made = 0;
    app.runStateChanged(true);
    try {
      await app.preflight(scenes);
      this.report();
      for (let si = 0; si < scenes.length; si++) {
        const scene = scenes[si];
        const plan = this.plan[si];
        const total = plan.total;
        const chunk = this.chunkSize(run, total);
        const target = Number(run.targetGood) || 0;
        const good = () => Judge.counts(app.images.list(scene.id), run).good;
        let phaseName = "gen";
        const title = () => fmt(M.runTitle, {
          i: si + 1, n: scenes.length, title: scene.title || `#${doc.scenes.indexOf(scene) + 1}`,
          phase: L.phasesVerb[phaseName], made: plan.done, total, good: good(),
        });
        app.markRunning(scene.id);
        while (plan.done < total) {
          if (run.check && !this.checkDisabled && target > 0 && good() >= target) break;
          const k = Math.min(chunk, total - plan.done);
          await this.ensureImageVram(signal);
          for (let j = 0; j < k; j++) {
            phaseName = "gen";
            app.phase("gen", title());
            app.status(fmt(M.runImage, { pct: 0 }));
            await this.generateOne(doc, scene, app.images.list(scene.id).length, signal);
            plan.done++;
            made++;
            this.doneUnits++;
            app.sceneChanged(scene.id);
            this.report();
          }
          if (run.check && run.timing !== "end") {
            phaseName = "check";
            await this.checkPending(doc, scene, signal, title);
          }
        }
        plan.closed = true;
        this.report();
      }
      if (run.check && run.timing === "end") {
        for (let si = 0; si < scenes.length; si++) {
          const scene = scenes[si];
          app.markRunning(scene.id);
          await this.checkPending(doc, scene, signal, () => fmt(M.runTitle, {
            i: si + 1, n: scenes.length, title: scene.title || `#${doc.scenes.indexOf(scene) + 1}`, phase: L.phasesVerb.check,
            made: this.plan[si].done, total: this.plan[si].total, good: Judge.counts(app.images.list(scene.id), run).good,
          }));
        }
        this.endChecked = true;
      }
      const goodAll = scenes.reduce((n, s) => n + Judge.counts(app.images.list(s.id), run).good, 0);
      const lacking = scenes.filter((s) => Judge.lacking(app.images.list(s.id), run)).map((s) => `#${doc.scenes.indexOf(s) + 1}`);
      const vars = { scenes: scenes.length, made, good: goodAll, time: formatDuration(Date.now() - started), lacking: lacking.join("・") || M.lacking };
      app.lastRun = { ...vars, at: new Date(), lacking };
      app.phase("done", "");
      app.progress(1);
      app.notice(fmt(lacking.length ? M.runDone : M.runDoneAll, vars), lacking.length ? "warn" : "ok");
      return { made, good: goodAll, lacking };
    } catch (err) {
      const why = Guide.explain(err, err?.who || "image");
      if (why.aborted) {
        app.phase("stop", "");
        app.notice(fmt(M.runStopped, { made }), "");
      } else {
        app.phase("error", "");
        app.notice(why.text, "err", why.action);
      }
      throw Object.assign(err instanceof Error ? err : new Error(String(err)), { shown: true });
    } finally {
      this.ctl = null;
      this.plan = [];
      app.markRunning(null);
      app.updateEta(null);
      app.runStateChanged(false);
    }
  }
}

// ===== NUMBER CONTROL (SLIDER + STEPPER + CLICK TO TYPE) =====
class NumberControl {
  static watch(root) {
    root.querySelectorAll('input[type="number"]').forEach((el) => this.enhance(el));
    const obs = new MutationObserver((list) => {
      for (const rec of list) for (const node of rec.addedNodes) {
        if (node.nodeType !== 1) continue;
        if (node.matches?.('input[type="number"]')) this.enhance(node);
        node.querySelectorAll?.('input[type="number"]').forEach((el) => this.enhance(el));
      }
    });
    obs.observe(root, { childList: true, subtree: true });
    return obs;
  }

  static num(v) {
    const n = Number(v);
    return v === "" || v === null || v === undefined || !Number.isFinite(n) ? null : n;
  }

  static decimals(step) {
    const t = String(step || 1);
    return t.includes(".") ? t.split(".")[1].length : 0;
  }

  static enhance(src) {
    if (src.dataset.numctl || src.closest(".numctl")) return;
    src.dataset.numctl = "1";
    const cfg = USER_SETTINGS.numberControl;
    const box = h("div", { class: "numctl" });
    src.replaceWith(box);
    src.classList.add("numctl-src");
    const minus = h("button", { type: "button", class: "numctl-step dec", text: "−", "aria-label": "減らす" });
    const plus = h("button", { type: "button", class: "numctl-step inc", text: "+", "aria-label": "増やす" });
    const range = h("input", { type: "range", class: "numctl-range", tabindex: "-1" });
    const val = h("button", { type: "button", class: "numctl-val", title: "クリックして数値を入力" });
    box.append(src, minus, range, plus, val);
    const proto = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, "value");
    const read = () => proto.get.call(src);
    const bounds = () => ({
      min: this.num(src.getAttribute("min")), max: this.num(src.getAttribute("max")),
      smin: this.num(src.dataset.sliderMin), smax: this.num(src.dataset.sliderMax),
      step: this.num(src.getAttribute("step")) || 1,
    });
    const sync = () => {
      const b = bounds();
      const v = this.num(read());
      const slider = b.smin !== null && b.smax !== null;
      box.classList.toggle("no-slider", !slider);
      range.hidden = !slider;
      if (slider) { Object.assign(range, { min: b.smin, max: b.smax, step: b.step }); range.value = v ?? b.smin; }
      val.textContent = v === null ? (src.placeholder || "—") : v.toFixed(Math.min(this.decimals(b.step), 4)).replace(/(\.\d*?)0+$/, "$1").replace(/\.$/, "");
      val.classList.toggle("empty", v === null);
      box.classList.toggle("disabled", src.disabled);
      [minus, plus, range, val].forEach((el) => { el.disabled = src.disabled; });
    };
    const commit = (v) => {
      const b = bounds();
      let out = "";
      if (v !== null) {
        let n = v;
        if (b.min !== null) n = Math.max(b.min, n);
        if (b.max !== null) n = Math.min(b.max, n);
        out = String(Number(n.toFixed(Math.min(this.decimals(b.step) + 2, 6))));
      }
      if (out === read()) { sync(); return; }
      proto.set.call(src, out);
      sync();
      src.dispatchEvent(new Event("input", { bubbles: true }));
      src.dispatchEvent(new Event("change", { bubbles: true }));
    };
    Object.defineProperty(src, "value", { configurable: true, get: read, set: (v) => { proto.set.call(src, v); sync(); } });
    new MutationObserver(sync).observe(src, { attributes: true, attributeFilter: ["min", "max", "step", "disabled", "placeholder"] });
    const bump = (dir) => {
      const b = bounds();
      const cur = this.num(read()) ?? this.num(String(src.placeholder || "").match(/-?\d+(\.\d+)?/)?.[0]) ?? b.smin ?? b.min ?? 0;
      commit(Math.round((cur + dir * b.step) / b.step) * b.step);
    };
    for (const [btn, dir] of [[minus, -1], [plus, 1]]) {
      let timer = null;
      const stop = () => { clearTimeout(timer); clearInterval(timer); timer = null; };
      btn.addEventListener("pointerdown", (e) => {
        if (e.button !== 0) return;
        e.preventDefault();
        bump(dir);
        timer = setTimeout(() => { timer = setInterval(() => bump(dir), cfg.repeatMs); }, cfg.repeatDelayMs);
      });
      ["pointerup", "pointerleave", "pointercancel"].forEach((ev) => btn.addEventListener(ev, stop));
      btn.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); bump(dir); } });
    }
    range.addEventListener("input", () => commit(Number(range.value)));
    val.addEventListener("click", () => {
      const edit = h("input", { type: "text", class: "numctl-edit", inputmode: "decimal", value: read(), "aria-label": "数値を入力" });
      let done = false;
      const finish = (ok) => {
        if (done) return;
        done = true;
        edit.replaceWith(val);
        if (ok) {
          const t = edit.value.trim().replace(/[０-９．－]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xfee0)).replace("ー", "-");
          if (t === "") commit(null);
          else if (Number.isFinite(Number(t))) commit(Number(t));
        }
        sync();
      };
      edit.addEventListener("keydown", (e) => {
        if (e.key === "Enter") { e.preventDefault(); finish(true); }
        else if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); finish(false); }
      });
      edit.addEventListener("blur", () => finish(true));
      val.replaceWith(edit);
      edit.focus();
      edit.select();
    });
    sync();
  }
}

// ===== CLIPPED TEXT (HOVER SHOWS THE WHOLE TEXT) =====
class ClipTitle {
  static selector = ".clip, .clip-lines, .prop-label, .pill-app, .set-item .cap, .scene-stat";

  static attach(root, bag) {
    bag.on(root, "mouseover", (e) => {
      const el = e.target.closest?.(this.selector);
      if (!el) return;
      if (el.dataset.full) { el.title = el.dataset.full; return; }
      if (el.title && !el.dataset.autoTitle) return;
      const cut = el.scrollWidth > el.clientWidth + 1 || el.scrollHeight > el.clientHeight + 1;
      if (cut) { el.title = el.innerText.trim(); el.dataset.autoTitle = "1"; }
      else if (el.dataset.autoTitle) { el.removeAttribute("title"); delete el.dataset.autoTitle; }
    });
  }
}

// ===== CORS EXTENSIONS FOR FORGE / COMFYUI (DOWNLOAD) =====
class CorsExtension {
  static origins(backend) {
    const cfg = USER_SETTINGS.corsExtensions[backend];
    const page = location.protocol.startsWith("http") ? location.origin : null;
    return [...new Set([...(page ? [page] : []), ...cfg.defaultOrigins])];
  }

  static pingUrl(backend, baseUrl) {
    return `${String(baseUrl || USER_SETTINGS.backends[backend].url).replace(/\/+$/, "")}${USER_SETTINGS.corsExtensions[backend].pingPath}`;
  }

  static zip(backend) {
    const cfg = USER_SETTINGS.corsExtensions[backend];
    const origins = this.origins(backend);
    const source = cfg.source.replace("__ORIGINS__", origins.map((o) => `    ${JSON.stringify(o)},`).join("\n"));
    const readme = cfg.readme.replace("__ORIGINS_TEXT__", origins.join(" / ")).replace(/\n/g, "\r\n");
    return ZipWriter.build([
      { path: `${cfg.folder}/${cfg.file}`, data: source },
      { path: `${cfg.folder}/README.txt`, data: readme },
    ]);
  }

  static download(backend) {
    downloadBlob(this.zip(backend), USER_SETTINGS.corsExtensions[backend].zipName);
  }

  static async ping(backend, baseUrl) {
    try {
      const res = await fetch(this.pingUrl(backend, baseUrl), { signal: AbortSignal.timeout(USER_SETTINGS.probeTimeoutMs) });
      return res.ok ? await res.json() : null;
    } catch {
      return null;
    }
  }
}

// ===== FORM HELPERS (CONTROLS BOUND TO AN OBJECT KEY) =====
class Form {
  static field(label, control, extra) {
    return h("label", { class: "field" }, label, control, extra);
  }

  static prop(label, control, { note, title, top } = {}) {
    return [
      h("div", { class: `prop${top ? " top" : ""}`, title }, h("span", { class: "prop-label", text: label }), control),
      note ? h("p", { class: "note", text: note }) : null,
    ];
  }

  static text(obj, key, onChange, props = {}) {
    const el = h(props.rows ? "textarea" : "input", { ...props, value: obj[key] ?? "" });
    el.addEventListener("input", () => { obj[key] = el.value; onChange?.(key, el.value); });
    return el;
  }

  static number(obj, key, onChange, range, props = {}) {
    const { slider, allowEmpty, ...rest } = props;
    const attrs = { type: "number", min: range?.[0], ...rest, value: obj[key] ?? "" };
    if (slider) Object.assign(attrs, { max: range?.[1], "data-slider-min": slider[0], "data-slider-max": slider[1] });
    const el = h("input", attrs);
    el.addEventListener("change", () => {
      if (el.value === "" && allowEmpty) { obj[key] = null; onChange?.(key, null); return; }
      let v = Number(el.value);
      if (!Number.isFinite(v) || el.value === "") v = Number(obj[key]) || (range ? range[0] : 0);
      if (range) v = clamp(v, range);
      if (String(v) !== el.value) el.value = v;
      obj[key] = v;
      onChange?.(key, v);
    });
    return el;
  }

  static check(obj, key, label, onChange) {
    const el = h("input", { type: "checkbox", checked: !!obj[key] });
    el.addEventListener("change", () => { obj[key] = el.checked; onChange?.(key, el.checked); });
    return h("label", { class: "check" }, el, label);
  }

  static select(obj, key, entries, onChange, props = {}) {
    const { listed, ...attrs } = props;
    const el = h("select", attrs);
    const value = obj[key] ?? "";
    const list = entries.some(([v]) => String(v) === String(value)) ? entries : [...entries, [value, entries.length && listed !== false ? `${value} ${L.notInList}` : String(value)]];
    fillSelect(el, list, value);
    el.addEventListener("change", () => { obj[key] = el.value; onChange?.(key, el.value); });
    return el;
  }

  static seg(entries, value, onPick) {
    const box = h("div", { class: "seg", role: "group" });
    const paint = (v) => box.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.value === String(v))));
    box.append(...entries.map(([v, label]) => h("button", { type: "button", "data-value": v, text: label, onclick: () => { paint(v); onPick(v); } })));
    paint(value);
    return box;
  }

  static section(key, title, body, tools = []) {
    return h("section", { class: "psec", "data-sec": key },
      h("h2", { class: "psec-title" }, h("span", { class: "clip", text: title }), tools.length ? h("span", { class: "tools" }, ...tools) : null),
      h("div", { class: "psec-body" }, ...body.flat().filter(Boolean)));
  }
}

    const el = this.root.querySelector(`[data-sec="${sec}"]`);

// ===== RIGHT PANEL (COMMON IMAGE SETTINGS / RUN AND CHECK) =====
class RightPanel {
  constructor(app) {
    this.app = app;
    this.root = $("right-panel");
    this.tabs = $("right-tabs");
    this.bag = new Listeners();
    this.tabs.replaceChildren(...USER_SETTINGS.rightTabs.map(([k, label]) => h("button", { role: "tab", "data-tab": k, text: label })));
    this.bag.on(this.tabs, "click", (e) => {
      const tab = e.target.closest("[data-tab]")?.dataset.tab;
      if (tab) this.show(tab);
    });
  }

  destroy() { this.bag.destroy(); this.root.replaceChildren(); }

  get tab() {
    const t = this.app.store.data.ui.rightTab;
    return USER_SETTINGS.rightTabs.some(([k]) => k === t) ? t : USER_SETTINGS.rightTabs[0][0];
  }

  show(tab, focusKey) {
    this.app.store.data.ui.rightTab = tab;
    this.app.store.save();
    this.render();
    if (focusKey) {
      const el = this.root.querySelector(`[data-key="${focusKey}"]`);
      el?.scrollIntoView({ block: "center", behavior: "smooth" });
      el?.focus();

  changed() { this.app.docChanged(false); this.app.board.updateAllPreviews(); }

    const tab = this.tab;

// ===== SCENE BOARD (ONE CARD PER SCENE) =====
class SceneBoard {
  constructor(app) {
    this.app = app;
    this.root = $("scenes");
    this.cards = new Map();
  }

  destroy() { this.cards.clear(); this.root.replaceChildren(); }

  render() {
    const doc = this.app.doc;
    this.cards.clear();
    if (!doc.scenes.length) {
      this.root.replaceChildren(h("div", { class: "empty-board", text: L.emptyBoard, style: "white-space:pre-line" }));
      return;
    }
    this.root.replaceChildren(...doc.scenes.map((s, i) => this.card(s, i)));
  }

  overridesText(scene) {
    const o = L.overrides;
    const parts = [];
    if (Number(scene.perScene) > 0) parts.push(fmt(o.perScene, { v: scene.perScene }));
    if (Number(scene.width) > 0 && Number(scene.height) > 0) parts.push(fmt(o.size, { w: scene.width, h: scene.height }));
    if (scene.seed !== null && scene.seed !== undefined && scene.seed !== "") parts.push(fmt(o.seed, { v: scene.seed }));
    if ((scene.negative || "").trim()) parts.push(o.negative);
    return parts.join("・");
  }

  extraSection(scene, changed) {
    const app = this.app;
    const c = app.doc.common;
    const lim = USER_SETTINGS.limits;
    const summaryInfo = h("span", { class: "override" });
    const refresh = () => {
      const t = this.overridesText(scene);
      summaryInfo.textContent = t ? `（${t}）` : "";
      summaryInfo.nextSibling && (summaryInfo.nextSibling.hidden = !!t);
      changed();
    };
    const presets = USER_SETTINGS.sizePresets.map(([w, hh]) => [`${w}x${hh}`, `${w} × ${hh}`]);
    const sizeSel = h("select");
    const own = () => Number(scene.width) > 0 && Number(scene.height) > 0;
    const sizeValue = () => (!own() ? "common" : presets.some(([v]) => v === `${scene.width}x${scene.height}`) ? `${scene.width}x${scene.height}` : "custom");
    fillSelect(sizeSel, [["common", fmt(L.sceneSizeCommon, { w: c.width, h: c.height })], ...presets, ["custom", L.sceneSizeCustom]], sizeValue());
    const wIn = Form.number(scene, "width", () => refresh(), lim.side, { step: USER_SETTINGS.sizeStep, allowEmpty: true, placeholder: String(c.width) });
    const hIn = Form.number(scene, "height", () => refresh(), lim.side, { step: USER_SETTINGS.sizeStep, allowEmpty: true, placeholder: String(c.height) });
    const custom = h("div", { class: "grid2" }, Form.field(L.width, wIn), Form.field(L.height, hIn));
    custom.hidden = sizeValue() !== "custom";
    sizeSel.addEventListener("change", () => {
      const v = sizeSel.value;
      if (v === "common") { scene.width = null; scene.height = null; }
      else if (v === "custom") { if (!own()) { scene.width = c.width; scene.height = c.height; } }
      else [scene.width, scene.height] = v.split("x").map(Number);
      wIn.value = scene.width ?? "";
      hIn.value = scene.height ?? "";
      custom.hidden = v !== "custom";
      refresh();
    });
    const t = this.overridesText(scene);
    summaryInfo.textContent = t ? `（${t}）` : "";
    const hint = h("span", { text: L.sceneExtraNone });
    hint.hidden = !!t;
    return h("details", { class: "scene-extra", open: !!t },
      h("summary", {}, h("span", { text: L.sceneExtra }), summaryInfo, hint),
      h("div", { class: "grid2" },
        Form.field(L.scenePerScene, Form.number(scene, "perScene", () => { refresh(); this.updateImages(scene.id); }, lim.perScene, { allowEmpty: true, placeholder: String(app.doc.run.perScene) })),
        Form.field(L.sceneSeed, Form.number(scene, "seed", () => refresh(), [-1, USER_SETTINGS.seedMax], { allowEmpty: true, placeholder: L.sceneSeedPlaceholder }))),
      Form.field(L.sceneSize, sizeSel),
      custom,
      Form.field(L.sceneNegative, Form.text(scene, "negative", () => refresh())));
  }

  card(scene, index) {
    const app = this.app;
    const doc = app.doc;
    const changed = () => { app.docChanged(false); this.updatePreview(scene.id); };
    const stat = h("span", { class: "scene-stat clip" });
    const thumbs = h("div", { class: "thumbs" });
    const preview = h("pre", { class: "preview-prompt" });
    const move = (d) => {
      const list = doc.scenes;
      const j = index + d;
      if (j < 0 || j >= list.length) return;
      [list[index], list[j]] = [list[j], list[index]];
      app.docChanged(true);
    };
    const castBox = h("div", { class: "cast-checks" }, ...doc.cast.map((c, i) => {
      const cb = h("input", { type: "checkbox", checked: scene.cast.includes(c.id) });
      cb.addEventListener("change", () => {
        scene.cast = doc.cast.map((x) => x.id).filter((id) => (id === c.id ? cb.checked : scene.cast.includes(id)));
        changed();
      });
      return h("label", { class: "check" }, cb, `${letter(i)} ${c.name || ""}`.trim());
    }));
    const locEntries = [["", L.sceneNoLocation], ...doc.locations.map((l, i) => [l.id, `${i + 1}. ${l.name || "—"}`])];
    const countIn = Form.text(scene, "count", changed);
    const promptIn = Form.text(scene, "prompt", changed, { rows: 4, "data-key": "prompt" });
    const rewrite = h("button", { class: "mini", text: L.rewriteScene, title: L.rewriteSceneTitle, onclick: () => app.rewriteScene(scene, { countIn, promptIn }) });
    const el = h("div", { class: "scene", "data-scene": scene.id },
      h("div", { class: "scene-head" },
        h("span", { class: "scene-no", text: String(index + 1) }),
        Form.text(scene, "title", () => { app.docChanged(false); app.setStrip.render(); }, { class: "title", placeholder: L.sceneTitle }),
        stat,
        h("button", { class: "mini primary scene-run", text: L.runScene, disabled: app.runner.busy, onclick: () => app.run([scene.id]) }),
        h("button", { class: "mini quiet", text: L.up, title: L.upTitle, onclick: () => move(-1), disabled: index === 0 }),
        h("button", { class: "mini quiet", text: L.down, title: L.downTitle, onclick: () => move(1), disabled: index === doc.scenes.length - 1 }),
        h("button", { class: "mini quiet", text: L.duplicate, onclick: () => app.duplicateScene(scene) }),
        h("button", { class: "mini quiet", text: L.clearImages, onclick: () => app.clearScene(scene) }),
        h("button", { class: "mini quiet danger", text: L.remove, onclick: () => app.removeScene(scene) })),
      h("div", { class: "scene-body" },
        h("div", { class: "scene-fields" },
          Form.field(L.sceneText, Form.text(scene, "text", () => { changed(); app.setStrip.render(); }, { rows: 2 })),
          Form.field(L.sceneCast, castBox),
          h("div", { class: "grid2" },
            Form.field(L.sceneLocation, Form.select(scene, "location", locEntries, changed)),
            Form.field(L.sceneCountTag, countIn)),
          h("div", { class: "field" }, h("div", { class: "row", style: "justify-content:space-between" }, h("span", { text: L.scenePrompt }), rewrite), promptIn),
          this.extraSection(scene, changed),
          h("details", {}, h("summary", { text: L.previewPrompt }), preview)),
        thumbs));
    this.cards.set(scene.id, { el, stat, thumbs, preview, promptIn });
    this.updatePreview(scene.id);
    this.updateImages(scene.id);
    return el;
  }

  updatePreview(sceneId) {
    const card = this.cards.get(sceneId);
    const doc = this.app.doc;
    const scene = doc.scenes.find((s) => s.id === sceneId);
    if (!card || !scene) return;
    const p = PromptBuilder.build(doc, scene);
    const size = Runner.sizeOf(doc, scene);
    const base = Runner.seedBase(doc, scene);
    const seed = Number(base) >= 0 ? fmt(L.previewSeedFrom, { v: base }) : L.previewSeedRandom;
    card.preview.textContent = `${fmt(L.previewMeta, { w: size.width, h: size.height, seed, n: Doc.perScene(doc, scene) })}\n\n${p.prompt}\n\nNegative: ${p.negative}`;
  }

  updateAllPreviews() {
    for (const id of this.cards.keys()) this.updatePreview(id);
  }

  updateAllImages() {
    for (const id of this.cards.keys()) this.updateImages(id);
  }

  updateImages(sceneId) {
    const card = this.cards.get(sceneId);
    if (!card) return;
    const app = this.app;
    const run = app.doc.run;
    const list = app.images.list(sceneId);
    const picked = app.pickOf(sceneId);
    const c = Judge.counts(list, run);
    const scene = app.doc.scenes.find((s) => s.id === sceneId);
    const total = scene ? Doc.perScene(app.doc, scene) : 0;
    card.stat.innerHTML = fmt(L.statLine, { total: `${c.total}/${total}`, good: c.good, ng: c.ng, pending: c.pending }) + (picked ? esc(fmt(L.statPicked, { n: list.indexOf(picked) + 1 })) : "");
    if (!list.length) {
      card.thumbs.replaceChildren(h("div", { class: "thumbs-empty", text: L.noImages }));
      return;
    }
    card.thumbs.replaceChildren(...list.map((img, i) => {
      const v = Judge.verdict(img, run);
      const badge = img.check?.state === "done" ? fmt(L.scorePt, { score: img.check.score }) : img.check?.state === "error" ? "!" : img.manual ? (v ? L.ok : L.ng) : `#${i + 1}`;
      const pinned = app.picks.get(sceneId) === img.id;
      const cls = ["thumb", v === true ? "ok" : v === false ? "ng" : "pending", img === picked ? "picked" : "", pinned ? "pinned" : ""].filter(Boolean).join(" ");
      const open = () => app.viewer.open(sceneId, img.id);
      const tip = [`#${i + 1}`, img.check?.state === "done" ? fmt(L.scorePt, { score: img.check.score }) : img.check?.error, ...(img.check?.issues || [])].filter(Boolean).join("\n");
      return h("div", { class: cls, title: tip, role: "button", tabindex: 0, "data-image": img.id, onclick: open, onkeydown: (e) => { if (e.target === e.currentTarget && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); open(); } } },
        h("img", { src: img.thumb, alt: "", loading: "lazy" }),
        h("span", { class: `badge ${v === true ? "ok" : v === false ? "ng" : ""}`, text: badge }),
        h("button", { class: "pin", text: "★", title: L.pinTitle, "aria-pressed": String(pinned), disabled: !img.blob, onclick: (e) => { e.stopPropagation(); app.togglePin(sceneId, img.id); app.sceneChanged(sceneId); } }));
    }));
  }

  setRunning(sceneId) {
    for (const [id, card] of this.cards) card.el.classList.toggle("running", id === sceneId);
    if (sceneId) this.cards.get(sceneId)?.el.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }

  focusScene(sceneId) {
    const card = this.cards.get(sceneId);
    card?.el.scrollIntoView({ block: "center", behavior: "smooth" });
    card?.promptIn.focus();
  }
}

// ===== SET STRIP (THE CHOSEN IMAGE OF EVERY SCENE) =====
class SetStrip {
  constructor(app) {
    this.app = app;
    this.root = $("set-strip");
  }

  destroy() { this.root.replaceChildren(); }

  render() {
    const app = this.app;
    const doc = app.doc;
    if (!doc.scenes.length) { this.root.replaceChildren(); return; }
    const ui = app.store.data.ui;
    const allGood = h("input", { type: "checkbox", checked: !!ui.exportAllGood });
    allGood.addEventListener("change", () => { ui.exportAllGood = allGood.checked; app.store.save(); });
    const items = doc.scenes.map((scene, i) => {
      const list = app.images.list(scene.id);
      const img = app.pickOf(scene.id);
      const pinned = !!img && app.picks.get(scene.id) === img.id;
      const score = img?.check?.state === "done" ? fmt(L.scorePt, { score: img.check.score }) : "";
      const mode = pinned ? L.setPinned : L.setAuto;
      const state = img ? fmt(L.setStatePicked, { no: list.indexOf(img) + 1, score: score || L.viewerUnchecked, mode }) : L.setStateNone;
      const full = fmt(L.setItemTitle, { n: i + 1, title: scene.title || L.sceneTitle, state, text: scene.text || "" }).trim();
      const frame = img
        ? h("button", { class: `frame${pinned ? " pinned" : ""}`, onclick: () => app.viewer.open(scene.id, img.id) }, h("img", { src: img.thumb, alt: "" }))
        : h("div", { class: "frame empty", text: L.setEmpty });
      return h("div", { class: "set-item", "data-scene": scene.id, title: full },
        frame,
        h("span", { class: "cap clip", "data-full": full, html: `<b>#${i + 1}</b> ${esc(scene.title || "")}` }),
        h("span", { class: "cap clip", "data-full": full, text: img ? `#${list.indexOf(img) + 1} ${score} ${mode}`.replace(/\s+/g, " ") : "" }));
    });
    this.root.replaceChildren(h("div", { class: "set-strip" },
      h("div", { class: "set-strip-head" },
        h("h2", { class: "clip", text: L.setTitle }),
        h("label", { class: "check" }, allGood, L.exportAllGood),
        h("button", { class: "mini", id: "btn-download", text: L.setDownload, onclick: () => app.exportSet() }),
        h("button", { class: "mini primary", id: "btn-post", text: L.setPost, onclick: () => app.postToPromptReel() })),
      h("p", { class: "set-note note clip", text: L.setNote, "data-full": L.setNote }),
      h("div", { class: "set-items" }, ...items)));
  }
}

// ===== IMAGE VIEWER =====
class Viewer {
  constructor(app) {
    this.app = app;
    this.dlg = $("viewer");
    this.bag = new Listeners();
    this.sceneId = null;
    this.imageId = null;
    this.bag.on(this.dlg, "click", (e) => { if (e.target.closest("[data-close]")) this.dlg.close(); });
    this.bag.on($("viewer-prev"), "click", () => this.step(-1));
    this.bag.on($("viewer-next"), "click", () => this.step(1));
    this.bag.on(this.dlg, "keydown", (e) => {
      if (e.target.matches("input, textarea, select")) return;
      if (e.key === "ArrowLeft") this.step(-1);
      if (e.key === "ArrowRight") this.step(1);
    });
  }

  destroy() { this.bag.destroy(); }

  open(sceneId, imageId) {
    this.sceneId = sceneId;
    this.imageId = imageId;
    this.render();
    if (!this.dlg.open) this.dlg.showModal();
  }

  step(d) {
    const list = this.app.images.list(this.sceneId);
    const i = list.findIndex((x) => x.id === this.imageId);
    const next = list[i + d];
    if (next) this.open(this.sceneId, next.id);
  }

  render() {
    const app = this.app;
    const list = app.images.list(this.sceneId);
    const img = list.find((x) => x.id === this.imageId);
    const scene = app.doc.scenes.find((s) => s.id === this.sceneId);
    if (!img || !scene) { if (this.dlg.open) this.dlg.close(); return; }
    const run = app.doc.run;
    const v = Judge.verdict(img, run);
    const pinned = app.picks.get(this.sceneId) === img.id;
    $("viewer-title").textContent = `#${app.doc.scenes.indexOf(scene) + 1} ${scene.title || ""} ・ ${list.indexOf(img) + 1}/${list.length}`;
    $("viewer-img").src = img.url || img.thumb;
    const c = img.check;
    const scoreText = c?.state === "done" ? fmt(L.scorePt, { score: c.score }) : c?.state === "error" ? L.checkError : L.viewerUnchecked;
    const verdictText = v === true ? L.ok : v === false ? L.ng : "";
    const redo = (fn) => () => { fn(); app.sceneChanged(this.sceneId); this.render(); };
    $("viewer-info").replaceChildren(...[
      h("div", { class: `score-big ${v === true ? "ok" : v === false ? "ng" : ""}`, text: `${scoreText}${verdictText ? " ・ " + verdictText : ""}` }),
      img.manual ? h("div", { class: "note", text: fmt(L.viewerManual, { v: img.manual === "ok" ? L.ok : L.ng }) }) : null,
      c?.state === "error" ? h("div", { class: "msg err", text: c.error }) : null,
      c?.issues?.length ? h("ul", { class: "issues" }, ...c.issues.map((t) => h("li", { text: t }))) : null,
      !img.blob ? h("div", { class: "msg warn", text: L.viewerNoFull }) : null,
      h("div", { class: "actions" },
        h("button", { class: "primary", text: pinned ? L.viewerUnpick : L.viewerPick, disabled: !img.blob, onclick: redo(() => app.togglePin(this.sceneId, img.id)) }),
        h("button", { text: L.viewerOk, onclick: redo(() => { img.manual = "ok"; }) }),
        h("button", { text: L.viewerNg, onclick: redo(() => { img.manual = "ng"; }) }),
        img.manual ? h("button", { text: L.viewerAuto, onclick: redo(() => { img.manual = null; }) }) : null),
      h("div", { class: "actions" },
        h("button", { text: L.viewerRecheck, disabled: !img.blob || app.runner.busy, onclick: () => app.recheck(this.sceneId, img.id) }),
        h("button", { text: L.viewerFixSeed, onclick: () => app.fixSeed(scene, img) }),
        h("button", { text: L.viewerSave, disabled: !img.blob, onclick: () => app.saveImage(scene, img) }),
        h("button", { class: "danger", text: L.viewerDelete, onclick: () => { const next = list[list.indexOf(img) + 1] || list[list.indexOf(img) - 1]; app.deleteImage(this.sceneId, img.id); if (next) this.open(this.sceneId, next.id); else this.dlg.close(); } })),
      h("div", { class: "note keep", text: fmt(L.viewerSeed, { seed: img.seed, w: img.width, h: img.height }) }),
      h("details", { open: true }, h("summary", { text: L.viewerPromptHead }), h("pre", { text: `${img.prompt}\n\nNegative: ${img.negative}` })),
    ].filter(Boolean));
  }
}

// ===== KAMISHIBAI SLIDESHOW =====
class Slideshow {
  constructor(app) {
    this.app = app;
    this.dlg = $("show");
    this.bag = new Listeners();
    this.index = 0;
    this.timer = null;
    this.bag.on(this.dlg, "click", (e) => { if (e.target.closest("[data-close]")) this.dlg.close(); });
    this.bag.on(this.dlg, "close", () => this.pause());
    this.bag.on($("show-prev"), "click", () => this.go(this.index - 1));
    this.bag.on($("show-next"), "click", () => this.go(this.index + 1));
    this.bag.on($("show-play"), "click", () => (this.timer ? this.pause() : this.play()));
    this.bag.on($("show-stage"), "click", () => this.go(this.index + 1));
    this.bag.on(this.dlg, "keydown", (e) => {
      if (e.key === "ArrowLeft") this.go(this.index - 1);
      if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); this.go(this.index + 1); }
    });
  }

  destroy() { this.pause(); this.bag.destroy(); }

  open() {
    if (!this.app.doc.scenes.length) { this.app.notice(M.showNone, "warn", "story"); return; }
    this.index = 0;
    this.render();
    this.dlg.showModal();
  }

  go(i) {
    const n = this.app.doc.scenes.length;
    if (i < 0 || i >= n) { this.pause(); return; }
    this.index = i;
    this.render();
  }

  play() {
    $("show-play").textContent = L.showPause;
    this.timer = setInterval(() => {
      if (this.index >= this.app.doc.scenes.length - 1) this.pause();
      else this.go(this.index + 1);
    }, USER_SETTINGS.showIntervalSec * 1000);
  }

  pause() {
    clearInterval(this.timer);
    this.timer = null;
    $("show-play").textContent = L.showPlay;
  }

  render() {
    const doc = this.app.doc;
    const scene = doc.scenes[this.index];
    if (!scene) return;
    const img = this.app.pickOf(scene.id);
    $("show-stage").replaceChildren(img ? h("img", { src: img.url, alt: scene.title }) : h("div", { class: "show-missing", text: L.showNoImage }));
    $("show-title").textContent = `${this.index + 1}. ${scene.title || ""}`;
    $("show-text").textContent = scene.text || "";
    $("show-count").textContent = `${this.index + 1} / ${doc.scenes.length}`;
  }
}

    const msg = h("p", { class: "msg" });
    const chips = h("div", { class: "llm-chips", role: "group" });
    const modelSel = h("select");
    const fillModels = (models) => {
      fillSelect(modelSel, [["", L.llmModelAuto], ...models.map((m) => [m, m]), ...(llm.model && !models.includes(llm.model) ? [[llm.model, llm.model]] : [])], llm.model);
    };
    fillModels([]);
    modelSel.addEventListener("change", () => { llm.model = modelSel.value; save(); });
    const urlIn = Form.text(llm, "url", save, { type: "url" });
    const fetchModels = () => new LlmClient(llm).listModels().then((list) => { fillModels(list); return list; }).catch(() => null);
    const paintChips = (found) => {
      chips.replaceChildren(...found.map((f) => h("button", {
        type: "button", "aria-pressed": String(LlmClient.norm(f.url) === LlmClient.norm(llm.url)),

        onclick: () => { llm.url = f.url; urlIn.value = f.url; if (!f.models.includes(llm.model)) llm.model = f.models[0] || ""; save(); fillModels(f.models); paintChips(found); },

      const best = found.find((f) => LlmClient.norm(f.url) === LlmClient.norm(llm.url) && f.state === "ok") || found.find((f) => f.state === "ok") || found[0];
      llm.url = best.url;
      urlIn.value = best.url;
      fillModels(best.models);
      if (!llm.model && best.models.length) { llm.model = best.models[0]; modelSel.value = llm.model; }
      save();
      paintChips(found);
      setMsg(msg, fmt(M.detectFound, { list: found.map((f) => `${f.name}（${f.state === "ok" ? `${f.models.length} モデル` : M.pillCors}）`).join("、") }), best.state === "ok" ? "ok" : "err");
    } });
    fetchModels();
    return [
      h("p", { class: "lead", text: P.lead }),
      this.card(null,
        h("div", { class: "row" }, detect),
        Form.field(L.llmUrl, urlIn),

        h("div", { class: "row" }, h("button", { text: L.llmFetch, onclick: async () => { const list = await fetchModels(); setMsg(msg, list ? fmt(M.detectFound, { list: `${list.length} モデル` }) : M.fix.llmDown, list ? "ok" : "err"); } })),
