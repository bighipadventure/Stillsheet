class App {
  constructor() {
    this.store = new SettingsStore();
    this.firstVisit = !localStorage.getItem(USER_SETTINGS.storageKey);
    try { localStorage.removeItem(USER_SETTINGS.legacyDocKey); } catch {}
    this.doc = Doc.create();
    this.dirty = false;
    this.images = new ImageStore();
    this.picks = new Map();
    this.res = {};
    this.clock = new RunClock();
    this.lastRun = null;
    this.conn = { image: "idle", llm: "idle" };
    this.runner = new Runner(this);
    this.voices = new Map();
    this.videos = new Map();
    this.voiceFiles = new Map();
    this.novel = new NovelRunner(this);
    this.bag = new Listeners();
    PanelWindow.onWindow((doc, win) => {
      const bag = new Listeners();
      const numbers = NumberControl.watch(doc.body);
      const grow = AutoGrow.watch(doc.body, [], bag);
      ClipTitle.attach(doc.body, bag);
      bag.on(win, "resize", () => AutoGrow.fitAll(doc.body));
      return () => { numbers.disconnect(); grow.disconnect(); bag.destroy(); };
    });
    this.numbers = NumberControl.watch(document.body);
    this.grow = AutoGrow.watch(document.body, [...PanelWindow.queryAll(".col-left, .col-center, .col-right")], this.bag);
    const statusPanel = PanelWindow.query(".status-panel");
    this.statusSize = new ResizeObserver(() => document.body.style.setProperty("--status-h", `${statusPanel.offsetHeight}px`));
    this.statusSize.observe(statusPanel);
    this.left = new LeftPanel(this);
    this.right = new RightPanel(this);
    this.board = new SceneBoard(this);
    this.setStrip = new SetStrip(this);
    this.viewer = new Viewer(this);
    this.picker = new ImagePicker(this);
    this.takes = new VoicePicker(this);
    this.show = new Slideshow(this);
    this.settings = new SettingsDialog(this);
    this.etaTimer = null;
    LlmClient.onProgress = (text) => this.status(text);
    LlmClient.onStall = (text) => this.status(text);
    this.bindTop();
    this.panelWindows = {};
    for (const side of ["left", "right"]) {
      this.panelWindows[side] = new PanelWindow({
        side,
        col: PanelWindow.query(`[data-panel="${side}"]`),
        button: $(`btn-pop-${side}`),
        onChange: (on, error) => {
          if (error) this.notice(error, "warn");
          this.applyPanels();
          AutoGrow.fitAll(document.body);
        },
      });
    }
    this.bindSplitters();
    this.applySideWidths();
    this.applyPanels();
    this.applyHelp();
    ClipTitle.attach(document.body, this.bag);
    fillSelect($("run-target"), USER_SETTINGS.runTargets, this.doc.run.target);
    this.left.render();
    this.right.render();
    this.renderAll();
    this.applyMode();
    this.phase("idle", "");
    this.status(M.runIdle);
    this.probeAll();
    if (this.firstVisit) { this.store.save(); this.settings.open("guide"); }
  }

  destroy() {
    this.runner.stop();
    clearInterval(this.etaTimer);
    this.numbers.disconnect();
    this.grow.disconnect();
    this.statusSize.disconnect();
    for (const part of [...Object.values(this.panelWindows), this.bag, this.novel, this.left, this.right, this.board, this.setStrip, this.viewer, this.picker, this.takes, this.show, this.settings]) part.destroy();
    this.images.clearAll();
    this.clearNovelMedia();
  }

  // SIDE PANEL WIDTHS AND HELP TEXT
  // 左右のパネルを畳む・開く。矢印はパネルが動く向き（左パネルの « で左へ畳む、細い帯の » で開く）
  applyPanels() {
    const ui = this.store.data.ui;
    const layout = PanelWindow.query(".layout");
    for (const side of ["left", "right"]) {
      const hidden = (side === "left" ? !!ui.hideLeft : !!ui.hideRight) || !!this.panelWindows?.[side]?.detached;
      layout.classList.toggle(`hide-${side}`, hidden);
      const btn = $(`btn-toggle-${side}`);
      btn.setAttribute("aria-expanded", String(!hidden));
      btn.querySelector(".arrow").textContent = L.panelToggle[side][hidden ? 1 : 0];
      btn.title = L.panelToggleTitle[side][hidden ? 1 : 0];
      btn.setAttribute("aria-label", L.panelToggleTitle[side][hidden ? 1 : 0]);
    }
  }

  togglePanel(side) {
    const ui = this.store.data.ui;
    const key = side === "left" ? "hideLeft" : "hideRight";
    ui[key] = !ui[key];
    this.store.save();
    this.applyPanels();
  }

  applySideWidths() {
    const ui = this.store.data.ui;
    const cfg = USER_SETTINGS.sidePanels;
    const layout = PanelWindow.query(".layout");
    layout.style.setProperty("--left-w", `${ui.leftW || cfg.left[2]}px`);
    layout.style.setProperty("--right-w", `${ui.rightW || cfg.right[2]}px`);
  }

  bindSplitters() {
    const cfg = USER_SETTINGS.sidePanels;
    const layout = PanelWindow.query(".layout");
    PanelWindow.queryAll(".splitter").forEach((bar) => {
      const side = bar.dataset.side;
      const key = side === "left" ? "leftW" : "rightW";
      const [min, max, initial] = cfg[side];
      let active = false;
      this.bag.on(bar, "pointerdown", (e) => {
        if (e.button !== 0) return;
        active = true;
        bar.setPointerCapture(e.pointerId);
        bar.classList.add("dragging");
        document.body.classList.add("resizing");
      });
      this.bag.on(bar, "pointermove", (e) => {
        if (!active) return;
        const ui = this.store.data.ui;
        const rect = layout.getBoundingClientRect();
        const other = side === "left" ? (ui.rightW || cfg.right[2]) : (ui.leftW || cfg.left[2]);
        const raw = side === "left" ? e.clientX - rect.left : rect.right - e.clientX;
        const limit = Math.min(max, rect.width - other - cfg.centerMin - cfg.splitterPx * 2);
        ui[key] = Math.round(Math.min(Math.max(raw, min), Math.max(min, limit)));
        this.applySideWidths();
      });
      const end = () => {
        if (!active) return;
        active = false;
        bar.classList.remove("dragging");
        document.body.classList.remove("resizing");
        this.store.save();
      };
      this.bag.on(bar, "pointerup", end);
      this.bag.on(bar, "pointercancel", end);
      this.bag.on(bar, "dblclick", () => {
        this.store.data.ui[key] = initial;
        this.store.save();
        this.applySideWidths();
      });
    });
  }

  applyHelp() {
    const on = this.store.data.ui.help !== false;
    $("help-toggle").checked = on;
    document.body.classList.toggle("no-help", !on);
  }

  // CONNECTIONS
  backend() {
    const url = this.store.url;
    if (!this.client || this.client.kind !== this.store.data.backend || this.client.url !== url) {
      const inst = this.store.data.backend === "comfy" ? new ComfyClient(url) : new A1111Client(url);
      this.client = { kind: this.store.data.backend, url, inst };
    }
    return this.client.inst;
  }

  llm() {
    return new LlmClient(this.store.data.llm);
  }

  voiceClient() {
    return new IrodoriClient(this.store.data.voice.bridgeUrl);
  }

  videoClient() {
    const cfg = this.store.data.video;
    if (!this.video || this.video.cfgKey !== JSON.stringify(cfg)) this.video = Object.assign(new VideoClient(cfg), { cfgKey: JSON.stringify(cfg) });
    return this.video;
  }

  async probeNovel() {
    const pv = $("pill-voice"), pd = $("pill-video");
    if (this.doc.mode !== "novel") return;
    setPill(pv, NL.pillVoice, M.probing);
    setPill(pd, NL.pillVideo, M.probing);
    const [vs, ds] = await Promise.all([this.voiceClient().check(), Net.probe(this.videoClient().probeUrl)]);
    const stateOf = (st) => (st === "ok" ? "ok" : st === "cors" || st === "warn" ? "warn" : "down");
    pv.dataset.state = stateOf(vs.state);
    pd.dataset.state = stateOf(ds);
    setPill(pv, NL.pillVoice, vs.state === "ok" ? "Irodori" : vs.state === "down" ? NM.pillDown : NM.pillCors);
    setPill(pd, NL.pillVideo, ds === "ok" ? "ComfyUI" : ds === "cors" ? NM.pillCors : NM.pillDown);
    pv.title = `${NL.pillVoice}: ${vs.text}`;
    pd.title = `${NL.pillVideo}: ${this.videoClient().base}`;
  }

  async probeAll() {
    const llmPill = $("pill-llm"), imgPill = $("pill-img");
    const short = USER_SETTINGS.backends[this.store.data.backend].short;
    setPill(llmPill, "文章AI", M.probing);
    setPill(imgPill, "画像AI", M.probing);
    const llmCfg = this.store.data.llm;
    const llmUrl = LlmClient.norm(llmCfg.url);
    const [ls, is] = await Promise.all([Net.probe(`${llmUrl}/models`), Net.probe(this.backend().probeUrl)]);
    this.conn = { image: is, llm: ls };
    const label = (state, name) => (state === "ok" ? name : state === "cors" ? `${name}（${M.pillCors}）` : `${name}（${M.pillDown}）`);
    const stateOf = (s) => (s === "ok" ? "ok" : s === "cors" ? "warn" : "down");
    llmPill.dataset.state = stateOf(ls);
    imgPill.dataset.state = stateOf(is);
    const llmName = LlmClient.appName(llmUrl) + (llmCfg.model ? ` · ${llmCfg.model}` : "");
    setPill(llmPill, "文章AI", label(ls, llmName));
    setPill(imgPill, "画像AI", label(is, short));
    llmPill.title = `文章AI: ${llmName}（${llmUrl}）`;
    imgPill.title = `画像AI: ${short}（${this.store.url}）`;
    this.probeNovel();
    if (is === "ok" && !this.res.models) await this.loadResources();
    return this.conn;
  }

  async refreshConnections() {
    const llmCfg = this.store.data.llm;
    const state = await Net.probe(`${LlmClient.norm(llmCfg.url)}/models`);
    if (state !== "ok") {
      const found = (await LlmClient.detect(llmCfg)).find((f) => f.state === "ok");
      if (found) {
        llmCfg.url = found.url;
        if (!found.models.includes(llmCfg.model)) llmCfg.model = found.models[0] || "";
        this.store.save();
      }
    }
    this.res = {};
    const conn = await this.probeAll();
    if (conn.image !== "ok") this.notice(conn.image === "cors" ? M.fix.imageCors : M.fix.imageDown, "err", conn.image === "cors" ? "settingsGuide" : "settings");
    else if (conn.llm !== "ok") this.notice(conn.llm === "cors" ? M.fix.llmCors : M.fix.llmDown, "warn", "settingsLlm");
    else this.notice(M.probeOk, "ok");
  }

  async loadResources(msgEl) {
    try {
      this.res = await this.backend().resources();
      if (msgEl) setMsg(msgEl, fmt(M.listsLoaded, { models: this.res.models.length, loras: this.res.loras.length }), "ok");
      this.right.render();
    } catch (err) {
      if (msgEl) setMsg(msgEl, fmt(M.listsFailed, { err: Guide.text(err, "image") }), "err");
    }
  }

  async connectionReport() {
    const conn = await this.probeAll();
    const lines = [];
    lines.push(`画像AI: ${Net.message(conn.image)}`);
    if (conn.image === "ok") {
      const ping = await CorsExtension.ping(this.store.data.backend, this.store.url);
      lines.push(ping ? fmt(M.corsPing, { version: ping.version, server: ping.server }) : M.corsPingNone);
    }
    lines.push(`文章AI: ${Net.message(conn.llm)}`);
    return { ok: conn.image === "ok" && conn.llm === "ok", text: lines.join("\n") };
  }

  async stateInfo() {
    const P = USER_SETTINGS.pages.state;
    const d = this.store.data;
    const conn = await this.probeAll();
    const ping = conn.image === "ok" ? await CorsExtension.ping(d.backend, this.store.url) : null;
    let bytes = 0, full = 0;
    for (const list of this.images.byScene.values()) for (const img of list) if (img.blob) { bytes += img.blob.size; full++; }
    const sec = (ms) => (ms == null ? "—" : formatDuration(ms));
    const r = this.lastRun;
    return [
      [P.image, [["ソフト", USER_SETTINGS.backends[d.backend].label], ["URL", this.store.url], ["状態", Net.message(conn.image)], ["web-app-cors", ping ? `v${ping.version}（${ping.server}）` : M.corsPingNone],
        ["Checkpoint", this.res.models ? `${this.res.models.length} 件` : "—"], ["LoRA", this.res.loras ? `${this.res.loras.length} 件` : "—"], ["選んでいる Checkpoint", this.doc.common.model || L.keepCurrent]]],
      [P.llm, [["アプリ", LlmClient.appName(d.llm.url)], ["URL", d.llm.url], ["状態", Net.message(conn.llm)], ["モデル", d.llm.model || L.llmModelAuto], ["温度 / 最大トークン", `${d.llm.temperature} / ${d.llm.maxTokens}`]]],
      [P.work, [["シーン", `${this.doc.scenes.length} 件`], ["登場人物 / 場所", `${this.doc.cast.length} 人 / ${this.doc.locations.length} 件`], ["ベース画像", this.doc.base?.name || "—"],
        ["生成した画像", `${this.images.total} 枚（元の画像を保持 ${full} 枚・約 ${(bytes / 1048576).toFixed(1)} MB）`], ["保存していない変更", this.dirty ? "あり" : "なし"]]],
      [P.run, [["1枚の生成", sec(this.clock.avg.gen)], ["1枚のチェック", sec(this.clock.avg.check)], ["VRAM の入れ替え", sec(this.clock.avg.vram)],
        ["結果", r ? `${r.scenes} シーン・${r.made} 枚・合格 ${r.good} 枚・${r.time}` : "—"]]],
    ];
  }

  async preflight(scenes) {
    const doc = this.doc;
    const empty = scenes.find((s) => !(s.prompt.trim() || s.count.trim() || s.cast.length));
    if (empty) {
      const n = doc.scenes.indexOf(empty) + 1;
      throw Guide.fail(fmt(M.fix.emptyPrompt, { n }), `scene:${empty.id}`);
    }
    if (this.store.data.backend === "comfy" && !doc.common.model) throw Guide.fail(M.needModelComfy, "image:model");
    this.phase("idle", "");
    this.status(M.runPreparing);
    const image = await Net.probe(this.backend().probeUrl);
    if (image === "down") throw Guide.fail(M.fix.imageDown, "refresh");
    if (image === "cors") throw Guide.fail(M.fix.imageCors, "settingsGuide");
    if (doc.run.check) {
      const llm = await Net.probe(`${LlmClient.norm(this.store.data.llm.url)}/models`);
      if (llm !== "ok") throw Guide.fail(M.fix.checkNoLlm, "run");
    }
  }

  // DOCUMENT STATE
  docChanged(structural) {
    this.dirty = true;
    if (structural) this.renderAll();
  }

  replaceDoc(doc) {
    this.runner.stop();
    this.images.clearAll();
    this.picks.clear();
    this.novel.stop();
    this.clearNovelMedia();
    this.doc = doc;
    this.dirty = false;
    fillSelect($("run-target"), USER_SETTINGS.runTargets, doc.run.target);
    this.left.render();
    this.right.render();
    this.renderAll();
    this.applyMode();
  }

  // NOVEL GAME MODE
  setMode(mode) {
    if (this.runner.busy || this.novel.busy) { this.notice(NM.modeBusy, "warn"); this.left.render(); return; }
    this.doc.mode = mode === "novel" ? "novel" : "sheet";
    this.dirty = true;
    if (this.doc.mode === "novel") this.snapAspect();
    this.left.render();
    this.right.render();
    this.renderAll();
    this.applyMode();
  }

  applyMode() {
    const novel = this.doc.mode === "novel";
    document.body.classList.toggle("mode-novel", novel);
    $("pill-voice").hidden = !novel;
    $("pill-video").hidden = !novel;
    $("btn-show").textContent = novel ? NL.showTitle : NL.sheetShowTitle;
    $("btn-show").title = novel ? NL.showTitleTip : NL.sheetShowTip;
    $("btn-run").textContent = novel ? NL.runContinue : NL.runImages;
    if (novel) this.probeNovel();
  }

  importScenario(obj, name) {
    if (this.runner.busy || this.novel.busy) { this.notice(M.runBusy, "warn"); return false; }
    const doc = this.doc;
    const count = doc.scenes.reduce((n, s) => n + this.images.list(s.id).length, 0);
    if (doc.scenes.length && !confirm(fmt(NM.scenarioReplace, { n: doc.scenes.length, count }))) return false;
    const added = NovelWriter.mergeCast(doc, obj.cast || obj.characters);
    NovelWriter.mergeLocations(doc, obj.locations);
    let out;
    try {
      out = NovelWriter.acceptPlan(doc, obj);
    } catch {
      this.notice(NM.scenarioBad, "err");
      return false;
    }
    doc.mode = "novel";
    if (typeof obj.title === "string" && obj.title.trim()) doc.title = obj.title.trim();
    if (typeof obj.synopsis === "string" && obj.synopsis.trim()) doc.synopsis = obj.synopsis.trim();
    doc.scenes = out.scenes;
    doc.novel.imageCount = clamp(out.scenes.length, NV.limits.imageCount);
    this.images.clearAll();
    this.picks.clear();
    this.clearNovelMedia();
    this.dirty = true;
    this.snapAspect();
    this.left.render();
    this.right.render();
    this.renderAll();
    this.applyMode();
    const lines = out.scenes.reduce((n, s) => n + s.lines.length, 0);
    this.notice(fmt(NM.scenarioLoaded, { name, g: Doc.groups(doc).length, n: out.scenes.length, lines, cast: doc.cast.length, added }), "ok");
    return true;
  }

  async regenCastImages(person) {
    const scenes = this.doc.scenes.filter((s) => s.cast.includes(person.id));
    if (!scenes.length) return;
    if (this.runner.busy || this.novel.busy) { this.notice(M.runBusy, "warn"); return; }
    const count = scenes.reduce((n, s) => n + this.images.list(s.id).length, 0);
    if (count && !confirm(fmt(NM.castRegenConfirm, { name: person.name || L.castUnnamed, n: scenes.length, count }))) return;
    for (const s of scenes) {
      this.images.clear(s.id);
      this.picks.delete(s.id);
      this.sceneChanged(s.id);
    }
    if (this.doc.mode === "novel") this.snapAspect();
    await this.run(scenes.map((s) => s.id));
  }

  moveLines(fromId, toId) {
    const lines = this.doc.scenes.flatMap((s) => s.lines).filter((l) => l.who === fromId);
    lines.forEach((l) => { l.who = toId; });
    this.dirty = true;
    this.board.paintNovel();
    this.left.render();
    this.left.paintSteps();
    this.notice(fmt(NM.castMoved, { from: NovelWriter.nameOf(this.doc, fromId), to: NovelWriter.nameOf(this.doc, toId), n: lines.length }), "ok");
  }

  downloadRequest() {
    const text = NovelWriter.requestText(this.doc);
    downloadBlob(new Blob([text], { type: "text/markdown" }), fmt(NV.requestFile, { title: safeName(this.doc.title) || "novel" }));
    this.notice(NM.requestSaved, "ok");
  }

  async copyRequest() {
    try {
      await navigator.clipboard.writeText(NovelWriter.requestText(this.doc));
      this.notice(NM.requestCopied, "ok");
    } catch {
      this.downloadRequest();
    }
  }

  async generateMore(sceneId, n) {
    const scene = this.doc.scenes.find((s) => s.id === sceneId);
    if (!scene) return;
    if (this.doc.mode === "novel") this.snapAspect();
    const keep = scene.perScene;
    scene.perScene = n;
    try {
      await this.run([sceneId]);
    } finally {
      scene.perScene = keep;
      this.picker.render();
    }
  }

  aspectOf(w, hh) {
    const ratio = w / hh;
    return NV.imageAspects.reduce((best, a) => (Math.abs(Math.log(a[2] / a[3] / ratio)) < Math.abs(Math.log(best[2] / best[3] / ratio)) ? a : best));
  }

  snapAspect() {
    const c = this.doc.common;
    const nv = this.doc.novel;
    const exact = (w, hh) => NV.imageAspects.find((a) => a[2] === w && a[3] === hh);
    const cur = exact(c.width, c.height) || this.aspectOf(c.width, c.height);
    let changed = c.width !== cur[2] || c.height !== cur[3] || nv.aspect !== cur[0];
    [nv.aspect, c.width, c.height] = [cur[0], cur[2], cur[3]];
    for (const s of this.doc.scenes) {
      if (Number(s.width) > 0 && !exact(Number(s.width), Number(s.height))) { s.width = null; s.height = null; changed = true; }
    }
    if (changed) { this.dirty = true; this.right.render(); this.board.render(); }
  }

  clearNovelMedia() {
    for (const m of [this.voices, this.videos]) {
      for (const e of m.values()) for (const x of [e, ...(e?.takes || [])]) if (x?.url) URL.revokeObjectURL(x.url);
      m.clear();
    }
  }

  reorderGroups(ids) {
    const groups = new Map(Doc.groups(this.doc).map((g) => [g.head.id, g.scenes]));
    const next = ids.flatMap((id) => groups.get(id) || []);
    if (next.length !== this.doc.scenes.length) return;
    this.doc.scenes.splice(0, this.doc.scenes.length, ...next);
    this.doc.scenes.forEach((s, i) => { if (i === 0) s.sceneStart = true; });
    this.docChanged(true);
  }

  reorderInGroup(headId, ids) {
    const g = Doc.groups(this.doc).find((x) => x.head.id === headId);
    if (!g) return;
    const byId = new Map(g.scenes.map((s) => [s.id, s]));
    const next = ids.map((id) => byId.get(id)).filter(Boolean);
    if (next.length !== g.scenes.length) return;
    if (next[0] !== g.head) {
      Object.assign(next[0], { sceneStart: g.head.sceneStart, sceneTitle: g.head.sceneTitle });
      Object.assign(g.head, { sceneStart: false, sceneTitle: "" });
      if (this.board.collapsed.delete(g.head.id)) this.board.collapsed.add(next[0].id);
    }
    const at = this.doc.scenes.indexOf(g.scenes[0]);
    this.doc.scenes.splice(at, next.length, ...next);
    this.docChanged(true);
  }

  joinGroup(head) {
    Object.assign(head, { sceneStart: false, sceneTitle: "" });
    this.docChanged(true);
  }

  splitGroup(scene) {
    scene.sceneStart = true;
    this.docChanged(true);
  }

  removeGroup(head) {
    if (this.runner.busy || this.novel.busy) { this.notice(M.runBusy, "warn"); return; }
    const g = Doc.groups(this.doc).find((x) => x.head.id === head.id);
    if (!g) return;
    const count = g.scenes.reduce((n, s) => n + this.images.list(s.id).length, 0);
    if (!confirm(fmt(M.deleteSceneConfirm, { n: Doc.groups(this.doc).indexOf(g) + 1, count }))) return;
    this.doc.scenes = this.doc.scenes.filter((s) => !g.scenes.includes(s));
    if (this.doc.scenes[0]) this.doc.scenes[0].sceneStart = true;
    this.docChanged(true);
  }

  addImageToGroup(head) {
    const g = Doc.groups(this.doc).find((x) => x.head.id === head.id);
    if (!g) return;
    const last = g.scenes[g.scenes.length - 1];
    const scene = Doc.newScene({ cast: last.cast.slice(), location: last.location });
    this.doc.scenes.splice(this.doc.scenes.indexOf(last) + 1, 0, scene);
    this.docChanged(true);
    this.board.cards.get(scene.id)?.el.scrollIntoView({ behavior: "smooth", block: "center" });
  }

  renderHead() {
    $("story-title").textContent = this.doc.title || L.untitled;
    const syn = $("story-synopsis");
    syn.textContent = this.doc.synopsis || "";
    syn.dataset.full = this.doc.synopsis || "";
    this.dirty = true;
  }

  renderAll() {
    const wasDirty = this.dirty;
    this.images.keepOnly(this.doc.scenes.map((s) => s.id));
    for (const id of [...this.picks.keys()]) if (!this.doc.scenes.some((s) => s.id === id)) this.picks.delete(id);
    for (const [id, e] of [...this.videos]) if (!this.doc.scenes.some((s) => s.id === id)) { if (e?.url) URL.revokeObjectURL(e.url); this.videos.delete(id); }
    this.renderHead();
    this.dirty = wasDirty;
    this.board.render();
    this.setStrip.render();
    this.updateRunNote();
    this.left.paintSteps();
  }

  sceneChanged(sceneId) {
    this.board.updateImages(sceneId);
    this.board.paintVideo(sceneId);
    this.left.paintSteps();
    this.setStrip.render();
    if (this.viewer.dlg.open && this.viewer.sceneId === sceneId) this.viewer.render();
  }

  updateRunNote() {
    this.updateAddAt();
    const r = this.doc.run;
    const ids = this.doc.scenes.map((s) => s.id);
    const total = this.doc.scenes.reduce((n, s) => n + Doc.perScene(this.doc, s), 0);
    const check = r.check ? fmt(L.runNoteCheck, { threshold: r.threshold }) : L.runNoteNoCheck;
    $("run-note").textContent = ids.length ? fmt(L.runNote, { scenes: ids.length, per: r.perScene, total, check }) : "";
  }

  // STATUS (PHASE, MESSAGE WITH A FIX BUTTON, PROGRESS, REMAINING TIME)
  status(text) {
    const el = $("run-status");
    el.replaceChildren(text);
    el.dataset.kind = "";
  }

  notice(text, kind = "", action = null) {
    const el = $("run-status");
    const kids = [h("span", { text })];
    const label = this.actionLabel(action);
    if (label) kids.push(h("button", { class: "fix", text: label, onclick: () => this.runAction(action) }));
    el.replaceChildren(...kids);
    el.dataset.kind = kind;
  }

  phase(kind, title) {
    const el = $("run-phase");
    el.dataset.phase = kind;
    el.textContent = USER_SETTINGS.phases[kind] || kind;
    if (title !== undefined) { $("run-title").textContent = title; $("run-title").dataset.full = title; }
  }

  progress(p) {
    const pct = Math.round(clamp(Number(p) || 0, [0, 1]) * 100);
    $("run-bar").style.width = `${pct}%`;
    $("progress-pct").textContent = `${pct}%`;
    $("progress").setAttribute("aria-valuenow", String(pct));
    document.title = this.runner.busy ? `(${pct}%) ${USER_SETTINGS.appName}` : USER_SETTINGS.appName;
  }

  updateEta(est) {
    const el = $("run-eta");
    clearInterval(this.etaTimer);
    this.etaTimer = null;
    if (!this.runner.busy) { el.textContent = ""; el.title = ""; document.title = USER_SETTINGS.appName; return; }
    if (!est) { el.textContent = M.etaMeasuring; return; }
    const deadline = Date.now() + est.ms;
    const tpl = est.partial ? M.etaMax : M.eta;
    const paint = () => { el.textContent = fmt(tpl, { time: formatDuration(Math.max(0, deadline - Date.now())) }); };
    el.title = fmt(M.etaTitle, { gen: formatDuration(this.clock.avg.gen || 0), check: this.clock.has("check") ? formatDuration(this.clock.avg.check) : "—" });
    paint();
    this.etaTimer = setInterval(paint, 1000);
  }

  actionLabel(action) {
    if (!action) return "";
    const A = M.fixActions;
    const [kind, arg] = action.split(":");
    if (kind === "scene") return fmt(A.scene, { n: this.doc.scenes.findIndex((s) => s.id === arg) + 1 });
    return A[kind] || "";
  }

  runAction(action) {
    const [kind, arg] = String(action).split(":");
    if (kind === "settings") this.settings.open("conn");
    else if (kind === "settingsLlm") this.settings.open("llm");
    else if (kind === "settingsGuide") this.settings.open("guide");
    else if (kind === "refresh") this.refreshConnections();
    else if (kind === "image") this.right.show("image", arg);
    else if (kind === "run") this.right.show("run", "threshold");
    else if (kind === "story") this.left.focus("story", "#brief");
    else if (kind === "scene") this.board.focusScene(arg);
    else if (kind === "imageFolder") $("file-folder").click();
    else if (kind === "target") { this.doc.run.target = "all"; $("run-target").value = "all"; this.status(M.runIdle); }
    else if (kind === "settingsVoice") this.settings.open("voice");
    else if (kind === "settingsVideo") this.settings.open("video");
    else if (kind === "cast") this.left.focus("cast");
  }

  runStateChanged(running) {
    running = running || this.novel.busy;
    $("btn-run").disabled = running;
    $("btn-stop").hidden = !running;
    this.picker.render();
    this.takes.render();
    for (const b of PanelWindow.queryAll(".scene-run, #btn-check-only")) b.disabled = running;
    if (!running) this.progress($("run-bar").style.width === "100%" ? 1 : 0);
  }

  markRunning(sceneId) { this.board.setRunning(sceneId); }

  // PICKS
  pickOf(sceneId) {
    return Judge.pick(this.images.list(sceneId), this.doc.run, this.picks.get(sceneId));
  }

  togglePin(sceneId, imageId) {
    if (this.picks.get(sceneId) === imageId) this.picks.delete(sceneId);
    else this.picks.set(sceneId, imageId);
  }

  // STORY
  async writeStory(msgEl) {
    if (this.runner.busy) { setMsg(msgEl, M.runBusy, "err"); return; }
    if (!this.doc.brief.trim()) { setMsg(msgEl, M.fix.needBrief, "err"); this.left.focus("story", "#brief"); return; }
    const count = this.doc.scenes.reduce((n, s) => n + this.images.list(s.id).length, 0);
    if (this.doc.scenes.length && !confirm(fmt(M.storyReplace, { n: count }))) return;
    setMsg(msgEl, M.storyRunning);
    this.phase("llm", M.storyRunning);
    this.status(M.storyRunning);
    this.storyCtl = new AbortController();
    $("btn-stop").hidden = false;
    try {
      const out = await StoryWriter.write(this.llm(), this.doc, this.storyCtl.signal);
      if (out.title) this.doc.title = out.title;
      if (out.synopsis) this.doc.synopsis = out.synopsis;
      this.doc.scenes = out.scenes;
      if (this.doc.sceneCount !== out.scenes.length) this.doc.sceneCount = clamp(out.scenes.length, USER_SETTINGS.limits.sceneCount);
      this.docChanged(true);
      this.left.render();
      const done = fmt(M.storyDone, { n: out.scenes.length });
      this.phase("done", "");
      this.notice(done, "ok");
      const m = $("story-msg");
      if (m) setMsg(m, done, "ok");
    } catch (err) {
      const why = Guide.explain(err, "llm");
      setMsg(msgEl, why.text, why.aborted ? "" : "err");
      this.phase(why.aborted ? "stop" : "error", "");
      this.notice(why.text, why.aborted ? "" : "err", why.action);
    } finally {
      this.storyCtl = null;
      $("btn-stop").hidden = !this.runner.busy;
    }
  }

  async rewriteScene(scene, { countIn, promptIn }) {
    const n = this.doc.scenes.indexOf(scene) + 1;
    if (!scene.title.trim() && !scene.text.trim()) { this.notice(M.fix.needSceneText, "warn", `scene:${scene.id}`); return; }
    this.phase("llm", fmt(M.rewriteRunning, { n }));
    this.status(fmt(M.rewriteRunning, { n }));
    try {
      const out = await StoryWriter.rewriteScene(this.llm(), this.doc, scene, new AbortController().signal);
      if (out.count) { scene.count = out.count; countIn.value = out.count; }
      scene.prompt = out.prompt;
      promptIn.value = out.prompt;
      AutoGrow.fit(promptIn);
      this.docChanged(false);
      this.board.updatePreview(scene.id);
      this.phase("done", "");
      this.notice(fmt(M.rewriteDone, { n }), "ok");
    } catch (err) {
      const why = Guide.explain(err, "llm");
      this.phase("error", "");
      this.notice(why.text, "err", why.action);
    }
  }

  // SCENES
  addScene() {
    const at = $("add-at").value;
    const index = at === "end" ? this.doc.scenes.length : clamp(Number(at) || 0, [0, this.doc.scenes.length]);
    const scene = Doc.newScene({ cast: this.doc.cast.slice(0, 1).map((c) => c.id), sceneStart: this.doc.mode === "novel" });
    this.doc.scenes.splice(index, 0, scene);
    $("add-at").value = "end";
    this.docChanged(true);
    this.board.cards.get(scene.id)?.el.scrollIntoView({ behavior: "smooth", block: "center" });
  }

  updateAddAt() {
    const sel = $("add-at");
    const n = this.doc.scenes.length;
    const entries = [["end", L.addAtEnd], ...(n ? [["0", L.addAtTop]] : []), ...Array.from({ length: Math.max(0, n - 1) }, (_, i) => [String(i + 1), fmt(L.addAtAfter, { n: i + 1 })])];
    fillSelect(sel, entries, entries.some(([v]) => v === sel.value) ? sel.value : "end");
  }

  duplicateScene(scene) {
    const i = this.doc.scenes.indexOf(scene);
    const { id, ...rest } = clone(scene);
    this.doc.scenes.splice(i + 1, 0, Doc.newScene({ ...rest, sceneStart: false, sceneTitle: "", lines: (rest.lines || []).map((l) => ({ ...l, id: "v" + uid() })) }));
    this.docChanged(true);
  }

  clearScene(scene) {
    const count = this.images.list(scene.id).length;
    if (!count) return;
    if (this.runner.busy) { this.notice(M.runBusy, "warn"); return; }
    if (!confirm(fmt(M.clearConfirm, { n: this.doc.scenes.indexOf(scene) + 1, count }))) return;
    this.images.clear(scene.id);
    this.picks.delete(scene.id);
    this.sceneChanged(scene.id);
  }

  reorderScenes(ids) {
    const byId = new Map(this.doc.scenes.map((sc) => [sc.id, sc]));
    const next = ids.map((id) => byId.get(id)).filter(Boolean);
    if (next.length !== this.doc.scenes.length) return;
    this.doc.scenes.splice(0, this.doc.scenes.length, ...next);
    this.docChanged(true);
  }

  removeScene(scene) {
    if (this.runner.busy) { this.notice(M.runBusy, "warn"); return; }
    const count = this.images.list(scene.id).length;
    if (!confirm(fmt(M.deleteSceneConfirm, { n: this.doc.scenes.indexOf(scene) + 1, count }))) return;
    this.doc.scenes = this.doc.scenes.filter((s) => s !== scene);
    this.docChanged(true);
  }

  deleteImage(sceneId, imageId) {
    if (this.picks.get(sceneId) === imageId) this.picks.delete(sceneId);
    this.images.remove(sceneId, imageId);
    this.sceneChanged(sceneId);
  }

  fixSeed(scene, img) {
    scene.seed = img.seed;
    this.docChanged(true);
    this.notice(fmt(L.viewerSeed, { seed: img.seed, w: img.width, h: img.height }) + ` → #${this.doc.scenes.indexOf(scene) + 1}`, "ok", `scene:${scene.id}`);
  }

  async recheck(sceneId, imageId) {
    const scene = this.doc.scenes.find((s) => s.id === sceneId);
    const img = this.images.list(sceneId).find((i) => i.id === imageId);
    if (!scene || !img?.blob) return;
    img.check = { state: "pending" };
    this.sceneChanged(sceneId);
    try {
      img.check = await ImageChecker.check(this.llm(), this.doc, scene, img, new AbortController().signal);
    } catch (err) {
      const why = Guide.explain(err, "llm");
      img.check = { state: "error", error: why.text };
      this.notice(why.text, "err", why.action);
    }
    this.sceneChanged(sceneId);
  }

  checkOnly() {
    return this.runner.checkOnly(this.doc.scenes.map((s) => s.id));
  }

  // RUN
  targetScenes() {
    const run = this.doc.run;
    if (run.target === "lacking") return this.doc.scenes.filter((s) => Judge.lacking(this.images.list(s.id), run)).map((s) => s.id);
    return this.doc.scenes.map((s) => s.id);
  }

  async run(sceneIds) {
    try {
      return await this.runner.run(sceneIds || this.targetScenes());
    } catch (err) {
      if (err?.shown) return null;
      const why = Guide.explain(err, "image");
      this.phase("error", "");
      this.notice(why.text, "err", why.action);
      return null;
    }
  }

  // FILES
  imageCount() { return this.images.total; }

  saveProject() {
    const blob = new Blob([JSON.stringify(Doc.serialize(this.doc), null, 2)], { type: "application/json" });
    downloadBlob(blob, `${USER_SETTINGS.fileNamePrefix}${safeName(this.doc.title) || "project"}_${timestamp()}.json`);
    this.dirty = false;
    this.notice(M.savedProject, "ok");
  }

  async saveProjectWithImages() {
    const pad = (n) => String(n).padStart(2, "0");
    const extOf = (blob) => ({ "image/jpeg": "jpg", "image/webp": "webp" })[blob.type] || "png";
    const scenes = this.doc.scenes;
    const m = scenes.reduce((n, sc) => n + this.images.list(sc.id).length, 0);
    const files = [], images = {};
    let k = 0, p = 0;
    for (let i = 0; i < scenes.length; i++) {
      const scene = scenes[i];
      const stem = `${pad(i + 1)}_${safeName(scene.title) || "scene"}`;
      const list = this.images.list(scene.id);
      images[scene.id] = [];
      for (let j = 0; j < list.length; j++) {
        const img = list[j];
        this.status(fmt(M.savingImages, { k: ++k, m }));
        const blob = img.blob || await (await fetch(img.thumb)).blob();
        const score = img.check?.state === "done" ? `_${img.check.score}点` : "";
        const path = `${L.zipImagesDir}/${stem}/${pad(j + 1)}${score}_${img.seed}.${extOf(blob)}`;
        files.push({ path, data: new Uint8Array(await blob.arrayBuffer()) });
        const { id, seed, info, prompt, negative, width, height, settings, check, manual, createdAt } = img;
        images[scene.id].push({ id, file: path, full: !!img.blob, seed, info, prompt, negative, width, height, settings, check, manual, createdAt });
      }
      const pick = this.pickOf(scene.id);
      if (pick?.blob) { files.push({ path: `${L.zipPickedDir}/${stem}.png`, data: await this.pngBytes(pick) }); p++; }
    }
    const media = await this.packMedia(files, (kind, name) => `${kind === "voice" ? NL.zipVoicesDir : NL.zipVideosDir}/${name}`, false);
    const data = { ...Doc.serialize(this.doc), images, picks: Object.fromEntries(this.picks), media };
    files.unshift({ path: USER_SETTINGS.zipProjectFile, data: JSON.stringify(data, null, 2) }, { path: "story.txt", data: this.storyText() });
    downloadBlob(ZipWriter.build(files), `${USER_SETTINGS.fileNamePrefix}${safeName(this.doc.title) || "project"}_images_${timestamp()}.zip`);
    this.dirty = false;
    this.status("");
    this.notice(fmt(M.savedProjectImages, { n: m, p }), "ok");
  }

  async packMedia(files, pathOf, onlyPicked, existing = new Map()) {
    const pad = (n) => String(n).padStart(2, "0");
    const put = async (blob, kind, name) => {
      if (existing.has(blob)) return existing.get(blob);
      const path = pathOf(kind, name);
      files.push({ path, data: new Uint8Array(await blob.arrayBuffer()) });
      return path;
    };
    const voices = {}, videos = {};
    for (const [i, s] of this.doc.scenes.entries()) {
      const n = pad(i + 1);
      for (const [li, l] of s.lines.entries()) {
        const e = this.voices.get(l.id);
        const takes = (e?.takes || []).filter((t) => !onlyPicked || t.id === e.pick);
        if (!takes.length) continue;
        voices[l.id] = { pick: e.pick, takes: [] };
        for (const [k, t] of takes.entries()) voices[l.id].takes.push({ id: t.id, file: await put(t.blob, "voice", `${n}_${pad(li + 1)}_${k + 1}.wav`), duration: t.duration, sig: t.sig, at: t.at });
      }
      const v = this.videos.get(s.id);
      if (v?.blob) videos[s.id] = { file: await put(v.blob, "video", `${n}_loop.${VideoClient.ext(v.blob)}`), sig: v.sig, name: v.name };
    }
    return { voices, videos };
  }

  restoreMedia(media, blobAt) {
    let n = 0;
    for (const [lineId, v] of Object.entries(media?.voices || {})) {
      const takes = (Array.isArray(v?.takes) ? v.takes : []).map((t) => {
        const blob = blobAt(t?.file, "audio/wav");
        return blob ? { id: typeof t.id === "string" ? t.id : "t" + uid(), blob, url: URL.createObjectURL(blob), duration: Number(t.duration) || 0, sig: String(t.sig || ""), at: t.at } : null;
      }).filter(Boolean);
      if (!takes.length) continue;
      this.voices.set(lineId, { takes, pick: takes.some((t) => t.id === v.pick) ? v.pick : takes[takes.length - 1].id });
      n += takes.length;
    }
    for (const [sceneId, v] of Object.entries(media?.videos || {})) {
      const blob = blobAt(v?.file, VideoClient.mime(String(v?.file || "")));
      if (!blob) continue;
      this.videos.set(sceneId, { state: "done", blob, url: URL.createObjectURL(blob), sig: String(v.sig || ""), name: v.name });
      n++;
    }
    return n;
  }

  async restoreImages(obj, zipFiles) {
    const saved = obj.images && typeof obj.images === "object" ? obj.images : {};
    const mimeOf = (path) => (/\.jpe?g$/i.test(path) ? "image/jpeg" : /\.webp$/i.test(path) ? "image/webp" : "image/png");
    // ZIP の中の名前はそのまま、フォルダから開いたときは「展開したフォルダ名/画像/…」なので末尾で探す
    const find = (path) => {
      if (!zipFiles || typeof path !== "string") return null;
      if (zipFiles.has(path)) return zipFiles.get(path);
      for (const [k, v] of zipFiles) if (k.endsWith(`/${path}`)) return v;
      return null;
    };
    const blobOf = (it) => {
      if (typeof it?.data === "string" && it.data.startsWith("data:image/")) return dataUrlToBlob(it.data);
      const bytes = find(it?.file);
      if (!bytes) return null;
      return bytes instanceof Blob ? new Blob([bytes], { type: bytes.type || mimeOf(it.file) }) : new Blob([bytes], { type: mimeOf(it.file) });
    };
    let m = 0;
    for (const scene of this.doc.scenes) {
      for (const it of Array.isArray(saved[scene.id]) ? saved[scene.id] : []) {
        const blob = blobOf(it);
        if (!blob) continue;
        const { data, file, full, ...fields } = it;
        const img = await this.images.add(scene.id, { ...fields, blob });
        if (!full) this.images.dropFull(img);
        m++;
      }
    }
    for (const [sceneId, imageId] of Object.entries(obj.picks || {})) {
      if (this.images.find(imageId)?.sceneId === sceneId) this.picks.set(sceneId, imageId);
    }
    const media = this.restoreMedia(obj.media, (path, mime) => {
      const bytes = find(path);
      return bytes ? new Blob([bytes], { type: mime }) : null;
    });
    if (m || media) this.renderAll();
    return m;
  }

  async openProject(file, given, zipFiles) {
    try {
      const obj = given || await readJsonFile(file);
      if (!Doc.isProject(obj) || obj.format !== USER_SETTINGS.projectFormat) throw Guide.fail(M.notProject);
      const n = this.imageCount();
      if (n && !confirm(fmt(M.loadDiscard, { n }))) return;
      this.replaceDoc(Doc.normalize(obj));
      const m = await this.restoreImages(obj, zipFiles);
      const wanted = Object.values(obj.images && typeof obj.images === "object" ? obj.images : {}).flat().filter((it) => typeof it?.file === "string").length;
      this.pendingProject = !m && wanted ? obj : null;
      if (m) this.notice(fmt(M.loadedProjectImages, { n: this.doc.scenes.length, m }), "ok");
      else if (wanted && zipFiles) this.notice(M.imageFolderMissing, "warn", "imageFolder");
      else if (wanted) this.notice(fmt(M.needImageFolder, { n: this.doc.scenes.length, m: wanted }), "warn", "imageFolder");
      else this.notice(fmt(M.loadedProject, { n: this.doc.scenes.length }), "ok");
    } catch (err) {
      this.notice(err instanceof UserError ? err.message : M.loadFailed, "err");
    }
  }

  async openFile(file) {
    if (/^image\//.test(file.type) || /\.(png|jpe?g|webp)$/i.test(file.name)) { await this.loadBase(file); return; }
    if (/\.zip$/i.test(file.name) || ZipReader.isZip(new Uint8Array(await file.slice(0, 4).arrayBuffer()))) return this.openZip(file);
    let obj;
    try {
      obj = await readJsonFile(file);
    } catch {
      const scenario = NovelWriter.scenarioIn(await file.text());
      if (scenario) return this.importScenario(scenario, file.name);
      this.notice(M.loadFailed, "err");
      return;
    }
    if (NovelWriter.isScenario(obj)) return this.importScenario(obj, file.name);
    if (obj?.format === USER_SETTINGS.situationFormat) return this.openSituation(obj);
    if (obj?.format === USER_SETTINGS.castFormat) return this.swapCastFrom(obj);
    return this.openProject(file);
  }

  /* 複数のファイル・フォルダを開く（展開した「画像も含めて保存（ZIP）」のフォルダをドロップしたときなど）。
     entries は { path: "フォルダ/画像/01_…/01_80点_123.png", file }。プロジェクトの JSON を探し、その中の画像の場所（file）と
     path の末尾を照らし合わせて画像を戻す。JSON がないときは、先に開いた JSON（fallback）の画像を探す */
  async openFiles(entries, fallback = null) {
    const projectEntry = entries.find((e) => e.file.name === USER_SETTINGS.zipProjectFile) || entries.find((e) => /\.json$/i.test(e.file.name));
    let obj = null;
    if (projectEntry) {
      try {
        obj = await readJsonFile(projectEntry.file);
      } catch {
        obj = null;
      }
    }
    if (obj?.format !== USER_SETTINGS.projectFormat) obj = fallback;
    if (!obj) {
      const zip = entries.find((e) => /\.zip$/i.test(e.file.name));
      if (zip) return this.openZip(zip.file);
      if (projectEntry) return this.openFile(projectEntry.file);
      const image = entries.find((e) => /\.(png|jpe?g|webp)$/i.test(e.file.name));
      if (image) return this.loadBase(image.file);
      this.notice(M.loadFailed, "err");
      return;
    }
    const files = new Map(entries.map((e) => [e.path.replace(/\\/g, "/").replace(/^\/+/, ""), e.file]));
    return this.openProject(projectEntry?.file || null, obj, files);
  }

  async openZip(file) {
    let files, obj;
    try {
      files = await ZipReader.read(file);
      const keys = [...files.keys()];
      const name = files.has(USER_SETTINGS.zipProjectFile) ? USER_SETTINGS.zipProjectFile : keys.find((n) => n.endsWith(`/${USER_SETTINGS.zipProjectFile}`)) || keys.find((n) => /\.json$/i.test(n) && !n.endsWith(NV.scenarioFile));
      obj = name ? JSON.parse(new TextDecoder().decode(files.get(name))) : null;
    } catch {
      this.notice(M.loadFailed, "err");
      return;
    }
    if (!obj || obj.format !== USER_SETTINGS.projectFormat) { this.notice(M.zipNoProject, "err"); return; }
    return this.openProject(file, obj, files);
  }

  saveSituation() {
    const blob = new Blob([JSON.stringify(Doc.situationFile(this.doc), null, 2)], { type: "application/json" });
    downloadBlob(blob, `${USER_SETTINGS.fileNamePrefix}situation_${safeName(this.doc.title) || "story"}_${timestamp()}.json`);
    this.notice(fmt(M.savedSituation, { n: this.doc.scenes.length }), "ok");
  }

  openSituation(obj) {
    const n = this.imageCount();
    if ((n || this.doc.scenes.length) && !confirm(fmt(M.situationDiscard, { n }))) return;
    const doc = Doc.loadSituation(this.doc, obj);
    this.replaceDoc(doc);
    this.dirty = true;
    this.notice(fmt(M.loadedSituation, { n: doc.scenes.length }), "ok");
  }

  async loadBase(file) {
    try {
      this.doc.base = await BaseImage.read(file);
      if (!this.res.models?.length) await this.loadResources();
      const used = this.applyBase({ keepText: true });
      if (!this.doc.scenes.length && this.doc.base.prompt) this.addSceneFromBase(true);
      this.left.render();
      const kept = used.kept.length ? fmt(M.baseKept, { list: used.kept.join("・") }) : "";
      if (used.length) this.notice(fmt(M.baseApplied, { list: used.join("・") }) + kept, "ok", "image");
      else if (kept) this.notice(kept.trim(), "ok", "image");
      else this.notice(M.baseAppliedNone, "warn");
    } catch {
      this.notice(M.baseFailed, "err");
    }
  }

  applyBase({ keepText = false } = {}) {
    const base = this.doc.base;
    if (!base) return [];
    const used = BaseImage.apply(this.doc, base, { res: this.res, backendKind: this.store.data.backend, keepText });
    if (this.doc.mode === "novel") this.snapAspect();
    this.right.show("image");
    this.docChanged(true);
    return used;
  }

  addSceneFromBase(quiet = false) {
    const base = this.doc.base;
    if (!base) return;
    this.doc.scenes.push(Doc.newScene({ title: base.name.replace(/\.[^.]+$/, ""), prompt: base.prompt }));
    this.docChanged(true);
    if (!quiet) this.notice(fmt(M.baseSceneAdded, { n: this.doc.scenes.length }), "ok", `scene:${this.doc.scenes.at(-1).id}`);
  }

  baseToCast() {
    const base = this.doc.base;
    if (!base) return;
    if (!this.doc.cast.length) this.doc.cast.push(Doc.person({}, "c"));
    this.doc.cast[0].body = base.prompt;
    this.docChanged(true);
    this.left.render();
    this.notice(M.baseCastSet, "ok");
  }

  async swapCastFrom(obj) {
    if (!Doc.isProject(obj)) { this.notice(M.notProject, "err"); return; }
    if (!Array.isArray(obj.cast) || !obj.cast.length) { this.notice(M.castNone, "err"); return; }
    const n = Doc.swapCast(this.doc, obj.cast);
    this.docChanged(true);
    this.left.render();
    this.notice(fmt(M.castSwapped, { n }), "ok");
  }

  saveCast() {
    const blob = new Blob([JSON.stringify(Doc.castFile(this.doc), null, 2)], { type: "application/json" });
    downloadBlob(blob, `${USER_SETTINGS.fileNamePrefix}cast_${timestamp()}.json`);
  }

  newProject() {
    const n = this.imageCount();
    if ((this.dirty || n) && !confirm(fmt(M.newDiscard, { n }))) return;
    this.replaceDoc(Doc.create());
    this.phase("idle", "");
    this.status(M.runIdle);
  }

  async pngBytes(img) {
    let bytes = new Uint8Array(await img.blob.arrayBuffer());
    if (PngText.isPng(bytes)) bytes = PngText.withText(bytes, "parameters", img.info || Infotext.build(img, this.doc.common));
    return bytes;
  }

  async saveImage(scene, img) {
    if (!img.blob) return;
    const n = this.doc.scenes.indexOf(scene) + 1;
    downloadBlob(new Blob([await this.pngBytes(img)], { type: "image/png" }), `${USER_SETTINGS.fileNamePrefix}${String(n).padStart(2, "0")}_${img.seed}.png`);
  }

  storyText() {
    const lines = [this.doc.title || L.untitled, this.doc.synopsis, ""];
    this.doc.scenes.forEach((s, i) => lines.push(`${i + 1}. ${s.title}`, s.text, ""));
    return lines.join("\r\n");
  }

  async buildExport(allGood) {
    const files = [];
    const pad = (n) => String(n).padStart(2, "0");
    for (let i = 0; i < this.doc.scenes.length; i++) {
      const scene = this.doc.scenes[i];
      const stem = `${pad(i + 1)}_${safeName(scene.title) || "scene"}`;
      const pick = this.pickOf(scene.id);
      if (pick) files.push({ path: `${stem}.png`, data: await this.pngBytes(pick) });
      if (allGood) {
        for (const img of this.images.list(scene.id)) {
          if (img.blob && Judge.verdict(img, this.doc.run) === true) files.push({ path: `good/${stem}/${img.seed}_${img.id}.png`, data: await this.pngBytes(img) });
        }
      }
    }
    const count = files.length;
    if (!count) return null;
    files.push({ path: "story.txt", data: this.storyText() }, { path: "stillsheet.json", data: JSON.stringify(Doc.serialize(this.doc), null, 2) });
    return { zip: ZipWriter.build(files), count };
  }

  async shareFiles() {
    const stamp = timestamp();
    const files = [];
    for (let i = 0; i < this.doc.scenes.length; i++) {
      const pick = this.pickOf(this.doc.scenes[i].id);
      if (!pick) continue;
      const name = `${USER_SETTINGS.fileNamePrefix}${stamp}_${String(i + 1).padStart(2, "0")}.png`;
      files.push({ blob: new Blob([await this.pngBytes(pick)], { type: "image/png" }), name, mime: "image/png" });
    }
    return { files, stamp };
  }

  handoffDb() {
    const cfg = USER_SETTINGS.shareHandoff;
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(cfg.db, 1);
      req.onupgradeneeded = () => { if (!req.result.objectStoreNames.contains(cfg.store)) req.result.createObjectStore(cfg.store); };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  openWaitingTab() {
    const win = window.open("", "_blank");
    if (!win) return null;
    try {
      win.document.title = "Prompt Reel";
      win.document.body.textContent = M.shareOpening;
    } catch {}
    return win;
  }

  async novelPackage() {
    const doc = this.doc;
    const pad = (n) => String(n).padStart(2, "0");
    const files = [];
    const pickFiles = {};
    const counts = { images: 0, videos: 0, voices: 0 };
    const json = { format: NV.reelFormat, version: NV.reelVersion, title: doc.title || "", scenes: [] };
    for (const g of Doc.groups(doc)) {
      const sc = { title: g.head.sceneTitle || "", sound: "", soundLoop: true, images: [] };
      for (const s of g.scenes) {
        const n = pad(doc.scenes.indexOf(s) + 1);
        const pick = this.pickOf(s.id);
        const vid = this.novel.videoState(s).state === "done" ? this.videos.get(s.id) : null;
        let image = "";
        if (vid) { image = `${n}_loop.${VideoClient.ext(vid.blob)}`; files.push({ name: image, blob: vid.blob }); counts.videos++; }
        else if (pick) { image = `${n}.png`; pickFiles[s.id] = image; files.push({ name: image, blob: new Blob([await this.pngBytes(pick)], { type: "image/png" }) }); counts.images++; }
        const lines = s.lines.filter((l) => l.text.trim()).map((l, li) => {
          const e = this.novel.voiceState(l).state === "done" ? this.novel.take(l) : null;
          const voice = e ? `${n}_${pad(li + 1)}.wav` : "";
          if (e) { files.push({ name: voice, blob: e.blob }); counts.voices++; }
          return { speaker: l.who === NV.narrator ? "" : NovelWriter.nameOf(doc, l.who), text: l.text.trim(), voice, sound: "", soundLoop: false };
        });
        sc.images.push({ image, videoSound: !!(vid && doc.novel.video.sound), sound: "", soundLoop: true, lines });
      }
      json.scenes.push(sc);
    }
    return { json, files, counts, pickFiles };
  }

  async exportNovel() {
    const { json, files, counts, pickFiles } = await this.novelPackage();
    if (!counts.images && !counts.videos) { this.notice(NM.exportNone, "warn"); return null; }
    const entries = [
      { path: NV.scenarioFile, data: JSON.stringify(json, null, 2) },
      ...(await Promise.all(files.map(async (f) => ({ path: f.name, data: new Uint8Array(await f.blob.arrayBuffer()) })))),
    ];
    const dir = NV.gameProjectDir;
    const images = {};
    for (const [i, s] of this.doc.scenes.entries()) {
      const pick = this.pickOf(s.id);
      if (!pick) continue;
      let path = pickFiles[s.id];
      if (!path) { path = `${dir}/${String(i + 1).padStart(2, "0")}.png`; entries.push({ path, data: await this.pngBytes(pick) }); }
      const { id, seed, info, prompt, negative, width, height, settings, check, manual, createdAt } = pick;
      images[s.id] = [{ id, file: path, full: true, seed, info, prompt, negative, width, height, settings, check, manual, createdAt }];
    }
    const media = await this.packMedia(entries, (kind, name) => `${dir}/${name}`, true, new Map(files.map((f) => [f.blob, f.name])));
    const picks = Object.fromEntries(Object.entries(images).map(([k, v]) => [k, v[0].id]));
    entries.push({ path: `${dir}/${USER_SETTINGS.zipProjectFile}`, data: JSON.stringify({ ...Doc.serialize(this.doc), images, picks, media }, null, 2) });
    const zip = ZipWriter.build(entries);
    downloadBlob(zip, `${USER_SETTINGS.fileNamePrefix}${safeName(this.doc.title) || "novel"}_${timestamp()}.zip`);
    this.notice(fmt(NM.exportDone, counts), "ok");
    return zip;
  }

  async postNovel() {
    const cfg = USER_SETTINGS.shareHandoff;
    const target = new URL(USER_SETTINGS.shareAppUrl, location.href);
    if (target.origin !== location.origin) { this.notice(fmt(M.shareOtherOrigin, { origin: target.origin }), "err"); return; }
    if (!this.doc.scenes.some((s) => this.pickOf(s.id))) { this.notice(NM.postNone, "warn"); return; }
    const win = this.openWaitingTab();
    if (!win) { this.notice(M.sharePopupBlocked, "err"); return; }
    this.status(M.sharePreparing);
    try {
      const { json, files, counts } = await this.novelPackage();
      const key = `${cfg.keyPrefix}_${timestamp()}_${uid()}`;
      const record = {
        source: cfg.importName, createdAt: Date.now(),
        images: files.map((f) => ({ blob: f.blob, name: f.name, mime: f.blob.type })),
        blob: files[0].blob, name: files[0].name, mime: files[0].blob.type,
        meta: { format: cfg.format, app: USER_SETTINGS.appName, title: this.doc.title, synopsis: this.doc.synopsis, mode: "novel", json: JSON.stringify(json), counts, base: BaseImage.shareInfo(this.doc.base) },
      };
      const db = await this.handoffDb();
      await new Promise((resolve, reject) => {
        const tx = db.transaction(cfg.store, "readwrite");
        tx.objectStore(cfg.store).put(record, key);
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });
      db.close();
      target.searchParams.set("import", cfg.importName);
      target.searchParams.set("key", key);
      win.location.href = target.href;
      this.notice(fmt(NM.postOpened, counts), "ok");
      return key;
    } catch (err) {
      win.close();
      this.notice(fmt(M.shareFailed, { err: err.message || err }), "err");
    }
  }

  async postToPromptReel() {
    if (this.doc.mode === "novel") return this.postNovel();
    const cfg = USER_SETTINGS.shareHandoff;
    const target = new URL(USER_SETTINGS.shareAppUrl, location.href);
    if (target.origin !== location.origin) { this.notice(fmt(M.shareOtherOrigin, { origin: target.origin }), "err"); return; }
    if (!this.doc.scenes.some((s) => this.pickOf(s.id))) { this.notice(M.exportNone, "warn"); return; }
    const win = this.openWaitingTab();
    if (!win) { this.notice(M.sharePopupBlocked, "err"); return; }
    this.status(M.sharePreparing);
    try {
      const { files, stamp } = await this.shareFiles();
      const key = `${cfg.keyPrefix}_${stamp}_${uid()}`;
      const record = {
        source: cfg.importName, createdAt: Date.now(),
        images: files.map((f) => ({ blob: f.blob, name: f.name, mime: f.mime })),
        blob: files[0].blob, name: files[0].name, mime: files[0].mime,
        meta: {
          format: cfg.format, app: USER_SETTINGS.appName, title: this.doc.title, synopsis: this.doc.synopsis,
          scenes: this.doc.scenes.filter((s) => this.pickOf(s.id)).map((s) => ({ title: s.title, text: s.text })),
          base: BaseImage.shareInfo(this.doc.base), mode: "scenes",
        },
      };
      const db = await this.handoffDb();
      await new Promise((resolve, reject) => {
        const tx = db.transaction(cfg.store, "readwrite");
        tx.objectStore(cfg.store).put(record, key);
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });
      db.close();
      target.searchParams.set("import", cfg.importName);
      target.searchParams.set("key", key);
      win.location.href = target.href;
      this.notice(fmt(M.shareOpened, { n: files.length }), "ok");
      return key;
    } catch (err) {
      win.close();
      this.notice(fmt(M.shareFailed, { err: err.message || err }), "err");
    }
  }

  async exportSet() {
    if (this.doc.mode === "novel") return this.exportNovel();
    const allGood = !!this.store.data.ui.exportAllGood;
    const out = await this.buildExport(allGood);
    if (!out) { this.notice(M.exportNone, "warn"); return; }
    downloadBlob(out.zip, `${USER_SETTINGS.fileNamePrefix}${safeName(this.doc.title) || "set"}_${timestamp()}.zip`);
    this.notice(fmt(M.exportDone, { n: out.count }), "ok");
  }

  toggleSaveMenu() {
    const menu = $("save-menu");
    if (!menu.hidden) { menu.hidden = true; return; }
    const item = (label, note, fn) => h("button", { onclick: () => { menu.hidden = true; fn(); } }, label, h("small", { text: note }));
    menu.replaceChildren(...(this.doc.mode === "novel" ? [
      item(NL.saveNovelAll, NL.saveNovelAllNote, () => this.saveProjectWithImages()),
      item(NL.saveNovelGame, NL.saveNovelGameNote, () => this.exportNovel()),
      item(NL.saveNovelJson, NL.saveNovelJsonNote, () => this.saveProject()),
      item(NL.saveNovelCast, NL.saveNovelCastNote, () => this.saveCast()),
    ] : [
      item(L.saveWithImages, L.saveWithImagesNote, () => this.saveProjectWithImages()),
      item(L.saveAll, L.saveAllNote, () => this.saveProject()),
      item(L.saveSituation, L.saveSituationNote, () => this.saveSituation()),
      item(L.saveCast, L.saveCastNote, () => this.saveCast()),
    ]));
    const r = $("btn-save").getBoundingClientRect();
    menu.style.top = `${r.bottom + 4}px`;
    menu.hidden = false;
    menu.style.left = `${Math.max(8, Math.min(r.left, innerWidth - menu.offsetWidth - 8))}px`;
  }

  // TOP BAR AND KEYS
  bindTop() {
    const on = (id, fn) => this.bag.on($(id), "click", fn);
    on("btn-settings", () => this.settings.open());
    on("btn-help", () => this.settings.open("help"));
    on("pill-llm", () => this.settings.open("llm"));
    on("pill-img", () => this.settings.open("conn"));
    on("refresh-conn", () => this.refreshConnections());
    on("btn-new", () => this.newProject());
    on("btn-save", (e) => { e.stopPropagation(); this.toggleSaveMenu(); });
    on("btn-open", () => $("file-open").click());
    on("btn-show", () => this.show.open());
    on("btn-add-scene", () => this.addScene());
    on("btn-run", () => (this.doc.mode === "novel" ? this.novel.start(null) : this.run()));
    on("btn-stop", () => { this.novel.stop(); this.runner.stop(); this.storyCtl?.abort(); });
    on("pill-voice", () => this.settings.open("voice"));
    on("pill-video", () => this.settings.open("video"));
    this.bag.on($("btn-toggle-left"), "click", () => this.togglePanel("left"));
    this.bag.on($("btn-toggle-right"), "click", () => this.togglePanel("right"));
    this.bag.on($("help-toggle"), "change", () => { this.store.data.ui.help = $("help-toggle").checked; this.store.save(); this.applyHelp(); });
    this.bag.on(document, "click", PanelWindow.mirror("click", (e) => { if (!e.target.closest("#save-menu")) $("save-menu").hidden = true; }));
    this.bag.on(document, "keydown", PanelWindow.mirror("keydown", (e) => { if (e.key === "Escape") $("save-menu").hidden = true; }));
    this.bag.on($("run-target"), "change", () => { this.doc.run.target = $("run-target").value; this.dirty = true; });
    const pickFile = (id, fn) => this.bag.on($(id), "change", (e) => {
      const f = e.target.files?.[0];
      e.target.value = "";
      if (f) fn(f);
    });
    this.bag.on($("file-open"), "change", (e) => {
      const files = [...(e.target.files || [])];
      e.target.value = "";
      if (files.length === 1) this.openFile(files[0]);
      else if (files.length) this.openFiles(files.map((file) => ({ path: file.name, file })));
    });
    this.bag.on($("file-folder"), "change", (e) => {
      const files = [...(e.target.files || [])].map((file) => ({ path: file.webkitRelativePath || file.name, file }));
      e.target.value = "";
      if (files.length) this.openFiles(files, this.pendingProject);
    });
    pickFile("file-base", (f) => this.loadBase(f));
    this.bag.on(window, "beforeunload", (e) => {
      if (this.runner.busy || this.novel.busy || this.dirty || this.imageCount()) { e.preventDefault(); e.returnValue = M.leaveConfirm; }
    });
    this.bag.on(document, "dragover", (e) => e.preventDefault());
    this.bag.on(document, "drop", PanelWindow.mirror("drop", async (e) => {
      e.preventDefault();
      const entries = await droppedFiles(e.dataTransfer);
      if (entries.length === 1 && !entries[0].path.includes("/")) this.openFile(entries[0].file);
      else if (entries.length) this.openFiles(entries);
    }));
  }
}

document.addEventListener("DOMContentLoaded", () => {
  window.stillsheet = new App();
});
</script>
